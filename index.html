<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>편입 영어 문법</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool, quiet and exact, modelled on the practice site the user pointed to
   IDEA a workbook that follows the lecture notes' table of contents, chapter → section → problem
   PICTURE the problem itself: the English sentence set large with (A)–(D) underlines beside the answer sheet
   COLOUR white paper, near-black ink, navy primary buttons, teal for progress and correct, red for wrong
   TYPE Noto Sans KR for the interface + Source Serif 4 for English sentences
   LAYOUT 1040px column; problem page splits question | answer on laptops, stacks question → answer on phones */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111418);--soft:light-dark(#f4f6f8,#181d23);--line:light-dark(#e1e6eb,#2a3139);--ink:light-dark(#151a20,#eef1f4);--mute:light-dark(#5d6874,#9da8b4);--navy:light-dark(#1d2b3b,#e3ebf3);--onnavy:light-dark(#ffffff,#111418);--teal:light-dark(#167a68,#55c7ae);--tealbg:light-dark(#e5f3ef,#132d28);--red:light-dark(#c4313c,#ff7d86);--redbg:light-dark(#fcebec,#35171a);--obj:light-dark(#2456a3,#93b6ee);--objbg:light-dark(#e9f0fb,#18263a);--sub:light-dark(#985a00,#f1c272);--subbg:light-dark(#fcf1df,#33270f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
button{font:inherit;color:inherit}
.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.topin{max-width:1040px;margin:0 auto;padding:0 max(4vw,16px);display:flex;align-items:center;justify-content:space-between;gap:8px 18px;flex-wrap:wrap;min-height:58px}
.brand{font-weight:700;text-decoration:none;font-size:17px}
.nav{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.nav a{text-decoration:none;padding:10px 12px;border-radius:8px;font-size:15px;color:var(--mute)}
.nav a[aria-current=page]{color:var(--ink);font-weight:500;background:var(--soft)}
.save{font-size:13px;color:var(--mute);padding-left:8px}
main{max-width:1040px;margin:0 auto;padding:28px max(4vw,16px) 64px}
h1{font-size:clamp(28px,4vw,36px);line-height:1.15;letter-spacing:-.02em;margin:6px 0 10px}
.h2{font-size:22px;margin:40px 0 14px;letter-spacing:-.01em}
.lead{color:var(--mute);margin:0 0 18px;max-width:62ch}
.ser{color:var(--teal);font-weight:500;font-size:14px;margin:0}
.back{display:inline-block;text-decoration:none;color:var(--mute);font-size:14px;padding:6px 0}
.back:hover{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.card h2{font-size:20px;line-height:1.3;margin:0}
.desc{margin:0;color:var(--mute);font-size:15px;flex:1}
.stat{margin:0;font-size:13px;color:var(--mute)}
.prog{display:grid;gap:6px;font-size:14px;margin:6px 0 4px}
.prog i{display:block;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.prog b{display:block;height:100%;background:var(--teal);border-radius:3px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:0;background:var(--navy);color:var(--onnavy);font-weight:500;text-decoration:none;cursor:pointer;font-size:15px}
.btn.alt{background:var(--teal);color:var(--onnavy)}
.btn kbd{font:12px "Noto Sans KR",sans-serif;opacity:.75}
.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:15px;text-decoration:none}
.ghost:disabled{color:var(--mute);cursor:default}
.btn:focus-visible,.ghost:focus-visible,a:focus-visible,.opt:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--obj);outline-offset:2px}
.band{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px 24px;flex-wrap:wrap;background:var(--soft)}
.band h2{margin:0 0 2px;font-size:18px}
.band p{margin:0;color:var(--mute);font-size:15px}
.mode{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}
.mode .card h2{font-size:18px}
.kline{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--mute);margin:0 0 6px}
.kline b{color:var(--ink)}
.tocch{border-top:1px solid var(--line);padding:14px 0 10px}
.toch{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;text-decoration:none;gap:10px;padding:4px 0}
.num{font:600 22px/1 "Source Serif 4",Georgia,serif;color:var(--teal)}
.toch b{display:block;font-size:17px}
.toch small{color:var(--mute);font-size:13px}
.toch:hover b{text-decoration:underline}
.tocch ul{list-style:none;margin:6px 0 0;padding:0 0 0 54px}
.tocch li a{display:grid;grid-template-columns:2.6em minmax(0,1fr) auto;gap:8px;padding:7px 0;text-decoration:none;font-size:15px;border-bottom:1px dashed var(--line)}
.tocch li:last-child a{border-bottom:0}
.sl{color:var(--mute)}
.sn{color:var(--mute);font-size:13px;white-space:nowrap}
.tocch li a:hover .st{text-decoration:underline}
.filters{display:flex;flex-direction:column;gap:8px;margin:18px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--navy);color:var(--onnavy);border-color:var(--navy)}
.sec{border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}
.sh{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;padding:12px 16px;background:var(--soft)}
.sh b{font-size:16px}
.sh span{font-size:13px;color:var(--mute)}
.row{display:grid;grid-template-columns:20px auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none}
.row:hover .rt{text-decoration:underline}
.empty{padding:14px 16px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.dot.ok{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px var(--bg)}
.dot.no{border-color:var(--red);background:var(--redbg)}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.obj{background:var(--objbg);color:var(--obj)}
.tag.sub{background:var(--subbg);color:var(--sub)}
.lv{font-size:13px;color:var(--mute);white-space:nowrap}
.lv.l1{color:var(--teal)}.lv.l3{color:var(--red)}
.lv.ptg{color:var(--obj)}
.cnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}
.ptop{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-bottom:14px;font-size:14px;color:var(--mute)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.pane{border:1px solid var(--line);border-radius:12px;padding:clamp(18px,2.6vw,26px);background:var(--bg)}
.tags{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pt{font-size:clamp(22px,3vw,28px);margin:0 0 4px}
.src{margin:0 0 14px;color:var(--mute);font-size:14px}
.ins{margin:0;font-weight:500}
.sent{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(19px,2.2vw,22px);line-height:2.25;background:var(--soft);border-radius:10px;padding:16px 18px;margin-top:12px;overflow-wrap:anywhere}
.u{display:inline-flex;flex-direction:column;align-items:center;line-height:1.35}
.u>span{text-decoration:underline 1.5px;text-underline-offset:5px}
.u>b{font:500 12px/1.3 "Noto Sans KR",sans-serif;color:var(--mute)}
.u.good>span{color:var(--teal)}.u.bad>span{color:var(--red);text-decoration-style:wavy}
.u1{text-decoration:underline 1.5px;text-underline-offset:5px}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid currentColor;line-height:1.3;text-align:center}
.blank.on{color:var(--teal);padding:0 .3em}
.ah{font-size:16px;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:left;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt:disabled{cursor:default}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--mute);display:grid;place-items:center;font-size:13px;font-weight:500}
.opt .ot{font-family:"Source Serif 4",Georgia,serif;font-size:17px}
.opt.sel{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.opt.sel .bub{background:var(--navy);border-color:var(--navy);color:var(--onnavy)}
.opt.ok{border-color:var(--teal);background:var(--tealbg)}
.opt.ok .bub{background:var(--teal);border-color:var(--teal);color:var(--onnavy)}
.opt.no{border-color:var(--red);background:var(--redbg)}
.opt.no .bub{background:var(--red);border-color:var(--red);color:var(--onnavy)}
.inp{width:100%;min-height:50px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:17px "Source Serif 4",Georgia,serif}
.inp:disabled{background:var(--soft)}
.help{font-size:13px;color:var(--mute);margin:8px 0 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hints{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.hints li{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:15px}
.hints li b{color:var(--teal);margin-right:6px;font-weight:500}
.res{margin:14px 0 0;font-weight:700;font-size:17px}
.res.ok{color:var(--teal)}.res.no{color:var(--red)}
.res small{font-weight:400;color:var(--mute);font-size:14px;margin-left:6px}
.solbtn{width:100%;margin-top:14px}
.sol{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.sol p{margin:0 0 8px}
.lab{display:inline-block;min-width:3em;font-size:13px;color:var(--mute)}
.serif{font-family:"Source Serif 4",Georgia,serif;font-size:17px}
.exp{background:var(--soft);border-radius:8px;padding:12px 14px}
.pnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.exbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.timer{font:600 20px "Source Serif 4",Georgia,serif;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.setup{display:grid;gap:18px;max-width:640px}
.setup h3{margin:0 0 8px;font-size:16px}
.big{display:flex;align-items:baseline;gap:8px;margin:6px 0}
.big b{font:600 clamp(52px,9vw,72px)/1 "Source Serif 4",Georgia,serif;color:var(--teal)}
.big span{font-size:22px;color:var(--mute)}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 6px}
.fig{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.fig b{display:block;font:600 clamp(24px,3.4vw,32px)/1.15 "Source Serif 4",Georgia,serif}
.fig span{font-size:13px;color:var(--mute)}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) 4.6em 3.4em;gap:12px;align-items:center;min-height:36px;font-size:14px;text-decoration:none}
.bar i{display:block;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--teal)}
.bar .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar .m{text-align:right;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar:hover .bn{text-decoration:underline}
.bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:13px;color:var(--mute);margin-top:28px}
@media(max-width:900px){.cards{grid-template-columns:minmax(0,1fr)}.pgrid{grid-template-columns:minmax(0,1fr)}.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.mode{grid-template-columns:minmax(0,1fr)}.tocch ul{padding-left:0}.row{grid-template-columns:18px minmax(0,1fr) auto;row-gap:2px}.row .tag{grid-column:2;justify-self:start}.row .rt{grid-column:2}.row .lv{grid-column:3;grid-row:1}.bar{grid-template-columns:minmax(0,1fr) 4.4em 3.2em}.bar i{grid-column:1/-1;grid-row:2}.nav a{padding:10px 8px}.save{display:none}}
@media(prefers-reduced-motion:no-preference){.res{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="brand" href="#home">편입 영어 문법</a><nav class="nav" aria-label="주요 메뉴"><a href="#home" data-n="home">차례</a><a href="#exam" data-n="exam">모의고사</a><a href="#me" data-n="me">내 기록</a><span class="save" id="save">기록은 이 브라우저에 저장돼</span></nav></div></header>
<main id="app"></main>
<script>
{

sted].","a":0,"e":"Not only가 앞으로 나가서 did he로 도치됐어. did 뒤에는 동사원형이라 fails가 아니라 fail.","h":["패턴: 주조동사","did + 주어 + 동사원형"],"src":"패턴","pp":"패턴편 I 33쪽","x":"he fail"},{"id":"P048","c":4,"s":0,"k":"err","lv":0,"t":"대동사","q":"[Obviously] we were [much more] impressed [with performance] than [did] the other members of the audience.","a":3,"e":"앞 동사가 be동사(were impressed)라 비교절의 대동사도 were. did는 일반동사를 받을 때 써.","h":["패턴: 주조동사","대동사는 앞 동사에 맞춰"],"src":"패턴","pp":"패턴편 I 34쪽","x":"were"},{"id":"P049","c":4,"s":0,"k":"err","lv":0,"t":"대동사","q":"Venus [approaches] the Earth [more closely] [than] any other [planet is].","a":3,"e":"approaches는 일반동사라 비교 뒤 대동사는 does야. planet is가 아니라 planet does.","h":["패턴: 주조동사","일반동사를 받는 대동사"],"src":"패턴","pp":"패턴편 I 34쪽","x":"planet does"},{"id":"4-01","c":4,"s":1,"k":"err","lv":1,"t":"조동사 두 개 연속 불가","q":"He [has worked] [hard] [for months], so next year he [will can] do the work for himself.","a":3,"x":"will be able to","h":["서법조동사를 두 개 연달아 쓸 수 있는지 생각해 봐.","미래 + 능력은 will + be able to."],"e":"서법조동사는 두 개 연속으로 못 써. will can (X) → will be able to, will must (X) → will have to, will may (X) → will be allowed to.","src":"연습"},{"id":"4-02","c":4,"s":1,"k":"err","lv":2,"t":"had better의 부정","q":"You [had not better] go [there] [after] [dark].","a":0,"h":["had better를 한 덩어리 조동사로 봐.","조동사 + not + 동사원형 순서야."],"e":"had better는 한 덩어리 조동사라 부정어는 그 뒤에: had better not R. would rather도 would rather not R.","x":"had better not","src":"연습"},{"id":"P050","c":4,"s":2,"k":"err","lv":0,"t":"평서문","q":"He would [lost] his license [if he didn’t take] a [refresher] course, [according to] my broker.","a":0,"e":"조동사 would 뒤에는 동사원형 lose. if he didn't take ~ 는 가정법 과거라 주절 would lose가 짝이야.","h":["패턴: 서법조동사","would + 동사원형"],"src":"패턴","pp":"패턴편 I 37쪽","x":"lose"},{"id":"P051","c":4,"s":2,"k":"blank","lv":0,"t":"평서문","q":"I think we had better _______ on time.","a":1,"e":"had better는 조동사처럼 쓰여서 뒤에 동사원형이 와. start working.","h":["패턴: 서법조동사","had better + 동사원형"],"src":"패턴","pp":"패턴편 I 37쪽","o":["to be with","start working","started working","being"]},{"id":"P052","c":4,"s":2,"k":"err","lv":0,"t":"평서문","q":"The farmer realized that [he'd] better, if he didn't want to have a total loss, [to harvest] his crop [earlier] [than usual].","a":1,"e":"he'd better(= had better) 뒤에는 to 없이 동사원형. 중간에 if절이 끼어 있어서 헷갈리게 만든 문제야.","h":["패턴: 서법조동사","had better 뒤 to 불가"],"src":"패턴","pp":"패턴편 I 37쪽","x":"harvest"},{"id":"P053","c":4,"s":2,"k":"blank","lv":0,"t":"부정문","q":"They _______ moved from their old house.","a":3,"e":"부정어 not은 조동사 바로 뒤에 와: may not have moved(이사 갔을 리 없다/안 갔을지도 모른다).","h":["패턴: 서법조동사","조동사 + not + have p.p."],"src":"패턴","pp":"패턴편 I 37쪽","o":["may haven`t","do not may have","not may have","may not have","may well"]},{"id":"P054","c":4,"s":2,"k":"blank","lv":0,"t":"부정문","q":"I would rather _______ a thing at all than do it badly.","a":0,"e":"would rather의 부정은 would rather not + 동사원형. than do와도 형태가 맞아.","h":["패턴: 서법조동사","would rather not + 동사원형"],"src":"패턴","pp":"패턴편 I 37쪽","o":["not do","not to do","not doing","no doing"]},{"id":"P055","c":4,"s":2,"k":"blank","lv":0,"t":"도치문","q":"Only after they are tanned _______ resistant to decomposition.","a":0,"e":"Only after ~ 처럼 Only가 이끄는 부사(절)가 문두에 오면 주절이 조동사 + 주어 + 동사 순으로 도치돼: can animal skin become.","h":["패턴: 서법조동사","Only + 부사절이 앞이면 도치"],"src":"패턴","pp":"패턴편 I 37쪽","o":["can animal skin become","that animal skin can become","animal skins can become","can become animal skins"]},{"id":"P056","c":4,"s":2,"k":"err","lv":0,"t":"도치문","q":"[Should] a foreign student [needing] [help], he or she [must] see the foreign student advisor.","a":1,"e":"if를 생략한 도치 Should a foreign student need help ~ 에서 should 뒤 동사는 원형이야. needing은 동사가 아니라 안 돼.","h":["패턴: 서법조동사","Should + 주어 + 동사원형"],"src":"패턴","pp":"패턴편 I 38쪽","x":"need"},{"id":"P057","c":4,"s":2,"k":"err","lv":0,"t":"도치문","q":"[Rarely] [should] a child [is] [discouraged] by his teacher.","a":2,"e":"부정부사 Rarely가 문두에 와서 should a child로 도치됐어. should 뒤에는 동사원형이라 be discouraged.","h":["패턴: 서법조동사","도치된 조동사 뒤는 원형"],"src":"패턴","pp":"패턴편 I 38쪽","x":"be"},{"id":"P058","c":4,"s":2,"k":"blank","lv":0,"t":"대동사","q":"Quarter horses can start more quickly, turn more sharply, and run faster over short courses than other breeds _______.","a":0,"e":"비교 대상 동사가 can start, turn, run이라 대동사도 can. 빠르게 출발할 수 있는 능력을 다른 품종과 비교하는 거야.","h":["패턴: 서법조동사","앞 조동사를 받는 대동사"],"src":"패턴","pp":"패턴편 I 38쪽","o":["can","do","will","may"]},{"id":"P059","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"He won’t believe her, whatever she _______ say.","a":1,"e":"whatever(무엇을 ~하더라도) 같은 양보절에는 조동사 may를 써: whatever she may say.","h":["패턴: 패턴편 문제","양보절의 may"],"src":"패턴","pp":"패턴편 I 41쪽","o":["can","may","could","would"]},{"id":"P060","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"Charlie assured his wife that there was no danger, but she could not _______.","a":2,"e":"'~하지 않을 수 없다'는 cannot help R-ing 또는 cannot but R. help worrying이 맞고 help but -ing, but to R은 틀려.","h":["패턴: 패턴편 문제","cannot help -ing"],"src":"패턴","pp":"패턴편 I 41쪽","o":["help worry","but to worry","help worrying","help but worrying"]},{"id":"P061","c":4,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"The scientists could not [help] [but talking] about the success [of] the Voyager missions [among] [themselves].","a":1,"e":"cannot help but 뒤에는 동사원형이 와(= cannot but R). talking이 아니라 talk.","h":["패턴: 패턴편 문제","cannot help but + 원형"],"src":"패턴","pp":"패턴편 I 41쪽","x":"but talk"},{"id":"P062","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"I had better put the meat in the refrigerator so that it ________.","a":2,"e":"지금 냉장고에 넣어 앞으로 녹지 않게 하려는 거라 목적절 so that ~ won't melt. 주절이 현재라 과거형 조동사는 안 돼.","h":["패턴: 패턴편 문제","so that + 미래 조동사"],"src":"패턴","pp":"패턴편 I 41쪽","o":["didn’t melt","wouldn’t melt","won’t melt","doesn’t melt"]},{"id":"P063","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"It seems to me that I can hardly pick up a newspaper ________ someone`s comments on that trial.","a":2,"e":"cannot(hardly) A without B-ing는 'A하면 반드시 B하다'. 신문을 집어 들 때마다 그 재판 이야기를 본다는 뜻이야.","h":["패턴: 패턴편 문제","cannot ~ without -ing"],"src":"패턴","pp":"패턴편 I 41쪽","o":["for me not to ecounter","but to encounter","without encountering","but I don`t encounter"]},{"id":"P070","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"I'm so tired. I'd rather stay at home _______ to the movies.","a":1,"e":"would rather A than B에서 A와 B는 둘 다 동사원형. stay와 맞춰 than go.","h":["패턴: 패턴편 문제","would rather A than B"],"src":"패턴","pp":"패턴편 I 45쪽","o":["to go","than go","to going","than going"]},{"id":"P071","c":4,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"The labor union members [shouted] that they [would] rather [die] than [losing] their jobs.","a":3,"e":"would rather A than B의 B도 동사원형이야. losing이 아니라 lose.","h":["패턴: 패턴편 문제","would rather die than lose"],"src":"패턴","pp":"패턴편 I 45쪽","x":"lose"},{"id":"P072","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"Alexander Graham Bell once said that he would rather be remembered as a teacher of the deaf _______ of the telephone.","a":3,"e":"would rather be remembered as A than as B. 비교 대상 as a teacher와 맞춰 than as the inventor.","h":["패턴: 패턴편 문제","than as the inventor"],"src":"패턴","pp":"패턴편 I 45쪽","o":["invention than","than invented","as the inventor","than as the inventor"]},{"id":"P073","c":4,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"[To become] a member of the civic association, one need only [attend] three meetings and [to pay] his fees [regularly.]","a":2,"e":"need가 조동사로 쓰여 need only attend ~ and pay ~. and로 연결된 두 번째 동사도 원형이라 to pay가 아니라 pay.","h":["패턴: 패턴편 문제","need only + 원형 and 원형"],"src":"패턴","pp":"패턴편 I 47쪽","x":"pay"},{"id":"P074","c":4,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"The idea of space colonies may appear [to be] farfetched at present, but as the earth's population grows and [as] its resources diminish, the idea [will need be] considered [seriously].","a":2,"e":"need는 긍정문에서 일반동사라 to부정사를 받아: will need to be considered. 조동사 need는 부정문·의문문에서만 써.","h":["패턴: 패턴편 문제","will need to be + p.p."],"src":"패턴","pp":"패턴편 I 47쪽","x":"will need to be"},{"id":"P075","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"Ancient civilizations such as the Phoenicians and the Mesopotamians _______ goods rather than use money.","a":1,"e":"과거에 늘 하던 일(물물교환)이라 used to trade. be used to R은 '~하는 데 사용되다'라 주어와 안 맞아.","h":["패턴: 패턴편 문제","used to + 동사원형"],"src":"패턴","pp":"패턴편 I 49쪽","o":["use to trade","used to trade","is used to trade","was used to trade"]},{"id":"P076","c":4,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"A female scholar [used to being] a deviant in a society where [the learned] woman, far from [being valued], is [likely to hear] herself [made fun of] on the public stage.","a":0,"e":"이 문장은 where절 밖에 본동사가 없어. '익숙하다'는 be used to -ing라 A female scholar is used to being a deviant로 써야 해.","h":["패턴: 패턴편 문제","문장에 동사가 없음"],"src":"패턴","pp":"패턴편 I 49쪽","x":"is used to being"},{"id":"P077","c":4,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"[Like] other forms of energy, natural gas [may be used] [to heating] homes, cook food, and even [run] automobiles.","a":2,"e":"'~하는 데 사용되다'는 be used to R. 뒤의 cook, run과도 병치되니까 to heat.","h":["패턴: 패턴편 문제","be used to + 동사원형"],"src":"패턴","pp":"패턴편 I 49쪽","x":"to heat"},{"id":"4-03","c":4,"s":2,"k":"blank","lv":2,"t":"may well","q":"He ___ be proud of his son; he has just become a doctor.","o":["may well","may as well","might as well","can well"],"a":0,"h":["'자랑스러워하는 것도 당연하다'라는 뜻이야.","may well R = have good reason to R"],"e":"may well R은 '~하는 것도 당연하다(= have good reason to R)'. may as well R은 '~하는 편이 낫다'라 의미가 달라.","src":"연습"},{"id":"4-04","c":4,"s":2,"k":"blank","lv":2,"t":"may as well A as B","q":"You ___ throw your money away as lend it to him.","o":["may well","might as well","had better","would rather"],"a":1,"h":["뒤에 as lend가 있어서 'A하는 것은 B하는 것과 같다'는 비교 구문이야.","may/might as well A as B"],"e":"may/might as well A as B는 'B하느니 차라리 A하는 게 낫다'. 그에게 돈을 빌려주느니 차라리 버리는 게 낫다는 뜻이야. would rather는 than과 짝지어.","src":"연습"},{"id":"4-05","c":4,"s":2,"k":"blank","lv":2,"t":"cannot help -ing","q":"I cannot help ___ at the sight.","a":0,"h":["'~하지 않을 수 없다'를 cannot help로 쓰면 뒤에 어떤 형태가 와?","cannot but R과 형태를 헷갈리지 마."],"e":"cannot help R-ing = cannot (choose) but R = have no choice but to R: '~하지 않을 수 없다'.","o":["laughing","laugh","to laugh","but laughing"],"src":"연습"},{"id":"4-06","c":4,"s":2,"k":"err","lv":2,"t":"cannot ~ too","q":"You [cannot] be [very] careful [when] you drive [at night].","a":1,"h":["'아무리 조심해도 지나치지 않다'라는 뜻이 되게 고쳐 봐.","cannot ~ too ~"],"e":"cannot ~ too ~ 는 '아무리 ~해도 지나치지 않다'. You cannot be too careful.(= You cannot be careful enough.)","x":"too","src":"연습"},{"id":"4-07","c":4,"s":2,"k":"err","lv":3,"t":"부정적 추측 cannot","q":"The cause of his death [may be] heavy smoking, but the news [must not] be true because no doctor [has confirmed] it [yet].","a":1,"x":"cannot","h":["'사실일 리가 없다'는 추측이야.","must not은 금지, '~일 리 없다'는 다른 조동사."],"e":"'~일 리 없다'는 부정적 추측은 cannot: The news cannot be true. must not은 '~해서는 안 된다(금지)'야. 반대로 '~임에 틀림없다'는 must.","src":"연습"},{"id":"4-10","c":4,"s":2,"k":"err","lv":2,"t":"조동사 need와 일반동사 need","q":"You [needed not] [write] a letter [to] him [yesterday].","a":0,"h":["조동사 need는 과거형이 따로 없어.","과거 부정은 일반동사 need로 써."],"e":"조동사 need는 과거형 needed로 못 써. 과거 부정은 일반동사로 didn't need to R. (편지를 썼는데 필요 없었다면 need not have written.)","x":"didn't need to","src":"연습"},{"id":"4-11","c":4,"s":2,"k":"blank","lv":1,"t":"used to와 would","q":"There ___ be a big tree in front of my house.","o":["used to","would","was used to","is used to"],"a":0,"h":["나무가 '있었다'는 동작이야, 상태야?","과거의 상태는 used to만 가능해."],"e":"used to R은 과거의 상태·습관 모두 가능하지만 would는 과거의 동작 습관에만 써. 과거 상태(There was a tree)는 used to.","src":"연습"},{"id":"P064","c":4,"s":3,"k":"blank","lv":0,"t":"과거표현의 선택","q":"She worked very hard so that she _______ pass the entrance exam.","a":3,"e":"주절이 과거(worked)라 목적절의 조동사도 과거형 could로 맞춰.","h":["패턴: 서법조동사의 시점","과거 주절 + so that could"],"src":"패턴","pp":"패턴편 I 43쪽","o":["will","shall","may","could"]},{"id":"P065","c":4,"s":3,"k":"blank","lv":0,"t":"과거표현의 선택","q":"I told him that he ______ worked much harder.","a":0,"e":"'더 열심히 했어야 했다'는 과거에 대한 유감이라 should have worked.","h":["패턴: 서법조동사의 시점","should have p.p. = 후회·유감"],"src":"패턴","pp":"패턴편 I 43쪽","o":["should have","could","will have","shall have"]},{"id":"P066","c":4,"s":3,"k":"blank","lv":0,"t":"과거표현의 선택","q":"A: Did you finish Lesson 7 today? B: Yes, but I ______ it last Friday.","a":1,"e":"오늘 끝냈지만 원래 지난 금요일에 끝냈어야 했다는 뜻이라 should have finished.","h":["패턴: 서법조동사의 시점","해야 했는데 안 한 일"],"src":"패턴","pp":"패턴편 I 43쪽","o":["should finish","should have finished","should be finishing","should be finished"]},{"id":"P067","c":4,"s":3,"k":"blank","lv":0,"t":"과거의 추측과 과거의 유감 의미구별","q":"A: Please accept my apology for breaking one of your favorite glasses. B: Well, I suppose it might have been worse. All of my glasses _______.","a":2,"e":"더 나쁠 수도 있었다(might have been worse)는 말에 이어 '잔이 다 깨졌을 수도 있었다'는 과거의 가능성이라 could have been broken.","h":["패턴: 서법조동사의 시점","could have p.p. = ~했을 수도 있다"],"src":"패턴","pp":"패턴편 I 43쪽","o":["won`t never be broken","must have been broken","could have been broken","should have been broken"]},{"id":"P068","c":4,"s":3,"k":"blank","lv":0,"t":"과거의 추측과 과거의 유감 의미구별","q":"Look at all the water on the ground. It _______ really hard last night.","a":0,"e":"땅에 물이 가득하니 어젯밤 비가 많이 왔음에 틀림없다는 강한 추측이라 must have rained.","h":["패턴: 서법조동사의 시점","must have p.p. = 확신 있는 과거 추측"],"src":"패턴","pp":"패턴편 I 43쪽","o":["must have rained","should rain","must be raining","should have rained"]},{"id":"P069","c":4,"s":3,"k":"blank","lv":0,"t":"과거의 추측과 과거의 유감 의미구별","q":"That was very kind of you, but you _______ have done it.","a":0,"e":"이미 해 준 일에 대해 '그럴 필요는 없었는데'라는 뜻이라 need not have done.","h":["패턴: 서법조동사의 시점","need not have p.p."],"src":"패턴","pp":"패턴편 I 43쪽","o":["need not","can not","may","had better"]},{"id":"4-08","c":4,"s":3,"k":"blank","lv":2,"t":"must have p.p.","q":"He ___ the exam; he looks so happy.","o":["must have passed","should have passed","cannot have passed","need not have passed"],"a":0,"h":["지금 기뻐 보이니 과거 일을 강하게 추측하는 거야.","과거에 대한 강한 확신은 must have p.p."],"e":"must have p.p.는 '~했음에 틀림없다(과거 추측)'. should have p.p.는 '~했어야 했는데(후회)', cannot have p.p.는 '~했을 리 없다', need not have p.p.는 '~할 필요가 없었는데 했다'.","src":"연습"},{"id":"4-09","c":4,"s":3,"k":"blank","lv":2,"t":"should have p.p.","q":"I failed the test. I ___ harder.","a":0,"h":["과거에 하지 않은 일에 대한 후회야.","should + have + p.p."],"e":"should have p.p.(= ought to have p.p.)는 '~했어야 했는데(안 했다)'라는 과거에 대한 후회·유감이야.","o":["should have studied","must have studied","cannot have studied","should study"],"src":"연습"},{"id":"P078","c":5,"s":0,"k":"blank","lv":0,"t":"시제를 앞당겼느냐?  아니냐?","q":"If he didn't promise it yesterday, still he _______ it tomorrow.","a":3,"e":"If he didn't promise it yesterday는 실제로 어제 약속하지 않았다는 사실(직설법)이야. 시제를 앞당긴 가정이 아니라서 내일 일은 그대로 will not promise.","h":["패턴: 직설법과 가정법의 구분방법","직설법 조건문"],"src":"패턴","pp":"패턴편 I 53쪽","o":["should not promise","could not promise","would not promise","will not promise"]},{"id":"P079","c":5,"s":0,"k":"err","lv":0,"t":"사실이냐?  아니냐?","q":"I [would] be able to finish [all my] work if the day [was] thirty [hours] long.","a":2,"e":"하루가 30시간인 건 현재 사실의 반대라 가정법 과거. be동사는 주어와 상관없이 were가 원칙이야.","h":["패턴: 직설법과 가정법의 구분방법","가정법 과거의 be동사"],"src":"패턴","pp":"패턴편 I 53쪽","x":"were"},{"id":"P080","c":5,"s":0,"k":"err","lv":0,"t":"사실이냐?  아니냐?","q":"Why [do] U.S. golf clubmakers still use Chinese factories? “If we [don't],” [says Adams], “your $400 driver [would cost] $1,000.”","a":1,"e":"주절이 would cost(가정법 과거)라 조건절도 과거형 didn't. 중국 공장을 안 쓴다면(실제론 쓰고 있음) 이라는 현재 사실의 반대야.","h":["패턴: 직설법과 가정법의 구분방법","가정법 과거의 조건절"],"src":"패턴","pp":"패턴편 I 53쪽","x":"didn't"},{"id":"P081","c":5,"s":1,"k":"blank","lv":0,"t":"단순한 형태","q":"The climate ______ more extreme if the town were a long way from the sea.","a":3,"e":"if절이 were(가정법 과거)라 주절은 would + 동사원형: would be.","h":["패턴: ※ 가정법과거","가정법 과거의 주절"],"src":"패턴","pp":"패턴편 I 55쪽","o":["was","will be","was being","would be"]},{"id":"P087","c":5,"s":1,"k":"blank","lv":0,"t":"같은 시점, 다른 시점 구분하기","q":"If she _______ the manager, she would not treat us so severely.","a":0,"e":"주절 would not treat(가정법 과거)에 맞춰 조건절은 were. 그녀는 실제 매니저가 아니야.","h":["패턴: ※ 가정법과거","가정법 과거의 were"],"src":"패턴","pp":"패턴편 I 56쪽","o":["were","are","is","had been"]},{"id":"5-01","c":5,"s":1,"k":"err","lv":1,"t":"It's time + 가정법","q":"It's [time] we [go] to [bed]; it's [already] midnight.","a":1,"h":["'진작 ~했어야 할 시간이다'라는 뜻이야.","It's time + 주어 + 과거동사"],"e":"It is (high/about) time + 주어 + 과거동사(가정법 과거)는 '이제 ~할 때다(늦었다)'. should + 동사원형도 가능해.","x":"went (또는 should go)","src":"연습"},{"id":"5-02","c":5,"s":1,"k":"blank","lv":2,"t":"would rather + 가정법","q":"I'd rather you ___ anything about it.","o":["don't do","didn't do","won't do","not do"],"a":1,"h":["would rather 뒤에 주어 + 동사의 절이 오면 어떤 시제를 써?","현재의 바람이지만 가정법 과거."],"e":"would rather (that) + 주어 + 과거동사는 '(지금) ~하면 좋겠다'는 가정법 과거야: I'd rather you didn't do anything.","src":"연습"},{"id":"5-03","c":5,"s":1,"k":"err","lv":2,"t":"가정법 과거의 be동사","q":"I [would be able to] finish all my work [if] the day [was] thirty hours [long].","a":2,"x":"were","h":["하루가 30시간인 것은 현재 사실의 반대야.","가정법 과거에서 be동사는 원칙적으로 하나로 통일해."],"e":"가정법 과거의 be동사는 주어와 상관없이 were가 원칙이야(시험에선 was를 틀린 것으로 봐): if the day were thirty hours long.","src":"연습"},{"id":"P082","c":5,"s":2,"k":"blank","lv":0,"t":"단순한 형태","q":"They could have stopped him if they _______ .","a":4,"e":"주절 could have stopped는 가정법 과거완료라 조건절은 had p.p.: had wanted to.","h":["패턴: ※ 가정법과거","가정법 과거완료의 조건절"],"src":"패턴","pp":"패턴편 I 55쪽","o":["want to","were wanting to","have wanted to","wanted","had wanted to"]},{"id":"P088","c":5,"s":2,"k":"blank","lv":0,"t":"같은 시점, 다른 시점 구분하기","q":"A: What do you think about German? B: If I had known German was so difficult, I ________ it up.","a":0,"e":"If I had known(과거 반대)에 맞춰 주절은 would never have taken. take up은 '시작하다'.","h":["패턴: ※ 가정법과거","가정법 과거완료의 주절"],"src":"패턴","pp":"패턴편 I 56쪽","o":["would never have taken","would never take","will never take","would never had taken"]},{"id":"5-04","c":5,"s":2,"k":"err","lv":1,"t":"가정법 과거완료의 주절","q":"If I [had known] her number [yesterday], I [would call] her [to apologize].","a":2,"x":"would have called","h":["if절이 had p.p.면 무엇의 반대야?","가정법 과거완료 주절 = would have p.p."],"e":"과거 사실의 반대는 If + had p.p., 주어 + would/could/might have p.p.: I would have called her to apologize.","src":"연습"},{"id":"5-05","c":5,"s":2,"k":"blank","lv":2,"t":"If it had not been for","q":"If it had not been for your help, I ___.","o":["would fail","would have failed","had failed","will fail"],"a":1,"h":["If it had not been for는 '~가 없었다면'이야.","과거의 반대니 주절은 would have p.p."],"e":"If it had not been for ~(~가 없었다면)는 가정법 과거완료라 주절은 would have failed. (= But for / Without your help, I would have failed.)","src":"연습"},{"id":"P083","c":5,"s":3,"k":"err","lv":0,"t":"시점부사 보기","q":"If you had not [stayed] [out] late last night, you [would not] [have felt] so tired now.","a":3,"e":"if절은 last night(과거)의 반대라 had p.p.지만 주절은 now(현재)라 would not feel. 혼합 가정법이야.","h":["패턴: ※ 가정법과거","now가 있으면 혼합 가정법"],"src":"패턴","pp":"패턴편 I 55쪽","x":"feel"},{"id":"P084","c":5,"s":3,"k":"err","lv":0,"t":"다른동사 보기","q":"If you [saw] the amount of food he ate [for breakfast] this morning, you would [understand] [why] he has grown so fat.","a":0,"e":"아침에 먹은 양을 봤다면(과거 반대) 지금 이해할 텐데(현재 반대)라는 혼합 가정법. 조건절은 had seen.","h":["패턴: ※ 가정법과거","this morning은 과거"],"src":"패턴","pp":"패턴편 I 55쪽","x":"had seen"},{"id":"P085","c":5,"s":3,"k":"blank","lv":0,"t":"다른동사 보기","q":"I’m hungry because I didn’t eat anything this morning. If I ①_______ breakfast, I ②_______ hungry now.","a":2,"e":"아침을 안 먹은 건 과거라 ① had eaten, 지금 배고픈 건 현재라 ② wouldn't be. 혼합 가정법이야.","h":["패턴: ※ 가정법과거","과거 반대 + 현재 반대"],"src":"패턴","pp":"패턴편 I 55쪽","o":["① ate        ―  ② wouldn't be","① ate        ―  ② wouldn't have been","① had eaten  ―  ② wouldn't be","① had eaten  ―  ② wouldn't have been"]},{"id":"P086","c":5,"s":3,"k":"blank","lv":0,"t":"다른동사 보기","q":"A: “I am very tired.” B: “You would be less tired if you ________ to bed earlier last night.”","a":0,"e":"어젯밤(과거) 일찍 잤다면 지금(현재) 덜 피곤할 거라는 혼합 가정법. 조건절은 had gone.","h":["패턴: ※ 가정법과거","last night은 과거"],"src":"패턴","pp":"패턴편 I 55쪽","o":["had gone","would have gone","went","have been","would had gone"]},{"id":"5-06","c":5,"s":3,"k":"blank","lv":3,"t":"혼합 가정법","q":"If he had taken the doctor's advice then, he ___ healthy now.","o":["would be","would have been","will be","had been"],"a":0,"h":["if절의 then과 주절의 now를 봐.","과거에 ~했다면 (지금) ~할 텐데: 혼합 가정법"],"e":"if절은 과거(then) 사실의 반대라 had p.p., 주절은 현재(now) 사실의 반대라 would + 동사원형. 시간 부사가 단서야.","src":"연습"},{"id":"P089","c":5,"s":4,"k":"blank","lv":0,"t":"주절을 물어보는 경우","q":"If a ruby is heated, it ______ temporarily lose its color.","a":2,"e":"루비를 가열하면 색을 잃는다는 건 실제로 일어나는 일이라 직설법. 조건절 현재 is heated에 주절 will lose.","h":["패턴: 가정법현재","가능성 있는 조건은 직설법"],"src":"패턴","pp":"패턴편 I 59쪽","o":["would","does","will","has"]},{"id":"P090","c":5,"s":4,"k":"blank","lv":0,"t":"조건절을 물어보는 경우","q":"If the client _______ dissatisfied, please have him write a letter.","a":1,"e":"가능성 있는 조건이라 직설법이고, 조건 부사절은 현재로 미래를 대신해. 주어 client가 단수라 is.","h":["패턴: 가정법현재","조건절 현재로 미래 대신"],"src":"패턴","pp":"패턴편 I 59쪽","o":["will be","is","are","be"]},{"id":"P113","c":5,"s":4,"k":"blank","lv":0,"t":"명령형 동사","q":"He also requested that the private sector voluntarily _______ from any such activity.","a":0,"e":"요구 동사 request 뒤 that절은 (should) + 동사원형이라 refrain.","h":["패턴: 명령형","request that + (should) 원형"],"src":"패턴","pp":"패턴편 I 75쪽","o":["refrain","might refrain","has been refrained","can refrain"]},{"id":"P114","c":5,"s":4,"k":"err","lv":0,"t":"명령형 동사","q":"The [patient’s] doctor [strongly] urges that he [has] an operation on his back as soon as his general health [improves].","a":2,"e":"주장·요구 동사 urge 뒤 that절은 (should) + 동사원형이라 has가 아니라 have.","h":["패턴: 명령형","urge that + (should) 원형"],"src":"패턴","pp":"패턴편 I 75쪽","x":"have"},{"id":"P115","c":5,"s":4,"k":"blank","lv":0,"t":"명령형 형용사","q":"It is essential that he ______ the director of the English program.","a":3,"e":"essential, imperative, necessary 같은 이성적 판단 형용사 뒤 that절은 (should) + 동사원형이라 be.","h":["패턴: 명령형","essential that + 원형"],"src":"패턴","pp":"패턴편 I 75쪽","o":["being","will be","to be","be"]},{"id":"P116","c":5,"s":4,"k":"err","lv":0,"t":"명령형 형용사","q":"It is [imperative] that a graduate student [maintains] a [grade point average] [of] “B” in his study.","a":1,"e":"imperative 뒤 that절은 (should) + 동사원형. maintains가 아니라 maintain.","h":["패턴: 명령형","imperative that + 원형"],"src":"패턴","pp":"패턴편 I 75쪽","x":"maintain"},{"id":"P117","c":5,"s":4,"k":"blank","lv":0,"t":"명령형 형용사","q":"I found it strongly recommendable that he _______ for bankruptcy.","a":2,"e":"추천·제안을 뜻하는 말 뒤 that절은 (should) + 동사원형이라 file.","h":["패턴: 명령형","recommendable that + 원형"],"src":"패턴","pp":"패턴편 I 75쪽","o":["would have filed","filed","file","files"]},{"id":"P118","c":5,"s":4,"k":"err","lv":0,"t":"명령형 명사","q":"John complied [with] the requirement that [all graduate] students [in education] [would write] a thesis.","a":3,"e":"requirement(요구) 같은 명사 뒤 동격 that절도 (should) + 동사원형이라 write.","h":["패턴: 명령형","requirement that + 원형"],"src":"패턴","pp":"패턴편 I 75쪽","x":"write"},{"id":"P119","c":5,"s":4,"k":"err","lv":0,"t":"명령형 문장?? 단순사실 문장??","q":"The witness insisted that [that major] car accident [take place] around the corner [at] about [11 p.m].","a":1,"e":"증인이 사고가 '일어났다'는 과거 사실을 주장한 거라 직설법 took place. '~해야 한다'는 당위일 때만 원형을 써.","h":["패턴: 명령형","insist가 사실 주장이면 직설법"],"src":"패턴","pp":"패턴편 I 75쪽","x":"took place"},{"id":"5-07","c":5,"s":4,"k":"blank","lv":2,"t":"제안 동사 + that + (should) R","q":"The doctor suggested that he ___ smoking.","a":0,"h":["suggest가 '제안하다'일 때 that절의 동사 형태야.","주장·요구·제안·명령 동사 + that + 주어 + (should) 동사원형"],"e":"insist, demand, require, suggest, recommend, order가 당위(~해야 한다)를 나타내면 that절에 (should) + 동사원형을 써. 그래서 stops가 아니라 stop.","o":["stop","stops","stopped","will stop"],"src":"연습"},{"id":"P091","c":5,"s":5,"k":"err","lv":0,"t":"'should' 미래 가정법","q":"If the volcano slope should collapse and [slide] into the sea, a scientist warns, it [has sent] waves [coursing] through [the Atlantic basin].","a":1,"e":"If ~ should collapse(가정법 미래)의 주절은 would/will + 동사원형. 현재완료 has sent는 안 돼.","h":["패턴: 가정법미래","should 가정법 미래의 주절"],"src":"패턴","pp":"패턴편 I 61쪽","x":"would send"},{"id":"P092","c":5,"s":5,"k":"blank","lv":0,"t":"'should' 미래 가정법","q":"If you _______ see Mr. Smith, give him my regards.","a":1,"e":"혹시라도 Smith 씨를 만나면이라는 가정법 미래 should. 주절에는 명령문도 올 수 있어.","h":["패턴: 가정법미래","If you should ~ 명령문"],"src":"패턴","pp":"패턴편 I 61쪽","o":["would","should","will","shall"]},{"id":"P093","c":5,"s":5,"k":"blank","lv":0,"t":"'were to' 미래 가정법","q":"_______, I for one would be disturbed.","a":0,"e":"그가 메달을 딸 가능성이 희박한 미래라 If he were to win. 주절 would be와 짝이야.","h":["패턴: 가정법미래","were to = 거의 불가능한 가정"],"src":"패턴","pp":"패턴편 I 61쪽","o":["If he were to win the medal","If he was to win the medal","If he wins the medal","If he is the winner of the medal"]},{"id":"5-08","c":5,"s":5,"k":"blank","lv":2,"t":"were to 가정법 미래","q":"If the sun ___ rise in the west, I would not change my mind.","o":["were to","should","will","would"],"a":0,"h":["해가 서쪽에서 뜰 가능성은 거의 0%야.","실현 가능성이 거의 없는 미래는 were to."],"e":"가정법 미래에서 실현 가능성이 거의 없는 일은 If + 주어 + were to R, 가능성이 낮지만 있는 일은 If + 주어 + should R.","src":"연습"},{"id":"P094","c":5,"s":6,"k":"blank","lv":0,"t":"‘were, had, should'의 접속사 역할","q":"________ cut away, the wheel could be strengthened with struts or crossbars.","a":0,"e":"If large sections of a wheel were cut away에서 if를 생략하면 Were large sections of a wheel cut away.","h":["패턴: ‘were, had, should'의 접속사 역할","Were + 주어 + p.p. 도치"],"src":"패턴","pp":"패턴편 I 63쪽","o":["Were large sections of a wheel","Large sections of a wheel","Large sections of a wheel were","Large sections of a wheel to"]},{"id":"P095","c":5,"s":6,"k":"blank","lv":0,"t":"‘were, had, should'의 접속사 역할","q":"_______ you have any questions about this matter, never hesitate to drop by my office.","a":0,"e":"If you should have any questions에서 if를 생략하면 Should eatures are organized into many different systems, _________ has a certain function.","a":3,"e":"접속사 역할 + 각각이라 each of which has. which만 쓰면 의미가 안 맞아.","h":["패턴: 관계절내의 수일치","each of which"],"src":"패턴","pp":"패턴편 II 59쪽","o":["which","in which","and","each of which"]},{"id":"P368","c":8,"s":1,"k":"err","lv":0,"t":"관계부사의 선택 - 전치사","q":"The kind of place in [where] a particular tribe originally [lives] can [be referred] to [as] its native land.","a":0,"e":"in 뒤에는 관계부사 where가 못 와. in which(= where).","h":["패턴: 관계부사","전치사 + 관계대명사"],"src":"패턴","pp":"패턴편 II 61쪽","x":"which"},{"id":"P369","c":8,"s":1,"k":"blank","lv":0,"t":"관계부사의 선택 - 완전성·불완전성","q":"The gardens _______ we planted pine trees belong to the city.","a":2,"e":"we planted pine trees(in the gardens)는 완전한 절이라 장소 관계부사 where.","h":["패턴: 관계부사","완전한 절 앞 where"],"src":"패턴","pp":"패턴편 II 61쪽","o":["why","when","where","which"]},{"id":"P370","c":8,"s":1,"k":"err","lv":0,"t":"관계부사의 선택 - 완전성·불완전성","q":"Increasingly, the Internet also is [a venue of] so-called citizen journalism, [which] swarms of surfers mobilize to gather information on what the traditional media isn’t covering, [or is covering] in a way [that dissatisfies] some people.","a":1,"e":"swarms of surfers mobilize ~ 는 완전한 절이라 which가 아니라 where(= in which).","h":["패턴: 관계부사","완전한 절 앞"],"src":"패턴","pp":"패턴편 II 61쪽","x":"where (또는 in which)"},{"id":"P371","c":8,"s":1,"k":"blank","lv":0,"t":"관계부사가 생략이 되는 경우","q":"The computer has dramatically affected __________ photographic lenses are constructed.","a":3,"e":"'렌즈가 만들어지는 방식'은 the way + 절. affected의 목적어로 바로 와.","h":["패턴: 관계부사","the way + 절"],"src":"패턴","pp":"패턴편 II 61쪽","o":["is the way","that the way","which way do","the way"]},{"id":"P372","c":8,"s":1,"k":"err","lv":0,"t":"관계부사가 생략이 되는 경우","q":"If people cannot rely on the news [for] facts, journalism has no reason for [being.] The principal reason journalists [existing] in society is that people have a need to [be informed of] and [comprehend] the details of experience.","a":2,"e":"The principal reason (why) journalists exist in society에서 관계절 동사가 필요해. existing이 아니라 exist.","h":["패턴: 관계부사","관계부사 생략 뒤 동사"],"src":"패턴","pp":"패턴편 II 61쪽","x":"exist"},{"id":"8-02","c":8,"s":1,"k":"err","lv":1,"t":"관계절 안 목적어 중복","q":"This is [the dictionary] [which] I bought [it] [yesterday].","a":2,"x":"(it 삭제)","h":["which가 관계절 안에서 무슨 역할을 해?","관계대명사가 이미 목적어 역할을 해."],"e":"목적격 관계대명사 which가 bought의 목적어 역할을 하니까 it을 또 쓰면 안 돼: the dictionary which I bought yesterday.","src":"연습"},{"id":"8-03","c":8,"s":1,"k":"blank","lv":3,"t":"삽입절 뒤 관계대명사의 격","q":"She was a teacher ___ I thought loved us very much.","o":["who","whom","which","what"],"a":0,"h":["I thought를 괄호로 묶고 다시 봐.","loved의 주어가 빈칸이야."],"e":"I thought는 삽입절이야. 빼고 보면 a teacher ___ loved us라 주격 who. 삽입절 뒤라고 whom을 고르는 게 대표 함정이야.","src":"연습"},{"id":"8-04","c":8,"s":1,"k":"blank","lv":2,"t":"앞 절 전체를 받는 which","q":"He paid all his debt, ___ proves his honesty.","o":["which","that","what","who"],"a":0,"h":["무엇이 정직함을 증명하는지 생각해 봐: 빚을 다 갚은 것 전체.","앞 문장 전체를 선행사로 받는 계속적 용법."],"e":"앞 절 전체를 선행사로 받는 계속적 용법은 , which. that은 계속적 용법에 못 쓰고, what은 선행사를 포함해서 안 돼.","src":"연습"},{"id":"8-05","c":8,"s":1,"k":"err","lv":2,"t":"what은 선행사를 포함","q":"[The thing what] [made] her angry [was] his [indifference].","a":0,"h":["what 안에 이미 the thing이 들어 있어.","선행사가 있으면 what은 못 써."],"e":"what = the thing which(that)라 선행사와 같이 못 써. What made her angry ~ 또는 The thing that(which) made her angry ~.","x":"What (또는 The thing that)","src":"연습"},{"id":"8-06","c":8,"s":1,"k":"err","lv":1,"t":"the way와 how","q":"This is [the way] [how] he [solved] the [quiz].","a":1,"x":"(how 삭제) the way he solved / how he solved","h":["the way와 how를 같이 쓸 수 있는지 생각해 봐.","둘 중 하나만 써."],"e":"the way와 관계부사 how는 함께 못 써. the way he solved, how he solved, the way in which he solved 중 하나로 써.","src":"연습"},{"id":"8-07","c":8,"s":1,"k":"blank","lv":1,"t":"관계부사 where","q":"This is the house ___ I was born.","o":["which","where","in where","that"],"a":1,"h":["I was born은 완전한 절이야.","완전한 3,"x":"while (또는 when)","h":["빈칸 뒤에 주어 + 동사가 있어.","during은 전치사."],"e":"during은 전치사라 명사(구)만 받아(during his childhood). 주어 + 동사가 오면 접속사 while/when.","src":"연습"},{"id":"9-02","c":9,"s":0,"k":"blank","lv":2,"t":"부사절의 축약","q":"___ traveling in Europe, he was taken ill.","o":["While","During","Since he","Because of"],"a":0,"h":["While he was traveling에서 무엇이 생략됐을까?","접속사 + 분사 형태로 줄일 수 있어."],"e":"While he was traveling에서 주어 + be동사를 생략하면 While traveling. during은 전치사라 동명사를 목적어로 쓰지 않고, Because of + -ing도 '~ 때문에'라 의미가 안 맞아.","src":"연습"},{"id":"P399","c":9,"s":2,"k":"err","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"As soon as [completing] his examination [of] the patient, the doctor offered his [judgement] of [her] condition.","a":0,"e":"as soon as는 접속사라 분사가 아니라 절이 와야 해: As soon as he completed ~.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","as soon as + 절"],"src":"패턴","pp":"패턴편 II 77쪽","x":"he completed"},{"id":"P400","c":9,"s":2,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"The wages of production workers could not be allowed to sink too low, _______ there be insufficient purchasing power in the economy.","a":3,"e":"빈칸 뒤 there be(원형)라 lest(~하지 않도록). 구매력이 부족해지지 않도록 임금이 너무 낮으면 안 된다는 뜻.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","lest + (should) 원형"],"src":"패턴","pp":"패턴편 II 77쪽","o":["therefore","because","where","lest"]},{"id":"P401","c":9,"s":2,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"Stupid _______ it sounds, I had very little sense of where it began or ended.","a":3,"e":"Stupid as it sounds = Though it sounds stupid(바보 같이 들리겠지만). 양보의 as.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","형용사 + as + S + V"],"src":"패턴","pp":"패턴편 II 77쪽","o":["so","maybe","as if","as"]},{"id":"P405","c":9,"s":2,"k":"err","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"The cost of a college education [has risen] [as rapidly] [during the past several years] that it is now [beyond the reach of] many people.","a":1,"e":"결과의 that과 짝이 되는 건 so. as rapidly는 that과 못 써.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","so ~ that"],"src":"패턴","pp":"패턴편 II 78쪽","x":"s function vHome(){
 const cards=BOOKS.map(b=>{const ps=P.filter(p=>b.ch.includes(p.c)),n=solved(ps);const r=b.ch.length>1?`${b.ch[0]}~${b.ch[b.ch.length-1]}강`:`${b.ch[0]}강`;
  return `<article class="card"><p class="ser">${b.name} · ${r}</p><h2>${b.sub}</h2><p class="desc">${b.desc}</p><p class="stat">문제 ${ps.length}개 · ${srcCnt(ps)}</p><div class="prog"><span>푼 문제 ${n} / ${ps.length}</span><i><b style="width:${pct(n,ps.length)}%"></b></i></div><div class="btns"><a class="btn" href="#${b.id}">차례 보기</a><a class="btn alt" href="#exam" data-scope="${b.id}">모의고사</a></div></article>`}).join("");
 const nx=P.find(p=>!st(p.id)),wr=P.filter(p=>st(p.id)==="no").length,done=solved(P);
 return `<h1>편입 영어 문법</h1><p class="lead">강의자료의 강과 절을 따라 푸는 문법 문제야. 답을 내면 바로 채점하고, 힌트 두 개와 해설을 볼 수 있어.</p><div class="cards">${cards}</div>
 <div class="band"><div><h2>${done?`${done}문제 풀었어 · 틀린 문제 ${wr}개`:"아직 푼 문제가 없어"}</h2><p>${nx?`다음 안 푼 문제: ${nx.c}강 ${esc(nx.t)}`:"모든 문제를 한 번씩 풀었어."}</p></div><div class="btns">${nx?`<a class="btn" href="#p${nx.id}">이어서 풀기</a>`:""}<a class="ghost" href="#me">내 기록</a></div></div>
 <p class="note">패턴편 문제는 강의자료 패턴편 그대로 가져왔고, 정답·힌트·해설은 이론편을 바탕으로 새로 썼어. 연습 문제는 이론편 규칙과 예문으로 만든 문제야. 쪽수는 강의자료 기준이야.</p>`}

function vBook(b){
 const ps=P.filter(p=>b.ch.includes(p.c)),n=solved(ps);
 const toc=b.ch.map(c=>{const C=CH[c],cp=chP(c);
  return `<div class="tocch"><a class="toch" href="#c${c}"><span class="num">${c}</span><span><b>${C.t}</b><small>${C.pg}쪽 · ${cp.length}문제 · 푼 문제 ${solved(cp)}</small></span></a><ul>${C.s.map((s,i)=>{const k=cp.filter(p=>p.s===i).length;return `<li><a href="#c${c}" data-sec="s${c}-${i}"><span class="sl">${s[0]||"·"}</span><span class="st">${s[1]}</span><span class="sn">${k?k+"문제":"문제 없음"}</span></a></li>`}).join("")}</ul></div>`}).join("");
 return `<a class="back" href="#home">← 편입 영어 문법</a><p class="ser">${b.name}</p><h1>${b.sub}</h1><p class="lead">${b.desc}</p><p class="kline"><span>문제 <b>${ps.length}</b>개</span>${kline(countK(ps))}<span>${srcCnt(ps)}</span></p>
 <div class="mode"><article class="card"><h2>연습</h2><p class="desc">차례에서 강과 절을 골라 풀고 바로 채점해. 힌트와 해설을 볼 수 있고, 푼 기록이 남아.</p><div class="btns"><button class="btn" data-goto="toc">차례 보기</button></div></article><article class="card"><h2>모의고사</h2><p class="desc">이 범위에서 무작위로 뽑은 문제를 제한 시간 안에, 또는 시간 제한 없이 풀어. 다 풀고 한꺼번에 채점해.</p><div class="btns"><a class="btn alt" href="#exam" data-scope="${b.id}">모의고사 시작</a></div></article></div>
 <div class="prog"><span>푼 문제 ${n} / ${ps.length} · 맞힌 문제 ${ps.filter(p=>st(p.id)==="ok").length}</span><i><b style="width:${pct(n,ps.length)}%"></b></i></div>
 <h2 class="h2" id="toc">차례</h2>${toc}`}

const vis=p=>(ui.fk==="all"||p.k===ui.fk)&&(ui.fsrc==="all"||(ui.fsrc==="pt")===(p.src==="패턴"))&&(ui.fs==="all"||(ui.fs==="un"&&!st(p.id))||(ui.fs==="no"&&st(p.id)==="no")||(ui.fs==="done"&&!!st(p.id)));
const rowH=p=>{const s=st(p.id)||"";return `<a class="row" href="#p${p.id}"><span class="dot ${s}" aria-label="${s==="ok"?"맞힘":s==="no"?"틀림":"안 품"}"></span><span class="tag ${KIND[p.k][1]}">${KIND[p.k][0]}</span><span class="rt">${esc(p.t)}</span>${lvH(p)}</a>`};
function vChap(c){
 const C=CH[c],b=bookOf(c),cp=chP(c);
 const fk=[["all","모든 유형"],["err","틀린 곳 찾기"],["blank","빈칸 고르기"]].map(([v,l])=>`<button class="chip" data-fk="${v}" aria-pressed="${ui.fk===v}">${l}</button>`).join("");
 const fs=[["all","모두"],["un","안 푼 문제"],["no","틀린 문제"],["done","푼 문제"]].map(([v,l])=>`<button class="chip" data-fs="${v}" aria-pressed="${ui.fs===v}">${l}</button>`).join("");
 const secs=C.s.map((s,i)=>{const all=cp.filter(p=>p.s===i),sp=all.filter(vis);
  return `<div class="sec" id="s${c}-${i}"><div class="sh"><b>${secName(c,i)}</b><span>${b.name} ${s[2]}쪽 · ${all.length}문제</span></div>${sp.length?sp.map(rowH).join(""):`<div class="empty">${all.length?"조건에 맞는 문제가 없어":"이 절에는 문제가 없어"}</div>`}</div>`}).join("");
 const prev=CH[c-1]?`<a class="ghost" href="#c${c-1}">← ${c-1}강 ${CH[c-1].t}</a>`:"<span></span>",next=CH[c+1]?`<a class="ghost" href="#c${c+1}">${c+1}강 ${CH[c+1].t} →</a>`:"<span></span>";
 return `<a class="back" href="#${b.id}">← ${b.name} 차례</a><p class="ser">${c}강</p><h1>${C.t}</h1><p class="lead">${b.name} ${C.pg}쪽 · 문제 ${cp.length}개 · 푼 문제 ${solved(cp)} · 맞힌 문제 ${cp.filter(p=>st(p.id)==="ok").length}</p>
 <div class="filters"><div class="chips" role="group" aria-label="출처">${[["all","모든 문제"],["pt","패턴편"],["ex","연습 문제"]].map(([v,l])=>`<button class="chip" data-fsrc="${v}" aria-pressed="${ui.fsrc===v}">${l}</button>`).join("")}</div><div class="chips" role="group" aria-label="유형">${fk}</div><div class="chips" role="group" aria-label="상태">${fs}</div></div>${secs}<div class="cnav">${prev}${next}</div>`}

function sentH(p,g){let n=0;
 let h=esc(p.q).replace(/\[([^\]]+)\]/g,(m,t)=>{const i=n++;if(p.k==="err"){let c="u";if(g){if(i===p.a)c+=" good";else if(g.g===i)c+=" bad"}return `<span class="${c}"><span>${t}</span><b>(${LET[i]})</b></span>`}return `<span class="u1">${t}</span>`});
 return h.replace(/_{3,}/g,()=>g&&p.k==="blank"?`<span class="blank on">${esc(p.o[p.a])}</span>`:g&&p.k==="fill"?`<span class="blank on">${esc(p.a[0])}</span>`:`<span class="blank"></span>`)}
function optsH(p,sel,g){const sg=segs(p);
 return `<div class="opts">${ord(p).map((oi,pos)=>{let c="opt";if(g){if(oi===p.a)c+=" ok";else if(g.g===oi)c+=" no"}else if(sel===oi)c+=" sel";
  const txt=p.k==="err"?esc(sg[oi]):esc(p.o[oi]);
  return `<button class="${c}" data-o="${oi}" ${g?"disabled":""} aria-pressed="${sel===oi}"><span class="bub">${LET[pos]}</span><span class="ot">${txt}</span></button>`}).join("")}</div>`}
function qPane(p,extra){const C=CH[p.c],b=bookOf(p.c);
 return `<section class="pane"><div class="tags"><span class="tag ${KIND[p.k][1]}">${KIND[p.k][0]}</span>${lvH(p)}</div><h1 class="pt">${esc(p.t)}</h1><p class="src">${b.name} ${p.c}강 ${secName(p.c,p.s)} · ${C.s[p.s][2]}쪽${p.pp?` · 출처 ${p.pp}`:""}</p><p class="ins">${INS[p.k]}</p><div class="sent">${sentH(p,extra)}</div></section>`}

function vProb(p){
 const C=CH[p.c],list=chP(p.c),i=list.indexOf(p),rec=S.r[p.id],g=rec&&!ui.retry[p.id]?rec:null;
 const sel=ui.sel[p.id],hs=ui.hints[p.id]||0,open=!!ui.open[p.id];
 const area=OBJ(p.k)?optsH(p,sel,g):`<label class="help" for="ans" style="display:block;margin:0 0 6px">${p.k==="fix"?"밑줄 친 부분을 고친 형태만 써":"빈칸에 들어갈 말만 써"}</label><input class="inp" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" ${g?`disabled value="${esc(g.g)}"`:`value="${esc(ui.draft[p.id]||"")}"`} placeholder="${p.k==="fix"?"예: had been":"영어로 입력"}"><p class="help">대소문자와 끝의 마침표는 상관없어.</p>`;
 const res=g?(g.s==="ok"?`<p class="res ok">정답이야${g.n>1?`<small>${g.n}번째 시도</small>`:""}</p>`:`<p class="res no">틀렸어${!OBJ(p.k)?`<small>내 답: ${esc(g.g||"(비워 둠)")}</small>`:""}</p>`):"";
 const self=g&&g.s==="no"&&!OBJ(p.k)&&g.g?`<button class="ghost" id="selfok">내 답도 맞아</button>`:"";
 const hints=hs?`<ol class="hints">${p.h.slice(0,hs).map((h,k)=>`<li><b>힌트 ${k+1}</b>${esc(h)}</li>`).join("")}</ol>`:"";
 const sol=g&&open?`<div class="sol"><p><span class="lab">정답</span> <span class="serif">${esc(ansText(p))}</span></p><p class="exp">${esc(p.e)}</p></div>`:"";
 const prev=list[i-1],next=list[i+1];
 return `<div class="ptop"><a class="back" href="#c${p.c}">← ${p.c}강 ${C.t}</a><span>${secName(p.c,p.s)}</span><span>${i+1} / ${list.length}</span></div>
 <div class="pgrid">${qPane(p,g)}<section class="pane"><h2 class="ah">답안</h2>${area}
 <div class="acts">${g?`<button class="btn" id="retry">다시 풀기</button>`:`<button class="btn" id="grade">채점하기 <kbd>Ctrl+↵</kbd></button>`}<button class="ghost" id="hint" ${hs>=2?"disabled":""}>힌트 ${hs}/2</button>${self}</div>${hints}${res}
 <button class="ghost solbtn" id="sol" ${g?"":"disabled"}>${g?(open?"정답과 해설 닫기":"정답과 해설 보기"):"정답과 해설 · 한 번 채점하면 열려"}</button>${sol}</section></div>
 <nav class="pnav">${prev?`<a class="ghost" href="#p${prev.id}">← 이전 문제</a>`:`<a class="ghost" href="#c${p.c}">← ${p.c}강 목록</a>`}${next?`<a class="btn" href="#p${next.id}">다음 문제 →</a>`:CH[p.c+1]?`<a class="btn" href="#p${chP(p.c+1)[0].id}">${p.c+1}강 첫 문제 →</a>`:`<a class="btn" href="#me">내 기록 보기</a>`}</nav>`}

/* 모의고사 */
function vExam(){
 if(EX&&!EX.done)return exRun();
 if(EX&&EX.done)return exResult();
 const sc=[["all","전체"]].concat(BOOKS.map(b=>[b.id,b.name])).map(([v,l])=>`<button class="chip" data-sc="${v}" aria-pressed="${ui.scope===v}">${l}</button>`).join("");
 const nn=[10,20,30].map(v=>`<button class="chip" data-en="${v}" aria-pressed="${ui.exN===v}">${v}문제</button>`).join("");
 const tt=[[0,"제한 없음"],[10,"10분"],[20,"20분"],[30,"30분"]].map(([v,l])=>`<button class="chip" data-et="${v}" aria-pressed="${ui.exT===v}">${l}</button>`).join("");
 return `<a class="back" href="#home">← 편입 영어 문법</a><h1>모의고사</h1><p class="lead">고른 범위에서 무작위로 문제를 뽑아. 풀 때는 채점하지 않고, 다 풀고 제출하면 한꺼번에 채점해. 결과는 내 기록에도 남아.</p>
 <div class="setup"><div><h3>범위</h3><div class="chips">${sc}</div></div><div><h3>문항 수</h3><div class="chips">${nn}</div></div><div><h3>제한 시간</h3><div class="chips">${tt}</div></div><div><button class="btn alt" id="exstart">시작하기</button></div></div>`}
function exRun(){const p=byId[EX.ids[EX.i]],a=EX.ans[p.id],n=EX.ids.length,last=EX.i===n-1;
 const area=OBJ(p.k)?optsH(p,a,null):`<input class="inp" id="exans" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(a||"")}" placeholder="${p.k==="fix"?"고친 형태만":"빈칸에 들어갈 말만"}">`;
 const done=EX.ids.filter(id=>EX.ans[id]!==undefined&&EX.ans[id]!=="").length;
 return `<div class="exbar"><div><p class="ser">모의고사 · ${EX.label}</p><b>${EX.i+1} / ${n}</b> <span class="lv">· 답한 문제 ${done}</span></div><span class="timer" id="timer">${EX.lim?fmt(EX.lim-(Date.now()-EX.t0)):fmt(Date.now()-EX.t0)}</span></div>
 <div class="pgrid">${qPane(p,null)}<section class="pane"><h2 class="ah">답안</h2>${area}<div class="acts">${EX.i?`<button class="ghost" data-ex="prev">← 이전</button>`:""}${last?`<button class="btn alt" data-ex="submit">제출하고 채점</button>`:`<button class="btn" data-ex="next">다음 →</button>`}</div><p class="help">${last?"제출하면 바로 채점해. 답하지 않은 문제는 기록에 남기지 않아.":"이전으로 돌아가 답을 바꿀 수 있어."}</p>${!last?`<button class="ghost solbtn" data-ex="submit">지금 제출하기</button>`:""}</section></div>`}
const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`};
function exStart(){const pool=ui.scope==="all"?P:P.filter(p=>bookOf(p.c).id===ui.scope);
 EX={ids:shuffle(pool.map(p=>p.id)).slice(0,ui.exN),i:0,ans:{},t0:Date.now(),lim:ui.exT*60000,done:false,label:ui.scope==="all"?"전체":BOOKS.find(b=>b.id===ui.scope).name};keep()}
function exFinish(){if(!EX||EX.done)return;EX.done=true;EX.used=Date.now()-EX.t0;EX.res={};
 EX.ids.forEach(id=>{const p=byId[id],g=EX.ans[id];if(g===undefined||g==="")return;const ok=check(p,g);EX.res[id]=ok;const prev=S.r[id]||{n:0};S.r[id]={s:ok?"ok":"no",g,n:(prev.n||0)+1,t:Date.now()}});save();keep()}
function exResult(){const n=EX.ids.length,ok=EX.ids.filter(id=>EX.res[id]===true).length;
 const rows=EX.ids.map((id,k)=>{const p=byId[id],r=EX.res[id];return `<a class="row" href="#p${id}"><span class="dot ${r===true?"ok":r===false?"no":""}"></span><span class="tag ${KIND[p.k][1]}">${KIND[p.k][0]}</span><span class="rt">${k+1}. ${esc(p.t)} <span class="lv">· ${p.c}강${p.src==="패턴"?" · 패턴편":""}</span></span><span class="lv ${r===true?"l1":r===false?"l3":""}">${r===true?"정답":r===false?"오답":"미응답"}</span></a>`}).join("");
 return `<a class="back" href="#home">← 편입 영어 문법</a><p class="ser">모의고사 결과 · ${EX.label}</p><div class="big"><b>${ok}</b><span>/ ${n}</span></div><p class="lead">${pct(ok,n)}점 · 걸린 시간 ${fmt(EX.used)} · 문제를 누르면 힌트와 해설을 볼 수 있어.</p><div class="sec"><div class="sh"><b>문항별 결과</b><span>정답 ${ok} · 오답 ${Object.values(EX.res).filter(v=>!v).length} · 미응답 ${n-Object.keys(EX.res).length}</span></div>${rows}</div><div class="cnav"><button class="ghost" id="exagain">같은 조건으로 다시</button><button class="btn" id="exnew">새 모의고사</button></div>`}

/* 내 기록 */
function vMe(){const done=solved(P),ok=P.filter(p=>st(p.id)==="ok").length,wr=P.filter(p=>st(p.id)==="no");
 const bars=Object.keys(CH).map(Number).map(c=>{const cp=chP(c),d=solved(cp),o=cp.filter(p=>st(p.id)==="ok").length;return `<a class="bar" href="#c${c}"><span class="bn">${c}강 ${CH[c].t}</span><i><b style="width:${pct(d,cp.length)}%"></b></i><span class="v">${d}/${cp.length}</span><span class="m">${d?pct(o,d)+"%":"—"}</span></a>`}).join("");
 const wl=wr.length?wr.map(rowH).join(""):`<div class="empty">틀린 문제가 없어. 틀리면 여기 모이고, 다시 맞히면 빠져.</div>`;
 return `<h1>내 기록</h1><div class="figs"><div class="fig"><b>${done}</b><span>푼 문제 / ${P.length}</span></div><div class="fig"><b>${ok}</b><span>맞힌 문제</span></div><div class="fig"><b>${done?pct(ok,done)+"%":"—"}</b><span>정답률</span></div><div class="fig"><b>${wr.length}</b><span>틀린 문제</span></div></div>
 <h2 class="h2">강별 진행</h2><p class="help" style="margin:-6px 0 10px">막대는 푼 비율, 오른쪽 숫자는 푼 문제 중 맞힌 비율이야.</p><div class="bars">${bars}</div>
 <h2 class="h2">틀린 문제</h2><div class="sec" style="margin-top:0">${wl}</div>
 <div class="cnav"><span class="help">기록은 문제마다 가장 최근 채점 결과로 남아.</span><button class="ghost" id="reset">${ui.reset?"한 번 더 누르면 모든 기록이 지워져":"기록 초기화"}</button></div>`}

/* 라우팅 */
function route(){clearInterval(tick);const h=decodeURIComponent(location.hash.slice(1))||"home";let html,title="편입 영어 문법",nav="home";
 if(/^b[123]$/.test(h)){const b=BOOKS.find(x=>x.id===h);html=vBook(b);title=b.name+" · 편입 영어 문법"}
 else if(/^c\d+$/.test(h)&&CH[+h.slice(1)]){const c=+h.slice(1);html=vChap(c);title=`${c}강 ${CH[c].t} · 편입 영어 문법`}
 else if(h[0]==="p"&&byId[h.slice(1)]){const p=byId[h.slice(1)];html=vProb(p);title=p.t+" · 편입 영어 문법"}
 else if(h==="exam"){html=vExam();nav="exam";title="모의고사 · 편입 영어 문법"}
 else if(h==="me"){html=vMe();nav="me";title="내 기록 · 편입 영어 문법"}
 else html=vHome();
 $("#app").innerHTML=html;document.title=title;
 document.querySelectorAll(".nav a").forEach(a=>a.dataset.n===nav?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
 if(h==="exam"&&EX&&!EX.done)tick=setInterval(()=>{const el=$("#timer");if(!el)return;if(EX.lim){const left=EX.lim-(Date.now()-EX.t0);el.textContent=fmt(left);el.classList.toggle("low",left<60000);if(left<=0){exFinish()}}else el.textContent=fmt(Date.now()-EX.t0)},1000);
}
let lastH=null;
function go(){const h=location.hash;if(h!==lastH){lastH=h;route();if(ui.sec){const el=document.getElementById(ui.sec);ui.sec=null;if(el){el.scrollIntoView();return}}window.scrollTo(0,0)}else keep()}
function keep(){const y=window.scrollY;route();window.scrollTo(0,y)}
window.addEventListener("hashchange",go);

const cur=()=>{const h=location.hash.slice(1);return h[0]==="p"?byId[h.slice(1)]:null};
function grade(p,g){const ok=check(p,g);const prev=S.r[p.id]||{n:0};S.r[p.id]={s:ok?"ok":"no",g,n:(prev.n||0)+1,t:Date.now()};delete ui.retry[p.id];delete ui.sel[p.id];save();keep()}
function tryGrade(){const p=cur();if(!p||(S.r[p.id]&&!ui.retry[p.id]))return;
 if(OBJ(p.k)){if(ui.sel[p.id]===undefined)return;grade(p,ui.sel[p.id])}else{const v=($("#ans")||{}).value||"";if(!v.trim()){$("#ans").focus();return}grade(p,v.trim())}}

document.addEventListener("click",e=>{const t=e.target.closest("button,a");if(!t)return;const p=cur();
 if(t.dataset.scope)ui.scope=t.dataset.scope;
 if(t.dataset.sec)ui.sec=t.dataset.sec;
 if(t.dataset.goto){document.getElementById(t.dataset.goto).scrollIntoView({behavior:"smooth"});return}
 if(t.dataset.fk){ui.fk=t.dataset.fk;keep();return}
 if(t.dataset.fs){ui.fs=t.dataset.fs;keep();return}
 if(t.dataset.fsrc){ui.fsrc=t.dataset.fsrc;keep();return}
 if(t.dataset.sc){ui.scope=t.dataset.sc;keep();return}
 if(t.dataset.en){ui.exN=+t.dataset.en;keep();return}
 if(t.dataset.et){ui.exT=+t.dataset.et;keep();return}
 if(t.id==="exstart"){exStart();window.scrollTo(0,0);return}
 if(t.id==="exagain"){exStart();window.scrollTo(0,0);return}
 if(t.id==="exnew"){EX=null;keep();return}
 if(t.dataset.ex){if(t.dataset.ex==="prev")EX.i--;else if(t.dataset.ex==="next")EX.i++;else exFinish();route();window.scrollTo(0,0);return}
 if(t.dataset.o!==undefined&&!t.disabled){const o=+t.dataset.o;if(location.hash==="#exam"&&EX&&!EX.done){EX.ans[EX.ids[EX.i]]=o;keep()}else if(p){ui.sel[p.id]=o;keep()}return}
 if(!p&&t.id==="reset"){if(ui.reset){S={r:{},u:0};save();ui.reset=0}else{ui.reset=1;setTimeout(()=>{if(ui.reset){ui.reset=0;if(location.hash==="#me")keep()}},4000)}keep();return}
 if(!p)return;
 if(t.id==="grade")tryGrade();
 else if(t.id==="retry"){ui.retry[p.id]=1;ui.open[p.id]=0;ui.draft[p.id]="";keep()}
 else if(t.id==="hint"){ui.hints[p.id]=Math.min(2,(ui.hints[p.id]||0)+1);keep()}
 else if(t.id==="sol"){ui.open[p.id]=!ui.open[p.id];keep()}
 else if(t.id==="selfok"){S.r[p.id].s="ok";save();keep()}
});
document.addEventListener("input",e=>{if(e.target.id==="ans"){const p=cur();if(p)ui.draft[p.id]=e.target.value}if(e.target.id==="exans"&&EX)EX.ans[EX.ids[EX.i]]=e.target.value});
document.addEventListener("keydown",e=>{const p=cur();
 if((e.ctrlKey||e.metaKey)&&e.key==="Enter"&&p){e.preventDefault();tryGrade();return}
 if(e.key==="Enter"&&e.target.id==="ans"){e.preventDefault();tryGrade();return}
 if(e.key==="Enter"&&e.target.id==="exans"){e.preventDefault();const b=document.querySelector('[data-ex="next"],[data-ex="submit"]');if(b)b.click();return}
 const tag=e.target.tagName;if(tag==="INPUT"||tag==="TEXTAREA"||e.ctrlKey||e.metaKey||e.altKey)return;
 if(/^[1-5]$/.test(e.key)){const q=location.hash==="#exam"&&EX&&!EX.done?byId[EX.ids[EX.i]]:p;if(!q||!OBJ(q.k))return;if(q===p&&S.r[p.id]&&!ui.retry[p.id])return;const o=ord(q)[+e.key-1];if(o===undefined)return;if(q===p)ui.sel[p.id]=o;else EX.ans[q.id]=o;keep()}
});

window.claude?.hot?.snapshot?.(()=>({EX,fk:ui.fk,fs:ui.fs,fsrc:ui.fsrc,scope:ui.scope,exN:ui.exN,exT:ui.exT}));
const boot=d=>{if(d&&d.EX)EX=d.EX;if(d&&d.fk){ui.fk=d.fk;ui.fs=d.fs||"all";ui.fsrc=d.fsrc||"all";ui.scope=d.scope||"all";ui.exN=d.exN||10;ui.exT=d.exT||0}go();setSave("기록은 이 브라우저에 저장돼")};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
}
</script>
</body>
</html>
