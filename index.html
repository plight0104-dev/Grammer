로는 수줍고 친근하다는 반대 내용이야.¶반대(대조)를 이을 때는 and가 아니라 but.¶단서: actually(사실은)가 대조를 알려 줘.","h":["패턴: 등위접속사의 의미","대조는 but"],"src":"패턴","pp":"패턴편 II 13쪽","x":"but"},{"id":"P270","c":6,"s":1,"k":"err","lv":0,"t":"등위접속사의 의미","q":"Powdered instant coffee was sold [on] the market in some form [and] [another,] [long] before the Korean War.","a":1,"e":"'이런저런 형태로'는 in some form or another.¶and가 아니라 or가 짝이야.¶같은 표현: one way or another(어떻게든), sooner or later(조만간).","h":["패턴: 등위접속사의 의미","in some form or another"],"src":"패턴","pp":"패턴편 II 13쪽","x":"or"},{"id":"P271","c":6,"s":1,"k":"blank","lv":0,"t":"등위접속사의 의미","q":"There is no railroad system on Cheju Island, nor ________ a subway system.","a":3,"e":"nor(~도 아니다) 뒤에서는 도치가 일어나: nor + 동사 + 주어.¶nor is there a subway system (지하철도 없다).¶there is를 쓰면 도치가 안 된 거라 틀려.","h":["패턴: 등위접속사의 의미","nor + 도치"],"src":"패턴","pp":"패턴편 II 13쪽","o":["there is not","it is","there is","is there"]},{"id":"6-04","c":6,"s":1,"k":"blank","lv":2,"t":"neither + 도치","q":"Tom doesn't smoke, and ___.","o":["neither does he drink","neither he drinks","nor he drinks","so does he drink"],"a":0,"h":["'~도 역시 아니다'는 부정 동의야.","neither/nor 뒤는 조동사 + 주어로 도치돼."],"e":"부정문 뒤 '~도 역시 아니다'는 neither + 조동사 + 주어(도치).¶and neither does he drink (술도 안 마신다).¶긍정 동의는 so does he.","src":"연습"},{"id":"6-05","c":6,"s":2,"k":"err","lv":2,"t":"for는 문두 불가","q":"[For] it was wet, he [took] a taxi [instead of] [walking].","a":0,"x":"Because (또는 He took a taxi, for it was wet.)","h":["for가 '왜냐하면'으로 쓰일 때 위치 제한이 있어.","준등위접속사 for는 앞 절 뒤에만 와."],"e":"이유의 for(왜냐하면)는 앞 절 뒤에 콤마와 함께 와. 문장 맨 앞에는 못 와.¶He took a taxi, for it was wet.¶문장 앞에서 이유를 말하려면 Because it was wet, ~.","src":"연습"},{"id":"6-06","c":6,"s":2,"k":"err","lv":1,"t":"both A and B","q":"She [has] both experience [as well as] [knowledge] [in] this field.","a":1,"h":["both의 짝을 생각해 봐.","both A and B"],"e":"both는 and와 짝이야: both A and B.¶both experience and knowledge (경험과 지식 둘 다).¶as well as와 섞어 쓰면 틀려.","x":"and","src":"연습"},{"id":"6-07","c":6,"s":2,"k":"blank","lv":3,"t":"세미콜론과 콤마","q":"My brother went to Seoul___ he continued to study.","o":["; because",", ","; ",": because"],"a":2,"h":["빈칸 앞뒤가 모두 완전한 절이야.","두 절을 접속사 없이 이으려면 콤마로는 안 돼."],"e":"빈칸 앞뒤가 모두 완전한 절(주어 + 동사)이야.¶두 절은 접속사나 세미콜론(;)으로 이어. 콤마만 쓰면 틀려.¶세미콜론과 because를 같이 쓰는 것도 틀려(이미 하나로 연결했는데 또 잇는 셈).","src":"연습"},{"id":"P272","c":6,"s":3,"k":"err","lv":0,"t":"A·B 의 대등한 형태","q":"[According to] the syllabus, you can [either] write [a paper] or [you can take] an exam.","a":3,"e":"either A or B에서 A와 B는 같은 모양이어야 해.¶you can either write a paper or take an exam. A가 write(원형)라 B도 take.¶you can take처럼 주어부터 다시 쓰면 모양이 어긋나.","h":["패턴: 등위상관접속사의 의미와 기능","either A or B 병치"],"src":"패턴","pp":"패턴편 II 15쪽","x":"take"},{"id":"P273","c":6,"s":3,"k":"err","lv":0,"t":"A·B 의 대등한 형태","q":"[An extended family] [consists] not only of parents and children [but also other] relatives, such as grandparents and [unmarried] aunts and uncles.","a":2,"e":"not only A but also B에서 A가 of parents and children(전치사구)이야.¶B도 전치사구로 맞춰: but also of other relatives.¶consist of의 of를 양쪽에 다 써 주는 모양이야.","h":["패턴: 등위상관접속사의 의미와 기능","not only A but also B 병치"],"src":"패턴","pp":"패턴편 II 15쪽","x":"but also of other"},{"id":"P274","c":6,"s":3,"k":"err","lv":0,"t":"A·B 의 대등한 형태","q":"[Neither] in his campaign [nor] his acceptance speech [did] Mr. Morgan acknowledge [those whose] assistance had won him the nomination.","a":1,"e":"Neither A nor B에서 A가 in his campaign(전치사구)이야.¶B도 맞춰서 nor in his acceptance speech.¶문두 Neither 때문에 did Mr. Morgan으로 도치된 것도 맞아.","h":["패턴: 등위상관접속사의 의미와 기능","neither A nor B 병치"],"src":"패턴","pp":"패턴편 II 15쪽","x":"nor in"},{"id":"P275","c":6,"s":3,"k":"err","lv":0,"t":"수일치","q":"Neither his friend's [betrayal] nor his [parents'] condemnation [have caused] him any [great] distress.","a":2,"e":"neither A nor B는 동사를 B에 맞춰.¶B가 his parents' condemnation(비난, 단수)이라 has caused.¶parents'는 소유격일 뿐 중심 명사는 condemnation이야.","h":["패턴: 등위상관접속사의 의미와 기능","neither A nor B는 B에 일치"],"src":"패턴","pp":"패턴편 II 15쪽","x":"has caused"},{"id":"P276","c":6,"s":3,"k":"err","lv":0,"t":"수일치","q":"Either the professor or the poet can store [their] books [on the bookshelf,] but there is not [room for] [the books of both.]","a":0,"e":"Either A or B는 둘 중 '한 사람'이라 단수야.¶그래서 대명사도 단수 his or her(또는 his). their는 복수라 안 맞아.¶뒤에 the books of both(둘 다의 책)를 둘 공간이 없다는 말과 대조돼.","h":["패턴: 등위상관접속사의 의미와 기능","either A or B는 단수"],"src":"패턴","pp":"패턴편 II 15쪽","x":"his or her"},{"id":"P277","c":6,"s":3,"k":"err","lv":0,"t":"상관여부","q":"Active participation [in] sports [produces] both release from stress [as well as] [physical ]fitness.","a":2,"e":"both는 and와 짝이야: both release from stress and physical fitness.¶as well as와 섞어 쓰면 틀려.¶both A and B / not only A but also B / either A or B를 짝으로 외워.","h":["패턴: 등위상관접속사의 의미와 기능","both A and B"],"src":"패턴","pp":"패턴편 II 15쪽","x":"and"},{"id":"P278","c":6,"s":3,"k":"err","lv":0,"t":"상관여부","q":"[Model airplanes] can [be guided] [both] by [control wires] or by radio transmitters.","a":2,"e":"뒤에 or by radio transmitters가 있어. or의 짝은 either.¶either by control wires or by radio transmitters.¶both는 and와 짝이라 or와 못 써.","h":["패턴: 등위상관접속사의 의미와 기능","either A or B"],"src":"패턴","pp":"패턴편 II 15쪽","x":"either"},{"id":"P279","c":6,"s":3,"k":"err","lv":0,"t":"상관여부","q":"Mrs. Roosevelt was [not] [only] an elegant first lady [and] [also] an able ambassador of good will of the U.","a":2,"e":"not only의 짝은 but also야.¶not only an elegant first lady but also an able ambassador.¶and also는 짝이 아니야.","h":["패턴: 등위상관접속사의 의미와 기능","not only A but also B"],"src":"패턴","pp":"패턴편 II 16쪽","x":"but"},{"id":"P280","c":6,"s":3,"k":"err","lv":0,"t":"상관여부","q":"When he [graduates from college] he [will have to] decide whether [to continue] his studies [and] seek employment.","a":3,"e":"whether는 or와 짝이야: whether to continue his studies or seek employment (학업을 계속할지 취업할지).¶and를 쓰면 '둘 중 하나'라는 뜻이 사라져.","h":["패턴: 등위상관접속사의 의미와 기능","whether A or B"],"src":"패턴","pp":"패턴편 II 16쪽","x":"or"},{"id":"P281","c":6,"s":3,"k":"err","lv":0,"t":"상관여부","q":"[Although] many places [have become] more flexible, in the nineties women still must [choose] between having a serious career [or] having a family.","a":3,"e":"between은 and와 짝이야: between A and B.¶between having a career and having a family (직업과 가정 사이에서).¶or를 쓰면 틀려.","h":["패턴: 등위상관접속사의 의미와 기능","between A and B"],"src":"패턴","pp":"패턴편 II 16쪽","x":"and"},{"id":"P282","c":6,"s":3,"k":"blank","lv":0,"t":"'not only ~ but also' 도치","q":"Not only _______ atoms with their microscopes, but they now can also “feel” them with the aid of a versatile sensing device called the “magic wrist.”","a":1,"e":"Not only가 문장 맨 앞에 오면 그 절이 도치돼: be동사 + 주어.¶Not only are today's scientists able to see atoms ~.¶평서문이면 Today's scientists are not only able to see ~.","h":["패턴: 등위상관접속사의 의미와 기능","Not only 문두 도치"],"src":"패턴","pp":"패턴편 II 16쪽","o":["today’s scientists are able to see","are today’s scientists able to see","being able to see today’s scientists","are able to see today’s scientists"]},{"id":"P283","c":6,"s":3,"k":"blank","lv":0,"t":"'not only ~ but also' 도치","q":"_______ the surface of metal, but also weakens it.","a":3,"e":"빈칸 뒤 but also weakens it에 주어가 없어. 그래서 빈칸에 주어 Rust가 들어가야 해.¶Rust not only corrodes ~ but also weakens ~ (녹은 부식시킬 뿐 아니라 약하게도 한다).¶Not only가 문두가 아니라 동사 앞에 있으면 도치하지 않아.","h":["패턴: 등위상관접속사의 의미와 기능","not only가 문두가 아닐 때"],"src":"패턴","pp":"패턴편 II 16쪽","o":["Not only does rust corrode","Not only rust corrodes","Rust, which not only corrodes","Rust not only corrodes"]},{"id":"P284","c":6,"s":3,"k":"blank","lv":0,"t":"기타","q":"Despite claims that filters and low-tar tobacco make smoking somewhat safer, in fact they only marginally reduce, _______ eliminate the hazards.","a":1,"e":"'겨우 줄일 뿐, 없애지는 못한다'는 뜻이야.¶동사 앞에서 부정하는 말은 not: reduce, not eliminate.¶no, none은 명사 앞이나 대명사 자리에 쓰고, nor는 앞에 부정이 있어야 해.","h":["패턴: 등위상관접속사의 의미와 기능","A, not B"],"src":"패턴","pp":"패턴편 II 16쪽","o":["no","not","nor","none"]},{"id":"P285","c":6,"s":3,"k":"blank","lv":0,"t":"접속부사의 기능","q":"The Smithsonian institution preserves more than sixty-five million items of scientific, historical, or artistic interest, _______ winning the popular title, \"attic of the nation\".","a":1,"e":"빈칸 뒤가 winning(분사)이야. and는 뒤에 동사가 와야 해서 안 맞아.¶thus + 분사구문 = 그래서 ~하게 되다: thus winning the title.¶however, moreover는 부사라 분사구문과 어울리지 않아.","h":["패턴: 접속부사","접속부사 + 분사구문"],"src":"패턴","pp":"패턴편 II 19쪽","o":["and","thus","however","moreover"]},{"id":"P286","c":6,"s":3,"k":"err","lv":0,"t":"접속부사의 기능","q":"Thoughts and dreams [are impossible to touch] or see, [accordingly] they are [very difficult to study] by the scientific methods [taken by doctors of that time.]","a":1,"e":"accordingly(그에 따라)는 부사라 두 절을 이어 주지 못해.¶콤마 대신 세미콜론을 써야 해: ~ touch or see; accordingly, they are ~.¶같은 부류: however, therefore, moreover도 절을 직접 잇지 못해.","h":["패턴: 접속부사","접속부사는 절을 못 잇는다"],"src":"패턴","pp":"패턴편 II 19쪽","x":"; accordingly,"},{"id":"P287","c":6,"s":3,"k":"blank","lv":0,"t":"접속부사의 의미","q":"English is spoken in cultures that have relatively little use of rigid hierarchical expressions. _______, it has limited honorific categories. Germans emphasize these conventions more than English speakers do. German employs the use of forms of \"you\", the informal du and the formal Sie.","a":2,"e":"앞: 영어 문화는 위계적 표현을 잘 안 쓴다. 뒤: 존칭 범주가 제한적이다.¶앞이 원인, 뒤가 결과라 Thus(그래서).¶Moreover는 추가, Nonetheless는 반대라 안 맞아.","h":["패턴: 접속부사","결과의 Thus"],"src":"패턴","pp":"패턴편 II 19쪽","o":["Likewise","Moreover","Thus","Nonetheless","Instead"]},{"id":"P288","c":6,"s":3,"k":"blank","lv":0,"t":"접속부사의 의미","q":"다음 빈칸에 들어갈 수 없는 것을 고르시오. Absolute secrecy is essential. ________, the fewer who are aware of the plan, the better.","a":1,"e":"비밀이 중요하다 → 그러니까 아는 사람이 적을수록 좋다. 원인과 결과야.¶So, Therefore, Consequently는 모두 결과라 들어갈 수 있어.¶However(그러나)만 대조라 들어갈 수 없어.","h":["패턴: 접속부사","However는 대조"],"src":"패턴","pp":"패턴편 II 19쪽","o":["So","However","Therefore","Consequently"]},{"id":"6-08","c":6,"s":3,"k":"blank","lv":2,"t":"Not only 도치","q":"Not only ___ she help him cook, but she also did  that"]},{"id":"P300","c":7,"s":1,"k":"err","lv":0,"t":"완전성·불완전성을 구분하는 경우","q":"[What] air travel [would become] an inexpensive and efficient way of travel was [probably not] envisioned by the [earliest] aviators.","a":0,"e":"What과 That 구별은 뒤 문장이 완전한지 보면 돼.¶air travel would become an inexpensive way of travel은 주어·동사·보어가 다 있는 완전한 문장이야.¶완전한 문장을 명사절로 만드는 건 That. What은 뒤에 빠진 게 있을 때.","h":["패턴: that (확실성,'~라는 사실‘)","완전한 절은 that"],"src":"패턴","pp":"패턴편 II 27쪽","x":"That"},{"id":"P301","c":7,"s":1,"k":"err","lv":0,"t":"완전성·불완전성을 구분하는 경우","q":"The National Assembly is [ready] for its first public hearing next week [to confirm] Kim Hwang-sik [as] the next prime minister in [that looks like] an open and shut case.","a":3,"e":"전치사 in 뒤에 명사절이 와야 해.¶___ looks like an open and shut case에서 looks의 주어가 비어 있어. 빠진 게 있으니 what.¶in what looks like ~ (뻔한 사건처럼 보이는 일에서).","h":["패턴: that (확실성,'~라는 사실‘)","불완전한 절은 what"],"src":"패턴","pp":"패턴편 II 27쪽","x":"what looks like"},{"id":"P302","c":7,"s":1,"k":"err","lv":0,"t":"완전성·불완전성을 구분하는 경우","q":"[Before] I travelled in East Asia, I [had no] notion [which] Japanese, Chinese, and Korean arts [were] so beautiful.","a":2,"e":"notion(생각) 뒤에 '~라는' 내용을 설명하는 동격절이야.¶Japanese, Chinese, and Korean arts were so beautiful은 완전한 문장이라 동격 that.¶which는 관계대명사라 뒤가 불완전해야 해.","h":["패턴: that (확실성,'~라는 사실‘)","동격 that"],"src":"패턴","pp":"패턴편 II 27쪽","x":"that"},{"id":"P303","c":7,"s":1,"k":"err","lv":0,"t":"의미 관계를 ‘if'와 구분하는 경우","q":"I know one woman [on maternity leave] [who] [phones me up] every week and [tells me if] she wants her job back.","a":3,"e":"매주 전화해서 '복귀하고 싶다고' 말하는 거야. 사실을 전하니 that.¶if는 '~인지 아닌지'라서 본인이 원하는지를 모르는 것처럼 돼.¶tells me that she wants her job back.","h":["패턴: that (확실성,'~라는 사실‘)","if와 that의 의미"],"src":"패턴","pp":"패턴편 II 27쪽","x":"tells me that"},{"id":"P304","c":7,"s":1,"k":"blank","lv":0,"t":"의미 관계를 ‘which, what', '관계대명사 that'과 구분하는 경우","q":"__________ inhabitants have been in the Americas for at least 15,000 thousand years.","a":1,"e":"'~라는 증거가 있다'는 존재를 말하니 There is ~ proof.¶proof의 내용을 설명하는 동격절이고 뒤가 완전한 문장(inhabitants have been ~)이라 that.¶which는 관계대명사라 완전한 문장 앞에 못 와.","h":["패턴: that (확실성,'~라는 사실‘)","There is proof that + 완전한 절"],"src":"패턴","pp":"패턴편 II 27쪽","o":["It is a considerable amount of proof which","There is a considerable amount of proof that","It is a considerable amount of proof for","There is a considerable amount of proof which"]},{"id":"P305","c":7,"s":1,"k":"blank","lv":0,"t":"의미 관계를 ‘which, what', '관계대명사 that'과 구분하는 경우","q":"A: “When did the first dining train run in the U.S.?” B: “In 1868. George Pullman introduced a dining car __________ its own kitchen in 1868.”","a":1,"e":"a dining car를 꾸미는 관계절이야. had의 주어가 비어 있어.¶주격 관계대명사 that: a dining car that had its own kitchen (자체 주방이 있는 식당차).¶that it had는 주어가 두 번 들어간 꼴이라 틀려.","h":["패턴: that (확실성,'~라는 사실‘)","that had + 목적어"],"src":"패턴","pp":"패턴편 II 27쪽","o":["it had","that had","that it had","which having","with which"]},{"id":"P306","c":7,"s":1,"k":"err","lv":0,"t":"의미 관계를 ‘which, what', '관계대명사 that'과 구분하는 경우","q":"[That] people consider [a luxury] at one time [frequently] becomes a necessity; many families find [that ownership] of two cars is indispensable.","a":0,"e":"people consider ___ a luxury에서 consider의 목적어가 비어 있어.¶선행사 없이 '~하는 것'이면서 뒤가 불완전하니 What.¶What people consider a luxury (사람들이 사치품으로 여기는 것)가 주어야.","h":["패턴: that (확실성,'~라는 사실‘)","불완전한 절은 what"],"src":"패턴","pp":"패턴편 II 27쪽","x":"What"},{"id":"P307","c":7,"s":1,"k":"blank","lv":0,"t":"전치사의 목적어","q":"My grandmother was a decent person except ______ she was rather lacking in confidence.","a":3,"e":"except that + 완전한 문장 = ~라는 것을 제외하면.¶she was rather lacking in confidence는 완전한 문장이라 that.¶전치사 뒤에 that절이 오는 건 except that, in that 두 개뿐이야.","h":["패턴: that (확실성,'~라는 사실‘)","except that"],"src":"패턴","pp":"패턴편 II 28쪽","o":["what","how","which","that","whatever"]},{"id":"P308","c":7,"s":1,"k":"blank","lv":0,"t":"전치사의 목적어","q":"Lemons differ from all other fruits ________ more edible after they are picked.","a":3,"e":"in that + 완전한 문장 = ~라는 점에서.¶레몬은 딴 뒤에 더 먹기 좋아진다는 점에서 다른 과일과 다르다.¶except that과 함께 전치사 뒤 that절이 허용되는 예외야.","h":["패턴: that (확실성,'~라는 사실‘)","in that"],"src":"패턴","pp":"패턴편 II 28쪽","o":["become","they become","that they become","in that they become"]},{"id":"P309","c":7,"s":1,"k":"err","lv":0,"t":"전치사의 목적어","q":"[Most of us] would maintain that physical attractiveness does not [play a major part] in [that] we react to the people [we meet.]","a":2,"e":"전치사 in 뒤에는 that절이 못 와(in that 제외).¶뜻이 '우리가 사람들에게 어떻게 반응하는지'라 how: in how we react to ~.¶in that을 쓰면 '~라는 점에서'가 돼서 뜻이 안 맞아.","h":["패턴: that (확실성,'~라는 사실‘)","전치사 뒤 that 불가"],"src":"패턴","pp":"패턴편 II 28쪽","x":"how"},{"id":"7-01","c":7,"s":1,"k":"err","lv":2,"t":"see to it that","q":"Please [see] [to that] the door [is] [locked].","a":1,"h":["전치사 to 바로 뒤에 that절이 올 수 있는지 생각해 봐.","전치사 뒤 that절은 안 되니까 가목적어를 둬."],"e":"전치사(to) 바로 뒤에는 that절이 못 와.¶그래서 가목적어 it을 넣어: see to it that the door is locked (문이 잠기도록 신경 쓰다).¶같은 원리: take it for granted that ~.","x":"to it that","src":"연습"},{"id":"P310","c":7,"s":2,"k":"blank","lv":0,"t":"완전성·불완전성을 구분하는 경우","q":"_______ the nuclear energy is used well or ill depends on the morality of the world.","a":2,"e":"주어 자리에서 '~인지 아닌지'를 말할 때는 Whether.¶Whether nuclear energy is used well or ill depends on ~ (잘 쓰이느냐 못 쓰이느냐는 ~에 달려 있다).¶뒤의 or ill이 whether와 짝이야.","h":["패턴: if/ whether (불확실성)","Whether ~ or"],"src":"패턴","pp":"패턴편 II 31쪽","o":["What","That","Whether","Which"]},{"id":"P311","c":7,"s":2,"k":"blank","lv":0,"t":"의미관계를 ‘that'과 구분하는 경우","q":"The early years of the United States government were characterized by a debate concerning ________ or individual states should have more power.","a":0,"e":"전치사 concerning 뒤에서 '연방정부냐 주정부냐'를 고르는 거야.¶whether A or B = A인지 B인지: whether the federal government or individual states.¶전치사 뒤에는 if를 못 쓰니 whether.","h":["패턴: if/ whether (불확실성)","whether A or B"],"src":"패턴","pp":"패턴편 II 31쪽","o":["whether the federal government","either the federal government","that the federal government","the federal government"]},{"id":"P312","c":7,"s":2,"k":"blank","lv":0,"t":"의미관계를 ‘if'와 구분하는 경우","q":"I don't care ____________.","a":2,"e":"'비가 안 와도 상관없다'는 I don't care if it doesn't rain.¶whether ~ or not은 자체에 '아닌지'가 들어 있어서 안에 부정어를 또 쓰지 않아.¶whether it doesn't rain만 쓰는 것도 어색해.","h":["패턴: if/ whether (불확실성)","don't care if"],"src":"패턴","pp":"패턴편 II 31쪽","o":["whether it doesn't rain or not","whether it doesn't rain","if it doesn't rain"]},{"id":"7-02","c":7,"s":2,"k":"err","lv":2,"t":"whether ~ or not","q":"I [don't care] [whether] it [doesn't rain] [or not].","a":2,"h":["whether ~ or not 안에 부정어가 또 들어갔어.","or not이 이미 부정을 담고 있어."],"e":"whether ~ or not = ~인지 아닌지. or not이 이미 부정을 담고 있어.¶그래서 안의 동사는 긍정: whether it rains or not.¶doesn't를 넣으면 부정이 겹쳐.","x":"rains","src":"연습"},{"id":"7-03","c":7,"s":2,"k":"err","lv":2,"t":"if 명사절은 주어 자리 불가","q":"[If] the talks will help the peace of the region [is] still [uncertain] [to] many experts.","a":0,"x":"Whether","h":["이 if절은 문장에서 무슨 역할을 해?","주어 자리에 오는 '~인지'는 whether만 가능해."],"e":"'~인지'라는 if 명사절은 목적어 자리에서만 써.¶여기는 주어 자리(___ is uncertain)라 Whether: Whether the talks will help ~ is uncertain.¶주어, 보어, 전치사 뒤, to부정사 앞에서는 whether.","src":"연습"},{"id":"7-04","c":7,"s":2,"k":"blank","lv":2,"t":"whether + to부정사","q":"She wondered ___ to accept the offer or not.","o":["if","whether","that","what"],"a":1,"h":["빈칸 뒤에 to부정사가 바로 와.","if는 to부정사와 함께 못 써."],"e":"빈칸 뒤에 to부정사(to accept)가 바로 와.¶whether to R(~할지 말지)은 되지만 if to R은 안 돼.¶what은 to accept 뒤에 목적어가 비어 있어야 하는데 the offer가 있어.","src":"연습"},{"id":"7-05","c":7,"s":2,"k":"blank","lv":1,"t":"전치사 뒤 whether","q":"It depends on ___ he will support us.","o":["if","whether","that","what"],"a":1,"h":["빈칸이 전치사 on의 목적어 자리야.","전치사 뒤에는 if도 that도 못 와."],"e":"빈칸이 전치사 on의 목적어 자리야.¶전치사 뒤 '~인지'는 whether만 가능: It depends on whether he will support us.¶if와 that은 전치사 뒤에 못 와.","src":"연습"},{"id":"P313","c":7,"s":3,"k":"blank","lv":0,"t":"'격‘을 구분해야 하는 경우","q":"It was not clear _________ responsibility it was.","a":1,"e":"'그게 누구의 책임인지'라 소유를 묻는 whose.¶whose responsibility it was (그게 누구 책임이었는지).¶who's는 who is의 줄임말이라 안 맞아.","h":["패턴: who/ whom/ whose","whose + 명사"],"src":"패턴","pp":"패턴편 II 33쪽","o":["which","whose","who's","one's"]},{"id":"P314","c":7,"s":3,"k":"blank","lv":0,"t":"'격‘과 ’의미‘를 구분해야 하는 경우","q":"There is no question as to _________ deserves the prize.","a":0,"e":"as to(~에 관해) 뒤 의문사절에서 deserves의 주어가 비어 있어.¶주어 자리니까 주격 who: who deserves the prize.¶전치사 뒤라고 whom을 고르면 함정이야. 격은 절 안 역할로 정해.","h":["패턴: who/ whom/ whose","주격 who"],"src":"패턴","pp":"패턴편 II 33쪽","o":["who","whom","what","which"]},{"id":"P315","c":7,"s":3,"k":"blank","lv":0,"t":"'격‘과 ’의미‘를 구분해야 하는 경우","q":"If there is a more nearly perfect exemplar of cultural education gained in the fifties than Sam Shepard, I cannot imagine _________ it might be.","a":0,"e":"it might be ___ 에서 be동사의 보어 자리야. 사람을 묻고 있어.¶be동사 뒤 보어 자리는 주격 who: who it might be (그게 누구일지).¶목적격 whom은 쓰지 않아.","h":["패턴: who/ whom/ whose","보어 자리 who"],"src":"패턴","pp":"패턴편 II 33쪽","o":["who","whom","what","which"]},{"id":"P316","c":7,"s":3,"k":"blank","lv":0,"t":"what(막연한 선택)/ which(제한된 선택)","q":"A: “What do we do in a Rorschach test?” B: “In a Rorschach test, the subject describes ________ sees in a series of inkblots.”","a":2,"e":"describes의 목적어이면서, sees의 목적어도 비어 있어.¶'~하는 것'이면서 뒤가 불완전하니 what: describes what he or she sees.¶that은 선행사가 없으면 목적어절에서 이렇게 못 써.","h":["패턴: what(막연한 선택)/ which(제한된 선택)","describes what"],"src":"패턴","pp":"패턴편 II 35쪽","o":["that he or she","whether he or she","what he or she","with what he or she"]},{"id":"P317","c":7,"s":3,"k":"err","lv":0,"t":"what(막연한 선택)/ which(제한된 선택)","q":"In fact, the [right to bear] arms is even [guaranteed in] the American Constitution, [although there] is debate [about why] the founding fathers meant by it.","a":3,"e":"the founding fathers meant ___ by it에서 meant의 목적어가 비어 있어.¶빠진 게 있으니 why가 아니라 what: debate about what they meant by it.¶why는 뒤가 완전한 문장일 때 써.","h":["패턴: what(막연한 선택)/ which(제한된 선택)","meant의 목적어"],"src":"패턴","pp":"패턴편 II 35쪽","x":"about what"},{"id":"P318","c":7,"s":3,"k":"err","lv":0,"t":"what(막연한 선택)/ which(제한된 선택)","q":"[Most] people know [that] it is like [to have] their blood pressure taken, but few understand the meaning of [the numbers] used to record blood pressure.","a":1,"e":"it is like ___ 에서 like(~ 같은)의 목적어가 비어 있어.¶'그게 어떤지'는 what it is like: know what it is like to have ~.¶that을 쓰면 like 뒤가 비어서 틀려.","h":["패턴: what(막연한 선택)/ which(제한된 선택)","know what it is like"],"src":"패턴","pp":"패턴편 II 35쪽","x":"what"},{"id":"P319","c":7,"s":3,"k":"blank","lv":0,"t":"what(막연한 선택)/ which(제한된 선택)","q":"This information will help you understand ________ changes they are going through and how you can smooth the way.","a":2,"e":"'어떤 변화를 겪고 있는지'라 what + 명사(의문형용사).¶what changes they are going through.¶how, when은 뒤에 명사를 바로 붙일 수 없어.","h":["패턴: what(막연한 선택)/ which(제한된 선택)","what + 명사"],"src":"패턴","pp":"패턴편 II 35쪽","o":["when","how","what","that"]},{"id":"P320","c":7,"s":3,"k":"blank","lv":0,"t":"what(막연한 선택)/ which(제한된 선택)","q":"The CEO has not decided ________ of the two strategies he should adopt.","a":1,"e":"of the two strategies(두 전략 중)처럼 정해진 범위 안에서 고르는 거야.¶정해진 것 중 고를 때는 which, 막연하게 '무엇'은 what.¶which of the two strategies he should adopt.","h":["패턴: what(막연한 선택)/ which(제한된 선택)","정해진 범위면 which"],"src":"패턴","pp":"패턴편 II 35쪽","o":["what","which","that","who"]},{"id":"P321","c":7,"s":3,"k":"blank","lv":0,"t":"‘wh-'와 다른 접속사의 구별","q":"Nancy _________ she could improve her writing ability, but she had little time to concentrate.","a":0,"e":"she could improve her writing ability는 완전한 문장이야.¶완전한 문장 앞에서 '어떻게'를 말하는 how: knew how she could improve ~.¶what은 뒤에 빠진 게 있어야 해.","h":["패턴: when/ where/ why/ how","know how + 절"],"src":"패턴","pp":"패턴편 II 37쪽","o":["knew how","knew what","knew how that","knew about"]},{"id":"P322","c":7,"s":3,"k":"err","lv":0,"t":"'how'의 ‘형용사·부사’의 구별","q":"The student was [noticeably] [upset by] [how indignant] her professor [responded to] her question.","a":2,"e":"how 뒤 말이 무엇을 꾸미는지 봐: her professor responded(대답했다)를 꾸며.¶동사를 꾸미니까 부사 how indignantly (얼마나 분개해서 대답했는지).¶how + 형용사/부사는 뒤 문장에서 그 말이 하는 역할로 정해.","h":["패턴: when/ where/ why/ how","how + 부사"],"src":"패턴","pp":"패턴편 II 37쪽","x":"how indignantly"},{"id":"P323","c":7,"s":3,"k":"err","lv":0,"t":"'how'의 ‘형용사·부사’의 구별","q":"When I consider how [talentedly] he is [as] a comedian, I cannot help [believing] that the public will appreciate [his] gift.","a":0,"e":"he is ___ as a comedian에서 be동사의 보어 자리야.¶보어는 형용사라 how talented he is (그가 얼마나 재능 있는지).¶부사 talentedly는 be동사 뒤에 못 와.","h":["패턴: when/ where/ why/ how","how + 형용사"],"src":"패턴","pp":"패턴편 II 37쪽","x":"talented"},{"id":"7-06","c":7,"s":3,"k":"err","lv":1,"t":"간접의문문 어순","q":"I [have never asked] him, so I [don't know] [where] [is he] from.","a":3,"x":"he is","h":["의문사절이 know의 목적어로 들어갔어.","간접의문문은 의문사 + 주어 + 동사."],"e":"know의 목적어 간접의문문은 '의문사 + 주어 + 동사' 순서.¶I don't know where he is from.¶where is he는 직접의문문(Where is he from?) 어순이라 문장 안에서는 틀려.","src":"연습"},{"id":"7-07","c":7,"s":3,"k":"blank","lv":3,"t":"think + 의문사절","q":"___ he spent his holidays?","o":["Do you think where","Where do you think","Do you know where did","Where do you know"],"a":1,"h":["yes/no로 답하는 질문이 아니야.","think, believe, guess, suppose, imagine이면 의문사가 문두로 나가."],"e":"think, believe, guess, suppose, imagine으로 묻는 질문은 yes/no로 답할 수 없어.¶그래서 의문사가 맨 앞으로 나가: Where do you think he spent his holidays?¶know는 yes/no로 답할 수 있어서 Do you know where he spent ~?","src":"연습"},{"id":"7-08","c":7,"s":3,"k":"err","lv":2,"t":"how long + 어순","q":"No one [knows] how long [will they stay] healthy, [but] the results [are] encouraging.","a":1,"h":["how long 이하는 knows의 목적어야.","간접의문문은 주어 + 동사 순서."],"e":"knows의 목적어 간접의문문이라 '의문사 + 주어 + 동사' 순서.¶how long they will stay healthy (그들이 얼마나 오래 건강할지).¶명사절이라 will도 그대로 써.","x":"they will stay","src":"연습"},{"id":"7-09","c":7,"s":4,"k":"blank","lv":2,"t":"복합관계대명사 whoever","q":"I'll give the ticket to ___ wants it.","a":0,"h":["빈칸 뒤 wants의 주어가 없어.","to의 목적어지만 절 안에서의 역할로 격을 정해."],"e":"빈칸 뒤 wants의 주어가 비어 있어.¶주격 복합관계대명사 whoever: give the ticket to whoever wants it (원하는 사람 누구에게든).¶to 뒤라고 whomever를 고르면 함정. 격은 절 안 역할로 정해.","o":["whoever","whomever","who","whom"],"src":"연습"},{"id":"7-10","c":7,"s":4,"k":"blank","lv":3,"t":"whomever","q":"I'll give the ticket to ___ you recommend.","o":["whoever","whomever","who","whom"],"a":1,"h":["빈칸 뒤 절에서 빠진 성분이 뭐야?","recommend의 목적어가 없어."],"e":"빈칸 뒤 you recommend에서 recommend의 목적어가 비어 있어.¶목적격 whomever: to whomever you recommend (네가 추천하는 사람 누구에게든).¶7-09와 비교: 주어가 비면 whoever, 목적어가 비면 whomever.","src":"연습"},{"id":"7-11","c":7,"s":5,"k":"blank","lv":2,"t":"화법 전환의 시제","q":"He said to me, “I am busy.” → He told me that he ___ busy.","a":0,"h":["전달동사가 과거(told)야.","직접화법의 현재는 간접화법에서 과거로 바뀌어."],"e":"전달동사가 과거(told)면 따옴표 안의 시제를 한 단계 앞당겨.¶I am busy → he was busy.¶인칭도 바꿔: I → he.","o":["was","is","has been","will be"],"src":"연습"},{"id":"P324","c":8,"s":0,"k":"blank","lv":0,"t":"대명사와 관계대명사의 구별","q":"There were two large offices on this floor, _______ served as a conference room.","a":0,"e":"콤마 뒤에 접속사 없이 또 다른 문장이 이어지려면 접속사 역할을 하는 관계대명사가 필요해.¶두 사무실 중 '더 큰 것'이라 the larger(둘이면 비교급), 그걸 관계대명사로 받아 the larger of which.¶the larger of them은 접속사가 없어서 두 문장이 그냥 붙어 버려.","h":["패턴: 등위접속사, 관계사, 분사와의 관계","the larger of which"],"src":"패턴","pp":"패턴편 II 41쪽","o":["the larger of which","the larger of them","the largest of which","largest of that"]},{"id":"P325","c":8,"s":0,"k":"blank","lv":0,"t":"관계대명사와 분사와의 관계","q":"The chinese constructed the Great Wall ________ a marvel even today.","a":1,"e":"the Great Wall을 꾸미는 관계절이 필요해. 만리장성은 경이로 '여겨지는' 대상이야.¶which is considered a marvel (경이로 여겨지는).¶it is considered는 접속사가 없어서 문장이 두 개가 돼.","h":["패턴: 등위접속사, 관계사, 분사와의 관계","which is considered"],"src":"패턴","pp":"패턴편 II 41쪽","o":["it is considered","which is considered","considering","which considered"]},{"id":"8-01","c":8,"s":0,"k":"err","lv":2,"t":"계속적 용법과 that","q":"[Last night], fire [destroyed] the old house, [that] [had been abandoned] long ago.","a":2,"x":"which","h":["관계사 앞에 콤마가 있어.","계속적 용법에 쓸 수 없는 관계대명사가 있어."],"e":"관계대명사 앞에 콤마가 있으면 계속적 용법이야.¶계속적 용법에는 that을 쓸 수 없어. 선행사가 사물(house)이라 which.¶the old house, which had been abandoned long ago.","src":"연습"},{"id":"P326","c":8,"s":1,"k":"err","lv":0,"t":"선행사 명사 1개인 경우","q":"[In the early 20th century,] [any] woman [which] had a college education was automatically regarded [as intelligent.]","a":2,"e":"선행사가 woman(사람)이야.¶사람을 받는 주격 관계대명사는 who: any woman who had a college education.¶which는 사물·동물에 써.","h":["패턴: 선행사와 관계대명사의 의미관계","사람 선행사"],"src":"패턴","pp":"패턴편 II 43쪽","x":"who"},{"id":"P327","c":8,"s":1,"k":"err","lv":0,"t":"선행사 명사 1개인 경우","q":"Bangkok, Thailand, [who] is [nicknamed] the \"Venice of Asia,\" [has] [many] canals.","a":0,"e":"선행사가 Bangkok(도시)이라 사물이야.¶사물을 받는 계속적 용법은 which: Bangkok, which is nicknamed ~.¶who는 사람에만 써.","h":["패턴: 선행사와 관계대명사의 의미관계","사물 선행사"],"src":"패턴","pp":"패턴편 II 43쪽","x":"which"},{"id":"P328","c":8,"s":1,"k":"blank","lv":0,"t":"부정대명사인 경우","q":"He gave several reasons, only a few ______ were valid.","a":0,"e":"콤마 뒤 두 번째 문장을 이어 주는 관계대명사가 필요해.¶reasons(사물) 중 몇 개라 a few of which.¶of that은 안 되고(that은 전치사 뒤 X), of whom은 사람에 써.","h":["패턴: 선행사와 관계대명사의 의미관계","a few of which"],"src":"패턴","pp":"패턴편 II 43쪽","o":["of which","of that","of whom","for that"]},{"id":"P329","c":8,"s":1,"k":"err","lv":0,"t":"선행사 명사 2개인 경우","q":"The term bilingual education [refers to] programs [designed] to instruct nonnative speakers of English [which] [have] not yet mastered English as their second language.","a":2,"e":"have not yet mastered English의 주어가 누구인지 봐: 영어를 아직 못 익힌 건 nonnative speakers(사람)야.¶사람을 받는 주격 관계대명사 who.¶선행사가 바로 앞 English가 아니라 speakers라는 게 함정이야.","h":["패턴: 선행사와 관계대명사의 의미관계","선행사는 speakers"],"src":"패턴","pp":"패턴편 II 43쪽","x":"who"},{"id":"P330","c":8,"s":1,"k":"err","lv":0,"t":"선행사 명사 2개인 경우","q":"His grandfather was one of the millions of immigrants [fleeing] eastern Europe [which] [landed] at Ellis Island during the early years of [this] country.","a":1,"e":"landed at Ellis Island(엘리스섬에 도착한) 주체는 immigrants(이민자, 사람)야.¶그래서 which가 아니라 who.¶바로 앞 eastern Europe이 선행사가 아니야. 의미로 선행사를 찾아.","h":["패턴: 선행사와 관계대명사의 의미관계","선행사는 immigrants"],"src":"패턴","pp":"패턴편 II 43쪽","x":"who"},{"id":"P331","c":8,"s":1,"k":"err","lv":0,"t":"단순한 문제","q":"Fear of height [cannot be] a [paralyzing] phobia to those [whom] enjoy bungee [jumping.]","a":2,"e":"enjoy bungee jumping의 주어가 비어 있어.¶주어 자리는 주격 who: those who enjoy ~ (번지점프를 즐기는 사람들).¶whom은 목적어 자리에 써.","h":["패턴: 관계대명사의 격과 선행사와의 의미관계","주격 자리"],"src":"패턴","pp":"패턴편 II 45쪽","x":"who"},{"id":"P332","c":8,"s":1,"k":"blank","lv":0,"t":"‘S + V + V ~'","q":"I will employ the woman __________ they say speaks English fluently.","a":1,"e":"they say는 끼어든 말(삽입절)이야. 빼고 보면 the woman ___ speaks English fluently.¶speaks의 주어가 비어 있으니 주격 who.¶삽입절 뒤라고 whom을 고르는 게 대표 함정이야.","h":["패턴: 관계대명사의 격과 선행사와의 의미관계","삽입절 뒤 주격"],"src":"패턴","pp":"패턴편 II 45쪽","o":["whom","who","what","whatever"]},{"id":"P333","c":8,"s":1,"k":"blank","lv":0,"t":"‘S + V + V ~'","q":"In the rain I met a gentleman _________ I believed to be a professor.","a":1,"e":"I believed ___ to be a professor 구조야. believe + 목적어 + to be(~를 ~라고 믿다).¶빈칸이 believed의 목적어라 목적격 whom.¶P332와 비교: 삽입절(they say)과 달리 여기는 believed가 목적어를 직접 받아.","h":["패턴: 관계대명사의 격과 선행사와의 의미관계","I believed + 목적어"],"src":"패턴","pp":"패턴편 II 45쪽","o":["who","whom","of whom","whose"]},{"id":"P334","c":8,"s":1,"k":"err","lv":0,"t":"‘S + V + V ~'","q":"Jane is [the only one] of the girls [whom] as you know [is] not desirable [for the group.]","a":1,"e":"as you know는 삽입절이야. 빼고 보면 the only one ___ is not desirable.¶is의 주어가 비어 있으니 주격 who.¶삽입절 뒤라고 whom을 쓰면 틀려.","h":["패턴: 관계대명사의 격과 선행사와의 의미관계","삽입절 뒤 주격"],"src":"패턴","pp":"패턴편 II 45쪽","x":"who"},{"id":"P335","c":8,"s":1,"k":"err","lv":0,"t":"의미관계를 구분해야하는 경우","q":"His desire [to make amends] [to] the people [who] had wronged indicated that he was truly penitent, [so] the parole board let him out of the penitentiary.","a":2,"e":"wrong이 동사로 '~에게 잘못하다(해를 끼치다)'라는 뜻이면 잘못한 대상(목적어)이 있어야 해.¶누가 누구에게 잘못했는지 봐: 그(he)가 그 사람들에게 잘못한 거야. 그래서 the people whom he had wronged.¶who had wronged면 그 사람들이 누군가에게 잘못한 게 되는데, 목적어도 빠져 있어.","h":["패턴: 관계대명사의 격과 선행사와의 의미관계","wronged의 목적어"],"src":"패턴","pp":"패턴편 II 45쪽","x":"whom he"},{"id":"P336","c":8,"s":1,"k":"err","lv":0,"t":"관계대명사와 대명사가 같이 있는 경우","q":"[Because] microbes are invisible, their existence was not confirmed [until] the invention of microscopes, which [it] could magnify them [considerably.]","a":2,"e":"which가 이미 could magnify의 주어야(현미경이 확대할 수 있었다).¶그런데 it을 또 쓰면 주어가 두 개가 돼.¶microscopes, which could magnify them considerably.","h":["패턴: 관계대명사의 불완전성과 선행사와의 의미관계","관계대명사 뒤 주어 중복"],"src":"패턴","pp":"패턴편 II 47쪽","x":"(it 삭제)"},{"id":"P337","c":8,"s":1,"k":"err","lv":0,"t":"관계대명사와 대명사가 같이 있는 경우","q":"[Although] memory function is difficult to understand and analyze, memory loss is something that many people [experience] and worry [about it] as they [age.]","a":2,"e":"something that many people experience and worry about에서 that이 about의 목적어 역할을 해.¶그래서 about 뒤에 it을 또 쓰면 목적어가 겹쳐.¶worry about (그것)으로 끝나는 게 맞아.","h":["패턴: 관계대명사의 불완전성과 선행사와의 의미관계","목적어 중복"],"src":"패턴","pp":"패턴편 II 47쪽","x":"about"},{"id":"P338","c":8,"s":1,"k":"err","lv":0,"t":"명사절‘that'과 형용사절’that'을 구별하는 경우","q":"Sarah Vaughn had a voice like a [perfect] instrument, and it was [an] instrument that she knew how [to use it] with the [utmost] skill.","a":2,"e":"an instrument that she knew how to use에서 that이 use의 목적어야.¶use 뒤에 it을 또 쓰면 목적어가 두 번 들어가.¶관계대명사가 받는 자리는 비워 둬야 해.","h":["패턴: 관계대명사의 불완전성과 선행사와의 의미관계","목적어 중복"],"src":"패턴","pp":"패턴편 II 47쪽","x":"to use"},{"id":"P339","c":8,"s":1,"k":"err","lv":0,"t":"명사절‘that'과 형용사절’that'을 구별하는 경우","q":"Nirvana is the word [that] Hindus [use it] [to describe] [a sense] of inner peace.","a":1,"e":"the word that Hindus use에서 that이 use의 목적어야.¶use it이라고 하면 목적어가 겹쳐.¶Hindus use (the word) to describe ~.","h":["패턴: 관계대명사의 불완전성과 선행사와의 의미관계","목적어 중복"],"src":"패턴","pp":"패턴편 II 47쪽","x":"use"},{"id":"P340","c":8,"s":1,"k":"blank","lv":0,"t":"명사절‘that'과 형용사절’that'을 구별하는 경우","q":"________ inhabitants have been in the Americas for at least 15,000 thousand years.","a":1,"e":"'~라는 증거가 있다'는 존재를 말하니 There is ~ proof.¶proof의 내용을 설명하는 동격 that이고, 뒤가 완전한 문장이라 which는 안 돼.¶There is a considerable amount of proof that inhabitants have been ~.","h":["패턴: 관계대명사의 불완전성과 선행사와의 의미관계","There is proof that"],"src":"패턴","pp":"패턴편 II 47쪽","o":["It is a considerable amount of proof which","There is a considerable amount of proof that","It is a considerable amount of proof for","There is a considerable amount of proof which"]},{"id":"P353","c":8,"s":1,"k":"blank","lv":0,"t":"소유형용사와 관계형용사를 구분하는 경우","q":"Mark Twain, _______ real name was Samuel Langhorne clemens, wrote many world-famous novels.","a":2,"e":"'그의 본명'을 관계절로 이어 주는 소유격 관계대명사 whose.¶Mark Twain, whose real name was ~ (그의 본명은 ~였는데).¶his를 쓰면 접속사가 없어서 문장이 두 개가 돼.","h":["패턴: 관계형용사 whose","whose real name"],"src":"패턴","pp":"패턴편 II 53쪽","o":["his","with his","whose","in spite of his"]},{"id":"P354","c":8,"s":1,"k":"err","lv":0,"t":"다른 관계사와 ‘whose’를 구분하는 경우","q":"The modern Olympic Games began in athens in 1896 as a result [of the initiative] of Baron Pierre de Coubertin, a French educator [who] [desire] was to promote international [understanding] through athletics.","a":1,"e":"바로 뒤에 desire라는 명사가 와: ___ desire was to promote ~.¶'그의 바람'이라 소유격 whose: a French educator whose desire was ~.¶who 뒤에는 동사가 와야 해.","h":["패턴: 관계형용사 whose","whose + 명사"],"src":"패턴","pp":"패턴편 II 53쪽","x":"whose"},{"id":"P355","c":8,"s":1,"k":"err","lv":0,"t":"다른 관계사와 ‘whose’를 구분하는 경우","q":"His bank card will not [work] in [those] banks [whose] are not [in] the NYCE","a":2,"e":"whose 뒤에는 반드시 명사가 와야 하는데 are(동사)가 바로 왔어.¶are의 주어가 비어 있으니 주격 which(또는 that): banks which are not in the NYCE.¶whose = 소유격(그것의 + 명사).","h":["패턴: 관계형용사 whose","whose 뒤에는 명사"],"src":"패턴","pp":"패턴편 II 53쪽","x":"which"},{"id":"P356","c":8,"s":1,"k":"blank","lv":0,"t":"다른 관계사와 ‘whose’를 구분하는 경우","q":"To those old allies _______ cultural and spiritual origins we share, we pledge the loyalty of faithful friends.","a":2,"e":"빈칸 뒤 cultural and spiritual origins(명사)가 바로 와.¶'그들의 기원'을 우리가 공유한다는 뜻이라 whose origins.¶those old allies whose origins we share.","h":["패턴: 관계형용사 whose","whose origins"],"src":"패턴","pp":"패턴편 II 53쪽","o":["what","who","whose","whom"]},{"id":"P357","c":8,"s":1,"k":"err","lv":0,"t":"다른 관계사와 ‘whose’를 구분하는 경우","q":"A person [which] kidneys have failed cannot [do without] the medical [treatment] known [as] dialysis.","a":0,"e":"바로 뒤에 kidneys(명사)가 와: ___ kidneys have failed.¶'그 사람의 신장'이라 소유격 whose: a person whose kidneys have failed.¶which는 소유를 나타내지 못해.","h":["패턴: 관계형용사 whose","whose + 명사"],"src":"패턴","pp":"패턴편 II 53쪽","x":"whose"},{"id":"P358","c":8,"s":1,"k":"blank","lv":0,"t":"불완정성을 구분하는 경우","q":"From time to time we must look up words ________.","a":3,"e":"words whose meanings we do not know (뜻을 모르는 단어들).¶whose meanings가 know의 목적어 역할을 해.¶B는 familiar 뒤에 with가 빠졌고, C는 접속사가 없어서 틀려.","h":["패턴: 관계형용사 whose","whose meanings we do not know"],"src":"패턴","pp":"패턴편 II 53쪽","o":["meaning of which we do not know","whose meanings we are not familiar","we do not know their meanings","whose meanings we do not know"]},{"id":"P359","c":8,"s":1,"k":"err","lv":0,"t":"‘that’을 쓰지 못하는 경우","q":"Adolescence is the time of life [between childhood and adulthood.] The word is [derived from] [the Latin word adolescere,] [that means] “to grow into maturity.”","a":3,"e":"콤마 뒤 계속적 용법이야. 계속적 용법에는 that을 쓰지 못해.¶the Latin word adolescere, which means \"to grow into maturity.\"¶which는 앞 단어(adolescere)를 받아.","h":["패턴: ‘that’을 쓰지 못하는 경우","계속적 용법 that 불가"],"src":"패턴","pp":"패턴편 II 55쪽","x":"which means"},{"id":"P360","c":8,"s":1,"k":"err","lv":0,"t":"‘that’을 쓰지 못하는 경우","q":"Humus, a substance [found] in soil, is [soft] and spongy and enables plant roots to send [out] tiny hairs through [that] they absorb water and food.","a":3,"e":"전치사 바로 뒤에는 that을 쓸 수 없어.¶through which they absorb water (그것을 통해 물을 흡수한다).¶전치사 + which(사물) / 전치사 + whom(사람).","h":["패턴: ‘that’을 쓰지 못하는 경우","전치사 뒤 that 불가"],"src":"패턴","pp":"패턴편 II 55쪽","x":"which"},{"id":"P361","c":8,"s":1,"k":"blank","lv":0,"t":"유사관계대명사의 선택","q":"There is not one of us _________ wishes to help you.","a":3,"e":"선행사에 부정어(not one)가 있을 때 but = that ~ not.¶There is not one of us but wishes to help you (너를 돕고 싶지 않은 사람은 하나도 없다 = 모두 돕고 싶다).¶이 but을 '유사관계대명사'라고 불러.","h":["패턴: 유사관계대명사의 선택","유사관계대명사 but"],"src":"패턴","pp":"패턴편 II 57쪽","o":["which","whose","whoever","but"]},{"id":"P362","c":8,"s":1,"k":"blank","lv":0,"t":"유사관계대명사의 선택","q":"Life is too short to be interested in everything, but it is good to be interested in as many things __________ are necessary to fill our days","a":2,"e":"앞에 as many things가 있으니 짝은 as.¶as many things as are necessary (필요한 만큼 많은 것들).¶이 as는 are의 주어 역할도 하는 유사관계대명사야.","h":["패턴: 유사관계대명사의 선택","as many as"],"src":"패턴","pp":"패턴편 II 57쪽","o":["than","that","as","which"]},{"id":"P363","c":8,"s":1,"k":"err","lv":0,"t":"단순한 형태","q":"Good, [affordable] housing is one of the [factors] that [makes] [a community] a desirable place to live in.","a":2,"e":"one of the factors that make ~ 에서 that의 선행사는 the factors(복수)야.¶그래서 동사는 make. one에 맞추면 틀려.¶뜻: 좋은 주택은 공동체를 살기 좋게 만드는 요인 중 하나다.","h":["패턴: 관계절내의 수일치","one of the 복수명사 + that"],"src":"패턴","pp":"패턴편 II 59쪽","x":"make"},{"id":"P364","c":8,"s":1,"k":"err","lv":0,"t":"단순한 형태","q":"She gave me the impression of [having] more [teeth,] white and large and [even,] than [was] necessary for [any] practical purpose.","a":3,"e":"than이 유사관계대명사로 앞의 teeth를 받아: more teeth than were necessary.¶teeth가 복수라 was가 아니라 were.¶뜻: 필요한 것보다 더 많은 이를 가진 것 같은 인상.","h":["패턴: 관계절내의 수일치","than 뒤의 수일치"],"src":"패턴","pp":"패턴편 II 59쪽","x":"were"},{"id":"P365","c":8,"s":1,"k":"err","lv":0,"t":"의미관계를 통해 선행사를 찾아야 하는 경우","q":"[Like] the giant reptiles, most lineages of organisms have [eventually] become extinct; still, some exist that [has] changed very little in [millions] of years.","a":2,"e":"some (lineages) exist that have changed very little에서 that의 선행사는 some(lineages, 복수)이야.¶그래서 has가 아니라 have.¶관계절이 선행사에서 떨어져 있어도 의미로 찾아.","h":["패턴: 관계절내의 수일치","선행사는 some(lineages)"],"src":"패턴","pp":"패턴편 II 59쪽","x":"have"},{"id":"P366","c":8,"s":1,"k":"err","lv":0,"t":"‘부정대명사 + 관계대명사’ 형태","q":"Note [also] that the base class has a default constructor and [a destructor,] neither [of] which [do] anything.","a":3,"e":"neither of which는 '둘 다 ~ 아니다'라는 뜻으로 단수 취급해.¶그래서 do가 아니라 does: neither of which does anything.¶같은 부류: each of which, either of which도 단수.","h":["패턴: 관계절내의 수일치","neither는 단수"],"src":"패턴","pp":"패턴편 II 59쪽","x":"does"},{"id":"P367","c":8,"s":1,"k":"blank","lv":0,"t":"‘부정대명사 + 관계대명사’ 형태","q":"The bodies of living creatures are organized into many different systems, _________ has a certain function.","a":3,"e":"콤마 뒤 이어지는 문장에서 '각 시스템이 기능을 가진다'는 뜻이야.¶접속사 역할 + '각각'이라 each of which has a certain function.¶which만 쓰면 many systems 전체가 has로 단수 동사와 안 맞아.","h":["패턴: 관계절내의 수일치","each of which"],"src":"패턴","pp":"패턴편 II 59쪽","o":["which","in which","and","each of which"]},{"id":"P368","c":8,"s":1,"k":"err","lv":0,"t":"관계부사의 선택 - 전치사","q":"The kind of place in [where] a particular tribe originally [lives] can [be referred] to [as] its native land.","a":0,"e":"전치사 in 뒤에는 관계부사 where가 못 와.¶in which(= where): the kind of place in which a tribe lives.¶in과 where는 둘 중 하나만.","h":["패턴: 관계부사","전치사 + 관계대명사"],"src":"패턴","pp":"패턴편 II 61쪽","x":"which"},{"id":"P369","c":8,"s":1,"k":"blank","lv":0,"t":"관계부사의 선택 - 완전성·불완전성","q":"The gardens _______ we planted pine trees belong to the city.","a":2,"e":"we planted pine trees는 빠진 게 없는 완전한 문장이야.¶완전한 문장 앞, 장소 선행사면 관계부사 where: the gardens where we planted pine trees.¶which는 뒤가 불완전할 때 써.","h":["패턴: 관계부사","완전한 절 앞 where"],"src":"패턴","pp":"패턴편 II 61쪽","o":["why","when","where","which"]},{"id":"P370","c":8,"s":1,"k":"err","lv":0,"t":"관계부사의 선택 - 완전성·불완전성","q":"Increasingly, the Internet also is [a venue of] so-called citizen journalism, [which] swarms of surfers mobilize to gather information on what the traditional media isn’t covering, [or is covering] in a way [that dissatisfies] some people.","a":1,"e":"swarms of surfers mobilize ~ 는 완전한 문장이야.¶완전한 문장 앞이라 관계대명사 which가 아니라 관계부사 where(= in which).¶citizen journalism, where swarms of surfers mobilize ~ (시민 저널리즘 속에서).","h":["패턴: 관계부사","완전한 절 앞"],"src":"패턴","pp":"패턴편 II 61쪽","x":"where (또는 in which)"},{"id":"P371","c":8,"s":1,"k":"blank","lv":0,"t":"관계부사가 생략이 되는 경우","q":"The computer has dramatically affected __________ photographic lenses are constructed.","a":3,"e":"'렌즈가 만들어지는 방식'은 the way + 문장.¶affected의 목적어로 바로 와: affected the way lenses are constructed.¶the way와 how는 같이 못 쓰고 둘 중 하나만.","h":["패턴: 관계부사","the way + 절"],"src":"패턴","pp":"패턴편 II 61쪽","o":["is the way","that the way","which way do","the way"]},{"id":"P372","c":8,"s":1,"k":"err","lv":0,"t":"관계부사가 생략이 되는 경우","q":"If people cannot rely on the news [for] facts, journalism has no reason for [being.] The principal reason journalists [existing] in society is that people have a need to [be informed of] and [comprehend] the details of experience.","a":2,"e":"The principal reason (why) journalists ___ in society 에서 관계절에도 동사가 필요해.¶그래서 existing이 아니라 exist.¶뼈대: The reason is that people have a need ~.","h":["패턴: 관계부사","관계부사 생략 뒤 동사"],"src":"패턴","pp":"패턴편 II 61쪽","x":"exist"},{"id":"8-02","c":8,"s":1,"k":"err","lv":1,"t":"관계절 안 목적어 중복","q":"This is [the dictionary] [which] I bought [it] [yesterday].","a":2,"x":"(it 삭제)","h":["which가 관계절 안에서 무슨 역할을 해?","관계대명사가 이미 목적어 역할을 해."],"e":"목적격 관계대명사 which가 이미 bought의 목적어 역할을 하고 있어.¶그래서 it을 또 쓰면 목적어가 겹쳐.¶This is the dictionary which I bought yesterday.","src":"연습"},{"id":"8-03","c":8,"s":1,"k":"blank","lv":3,"t":"삽입절 뒤 관계대명사의 격","q":"She was a teacher ___ I thought loved us very much.","o":["who","whom","which","what"],"a":0,"h":["I thought를 괄호로 묶고 다시 봐.","loved의 주어가 빈칸이야."],"e":"I thought는 삽입절이야. 빼고 보면 a teacher ___ loved us.¶loved의 주어가 비어 있으니 주격 who.¶삽입절 뒤라고 whom을 고르는 게 대표 함정이야.","src":"연습"},{"id":"8-04","c":8,"s":1,"k":"blank","lv":2,"t":"앞 절 전체를 받는 which","q":"He paid all his debt, ___ proves his honesty.","o":["which","that","what","who"],"a":0,"h":["무엇이 정직함을 증명하는지 생각해 봐: 빚을 다 갚은 것 전체.","앞 문장 전체를 선행사로 받는 계속적 용법."],"e":"그의 정직함을 증명하는 건 '빚을 다 갚은 것' 전체야.¶앞 문장 전체를 받는 건 계속적 용법 , which.¶that은 콤마 뒤에 못 쓰고, what은 선행사가 있으면 못 써.","src":"연습"},{"id":"8-05","c":8,"s":1,"k":"err","lv":2,"t":"what은 선행사를 포함","q":"[The thing what] [made] her angry [was] his [indifference].","a":0,"h":["what 안에 이미 the thing이 들어 있어.","선행사가 있으면 what은 못 써."],"e":"what = the thing which. what 안에 이미 '것(the thing)'이 들어 있어.¶그래서 the thing what은 '것'이 두 번 들어간 꼴이야.¶What made her angry ~ 또는 The thing that made her angry ~.","x":"What (또는 The thing that)","src":"연습"},{"id":"8-06","c":8,"s":1,"k":"err","lv":1,"t":"the way와 how","q":"This is [the way] [how] he [solved] the [quiz].","a":1,"x":"(how 삭제) the way he solved / how he solved","h":["the way와 how를 같이 쓸 수 있는지 생각해 봐.","둘 중 하나만 써."],"e":"the way와 how는 함께 쓰지 않아.¶This is the way he solved the quiz / This is how he solved the quiz.¶the way in which he solved도 가능해.","src":"연습"},{"id":"8-07","c":8,"s":1,"k":"blank","lv":1,"t":"관계부사 where","q":"This is the house ___ I was born.","o":["which","where","in where","that"],"a":1,"h":["I was born은 완전한 절이야.","완전한 절 앞 장소 선행사 → 관계부사."],"e":"I was born은 빠진 게 없는 완전한 문장이야.¶완전한 문장 앞 장소 선행사면 관계부사 where(= in which).¶in where처럼 전치사와 관계부사를 겹쳐 쓰면 틀려.","src":"연습"},{"id":"P341","c":8,"s":2,"k":"err","lv":0,"t":"단순한 문제","q":"Recently, police officers and lawyers [have paid] more attention to crimes [associated with] marital violence, [and to] the prevention of situations in [which tend] to occur.","a":3,"e":"in which 뒤에는 완전한 문장이 와야 하는데, tend의 주어가 없어.¶주어 역할을 하도록 전치사를 빼고 주격 which: situations which tend to occur.¶구별법: 전치사 + 관계대명사 뒤는 완전, 관계대명사 혼자 뒤는 불완전.","h":["패턴: ‘전치사 + 관계대명사’의 완전성과 선행사의 의미관계","전치사 + 관계사 뒤는 완전한 절"],"src":"패턴","pp":"패턴편 II 49쪽","x":"which tend (in 삭제)"},{"id":"P342","c":8,"s":2,"k":"err","lv":0,"t":"단순한 문제","q":"Insulin is a substance [for which] enables muscles [to absorb] sugar from the blood, and [to break] it up [for the purpose of obtaining] energy.","a":0,"e":"enables의 주어가 비어 있어. 주어 역할은 주격 관계대명사 which.¶for which는 뒤에 완전한 문장이 와야 해.¶a substance which enables muscles to absorb sugar.","h":["패턴: ‘전치사 + 관계대명사’의 완전성과 선행사의 의미관계","주격 관계대명사"],"src":"패턴","pp":"패턴편 II 49쪽","x":"which"},{"id":"P343","c":8,"s":2,"k":"blank","lv":0,"t":"선행사와 의미관계를 구별해야하는 경우","q":"If, through laziness, you read at a slower rate than the rate _______ you are able to comprehend, there is great temptation for your mind to wander.","a":0,"e":"'~의 속도로'는 at a rate야.¶you are able to comprehend at the rate → the rate at which you are able to comprehend.¶전치사는 선행사와 어울리는 걸로 골라.","h":["패턴: ‘전치사 + 관계대명사’의 완전성과 선행사의 의미관계","at a rate"],"src":"패턴","pp":"패턴편 II 49쪽","o":["at which","which","as if","through which"]},{"id":"P344","c":8,"s":2,"k":"err","lv":0,"t":"선행사와 의미관계를 구별해야하는 경우","q":"Some modern scientists believe that the impact [which] a gigantic meteor [crashed into] the Earth millions of years ago [set off] the chain of events that led to the extinction of the dinosaurs and [the close] of the Age of Reptiles.","a":0,"e":"a meteor crashed into the Earth는 완전한 문장이라 which 혼자는 못 와.¶충돌이 일어난 그 사건 '속에서'라는 뜻이라 in which(또는 when).¶구별법: 뒤가 완전하면 전치사 + which 또는 관계부사.","h":["패턴: ‘전치사 + 관계대명사’의 완전성과 선행사의 의미관계","완전한 절 앞"],"src":"패턴","pp":"패턴편 II 49쪽","x":"in which (또는 when)"},{"id":"P345","c":8,"s":2,"k":"blank","lv":0,"t":"전치사의 선택을 고려하는 경우","q":"The subject _________ I am most interested is Spanish.","a":0,"e":"be interested in = ~에 관심이 있다.¶I am most interested in the subject → the subject in which I am most interested.¶전치사는 관계절 안의 표현에서 가져와.","h":["패턴: ‘전치사 + 관계대명사’의 완전성과 선행사의 의미관계","be interested in"],"src":"패턴","pp":"패턴편 II 49쪽","o":["in which","on that","of which","on which"]},{"id":"P346","c":8,"s":2,"k":"blank","lv":0,"t":"전치사의 선택을 고려하는 경우","q":"The mockingbird was so named because of its ability to mimic other birds' songs and calls, _______ it adds some variations of its kind.","a":3,"e":"add A to B = A를 B에 더하다.¶it adds variations to the songs and calls → the songs and calls, to which it adds variations.¶전치사는 원래 표현(add to)에서 가져와.","h":["패턴: ‘전치사 + 관계대명사’의 완전성과 선행사의 의미관계","add A to B"],"src":"패턴","pp":"패턴편 II 49쪽","o":["with what","for which","in which","to which"]},{"id":"P347","c":8,"s":2,"k":"err","lv":0,"t":"대명사와의 구별","q":"[Seoul citizens] are [considerably] proud [of] beautiful mountains in the city, and the most breathtaking [of which] is Mt.","a":3,"e":"이미 접속사 and가 두 문장을 이어 주고 있어.¶그래서 관계대명사가 또 필요 없고, 대명사 them이 맞아: the most breathtaking of them is Mt. ~.¶구별법: 접속사가 있으면 대명사, 없으면 관계대명사.","h":["패턴: ‘부정대명사 + 관계대명사’","접속사 and가 이미 있음"],"src":"패턴","pp":"패턴편 II 51쪽","x":"of them"},{"id":"P348","c":8,"s":2,"k":"err","lv":0,"t":"대명사와의 구별","q":"Chinese firms, many of [them] are state-owned and don't need to [field] tough questions on [ethics] from their boards or shareholders, have invested heavily in places [where] Western companies face severe restrictions.","a":0,"e":"Chinese firms, many of ___ are state-owned ~, have invested ~ 에서 접속사가 없어.¶두 문장을 이어 줄 관계대명사가 필요하니 many of which.¶them을 쓰면 문장 두 개가 접속사 없이 붙어.","h":["패턴: ‘부정대명사 + 관계대명사’","두 절을 잇는 관계대명사"],"src":"패턴","pp":"패턴편 II 51쪽","x":"which"},{"id":"P349","c":8,"s":2,"k":"blank","lv":0,"t":"적절한 관계대명사의 선택","q":"UNICEF, with a multimillion dollar budget, provides its many services thanks to voluntary contributions, most of ________ come from governments.","a":1,"e":"contributions(기부금, 사물) 중 대부분이라 most of which.¶whom, who는 사람에만, that과 what은 전치사 of 뒤에 못 와.¶most of which come from governments.","h":["패턴: ‘부정대명사 + 관계대명사’","most of which"],"src":"패턴","pp":"패턴편 II 51쪽","o":["whom","which","that","what","who"]},{"id":"P350","c":8,"s":2,"k":"blank","lv":0,"t":"적절한 부정사대명사의 선택","q":"The car has two new tires, _______ are flat.","a":3,"e":"타이어 두 개 둘 다라 both, 접속사 역할이 필요하니 관계대명사 which.¶both of which are flat (둘 다 펑크 났다).¶all은 셋 이상, whom은 사람, that은 전치사 뒤 불가.","h":["패턴: ‘부정대명사 + 관계대명사’","both of which"],"src":"패턴","pp":"패턴편 II 51쪽","o":["both of whom","all of them","all of which","both of which","both of that"]},{"id":"P351","c":8,"s":2,"k":"blank","lv":0,"t":"적절한 부정사대명사의 선택","q":"The most brilliant Greek inventor was Archimedes, ________ about 2,250 years ago.","a":1,"e":"약 2,250년 전에 살았던 사람이라 과거 lived, 사람이라 who.¶Archimedes, who lived about 2,250 years ago.¶has lived는 '지금까지 살아왔다'라 ago와 안 맞고, that은 콤마 뒤에 못 써.","h":["패턴: ‘부정대명사 + 관계대명사’","who lived"],"src":"패턴","pp":"패턴편 II 51쪽","o":["one of whom lived","who lived","whose sister has lived","who has lived","that lived"]},{"id":"P352","c":8,"s":2,"k":"err","lv":0,"t":"전치사의 누락여부","q":"There are twenty [species] of wild roses in North America, [all which] have [prickly] stems, pinnate leaves, and large flowers which usually smell [sweet.]","a":1,"e":"부정대명사 + 관계대명사 사이에는 of가 있어야 해.¶all of which have prickly stems (그 모두가 가시 줄기를 가진다).¶all which (X) → all of which.","h":["패턴: ‘부정대명사 + 관계대명사’","부정대명사 + of + 관계대명사"],"src":"패턴","pp":"패턴편 II 51쪽","x":"all of which"},{"id":"8-08","c":8,"s":2,"k":"blank","lv":2,"t":"전치사 + whom","q":"This is the scientist ___ whom I have discussed the problem.","a":0,"h":["'~와 그 문제를 논의했다'를 생각해 봐.","I discussed the problem with the scientist."],"e":"관계절을 원래 문장으로 돌려 봐: I have discussed the problem with the scientist.¶with가 whom 앞으로 와서 with whom.¶전치사는 원래 문장에서 가져와.","o":["with","to","about","for"],"src":"연습"},{"id":"8-09","c":8,"s":2,"k":"blank","lv":3,"t":"수량사 + of + whom","q":"He has three daughters, none of ___ are married yet.","o":["them","whom","who","that"],"a":1,"h":["콤마 뒤에 접속사 없이 절이 이어져.","두 절을 이어 주면서 전치사 of의 목적어가 될 말은?"],"e":"접속사 없이 두 문장을 이으려면 관계대명사가 필요해.¶딸들(사람) 중 아무도 아니라 none of whom.¶none of them은 접속사가 없어서 틀리고, who는 전치사 뒤에 못 와.","src":"연습"},{"id":"P373","c":8,"s":3,"k":"blank","lv":0,"t":"동사의 필요성","q":"People usually can get a sufficient amount of the calcium their bodies ________ from the food they consume.","a":0,"e":"the calcium (that) their bodies ___ 에서 목적격 관계대명사가 생략됐어.¶관계절의 동사 자리고, bodies가 복수라 need.¶뜻: 몸이 필요로 하는 칼슘.","h":["패턴: 관계대명사의 생략","the calcium (that) their bodies need"],"src":"패턴","pp":"패턴편 II 63쪽","o":["need","needs","to need","needing"]},{"id":"P374","c":8,"s":3,"k":"blank","lv":0,"t":"끊고, 불완전성","q":"Lives would continue to be lost to the ravages __________ the bodies and spirits of those who take them.","a":0,"e":"the ravages (that) drugs inflict on ~ 에서 목적격 관계대명사가 생략됐어.¶inflict A on B(A를 B에 가하다)에서 A가 관계사로 빠진 구조야.¶drugs inflict on the bodies (마약이 몸에 가하는 피해).","h":["패턴: 관계대명사의 생략","생략된 관계절"],"src":"패턴","pp":"패턴편 II 63쪽","o":["drugs inflict on","drugs’ infliction on","drugs inflict themselves on","drugs inflicting on"]},{"id":"8-10","c":8,"s":3,"k":"err","lv":2,"t":"생략된 관계사와 전치사","q":"We [need] the chairs [we] will [sit] [tonight].","a":2,"h":["관계사가 생략돼 있어: the chairs (which) we will sit ~","원래 문장은 We will sit on the chairs."],"e":"sit은 '앉다'라는 뜻으로, 혼자 앉는 동작이라 앉을 곳을 바로 목적어로 받지 못해. 그래서 '어디에' 앉는지는 on으로 이어 줘: sit on the chairs.¶관계대명사가 생략돼도 이 on은 남아야 해: the chairs (which) we will sit on.¶같은 예: a house to live in, a pen to write with.","x":"sit on","src":"연습"},{"id":"8-11","c":8,"s":3,"k":"err","lv":3,"t":"강조구문의 부사구","q":"It was [the house] [that] the accident [took place] [last year].","a":0,"x":"in the house","h":["It was ~ that 강조구문이야. that 뒤 절이 완전한지 봐.","the accident took place in the house에서 무엇을 강조한 거지?"],"e":"It was ~ that 강조구문이야. that 뒤 the accident took place는 완전한 문장이야.¶그러니 강조된 건 부사구 in the house여야 해: It was in the house that the accident took place.¶원래 문장: The accident took place in the house.","src":"연습"},{"id":"P375","c":8,"s":4,"k":"blank","lv":0,"t":"격구분","q":"They were prepared to give their book to ________ came here first.","a":2,"e":"came here의 주어가 비어 있어.¶주격 whoever: give their book to whoever came here first.¶to 뒤라고 whomever를 고르면 함정이야.","h":["패턴: 복합관계사","whoever + 동사"],"src":"패턴","pp":"패턴편 II 65쪽","o":["whomever","whom","whoever","those","who"]},{"id":"P376","c":8,"s":4,"k":"err","lv":0,"t":"수일치","q":"[Whoever] inspected [this] radio [should] have put [their] identification number on the box.","a":3,"e":"whoever는 단수 취급해.¶그래서 대명사도 단수 his(또는 his or her). their는 복수야.¶Whoever inspected this radio should have put his number ~.","h":["패턴: 복합관계사","whoever는 단수"],"src":"패턴","pp":"패턴편 II 65쪽","x":"his (또는 his or her)"},{"id":"P377","c":8,"s":4,"k":"blank","lv":0,"t":"적절한 복합관계사의 선택","q":"_______ the source of its potency this year, the values issue is hardly untrod ground for politicians.","a":1,"e":"Whatever + 명사 = 무엇이든 간에(양보).¶Whatever the source of its potency (may be) (그 영향력의 원천이 무엇이든).¶뒤에 be동사가 생략된 모양이야.","h":["패턴: 복합관계사","Whatever + 명사"],"src":"패턴","pp":"패턴편 II 65쪽","o":["However","Whatever","Whomever","Nonetheless"]},{"id":"P378","c":8,"s":4,"k":"blank","lv":0,"t":"적절한 복합관계사의 선택","q":"_______ player scores the highest number of points will be the winner.","a":3,"e":"Whichever + 명사 = 어느 ~든지.¶Whichever player scores the highest ~ (가장 많이 득점하는 선수는 누구든).¶이 절 전체가 will be의 주어야.","h":["패턴: 복합관계사","Whichever + 명사"],"src":"패턴","pp":"패턴편 II 65쪽","o":["Any","Whoever","No","Whichever"]},{"id":"8-12","c":8,"s":4,"k":"blank","lv":1,"t":"복합관계대명사 whatever","q":"___ may happen, I'm ready to fight it off.","a":0,"h":["'무슨 일이 일어나더라도'라는 양보 부사절이야.","happen의 주어 역할도 해야 해."],"e":"'무슨 일이 일어나더라도'라는 양보 표현이야. happen의 주어 역할도 해야 해.¶Whatever may happen = No matter what may happen.¶= Happen what may.","o":["Whatever","Whoever","However","Wherever"],"src":"연습"},{"id":"P379","c":9,"s":0,"k":"blank","lv":0,"t":"문두에서","q":"_______ she had rid herself of falsehood, that young woman had only to be herself.","a":2,"e":"뼈대: ___ she had rid herself of falsehood, she had only to be herself.¶앞은 '거짓을 버렸으니까'라는 이유야. Now that = 이제 ~이니까.¶That은 명사절, No matter는 뒤에 what/how가 필요하고, However는 부사라 절을 못 이어.","h":["패턴: 부사절접속사와 다른 접속사의 구별","Now that = ~이니까"],"src":"패턴","pp":"패턴편 II 69쪽","o":["That","No matter","Now that","However"]},{"id":"P380","c":9,"s":0,"k":"blank","lv":0,"t":"문두에서","q":"______ of smell might, without our realizing it, affect those whom we choose as friends has been suggested.","a":0,"e":"뼈대: ___ has been suggested. 주어 자리가 비어 있어.¶완전한 문장 '후각이 친구 선택에 영향을 줄지도 모른다'를 주어로 만드는 건 That.¶Because는 부사절이라 주어가 될 수 없어.","h":["패턴: 부사절접속사와 다른 접속사의 구별","주어 자리 명사절"],"src":"패턴","pp":"패턴편 II 69쪽","o":["That our sense","Sense","For our sense","Because our sense"]},{"id":"P381","c":9,"s":0,"k":"blank","lv":0,"t":"문중에서","q":"She reflected no longer than a second ________ she decisively slit the envelope.","a":0,"e":"1초도 안 되게 생각하고 '나서' 봉투를 뜯었다는 순서야.¶no longer than a second before ~ = ~하기 전에 1초도 생각하지 않았다.¶then, and, but은 뜻이나 구조가 안 맞아.","h":["패턴: 부사절접속사와 다른 접속사의 구별","before + 절"],"src":"패턴","pp":"패턴편 II 69쪽","o":["before","then","and","but"]},{"id":"P382","c":9,"s":0,"k":"blank","lv":0,"t":"문중에서","q":"Roquefort Cheese is named for the region of France ________ it was first accidentally produced.","a":0,"e":"it was first produced in the region이라 전치사 in이 필요해.¶the region in which it was first produced.¶on where는 전치사와 관계부사를 겹쳤고, when은 시간에 써.","h":["패턴: 부사절접속사와 다른 접속사의 구별","the region in which"],"src":"패턴","pp":"패턴편 II 69쪽","o":["in which","as","on where","whereas","when"]},{"id":"P383","c":9,"s":0,"k":"err","lv":0,"t":"무조건 부사절 접속사 - ‘동사’가 있는 경우","q":"James’s first novel [was published] [during] he was [still] a junior [in] university.","a":1,"e":"during은 전치사라 뒤에 명사만 와: during his school days.¶he was still a junior처럼 주어 + 동사가 오면 접속사 while.¶구별법: 뒤에 동사가 있으면 접속사, 명사만 있으면 전치사.","h":["패턴: 부사절접속사와 전치사와의 구별","during + 절 불가"],"src":"패턴","pp":"패턴편 II 71쪽","x":"while"},{"id":"P384","c":9,"s":0,"k":"blank","lv":0,"t":"무조건 부사절 접속사 - ‘동사’가 있는 경우","q":"________ ended traffic on the Mississippi River, Mark Twain left his job as a river pilot and moved west to Carson City.","a":3,"e":"빈칸 뒤 ended traffic이 동사 + 목적어야. 그러니 빈칸에 주어가 필요하고, 문장을 이어 줄 접속사도 필요해.¶When the Civil War ended traffic ~ (남북전쟁으로 강의 교통이 끊겼을 때).¶During the Civil War는 전치사구라 ended의 주어가 없어.","h":["패턴: 부사절접속사와 전치사와의 구별","When + 절"],"src":"패턴","pp":"패턴편 II 71쪽","o":["During the Civil War","Because the Civil War was","That the Civil War was","When the Civil War"]},{"id":"P385","c":9,"s":0,"k":"blank","lv":0,"t":"무조건 부사절 접속사 - ‘분사·형용사’가 있는 경우","q":"________ in 1939, the museum still strikes the eye as new and unusual.","a":2,"e":"Although (it was) opened in 1939 = 1939년에 개관했지만.¶박물관은 '개관된' 거라 opened, 내용이 '그럼에도 여전히 새로워 보인다'라 양보 Although.¶Despite는 전치사라 뒤에 분사가 못 와.","h":["패턴: 부사절접속사와 전치사와의 구별","Although + p.p."],"src":"패턴","pp":"패턴편 II 71쪽","o":["Because opening","Despite opened","Although opened","Although opening"]},{"id":"P386","c":9,"s":0,"k":"blank","lv":0,"t":"무조건 부사절 접속사 - ‘분사·형용사’가 있는 경우","q":"The flight instructor, _______ at the air base, said that orders not to fight had been issued.","a":0,"e":"when (he was) interviewed = 인터뷰를 받았을 때.¶교관이 '인터뷰를 받은' 쪽이라 수동 interviewed.¶접속사 뒤 주어 + be동사는 생략할 수 있어.","h":["패턴: 부사절접속사와 전치사와의 구별","when + p.p."],"src":"패턴","pp":"패턴편 II 71쪽","o":["when interviewed","when be interviewed","when to interview","when interviews"]},{"id":"P387","c":9,"s":0,"k":"err","lv":0,"t":"무조건 부사절 접속사 - ‘분사·형용사’가 있는 경우","q":"[Despite difficult to master,] the guitar is embraced by many beginning music students because [of its] musical [versatility,] relative low cost, and [extreme] popularity.","a":0,"e":"despite는 전치사라 뒤에 명사가 와야 해. difficult(형용사)는 못 받아.¶Although (it is) difficult to master = 익히기 어렵지만.¶구별법: 형용사·분사 앞은 접속사(although), 명사 앞은 전치사(despite).","h":["패턴: 부사절접속사와 전치사와의 구별","despite + 형용사 불가"],"src":"패턴","pp":"패턴편 II 71쪽","x":"Although difficult to master"},{"id":"P388","c":9,"s":0,"k":"blank","lv":0,"t":"무조건 부사절 접속사 - ‘전명구’가 있는 경우","q":"The general received the news of his promotion _________ at an on-site inspection tour.","a":2,"e":"while (he was) at an on-site inspection tour = 현장 시찰 중에.¶접속사 while 뒤 주어 + be동사가 생략된 모양이야.¶over, until도 전치사지만 뜻이 안 맞아.","h":["패턴: 부사절접속사와 전치사와의 구별","while + 전치사구"],"src":"패턴","pp":"패턴편 II 71쪽","o":["even","over","while","recent","until"]},{"id":"P389","c":9,"s":0,"k":"err","lv":0,"t":"부사절접속사·전치사 구분하는 경우","q":"[Although] a lawyer [by] profession and [accustomed public] speaking, Sir Robert Borden was not [a great orator.]","a":2,"e":"Although (he was) a lawyer ~ and accustomed to public speaking.¶be accustomed to + 명사/-ing = ~에 익숙하다. to가 빠졌어.¶같은 부류: be used to, be devoted to, look forward to.","h":["패턴: 부사절접속사와 전치사와의 구별","be accustomed to + 명사"],"src":"패턴","pp":"패턴편 II 72쪽","x":"accustomed to public"},{"id":"P390","c":9,"s":0,"k":"err","lv":0,"t":"부사절접속사·전치사 구분하는 경우","q":"[Although] [their] light weight, [aluminum] alloys can be [very] strong.","a":0,"e":"their light weight는 명사구야. 명사구 앞에는 전치사 Despite.¶Although는 접속사라 뒤에 주어 + 동사가 와야 해.¶Despite their light weight = 가벼운 무게에도 불구하고.","h":["패턴: 부사절접속사와 전치사와의 구별","Although + 명사구 불가"],"src":"패턴","pp":"패턴편 II 72쪽","x":"Despite"},{"id":"P391","c":9,"s":0,"k":"blank","lv":0,"t":"부사절접속사·전치사 구분하는 경우","q":"I couldn’t sleep _______ very tired.","a":1,"e":"despite 뒤에는 명사나 동명사: despite being very tired.¶despite I was, in spite of I was처럼 절이 오면 틀려.¶although를 쓰려면 although I was very tired.","h":["패턴: 부사절접속사와 전치사와의 구별","despite + 동명사"],"src":"패턴","pp":"패턴편 II 72쪽","o":["although I being","despite being","in spite of I was","despite I was"]},{"id":"P392","c":9,"s":0,"k":"blank","lv":0,"t":"부사절접속사와 접속부사를 구분하는 경우","q":"Spider monkeys are the best climbers in the jungle _______ they do not have thumbs.","a":3,"e":"빈칸 뒤가 they do not have thumbs라는 절이야. 절을 잇는 접속사가 필요해.¶뜻이 '엄지가 없는데도 최고의 등반가'라 양보 although.¶despite는 전치사, nevertheless는 부사라 절을 못 이어.","h":["패턴: 부사절접속사와 전치사와의 구별","although + 절"],"src":"패턴","pp":"패턴편 II 72쪽","o":["nevertheless","for","despite","although","as"]},{"id":"9-01","c":9,"s":0,"k":"err","lv":2,"t":"during과 while","q":"He [lost] his parents [and] [was raised] by his aunt [during] he was a child.","a":3,"x":"while (또는 when)","h":["빈칸 뒤에 주어 + 동사가 있어.","during은 전치사."],"e":"during은 전치사라 he was a child처럼 절을 못 받아.¶while(또는 when) + 절: while he was a child.¶전치사로 쓰려면 during his childhood.","src":"연습"},{"id":"9-02","c":9,"s":0,"k":"blank","lv":2,"t":"부사절의 축약","q":"___ traveling in Europe, he was taken ill.","o":["While","During","Since he","Because of"],"a":0,"h":["While he was traveling에서 무엇이 생략됐을까?","접속사 + 분사 형태로 줄일 수 있어."],"e":"While he was traveling에서 주어 he와 was를 생략한 모양이야: While traveling.¶접속사 while은 뒤에 분사를 받을 수 있어.¶During은 전치사라 traveling을 받으면 어색하고, Because of는 뜻이 안 맞아.","src":"연습"},{"id":"P399","c":9,"s":2,"k":"err","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"As soon as [completing] his examination [of] the patient, the doctor offered his [judgement] of [her] condition.","a":0,"e":"as soon as는 접속사라 뒤에 '주어 + 동사'가 와야 해.¶As soon as he completed his examination (진찰을 마치자마자).¶분사 completing만 쓰면 형태가 안 맞아.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","as soon as + 절"],"src":"패턴","pp":"패턴편 II 77쪽","x":"he completed"},{"id":"P400","c":9,"s":2,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"The wages of production workers could not be allowed to sink too low, _______ there be insufficient purchasing power in the economy.","a":3,"e":"빈칸 뒤 there be(원형)가 단서야. lest + 주어 + (should) 원형.¶lest there (should) be insufficient purchasing power (구매력이 부족해지지 않도록).¶lest = ~하지 않도록. 이미 부정이 들어 있어.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","lest + (should) 원형"],"src":"패턴","pp":"패턴편 II 77쪽","o":["therefore","because","where","lest"]},{"id":"P401","c":9,"s":2,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"Stupid _______ it sounds, I had very little sense of where it began or ended.","a":3,"e":"형용사 + as + 주어 + 동사 = ~이지만(양보).¶Stupid as it sounds = Though it sounds stupid (바보같이 들리겠지만).¶형용사가 맨 앞으로 나간 특이한 어순이야.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","형용사 + as + S + V"],"src":"패턴","pp":"패턴편 II 77쪽","o":["so","maybe","as if","as"]},{"id":"P405","c":9,"s":2,"k":"err","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"The cost of a college education [has risen] [as rapidly] [during the past several years] that it is now [beyond the reach of] many people.","a":1,"e":"결과의 that(그래서 ~하다)과 짝이 되는 건 so.¶has risen so rapidly that it is now beyond ~ (너무 빨리 올라서 이제 감당이 안 된다).¶as rapidly는 뒤에 as가 와야 해.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","so ~ that"],"src":"패턴","pp":"패턴편 II 78쪽","x":"so rapidly"},{"id":"P406","c":9,"s":2,"k":"err","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"The [various] parts of the body require [so] different [surgical] skills that [many] surgical specialities have developed.","a":1,"e":"뒤에 명사(skills)가 있어. 명사가 오면 so가 아니라 such.¶such different surgical skills that ~ (너무 다른 수술 기술이 필요해서 ~).¶구별법: so + 형용사 / such + (형용사) + 명사.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","such + 형용사 + 복수명사 + that"],"src":"패턴","pp":"패턴편 II 78쪽","x":"such"},{"id":"P407","c":9,"s":2,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"Even when fingerprints are hidden at the scene of a crime, they can be dusted with aluminum powder _______ they can be seen and photographed.","a":0,"e":"'보이고 사진 찍힐 수 있도록'이라는 목적이야.¶so that + 주어 + can = ~하도록: so that they can be seen.¶in order to는 뒤에 절(주어 + 동사)을 못 받아.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","so that = ~하도록"],"src":"패턴","pp":"패턴편 II 78쪽","o":["so that","in order to","although","as well as"]},{"id":"P408","c":9,"s":2,"k":"err","lv":0,"t":"부사절접속사의 선택 - 의미적 접근","q":"Some people protest about certain commercial fishing operation [although] dolphins, [considered to] be [highly intelligent] mammals, are killed [unnecessarily.]","a":0,"e":"돌고래가 불필요하게 죽기 '때문에' 일부 사람들이 항의하는 거야.¶이유를 말하니 because.¶although는 '~이지만'이라 앞뒤가 이유 관계일 때 안 맞아.","h":["패턴: 부사절접속사의 선택 - 의미적 접근","이유의 접속사"],"src":"패턴","pp":"패턴편 II 79쪽","x":"because"},{"id":"P409","c":9,"s":2,"k":"err","lv":0,"t":"부사절접속사의 선택 - 의미적 접근","q":"No one [may] ride the downtown bus [free,] [if] he is [of] retirement age.","a":2,"e":"뜻: 정년이 아니면 버스를 무료로 탈 수 없다.¶'~가 아니면'은 unless(= if ~ not).¶if를 쓰면 '정년이면 무료로 탈 수 없다'는 반대 뜻이 돼.","h":["패턴: 부사절접속사의 선택 - 의미적 접근","unless = if ~ not"],"src":"패턴","pp":"패턴편 II 79쪽","x":"unless"},{"id":"P410","c":9,"s":2,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 의미적 접근","q":"_______ the great popularity of chocolate stems from the last century, it is far from new. The earliest records of the serving of chocolate as a drink go back to the Aztecs of Mexico. Soon its use spread widely, and Europe was dotted with houses that specialized in providing hot chocolate for their customers.","a":0,"e":"초콜릿 인기는 지난 세기부터지만, 결코 새로운 건 아니다(아즈텍 시대부터 있었다).¶앞뒤가 대조라 Although.¶Since, Because는 이유라 뜻이 안 맞아.","h":["패턴: 부사절접속사의 선택 - 의미적 접근","양보 Although"],"src":"패턴","pp":"패턴편 II 79쪽","o":["Although","Since","Because","As long as"]},{"id":"P411","c":9,"s":2,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 의미적 접근","q":"I need to find an apartment before I can move. _______ I can find one in the next week or so, I will move to Seoul the first of next month.","a":4,"e":"'1~2주 안에 집을 구한다면 이사하겠다'는 조건이야.¶Provided that = ~라면(조건).¶Only if가 문장 맨 앞에 오면 주절이 도치돼야 해서(will I move) 안 맞아.","h":["패턴: 부사절접속사의 선택 - 의미적 접근","Provided that = ~라면"],"src":"패턴","pp":"패턴편 II 79쪽","o":["Due to","Only if","Even if","But still","Provided that"]},{"id":"P412","c":9,"s":2,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 의미적 접근","q":"The first time I went swimming in deep water, I sank to the bottom like a rock. _______ I’ve learned to stay afloat, I feel better about the water, but I still can’t swim well.","a":1,"e":"'이제 물에 떠 있는 법을 배웠으니 물이 덜 무섭다'는 뜻이야.¶Now that = 이제 ~이니까.¶When이나 As soon as는 '그때'를 말할 뿐 이유가 안 살아.","h":["패턴: 부사절접속사의 선택 - 의미적 접근","Now that = 이제 ~이니까"],"src":"패턴","pp":"패턴편 II 79쪽","o":["When","Now that","As soon as","As long as","The first time"]},{"id":"9-03","c":9,"s":2,"k":"blank","lv":3,"t":"명사 + as + S + V 양보","q":"___ as he was, he acted like a man.","o":["Child","A child","The child","Children"],"a":0,"h":["'그는 아이였지만'이라는 양보 구문이야.","명사 + as + S + V에서 명사는 관사 없이 써."],"e":"명사 + as + 주어 + 동사 = ~이지만(양보).¶Child as he was = Though he was a child (그는 아이였지만).¶이 구문에서 맨 앞 명사는 관사 없이 써.","src":"연습"},{"id":"9-04","c":9,"s":2,"k":"err","lv":2,"t":"lest의 부정 중복","q":"We [ran] fast [lest] we [should not be] [caught].","a":2,"h":["lest가 이미 '~하지 않도록'이야.","lest S (should) R"],"e":"lest = ~하지 않도록. lest 자체에 이미 부정(not)이 들어 있어.¶그래서 안에 not을 또 쓰지 않아: lest we (should) be caught.¶for fear (that)도 같은 원리야.","x":"should be","src":"연습"},{"id":"9-05","c":9,"s":2,"k":"err","lv":1,"t":"so ~ that","q":"He [worked] [very] hard [that] he became [rich].","a":1,"x":"so","h":["'너무 ~해서 …하다' 구문이야.","that과 짝이 되는 부사는 하나야."],"e":"'너무 ~해서 …하다'는 so + 형용사/부사 + that.¶He worked so hard that he became rich.¶very, too, as는 that과 짝이 안 돼.","src":"연습"},{"id":"9-06","c":9,"s":2,"k":"blank","lv":2,"t":"unless","q":"You will miss the train ___ you hurry.","o":["unless","if","as long as","in case"],"a":0,"h":["'서두르지 않으면' 기차를 놓친다는 뜻이야.","if ~ not = ?"],"e":"'서두르지 않으면 기차를 놓친다'는 뜻이야.¶unless = if ~ not (~하지 않으면).¶in case는 '~할 경우에 대비해'라 뜻이 달라.","src":"연습"},{"id":"P397","c":9,"s":3,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"No sooner had this been accomplished _______ the band started to play the national anthem.","a":3,"e":"No sooner had + 주어 + p.p. than ~ = ~하자마자 …했다.¶sooner가 비교급이라 than과 짝이야.¶Hardly/Scarcely는 when/before와 짝이야.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","No sooner ~ than"],"src":"패턴","pp":"패턴편 II 77쪽","o":["that","then","where","than"]},{"id":"P398","c":9,"s":3,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"I was barely ten years _______ my dad gave me the responsibility of feeding the turkeys and cleaning the barns.","a":1,"e":"barely(겨우) ~ when ~ = ~하자마자, ~했을 때 바로.¶겨우 열 살이 됐을 때 아빠가 일을 맡겼다는 뜻이야.¶hardly/scarcely/barely ~ when 세트로 외워.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","barely ~ when"],"src":"패턴","pp":"패턴편 II 77쪽","o":["as","when","if","that","which"]},{"id":"P402","c":9,"s":3,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"Not until a pony is several years old ______ to exhibit signs of independence from its mother.","a":2,"e":"Not until ~ 이 문장 맨 앞에 오면 주절이 도치돼.¶Not until a pony is several years old does it begin to exhibit ~.¶평서문이면 It does not begin ~ until it is several years old.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","Not until 도치"],"src":"패턴","pp":"패턴편 II 77쪽","o":["it begins","and begins","does it begin","beginning"]},{"id":"P403","c":9,"s":3,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"It was not ______ the 1960s that we learned that the moon supports no life.","a":2,"e":"It was not until ~ that … = ~하고 나서야 비로소 …했다.¶It was not until the 1960s that we learned ~ (1960년대가 되어서야 알았다).¶not until과 that이 세트야.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","It was not until ~ that"],"src":"패턴","pp":"패턴편 II 77쪽","o":["while","since","until","then"]},{"id":"P404","c":9,"s":3,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 형태적 접근","q":"It will be a long time _______ of the accident.","a":3,"e":"It will be a long time before + 현재 = ~하려면 오래 걸릴 것이다.¶before Harris comes to the reality (Harris가 현실을 받아들이려면).¶시간 부사절이라 will이 아니라 현재 comes.","h":["패턴: 부사절접속사의 선택 - 형태적 접근","It will be a long time before"],"src":"패턴","pp":"패턴편 II 78쪽","o":["when Harris comes to the reality","when Harris will come to the reality","that Harris comes to the reality","before Harris comes to the reality"]},{"id":"P413","c":9,"s":3,"k":"blank","lv":0,"t":"부사절접속사의 선택 - 의미적 접근","q":"________, the Inuit people were under the misapprehension that they were the only people in the world.","a":0,"e":"'유럽 탐험가들과 처음 만나기 전까지 자기들만 있다고 착각했다'는 뜻이야.¶~할 때까지는 Until.¶After, Since를 쓰면 만난 뒤에도 착각했다는 이상한 뜻이 돼.","h":["패턴: 부사절접속사의 선택 - 의미적 접근","Until = ~할 때까지"],"src":"패턴","pp":"패턴편 II 79쪽","o":["Until European explorers first made contact with them in the early 1800s.","After European first explorers made contact with them in the early 1800s.","Although explorers made first contact with them in the early 1800s.","Since first explorers made contact with them in the early 1800s."]},{"id":"9-07","c":9,"s":3,"k":"blank","lv":1,"t":"until절의 시제","q":"I'll wait here until she ___ back.","a":0,"h":["until절은 시간 부사절이야.","시간 부사절에서는 will을 못 써."],"e":"until(~할 때까지)도 시간 부사절이라 will을 쓰지 않아.¶until she comes back (그녀가 돌아올 때까지).¶주절 I'll wait가 이미 미래를 말해 줘.","o":["comes","will come","came","would come"],"src":"연습"},{"id":"9-08","c":9,"s":3,"k":"blank","lv":2,"t":"It was not until ~ that","q":"It was not until he came home ___ he realized he had lost his wallet.","o":["that","when","then","which"],"a":0,"h":["not A until B를 강조구문으로 바꾼 형태야.","It was ~ that"],"e":"It was not until A that B = A하고 나서야 B했다.¶It was not until he came home that he realized ~ (집에 오고 나서야 지갑 잃어버린 걸 알았다).¶강조구문이라 that이 와야 해.","src":"연습"},{"id":"9-09","c":9,"s":3,"k":"blank","lv":2,"t":"No sooner ~ than","q":"No sooner had he arrived ___ it began to rain.","a":0,"h":["'~하자마자 …하다' 구문이야.","no sooner는 비교급 꼴이야."],"e":"No sooner had + 주어 + p.p. than ~ = ~하자마자 …했다.¶No sooner had he arrived than it began to rain.¶sooner(비교급)의 짝은 than.","o":["than","when","before","that"],"src":"연습"},{"id":"9-10","c":9,"s":3,"k":"err","lv":3,"t":"Hardly ~ when","q":"Hardly [had] she [closed] the door [than] the phone [rang].","a":2,"x":"when (또는 before)","h":["Hardly와 짝이 되는 접속사를 떠올려 봐.","than은 no sooner의 짝이야."],"e":"Hardly(Scarcely) had + 주어 + p.p. when(before) ~ = ~하자마자 …했다.¶Hardly had she closed the door when the phone rang.¶than은 No sooner와만 짝이야.","src":"연습"},{"id":"P393","c":9,"s":4,"k":"blank","lv":0,"t":"명사의 접속사 전용","q":"As you may know, that is _______ the elephants lives more than a hundred years.","a":2,"e":"the way + 문장 = ~하는 방식, ~하는 것.¶that is the way the elephant lives ~ (그게 코끼리가 사는 방식이다).¶the way how는 같이 못 쓰고, what은 뒤가 불완전해야 해.","h":["패턴: 타품사의 접속사 전용","the way가 접속사처럼"],"src":"패턴","pp":"패턴편 II 75쪽","o":["which","what","the way","the way how"]},{"id":"P394","c":9,"s":4,"k":"blank","lv":0,"t":"전명구의 접속사 전용","q":"Advertising is distinguished from other forms of communication _______ the advertiser pays for the message to be delivered.","a":1,"e":"in that + 완전한 문장 = ~라는 점에서.¶광고는 광고주가 돈을 낸다는 점에서 다른 소통과 구별된다.¶owing to는 뒤에 명사가 와야 하고, which는 뒤가 불완전해야 해.","h":["패턴: 타품사의 접속사 전용","in that = ~라는 점에서"],"src":"패턴","pp":"패턴편 II 75쪽","o":["which","in that","owing to","how"]},{"id":"P395","c":9,"s":4,"k":"blank","lv":0,"t":"전명구의 접속사 전용","q":"I'll give you my phone number ______ you need to get in touch with me.","a":2,"e":"in case = ~할 경우에 대비해서.¶I'll give you my number in case you need to get in touch (연락해야 할 경우를 대비해).¶unless는 '~하지 않으면'이라 뜻이 반대가 돼.","h":["패턴: 타품사의 접속사 전용","in case = ~할 경우에 대비해"],"src":"패턴","pp":"패턴편 II 75쪽","o":["otherwise","unless","in case","so that"]},{"id":"P396","c":9,"s":4,"k":"blank","lv":0,"t":"분사의 접속사 전용","q":"We were instructed to disable the trigger device _______ there be any indication of system malfunction.","a":0,"e":"빈칸 뒤 there be(원형)가 단서야. 원형 앞에 올 수 있는 건 조동사 should.¶should there be any indication = if there should be any indication.¶if, in case는 뒤에 there is처럼 시제 있는 동사가 와야 해.","h":["패턴: 타품사의 접속사 전용","should 도치"],"src":"패턴","pp":"패턴편 II 75쪽","o":["should","if","in case","provided that"]},{"id":"9-11","c":9,"s":4,"k":"blank","lv":2,"t":"as와 like","q":"In 1939, ___ in 1914, everybody seemed to want war.","o":["as","like","such as","so"],"a":0,"h":["빈칸 뒤에 명사가 아니라 전치사구(in 1914)가 와.","like는 전치사라 뒤에 명사가 와야 해."],"e":"빈칸 뒤가 명사가 아니라 in 1914(전치사구)야.¶like는 전치사라 뒤에 명사가 와야 해. 전치사구·절 앞에서 '~처럼'은 접속사 as.¶as in 1914 = 1914년에 그랬던 것처럼.","src":"연습"},{"id":"P414","c":10,"s":0,"k":"blank","lv":0,"t":"영어문장에는 동사는 1개","q":"Eva Le Callienne __________ the civic Repertory Theatre in New York City.","a":0,"e":"뼈대: Eva Le Callienne ___ the Theatre. 주어 뒤에 동사가 없어.¶영어 문장에는 동사가 꼭 하나 있어야 해. 동사 두 개를 and로 이은 founded and directed.¶who founded는 관계절이라 본동사가 안 되고, to found, founding은 준동사야.","h":["패턴: 영어문장에는 동사는 1개","문장에는 동사가 필요"],"src":"패턴","pp":"패턴편 II 82쪽","o":["founded and directed","who founded and directed","to found and direct","founding and directing"]},{"id":"P415","c":10,"s":0,"k":"blank","lv":0,"t":"'준동사'를 쓸지, '접속사 + 동사'를 쓸지 애매할 경우에는 '시제'를 확인","q":"The man pursued the thief, __________.","a":1,"e":"앞 문장 The man pursued the thief에 이미 동사(pursued)가 있어. 접속사 없이 동사를 또 쓸 수 없어.¶그래서 분사구문 finally catching him (그리고 결국 잡았다).¶and catch는 시제가 안 맞고(pursued와 맞추려면 caught), caught him만 쓰면 접속사가 없어.","h":["패턴: '준동사'를 쓸지, '접속사 + 동사'를 쓸지 애매할 경우에는 '시제'를 확인","분사구문"],"src":"패턴","pp":"패턴편 II 82쪽","o":["and finally catch him","finally catching him","caught him","catch him"]},{"id":"P416","c":10,"s":0,"k":"blank","lv":0,"t":"'준동사'를 쓸지, '접속사 + 동사'를 쓸지 애매할 경우에는 '시제'를 확인","q":"With the production of A Raisin in the Sun, Lorraine Hansberry became the first Black woman ________ a play on Broadway.","a":1,"e":"the first(최초의) + 명사 뒤에는 to부정사가 와서 꾸며.¶the first Black woman to stage a play (연극을 무대에 올린 최초의 흑인 여성).¶to be staged면 그녀가 무대에 올려진다는 이상한 뜻이 돼.","h":["패턴: '준동사'를 쓸지, '접속사 + 동사'를 쓸지 애매할 경우에는 '시제'를 확인","the first + to R"],"src":"패턴","pp":"패턴편 II 82쪽","o":["staged","to stage","who is staging","to be staged"]},{"id":"P417","c":10,"s":0,"k":"blank","lv":0,"t":"‘준동사’를 쓸지, ‘접속사 + 동사’를 쓸지 애매할 경우에는 ‘주체’를 확인","q":"The most common form of candle is a hard cylinder of paraffin with a wick ________ through its center.","a":2,"e":"with + 명사 + 분사 = ~가 ~한 채로.¶with a wick running through its center (심지가 가운데를 관통한 채로). 심지가 '관통하는' 능동이라 -ing.¶and runs는 주어가 맞지 않아(cylinder가 관통하는 게 아니라 wick).","h":["패턴: ‘준동사’를 쓸지, ‘접속사 + 동사’를 쓸지 애매할 경우에는 ‘주체’를 확인","with + O + -ing"],"src":"패턴","pp":"패턴편 II 82쪽","o":["and run","runs","running","and runs"]},{"id":"P418","c":10,"s":0,"k":"blank","lv":0,"t":"‘동사’를 쓸지, ‘준동사’를 쓸지 애매할 경우","q":"Experiences that Lillias Underwood had while making charity visits to invalids in Chicago hospitals ________ decide to study medicine in preparation for a missionary career.","a":3,"e":"Experiences that ~ hospitals까지가 긴 주어야. 아직 본동사가 없어.¶그래서 동사 helped: Experiences ~ helped her decide to study medicine.¶help + 목적어 + 원형(decide). to help, helping은 동사가 아니라 안 돼.","h":["패턴: ‘동사’를 쓸지, ‘준동사’를 쓸지 애매할 경우","주어 Experiences의 동사"],"src":"패턴","pp":"패턴편 II 82쪽","o":["to help her","helping to","she helped","helped her"]},{"id":"P419","c":10,"s":0,"k":"blank","lv":0,"t":"여러 가지 준동사가 나올 경우에는 준동사의 ‘능·수동형’을 먼저 확인","q":"Human nature is not a machine ________ after a model.","a":1,"e":"a machine을 꾸미는 to부정사야. 인간 본성은 모델에 따라 '만들어지는' 기계가 아니라는 뜻.¶
