":"10-02","c":10,"s":0,"k":"err","lv":3,"t":"병치되는 부정사","q":"He continued [to search], [to explore], and [expand] the theme [without rest].","a":2,"x":"to expand","h":["to가 앞에 몇 번 쓰였는지 세어 봐.","to를 첫 번째에만 쓰든지, 모두에 쓰든지 통일해."],"e":"to부정사 여러 개를 나열할 때는 to를 첫 번째에만 쓰거나, 전부에 써야 해.¶to search, to explore, and to expand (전부) 또는 to search, explore, and expand (첫 번째만).¶둘을 섞어서 앞 두 개만 to를 쓰면 틀려.","src":"연습"},{"id":"P428","c":10,"s":1,"k":"err","lv":0,"t":"준동사의 필요성 - 주어자리","q":"Instead of [sticking to] one study [location,] [simply alternate] the room [where a person] studies improves retention.","a":2,"e":"뼈대: ___ the room improves retention. (방을 바꾸는 것이 기억력을 높인다)¶improves의 주어 자리라 동명사 alternating이 필요해.¶alternate(동사원형)는 주어 자리에 못 와.","h":["패턴: 준동사의 명사적 용법 - 주어자리","동명사 주어"],"src":"패턴","pp":"패턴편 II 89쪽","x":"simply alternating"},{"id":"P429","c":10,"s":1,"k":"err","lv":0,"t":"준동사의 필요성 - 주어자리","q":"[Offered] movies [during flights] is one way airlines [make sure] that passengers are [not bored.]","a":0,"e":"'기내에서 영화를 제공하는 것'이 주어야. 항공사가 영화를 '제공하는' 능동.¶능동 동명사 Offering movies.¶Offered는 과거분사라 주어 자리에 못 와.","h":["패턴: 준동사의 명사적 용법 - 주어자리","동명사 주어 + 능동"],"src":"패턴","pp":"패턴편 II 89쪽","x":"Offering"},{"id":"P430","c":10,"s":1,"k":"err","lv":0,"t":"부정사의 필요성 - 가주어·진주어 자리","q":"[It's] easy [require] neckties, harder to roll back policies. Clinton's high approval rating and Bush's loss of the popular vote [make] drastic ideological shifts [nearly] impossible.","a":1,"e":"It's easy ___ neckties에서 It은 가짜 주어야. 진짜 주어는 to부정사로 뒤에 와.¶It's easy to require neckties (넥타이를 요구하기는 쉽다).¶뒤의 harder to roll back과도 모양이 맞아.","h":["패턴: 준동사의 명사적 용법 - 주어자리","It's easy to R"],"src":"패턴","pp":"패턴편 II 89쪽","x":"to require"},{"id":"P431","c":10,"s":1,"k":"err","lv":0,"t":"부정사의 필요성 - 가주어·진주어 자리","q":"[When] the costs of delays and uncertainties [are added into] their calculations, [both] government and private industry often find that it pays [for canceling] projects that would [otherwise] be profitable.","a":3,"e":"it pays to R = ~하는 것이 이득이다. it은 가짜 주어고 to부정사가 진짜 주어야.¶it pays to cancel projects (프로젝트를 취소하는 게 이득이다).¶for canceling은 이 구문에서 쓰지 않아.","h":["패턴: 준동사의 명사적 용법 - 주어자리","it pays to R"],"src":"패턴","pp":"패턴편 II 89쪽","x":"to cancel"},{"id":"P432","c":10,"s":1,"k":"err","lv":0,"t":"준동사 주어의 단수 취급","q":"We expected politicians [to place] a positive spin on economic news, but to insist that things [are] going great when many people have personal experience [to] the contrary [seem] foolish.","a":3,"e":"뼈대: to insist that ~ seem foolish. 주어가 to insist ~ (to부정사구)야.¶to부정사·동명사 주어는 단수 취급해서 seems.¶사이에 낀 many people, experience 같은 명사에 속지 마.","h":["패턴: 준동사의 명사적 용법 - 주어자리","to부정사 주어는 단수"],"src":"패턴","pp":"패턴편 II 89쪽","x":"seems"},{"id":"P433","c":10,"s":1,"k":"err","lv":0,"t":"준동사 주어의 단수 취급","q":"Determining parts of speech [are] nothing more than [determining] the function a particular word has in a sentence. The usefulness of [being] able to identify parts of speech [is] that we will be able to discuss the elements of the sentence more [easily.]","a":0,"e":"주어는 Determining parts of speech(품사를 결정하는 것), 동명사구야.¶동명사 주어는 단수 취급이라 are가 아니라 is.¶parts라는 복수 명사가 가까이 있어도 중심은 Determining이야.","h":["패턴: 준동사의 명사적 용법 - 주어자리","동명사 주어는 단수"],"src":"패턴","pp":"패턴편 II 89쪽","x":"is"},{"id":"P434","c":10,"s":1,"k":"err","lv":0,"t":"준동사 주어의 단수 취급","q":"[Neighboring] states [often] [signs] trade agreement [with] one another.","a":2,"e":"주어 Neighboring states(이웃한 주들)가 복수야.¶그래서 동사는 signs가 아니라 sign.¶Neighboring은 '이웃한'이라는 분사(형용사)일 뿐 주어 중심이 아니야.","h":["패턴: 준동사의 명사적 용법 - 주어자리","주어 states는 복수"],"src":"패턴","pp":"패턴편 II 89쪽","x":"sign"},{"id":"P435","c":10,"s":1,"k":"err","lv":0,"t":"부정사의 선택","q":"Space exploration is [so costly] that [no single] nation [can] hope [sustaining] a major program indefinitely.","a":3,"e":"hope는 뒤에 to부정사를 목적어로 받아.¶can hope to sustain a program (계속 유지하기를 바랄 수 있다).¶hope -ing는 안 돼.","h":["패턴: 준동사의 명사적 용법 - 목적어자리","hope + to R"],"src":"패턴","pp":"패턴편 II 91쪽","x":"to sustain"},{"id":"P436","c":10,"s":1,"k":"err","lv":0,"t":"동명사의 선택","q":"The director of the department [advised] the new employees to avoid [to waste] time [studying] methods that were [so] out-of-date.","a":1,"e":"avoid(피하다)는 뒤에 동명사만 받아.¶avoid wasting time (시간 낭비를 피하다).¶같은 부류: enjoy, mind, finish, deny, postpone, quit, consider.","h":["패턴: 준동사의 명사적 용법 - 목적어자리","avoid + -ing"],"src":"패턴","pp":"패턴편 II 91쪽","x":"wasting"},{"id":"P437","c":10,"s":1,"k":"err","lv":0,"t":"동명사의 부정사의 의미와 시점 구별선택","q":"The weather bureau is predicting rain, [so] don't forget [taking] your umbrella when you [leave] [for] home.","a":1,"e":"forget to R = (앞으로) ~할 것을 잊다 / forget -ing = (과거에) ~했던 것을 잊다.¶나갈 때 '가져갈 것을' 잊지 말라는 앞으로의 일이라 to take.¶taking이면 이미 가져간 걸 잊는다는 이상한 뜻이 돼.","h":["패턴: 준동사의 명사적 용법 - 목적어자리","forget + to R = 할 일을 잊다"],"src":"패턴","pp":"패턴편 II 91쪽","x":"to take"},{"id":"P438","c":10,"s":1,"k":"err","lv":0,"t":"동명사의 부정사의 의미와 시점 구별선택","q":"[Being] a good [flight attendant] means [to make] your passengers feel [relaxed.]","a":2,"e":"mean -ing = ~을 의미하다 / mean to R = ~할 작정이다.¶좋은 승무원이 된다는 건 승객을 편하게 '해 주는 것을 의미한다'라 making.¶주어 Being a flight attendant(동명사)와도 모양이 맞아.","h":["패턴: 준동사의 명사적 용법 - 목적어자리","mean -ing = ~을 의미하다"],"src":"패턴","pp":"패턴편 II 91쪽","x":"making"},{"id":"P448","c":10,"s":1,"k":"blank","lv":0,"t":"부정만 쓰는 경우","q":"A: Is Marsha still here? B: No, she was the first ________.","a":0,"e":"the first(첫 번째) 뒤에는 to부정사가 와서 꾸며.¶she was the first to leave (그녀가 제일 먼저 떠났다).¶leaving, left는 이 자리에 쓰지 않아.","h":["패턴: 준동사의 형용사적 용법 구별 - 후치수식(주술관계)","the first + to R"],"src":"패턴","pp":"패턴편 II 97쪽","o":["to leave","leaving","left","to be left"]},{"id":"P452","c":10,"s":1,"k":"blank","lv":0,"t":"부정사·분사를 구분하는 경우","q":"Pumped by the heart, the blood delivers the food and the oxygen _______ combine in the cells to produce energy.","a":1,"e":"the food and the oxygen ___ combine in the cells에서 combine의 주어가 비어 있어.¶주격 관계대명사 that: the oxygen that combine(s) ~ (세포에서 결합하는 산소).¶to, of, and로는 문장이 이어지지 않아.","h":["패턴: 준동사의 형용사적 용법 구별 - 후치수식(주술관계)","주격 관계대명사 that"],"src":"패턴","pp":"패턴편 II 97쪽","o":["to","that","of","and"]},{"id":"P453","c":10,"s":1,"k":"err","lv":0,"t":"부정사·분사를 구분하는 경우 - 주체비교","q":"In order [for people] who [spoke] different languages [engaging] in trade with each other, they often developed a [simplified] language called pidgin.","a":2,"e":"in order for A to R = A가 ~하기 위해서.¶in order for people ~ to engage in trade (사람들이 교역을 하기 위해서).¶for 뒤 의미상 주어 다음에는 to부정사가 와야 해.","h":["패턴: 준동사의 형용사적 용법 구별 - 후치수식(주술관계)","in order for + 의미상 주어 + to R"],"src":"패턴","pp":"패턴편 II 97쪽","x":"to engage"},{"id":"P454","c":10,"s":1,"k":"err","lv":0,"t":"부정사·분사를 구분하는 경우 - 주체비교","q":"[No] bank keeps enough cash [paying] all [its] depositors in full at [one time.]","a":1,"e":"enough + 명사 + to R = ~할 만큼 충분한 (명사).¶enough cash to pay all its depositors (모든 예금자에게 지급할 만큼 충분한 현금).¶paying은 이 구문에서 쓰지 않아.","h":["패턴: 준동사의 형용사적 용법 구별 - 후치수식(주술관계)","enough + 명사 + to R"],"src":"패턴","pp":"패턴편 II 97쪽","x":"to pay"},{"id":"P468","c":10,"s":1,"k":"err","lv":0,"t":"be to ≒ will/ should","q":"Paul's aunt said that if she were [late] he was [to wait] [for] her at the airport for at least half [a] hour.","a":3,"e":"hour는 h가 소리 나지 않아서 '아워'로 시작해. 모음 소리라 a가 아니라 an.¶half an hour (30분).¶같은 예: an honest man, an hour, a university(유 소리라 a).","h":["패턴: 보어자리의 부정사","half an hour"],"src":"패턴","pp":"패턴편 II 105쪽","x":"an"},{"id":"P469","c":10,"s":1,"k":"blank","lv":0,"t":"be to ≒ will/ should","q":"The question whether he _______ or not cannot be decided.","a":2,"e":"be to blame = 책임이 있다, 탓이다.¶형태는 능동(to blame)인데 뜻은 수동(비난받아야 할)인 특별한 표현이야.¶whether he is to blame or not (그가 책임이 있는지 없는지).","h":["패턴: 보어자리의 부정사","be to blame"],"src":"패턴","pp":"패턴편 II 105쪽","o":["is to blamed","is blamed","is to blame","is to be blame"]},{"id":"P470","c":10,"s":1,"k":"blank","lv":0,"t":"시간순서로 구별하기","q":"Mandela proved the saying right ______ his morals or his fight for freedom.","a":2,"e":"by + 동명사 = ~함으로써. 부정어 never는 동명사 앞에 와.¶by never doubting his morals (신념을 결코 의심하지 않음으로써).¶by doubting never는 never 위치가 틀려.","h":["패턴: 준동사의 부사적 용법","by never doubting"],"src":"패턴","pp":"패턴편 II 107쪽","o":["never to doubt","to doubt never","by never doubting","by doubting never"]},{"id":"P471","c":10,"s":1,"k":"blank","lv":0,"t":"시간순서로 구별하기","q":"________ I hugged her tightly in my arms.","a":2,"e":"빈칸 뒤 I hugged her가 주절이야. 앞에는 분사구문이 와야 해.¶Hardly knowing what I was doing (내가 뭘 하는지도 거의 모른 채) 그녀를 꼭 안았다.¶know, knew는 동사라 접속사 없이 못 와.","h":["패턴: 준동사의 부사적 용법","분사구문 Hardly knowing"],"src":"패턴","pp":"패턴편 II 107쪽","o":["Hardly know what I was doing","Hardly to know what I was doing","Hardly knowing what I was doing","Hardly knew what I doing"]},{"id":"P472","c":10,"s":1,"k":"blank","lv":0,"t":"형태로 구별하기","q":"__________ bricks, workers press clay into blocks and bake them to the requisite hardness in a kiln.","a":1,"e":"벽돌을 '만들기 위해' 점토를 누른다는 목적이야.¶목적의 to부정사 To make bricks (벽돌을 만들기 위해).¶Made, Being made는 일꾼들이 '만들어진다'는 뜻이 돼.","h":["패턴: 준동사의 부사적 용법","목적의 To R"],"src":"패턴","pp":"패턴편 II 107쪽","o":["Made","To make","Being made","The making of"]},{"id":"P473","c":10,"s":1,"k":"blank","lv":0,"t":"부정사의 선택","q":"Do you have _______ a vacation right now?","a":1,"e":"enough + 명사 + to R = ~할 만큼 충분한 (명사).¶enough money to take a vacation (휴가를 갈 만큼 충분한 돈).¶too money는 틀린 표현이야.","h":["패턴: 부정사의 선택","enough + 명사 + to R"],"src":"패턴","pp":"패턴편 II 109쪽","o":["enough money for taking","enough money to take","money enough for taking","too money to take"]},{"id":"P474","c":10,"s":1,"k":"err","lv":0,"t":"부정사의 선택","q":"Doctors [often] study records [of complex] operations in order [for improving] their [knowledge and skill.]","a":2,"e":"in order to + 동사원형 = ~하기 위해서.¶in order to improve their knowledge.¶in order for -ing는 틀려. for는 의미상 주어를 쓸 때만(in order for A to R).","h":["패턴: 부정사의 선택","in order to R"],"src":"패턴","pp":"패턴편 II 109쪽","x":"to improve"},{"id":"P475","c":10,"s":1,"k":"err","lv":0,"t":"부정사의 선택","q":"Although in some ways I'd rather [stay out] of the pretest [myself.] I have no choice but [will support] my [fellow] union members.","a":2,"e":"have no choice but to R = ~할 수밖에 없다.¶I have no choice but to support my union members.¶will support는 이 자리에 쓰지 않아.","h":["패턴: 부정사의 선택","have no choice but to R"],"src":"패턴","pp":"패턴편 II 109쪽","x":"to support"},{"id":"10-03","c":10,"s":1,"k":"blank","lv":2,"t":"의문사 + to부정사","q":"Do you understand what ___?","o":["to do","to do it","you should do it","doing"],"a":0,"h":["what이 do의 목적어 역할을 해.","목적어가 또 있으면 안 돼."],"e":"what to do = what I should do (무엇을 해야 할지).¶what이 이미 do의 목적어라 it을 또 쓰면 목적어가 겹쳐.¶의문사 + to부정사로 간단히 줄인 모양이야.","src":"연습"},{"id":"10-04","c":10,"s":1,"k":"blank","lv":2,"t":"형용사적 용법과 전치사","q":"This skirt has no pocket to put things ___.","a":0,"h":["put things in a pocket을 떠올려 봐.","명사를 꾸미는 to부정사 끝에 전치사가 남아."],"e":"a pocket을 꾸미는 to부정사야. 원래는 put things in a pocket.¶그래서 끝에 전치사 in이 남아: a pocket to put things in.¶같은 예: a house to live in, a chair to sit on.","o":["in","on","at","(전치사 없음)"],"src":"연습"},{"id":"P476","c":10,"s":2,"k":"blank","lv":0,"t":"여러 가지 준동사의 경우","q":"_____________, a Form 57 must be completed.","a":3,"e":"주절 주어는 a Form 57(서류)이야. 서류가 일자리에 지원하는 건 아니지.¶To apply for this job처럼 주어 없이 시작하면 주어가 서류가 돼서 틀려.¶주어를 밝힌 절 If you want to apply for this job이 맞아.","h":["패턴: 의미상의 주어를 표시하지 않은 경우","의미상 주어 불일치"],"src":"패턴","pp":"패턴편 II 113쪽","o":["To apply for this job","In order to get his job","Making application for this job","If you want to apply for this job"]},{"id":"P477","c":10,"s":2,"k":"blank","lv":0,"t":"부정사의 경우","q":"To succeed in a difficult task, ____________.","a":0,"e":"To succeed in a difficult task(어려운 일에 성공하려면)의 주체는 사람이야.¶그래서 주절 주어도 사람 one: one needs to be persistent.¶persistence(끈기)가 성공하려는 게 아니니까 B, D는 틀려.","h":["패턴: 의미상의 주어를 표시하지 않은 경우","to부정사 의미상 주어 일치"],"src":"패턴","pp":"패턴편 II 113쪽","o":["one needs to be persistent","persistence is needed","you need be a persistent person","persistence is what one needs"]},{"id":"P481","c":10,"s":2,"k":"blank","lv":0,"t":"부정사 - ‘for'의 선택","q":"_________ a state to survive more than a fleeting historical moment, it must have the loyalty of its residents.","a":1,"e":"for + 의미상 주어 + to R = (누가) ~하기 위해서는.¶For a state to survive ~ (국가가 살아남으려면).¶If를 쓰려면 If a state is to survive가 돼야 해.","h":["패턴: 의미상의 주어를 표시하는 경우","For + 의미상 주어 + to R"],"src":"패턴","pp":"패턴편 II 115쪽","o":["If","For","Then","Of"]},{"id":"P482","c":10,"s":2,"k":"err","lv":0,"t":"부정사 - ‘to R'의 선택","q":"For [most] social engagements, it [often causes] inconvenience [for] a guest [coming] either earlier or later than the suggested hour.","a":3,"e":"it causes inconvenience for a guest ___ 에서 it은 가짜 주어야.¶진짜 주어는 to부정사: for a guest to come early or late (손님이 일찍 혹은 늦게 오는 것).¶coming은 가짜 주어 it의 짝이 아니야.","h":["패턴: 의미상의 주어를 표시하는 경우","가주어 it + to R"],"src":"패턴","pp":"패턴편 II 115쪽","x":"to come"},{"id":"P483","c":10,"s":2,"k":"blank","lv":0,"t":"부정사 - ‘of'의 선택","q":"Was it wrong _______ me to have purchased a gift that she wouldn`t be able to return?","a":1,"e":"wrong, kind, foolish처럼 사람을 평가하는 형용사 뒤 의미상 주어는 of + 사람.¶Was it wrong of me to have purchased a gift? (내가 선물을 산 게 잘못이었나?)¶평가가 아닌 형용사(easy, hard)면 for.","h":["패턴: 의미상의 주어를 표시하는 경우","wrong + of"],"src":"패턴","pp":"패턴편 II 115쪽","o":["on","of","for","in"]},{"id":"P486","c":10,"s":2,"k":"err","lv":0,"t":"부정사의 경우","q":"The grenade is a small bomb [made] to [be thrown] by hand or [to shoot] from a [modified rifle].","a":2,"e":"수류탄은 손으로 '던져지거나' 소총에서 '발사되는' 대상이야.¶to be thrown or to be shot으로 둘 다 수동이어야 해.¶to shoot면 수류탄이 무언가를 쏜다는 뜻이 돼.","h":["패턴: 준동사의 태","수동 부정사 병치"],"src":"패턴","pp":"패턴편 II 117쪽","x":"to be shot"},{"id":"P487","c":10,"s":2,"k":"blank","lv":0,"t":"부정사의 경우","q":"When Mary was inviting people to her party, Tom was annoyed to _______.","a":3,"e":"파티 초대할 때 Tom이 '잊혀진' 것에 화가 난 거야.¶잊혀진 게 화나기 전이고 수동이라 to have been forgotten.¶to forget이면 Tom이 누군가를 잊은 게 돼.","h":["패턴: 준동사의 태","완료 수동 부정사"],"src":"패턴","pp":"패턴편 II 117쪽","o":["forget","have forgotten","be forgetting","have been forgotten"]},{"id":"P494","c":10,"s":2,"k":"blank","lv":0,"t":"완료부정사가 나올 수 없는 자리","q":"Vietnamese immigrants began ________ to the United States in large numbers in the late of the 20th century.","a":1,"e":"begin은 뒤에 to부정사(또는 동명사)를 받아.¶began to come to the U.S. (미국에 오기 시작했다).¶to have come은 시작하기 전의 일을 말해서 뜻이 안 맞아.","h":["패턴: 부정사의 완료형","begin to R"],"src":"패턴","pp":"패턴편 II 119쪽","o":["come","to come","to have come","have come"]},{"id":"P495","c":10,"s":2,"k":"blank","lv":0,"t":"완료부정사가 나올 수 없는 자리","q":"______ a dancer myself, I have excellent posture.","a":0,"e":"As I am a dancer myself를 분사구문으로 바꾸면 Being a dancer myself.¶내가 무용수이기 때문에 자세가 좋다는 이유야.¶To be는 '~하기 위해'라 이유가 안 돼.","h":["패턴: 부정사의 완료형","Being = As I am"],"src":"패턴","pp":"패턴편 II 119쪽","o":["Being","To be","Having be","To have been"]},{"id":"P496","c":10,"s":2,"k":"err","lv":0,"t":"완료부정사가 나올 수 없는 자리","q":"I had hoped [to have learned] French before my trip [to] Paris, but I [didn't have] any [extra money] for a course.","a":0,"e":"had hoped to R = (과거에) ~하기를 바랐지만 이루지 못했다.¶had hoped 자체에 '못 했다'는 뜻이 있어서 뒤는 그냥 to learn.¶to have learned를 붙이면 시간이 겹쳐서 틀려.","h":["패턴: 부정사의 완료형","had hoped to R"],"src":"패턴","pp":"패턴편 II 119쪽","x":"to learn"},{"id":"P497","c":10,"s":2,"k":"err","lv":0,"t":"완료형 준동사가 나올 수 있는 자리 - 시점 구분 하기","q":"China [has been aggressively researching] tests and a possible vaccine for SARS, [which] is believed to [originate] in Guangdong in [late 2002].","a":2,"e":"사스는 2002년(과거)에 발생했고, 그렇게 '믿어지는' 건 지금이야.¶믿는 시점(현재)보다 앞선 일이라 완료부정사 to have originated.¶구별법: 본동사보다 앞선 일 → to have p.p.","h":["패턴: 부정사의 완료형","believed보다 앞선 일"],"src":"패턴","pp":"패턴편 II 119쪽","x":"have originated"},{"id":"P498","c":10,"s":2,"k":"err","lv":0,"t":"완료형 준동사가 나올 수 있는 자리 - 시점 구분 하기","q":"[Far from being] an ambitious entertainer who [played down] his Catholic roots under a repressive Elizabethan regime, Shakespeare is said [to take] deliberate risks [each time] he took up his pen.","a":2,"e":"셰익스피어가 위험을 감수한 건 과거고, '~라고 말해지는' 건 지금이야.¶지금보다 앞선 일이라 is said to have taken.¶뒤의 he took up his pen(과거)도 단서야.","h":["패턴: 부정사의 완료형","is said보다 앞선 일"],"src":"패턴","pp":"패턴편 II 119쪽","x":"to have taken"},{"id":"P499","c":10,"s":2,"k":"blank","lv":0,"t":"완료형 준동사가 나올 수 있는 자리 - 시점 구분 하기","q":"When I arrived in Seoul, I didn't have any money. I'm lucky ______ a job as quickly as I did.","a":2,"e":"일자리를 구한 건 이미 지난 일이고, 운이 좋다는 건 지금이야.¶지금보다 앞선 일이라 to have found (구했다니 운이 좋다).¶to found는 '설립하다'라 다른 동사야.","h":["패턴: 부정사의 완료형","lucky보다 앞선 일"],"src":"패턴","pp":"패턴편 II 119쪽","o":["to found","to find","to have found","I was found"]},{"id":"P502","c":10,"s":2,"k":"blank","lv":0,"t":"어순","q":"In recent speeches, the officials pledged _______.","a":0,"e":"부정어 not은 to 앞에 와: not to let.¶let 뒤에는 원형(to 없이): let that happen.¶not to let that happen (그런 일이 일어나지 않게 하겠다고).","h":["패턴: 어순","부정사의 부정"],"src":"패턴","pp":"패턴편 II 121쪽","o":["not to let that happen","to not let that to happen","not to let that to happen","to not let that happen"]},{"id":"10-05","c":10,"s":2,"k":"err","lv":2,"t":"부정사의 의미상 주어 일치","q":"[To inspect] the car, [a special light] [is needed] [in] the garage.","a":1,"x":"you need a special light (주어를 사람으로)","h":["차를 점검하는 주체가 누구야?","문두의 to부정사 주어는 주절 주어와 같아야 해."],"e":"To inspect the car(차를 점검하려면)의 주체는 사람이야.¶그런데 주절 주어가 a special light(불빛)라 불빛이 차를 점검하는 꼴이 돼.¶주어를 사람으로: To inspect the car, you need a special light.","src":"연습"},{"id":"10-06","c":10,"s":2,"k":"blank","lv":3,"t":"난이형용사 구문과 전치사","q":"This river is dangerous ___.","o":["to swim","to swim in","to swim in it","for swimming it"],"a":1,"h":["swim in the river를 생각해 봐.","주어가 to부정사의 목적어 역할을 하니까 목적어를 또 쓰지 않아."],"e":"swim in the river에서 the river가 문장 주어로 나간 구조야.¶This river is dangerous to swim in. 전치사 in은 남겨야 해.¶주어가 이미 강이라 it을 또 쓰면 겹쳐.","src":"연습"},{"id":"10-07","c":10,"s":2,"k":"err","lv":2,"t":"난이형용사 구문의 목적어","q":"The bumper [is] difficult [for me] [to remove it] [without] tools.","a":2,"h":["주어 The bumper가 무엇의 목적어였는지 생각해 봐.","It is difficult for me to remove the bumper."],"e":"It is difficult for me to remove the bumper에서 the bumper가 주어로 나간 구조야.¶The bumper is difficult for me to remove. remove 뒤를 비워 둬야 해.¶it을 쓰면 범퍼가 두 번 들어가.","x":"to remove","src":"연습"},{"id":"10-08","c":10,"s":2,"k":"blank","lv":2,"t":"의미상 주어 of","q":"It was very kind ___ you to help me.","o":["of","for","to","with"],"a":0,"h":["kind가 사람의 성격을 평가하는 형용사야.","성격 형용사 + of + 목적격"],"e":"kind처럼 사람의 성격을 칭찬·평가하는 형용사 뒤 의미상 주어는 of.¶It was very kind of you to help me.¶평가가 아닌 형용사(easy, necessary)면 for.","src":"연습"},{"id":"10-09","c":10,"s":2,"k":"blank","lv":3,"t":"완료부정사","q":"She seems ___ rich when she was young.","a":0,"h":["seems는 현재, when she was young은 과거야.","본동사보다 앞선 시점이면 완료부정사."],"e":"seems는 지금, 부자였던 건 어렸을 때(과거)야.¶본동사보다 앞선 일이라 완료부정사 to have been.¶= It seems that she was rich when she was young.","o":["to have been","to be","being","to had been"],"src":"연습"},{"id":"10-10","c":10,"s":2,"k":"err","lv":2,"t":"부정사의 부정","q":"She [seems] [to not have noticed] me [at] a [glance].","a":1,"h":["부정어 not의 위치를 봐.","부정사의 부정은 to 앞에."],"e":"to부정사를 부정할 때 not은 to 바로 앞.¶not to have noticed (알아채지 못했던 것 같다).¶to not은 시험에서 틀린 것으로 봐.","x":"not to have noticed","src":"연습"},{"id":"P504","c":10,"s":3,"k":"blank","lv":0,"t":"대부정사","q":"“Bobby, can you type my paper?” “I don't have time ________ right now.”","a":1,"e":"I don't have time to (type your paper) right now에서 반복되는 부분을 지우고 to만 남긴 거야.¶이걸 대부정사라고 해.¶to do를 쓰려면 목적어 it이 필요해: to do it.","h":["패턴: 기타","대부정사"],"src":"패턴","pp":"패턴편 II 123쪽","o":["to do","to","to doing","having reviewed"]},{"id":"P505","c":10,"s":3,"k":"blank","lv":0,"t":"대부정사","q":"One of Franklin's good ideas was to set up a club where people could share their books. Anyone __________ could stop in and read the books.","a":2,"e":"Anyone who wanted to (read the books)에서 반복되는 부분을 지우고 to만 남겼어.¶대부정사: 앞에 나온 동사구의 반복을 피하려고 to만 남기는 것.¶who wanted만 쓰면 무엇을 원했는지가 안 보여.","h":["패턴: 기타","대부정사"],"src":"패턴","pp":"패턴편 II 123쪽","o":["who wanted","who wanted as","who wanted to","who wanted for"]},{"id":"P506","c":10,"s":3,"k":"err","lv":0,"t":"분리부정사","q":"[To completely solve] the problem [requires] more thought [than] we have given [so far].","a":0,"e":"to와 동사원형 사이에 부사를 넣는 걸 분리부정사라고 하고, 시험에서는 틀린 것으로 봐.¶To solve the problem completely (부사는 뒤로).¶일상 영어에선 쓰기도 하지만 편입에선 뒤로 빼는 게 정답이야.","h":["패턴: 기타","분리부정사 피하기"],"src":"패턴","pp":"패턴편 II 123쪽","x":"To solve the problem completely"},{"id":"10-11","c":10,"s":3,"k":"blank","lv":2,"t":"대부정사","q":"You can go if you want ___.","o":["to","it","to it","so"],"a":0,"h":["want to go에서 go가 반복돼서 생략된 거야.","동사원형을 빼고 to만 남기는 걸 뭐라고 하지?"],"e":"You can go if you want to (go)에서 반복되는 go를 지우고 to만 남긴 대부정사야.¶if you want to.¶it을 쓰면 '그것을 원하면'이라 뜻이 달라져.","src":"연습"},{"id":"P421","c":11,"s":0,"k":"blank","lv":0,"t":"정관사로 구별","q":"Instead of trying to imitate reality in their works, many artists of the early twentieth century _______ their feelings and ideas in abstract art.","a":2,"e":"뼈대: many artists ___ their feelings. 주어 many artists 뒤에 동사가 없어.¶동사 자리라 began to reveal (드러내기 시작했다).¶in beginning, to begin은 동사가 아니라서 문장이 안 돼.","h":["패턴: 명사와 준동사의 명사적 용법 구별","동사 자리"],"src":"패턴","pp":"패턴편 II 85쪽","o":["in beginning to reveal","revealed the beginning","began to reveal","to begin revealing"]},{"id":"P422","c":11,"s":0,"k":"err","lv":0,"t":"자리로 구별","q":"[Social reformer] Florence Kelly played a key [role in] the 1893 [deciding] of the Illinois legislature [to prohibit] child labor.","a":2,"e":"the 1893 ___ of the Illinois legislature에서 관사(the)와 of 사이는 명사 자리야.¶'결정'이라는 명사 decision.¶deciding(동명사)도 명사 역할은 하지만, decision처럼 원래 명사가 있으면 명사를 써.","h":["패턴: 명사와 준동사의 명사적 용법 구별","the + 명사 + of"],"src":"패턴","pp":"패턴편 II 85쪽","x":"decision"},{"id":"P423","c":11,"s":0,"k":"err","lv":0,"t":"자리로 구별","q":"As Russia [prepared for] its lavish commemoration of the 60th anniversary of [the end] of World War II earlier this month, there [were] predictable calls for the [rehabilitating] of Joseph Stalin.","a":3,"e":"calls for the ___ of Joseph Stalin에서 the와 of 사이는 명사 자리야.¶'복권(명예 회복)'이라는 명사 rehabilitation.¶명사가 따로 있으면 동명사보다 명사가 우선이야.","h":["패턴: 명사와 준동사의 명사적 용법 구별","the + 명사 + of"],"src":"패턴","pp":"패턴편 II 85쪽","x":"rehabilitation"},{"id":"P424","c":11,"s":0,"k":"err","lv":0,"t":"자리로 구별","q":"Maison earned the funds [to construct] the building by [sale] his new ideas [about] growing [potatoes.]","a":1,"e":"by ___ his new ideas에서 전치사 by 뒤에 목적어 his new ideas를 받아야 해.¶명사 sale은 목적어를 직접 받지 못하니 동명사 selling.¶by selling his ideas (아이디어를 팔아서).","h":["패턴: 명사와 준동사의 명사적 용법 구별","전치사 뒤 + 목적어"],"src":"패턴","pp":"패턴편 II 85쪽","x":"selling"},{"id":"11-01","c":11,"s":0,"k":"err","lv":1,"t":"동명사와 명사","q":"We can [examine] something [by] [observation] it [carefully].","a":2,"h":["뒤에 목적어 it이 있어.","목적어를 받을 수 있는 건 명사가 아니라 동명사."],"e":"by ___ it에서 뒤에 목적어 it이 있어.¶명사 observation은 목적어를 바로 받지 못하니 동명사 observing.¶구별법: 뒤에 목적어가 있으면 동명사, 없으면 명사.","x":"observing","src":"연습"},{"id":"11-02","c":11,"s":0,"k":"blank","lv":2,"t":"명사가 있으면 명사","q":"She made a lot of money from her ___.","o":["investment","investing","invest","invested"],"a":0,"h":["빈칸 뒤에 목적어가 없어.","소유격 뒤 목적어 없는 자리에 일반 명사가 있으면 명사가 우선이야."],"e":"her ___ 뒤에 목적어가 없어. '그녀의 투자'라는 뜻만 필요해.¶이럴 땐 원래 명사 investment가 우선이야.¶동명사 investing은 목적어가 필요할 때 써(investing money).","src":"연습"},{"id":"P439","c":11,"s":1,"k":"err","lv":0,"t":"동명사가 필요한 전치사의 목적어자리","q":"A perpetual-motion [machine] could not run [without] [violate] the laws of [thermo-dynamics.]","a":2,"e":"without(전치사) 뒤에는 동명사가 와.¶without violating the laws (법칙을 위반하지 않고).¶violate(원형)는 전치사 뒤에 못 와.","h":["패턴: 준동사의 명사적 용법 - 전치사의 목적어자리","전치사 뒤 동명사"],"src":"패턴","pp":"패턴편 II 93쪽","x":"violating"},{"id":"P440","c":11,"s":1,"k":"err","lv":0,"t":"동명사가 필요한 전치사의 목적어자리","q":"Buyers and sellers may [be scattered] over the whole world and instead of actually [meet] together in a market-place they may [deal with] one another [by] telephone, telegram, cable or letter.","a":1,"e":"instead of(~ 대신에)는 전치사라 뒤에 동명사.¶instead of actually meeting together (실제로 만나는 대신).¶meet(원형)는 전치사 뒤에 못 와.","h":["패턴: 준동사의 명사적 용법 - 전치사의 목적어자리","instead of + 동명사"],"src":"패턴","pp":"패턴편 II 93쪽","x":"meeting"},{"id":"P441","c":11,"s":1,"k":"blank","lv":0,"t":"동명사가 필요한 전치사의 목적어자리","q":"Rather like the ant in an Aesop’s fable, people with thrifty genotypes prepare for hard times by _______ they expend.","a":3,"e":"by(~함으로써) 뒤에는 동명사가 오고, and로 이어지니 둘 다 동명사.¶by consuming and storing more calories than they expend.¶more(비교급)의 짝은 than이야.","h":["패턴: 준동사의 명사적 용법 - 전치사의 목적어자리","by + 동명사 병치"],"src":"패턴","pp":"패턴편 II 93쪽","o":["consumption and storage of more calories that","consume and store more calories than","consuming and store more calories that","consuming and storing more calories than"]},{"id":"P442","c":11,"s":1,"k":"err","lv":0,"t":"동명사가 필요한 전치사 ‘to'의 목적어자리","q":"For the protection of minority languages, it [is required] that people in top government and social services positions [should be] committed [to preserve] the endangered languages and willing to spend [considerable] time, energy and money to do so.","a":2,"e":"be committed to(~에 전념하다)의 to는 전치사야.¶전치사 뒤라 동명사: committed to preserving the languages.¶to부정사 to와 헷갈리기 쉬운 대표 표현이야.","h":["패턴: 준동사의 명사적 용법 - 전치사의 목적어자리","be committed to + -ing"],"src":"패턴","pp":"패턴편 II 93쪽","x":"to preserving"},{"id":"P443","c":11,"s":1,"k":"err","lv":0,"t":"동명사가 필요한 전치사 ‘to'의 목적어자리","q":"[Of course,] a [balanced] diet along with a [regular] program of exercise is the real key [to get] into shape.","a":3,"e":"the key to(~의 열쇠, 비결)의 to는 전치사야.¶그래서 the key to getting into shape (건강해지는 비결).¶같은 부류: the answer to, a solution to.","h":["패턴: 준동사의 명사적 용법 - 전치사의 목적어자리","the key to + -ing"],"src":"패턴","pp":"패턴편 II 93쪽","x":"to getting"},{"id":"P444","c":11,"s":1,"k":"err","lv":0,"t":"동명사의 관용적 표현","q":"Aurelia [did not have] time [to go] to the concert last night, because she was busy [to prepare] [for her trip] to Brazil and Chile.","a":2,"e":"be busy -ing = ~하느라 바쁘다.¶she was busy preparing for her trip.¶be busy to R는 틀린 표현이야.","h":["패턴: 동명사의 관용적 표현","be busy -ing"],"src":"패턴","pp":"패턴편 II 95쪽","x":"preparing"},{"id":"P445","c":11,"s":1,"k":"err","lv":0,"t":"동명사의 관용적 표현","q":"The student [had] difficulty [to write] [a short paragraph] [correctly.]","a":1,"e":"have difficulty -ing = ~하는 데 어려움을 겪다.¶had difficulty (in) writing a short paragraph.¶have difficulty to R는 틀려.","h":["패턴: 동명사의 관용적 표현","have difficulty -ing"],"src":"패턴","pp":"패턴편 II 95쪽","x":"writing (또는 in writing)"},{"id":"P446","c":11,"s":1,"k":"err","lv":0,"t":"동명사의 관용적 표현","q":"[For students] who have trouble [make up] their mind about a major in college, most schools have [an undergraduate] classification simply [called] \"undecided.\"","a":1,"e":"have trouble -ing = ~하는 데 어려움을 겪다.¶students who have trouble making up their mind (결정하는 데 어려움을 겪는 학생들).¶make up(원형)은 이 자리에 못 와.","h":["패턴: 동명사의 관용적 표현","have trouble -ing"],"src":"패턴","pp":"패턴편 II 95쪽","x":"making up"},{"id":"P447","c":11,"s":1,"k":"blank","lv":0,"t":"동명사의 관용적 표현","q":"I don’t think this jacket is _______.","a":2,"e":"be worth + 명사(또는 동명사) = ~의 가치가 있다.¶this jacket is worth the price (이 재킷은 그 값어치를 한다).¶worth to buy는 틀려. worth buying은 가능.","h":["패턴: 동명사의 관용적 표현","be worth + 명사/동명사"],"src":"패턴","pp":"패턴편 II 95쪽","o":["worthy to buy","worth to buy","worth the price","worthy buying"]},{"id":"11-03","c":11,"s":1,"k":"blank","lv":1,"t":"전치사의 목적어","q":"I am fond of ___ stamps.","a":0,"h":["of는 전치사야.","전치사 뒤 동사는 -ing."],"e":"be fond of(~을 좋아하다)의 of는 전치사야.¶전치사 뒤라 동명사: fond of collecting stamps.¶collect(원형)나 to collect는 of 뒤에 못 와.","o":["collecting","collect","to collect","collected"],"src":"연습"},{"id":"11-04","c":11,"s":1,"k":"err","lv":2,"t":"목적은 to R","q":"On my way [home], I [popped into] the supermarket [to see] a friend and [for buying] some apples.","a":3,"x":"to buy","h":["사과를 '사려고' 들른 거야.","개인의 목적은 for + 명사나 to R로 표현해."],"e":"사람이 '~하러' 가는 목적은 to부정사로 써.¶I popped into the supermarket to see a friend and to buy some apples.¶for + -ing는 물건의 용도(a knife for cutting)에 써. 앞의 to see와도 모양을 맞춰.","src":"연습"},{"id":"11-05","c":11,"s":1,"k":"blank","lv":1,"t":"look forward to","q":"I look forward to ___ from you.","o":["hear","hearing","be heard","have heard"],"a":1,"h":["look forward to의 to는 전치사야.","전치사 뒤 → 동명사"],"e":"look forward to(~을 고대하다)의 to는 전치사야.¶그래서 동명사: I look forward to hearing from you.¶편지 끝에 자주 나오는 표현이라 꼭 외워 둬.","src":"연습"},{"id":"11-06","c":11,"s":1,"k":"blank","lv":2,"t":"It is no use -ing","q":"It is no use ___ over spilt milk.","a":0,"h":["'~해 봐야 소용없다' 관용 표현이야.","It is no use + 동명사"],"e":"It is no use -ing = ~해 봐야 소용없다.¶It is no use crying over spilt milk (엎질러진 물 앞에서 울어 봐야 소용없다).¶= It is of no use to cry ~.","o":["crying","to cry","cry","cried"],"src":"연습"},{"id":"P478","c":11,"s":2,"k":"blank","lv":0,"t":"동명사의 경우","q":"Upon hatching, ______________________ .","a":1,"e":"Upon hatching(부화하자마자)의 주체는 새끼 오리야.¶그래서 주절 주어도 오리: young ducks know how to swim.¶swimming, the knowledge가 주어면 수영이 부화했다는 이상한 뜻이 돼.","h":["패턴: 의미상의 주어를 표시하지 않은 경우","동명사 의미상 주어 일치"],"src":"패턴","pp":"패턴편 II 113쪽","o":["swimming is known by young ducks","young ducks know how to swim","the knowledge of swimming is in young ducks","how to swim is known in young ducks"]},{"id":"P484","c":11,"s":2,"k":"err","lv":0,"t":"동명사 - 의미관계의 구별","q":"I [do] appreciate [you helping] me [work] out the best solution [to] the thorny problem.","a":1,"e":"감사하는 대상은 '네가' 아니라 '네가 도와준 것'이야.¶동명사 helping의 행위자는 소유격으로 표시: your helping me.¶you helping이면 '돕고 있는 너'에게 감사하는 뜻이 돼.","h":["패턴: 의미상의 주어를 표시하는 경우","appreciate의 목적어"],"src":"패턴","pp":"패턴편 II 115쪽","x":"your helping"},{"id":"P485","c":11,"s":2,"k":"err","lv":0,"t":"동명사 - 의미관계의 구별","q":"We were [particularly] frightened of [John] [driving] the car in the race, [which] was believed to be very tough.","a":1,"e":"우리가 무서워한 건 John이 아니라 'John이 운전하는 것'이야.¶동명사 driving의 행위자를 소유격으로: John's driving.¶John driving이면 '운전하는 John'을 무서워하는 뜻이 돼.","h":["패턴: 의미상의 주어를 표시하는 경우","무서운 대상은 '운전하는 것'"],"src":"패턴","pp":"패턴편 II 115쪽","x":"John's"},{"id":"P488","c":11,"s":2,"k":"blank","lv":0,"t":"동명사의 경우","q":"Most Americans do not themselves enjoy ________ with respect for age or position; it makes them uncomfortable.","a":2,"e":"미국인들은 나이나 지위 때문에 특별히 '대우받는 것'을 좋아하지 않는다는 뜻이야.¶enjoy 뒤는 동명사, 대우를 '받는' 거라 수동 being treated.¶treating이면 남을 대우하는 게 돼.","h":["패턴: 준동사의 태","enjoy + 수동 동명사"],"src":"패턴","pp":"패턴편 II 117쪽","o":["treating","to have been treated","being treated","having teated"]},{"id":"P489","c":11,"s":2,"k":"err","lv":0,"t":"동명사의 경우","q":"There is no [gainsaying] the fact that [the privileged] seldom give up their privileges [of] their own accord without [coercing] into doing so.","a":3,"e":"특권층이 '강요받지' 않으면 특권을 포기하지 않는다는 뜻이야.¶without 뒤 동명사, 강요를 '당하는' 거라 수동 being coerced.¶coercing이면 남을 강요하는 게 돼.","h":["패턴: 준동사의 태","수동 동명사"],"src":"패턴","pp":"패턴편 II 117쪽","x":"being coerced"},{"id":"P490","c":11,"s":2,"k":"err","lv":0,"t":"동명사의 경우","q":"[Instead of] [eliminating], music appreciation [should be] included in our [elementary] curriculum.","a":1,"e":"음악 감상 과목이 '없어지는' 대신 포함되어야 한다는 뜻이야.¶instead of 뒤 동명사, 없어지는 거라 수동 being eliminated.¶eliminating이면 음악 감상이 뭔가를 없애는 게 돼.","h":["패턴: 준동사의 태","수동 동명사"],"src":"패턴","pp":"패턴편 II 117쪽","x":"being eliminated"},{"id":"P491","c":11,"s":2,"k":"err","lv":0,"t":"'need/ want/ deserve/ require'의 경우","q":"Written languages originate only [in] large, complex societies that [have] [a great deal of information] that needs to [store].","a":3,"e":"information that needs to ___ 에서 정보는 '저장되는' 대상이야.¶need to be p.p.: needs to be stored.¶= needs storing (need -ing도 수동의 뜻).","h":["패턴: 준동사의 태","need to be p.p."],"src":"패턴","pp":"패턴편 II 117쪽","x":"be stored"},{"id":"P492","c":11,"s":2,"k":"blank","lv":0,"t":"'need/ want/ deserve/ require'의 경우","q":"Several of these washers are out of order and _______.","a":3,"e":"세탁기는 '수리되는' 대상이야.¶need to be p.p.: need to be repaired.¶= need repairing. need to be repairing은 틀려.","h":["패턴: 준동사의 태","need to be p.p."],"src":"패턴","pp":"패턴편 II 117쪽","o":["need to be repairing","require that they be repaired","repairing is required of them","need to be repaired"]},{"id":"P493","c":11,"s":2,"k":"err","lv":0,"t":"‘be worth'의 경우","q":"However, these [first seven] examples do not meet the criteria [for being] a secret worth [being kept] safe from [the public].","a":2,"e":"be worth -ing 뒤의 동명사는 능동 모양으로 수동 뜻을 나타내.¶a secret worth keeping safe (안전하게 지킬 가치가 있는 비밀).¶being kept처럼 수동 모양을 쓰면 틀려.","h":["패턴: 준동사의 태","be worth -ing"],"src":"패턴","pp":"패턴편 II 117쪽","x":"keeping"},{"id":"P500","c":11,"s":2,"k":"blank","lv":0,"t":"완료형 준동사가 나올 수 있는 자리 - 시점 구분 하기","q":"John, scolded by his teacher, finally confessed to _________ the book.","a":3,"e":"John이 책을 훔친 건 고백한 것보다 먼저야.¶confess to + -ing에서 더 앞선 일이라 완료 동명사 having stolen.¶stealing도 쓸 수 있지만 '앞서 일어난 일'을 강조하는 게 정답이야.","h":["패턴: 부정사의 완료형","confess to having p.p."],"src":"패턴","pp":"패턴편 II 119쪽","o":["stealing","steal","have stolen","having stolen"]},{"id":"11-07","c":11,"s":2,"k":"blank","lv":3,"t":"동명사의 의미상 주어","q":"I insisted on ___ attending the meeting.","o":["her","she","hers","herself"],"a":0,"h":["attending의 행위자는 누구야?","동명사의 의미상 주어는 소유격이나 목적격."],"e":"동명사 attending의 행위자(그녀)를 밝히는 의미상 주어야.¶의미상 주어는 소유격이나 목적격: insisted on her attending.¶주격 she는 이 자리에 못 와.","src":"연습"},{"id":"11-08","c":11,"s":2,"k":"err","lv":2,"t":"need -ing","q":"Your car [needs] [being washed] [before] the [trip].","a":1,"x":"washing (또는 to be washed)","h":["need, want 뒤 동명사는 능동형이지만 수동의 뜻이야.","need -ing = need to be p.p."],"e":"need -ing는 능동 모양이지만 수동 뜻이야: needs washing = needs to be washed.¶그래서 being washed처럼 수동 동명사를 쓰면 틀려.¶같은 부류: want -ing, deserve -ing.","src":"연습"},{"id":"11-09","c":11,"s":2,"k":"err","lv":1,"t":"be worth -ing","q":"This book [is] [worth] [reading it] [carefully].","a":2,"h":["주어 This book이 reading의 목적어 역할을 해.","목적어를 또 쓰면 중복이야."],"e":"be worth -ing에서 주어(this book)가 이미 reading의 목적어 역할을 해.¶그래서 it을 또 쓰면 겹쳐: This book is worth reading.¶being read(수동)도 쓰지 않아.","x":"reading","src":"연습"},{"id":"11-10","c":11,"s":2,"k":"err","lv":2,"t":"동명사의 부정","q":"We [can] blame him [for] [having not told] us [the truth].","a":2,"h":["부정어 not의 위치를 봐.","준동사의 부정은 준동사 바로 앞에."],"e":"동명사를 부정할 때 not은 동명사 바로 앞.¶for not having told us the truth (진실을 말하지 않은 것에 대해).¶having not told는 not 위치가 틀려.","x":"not having told","src":"연습"},{"id":"P464","c":12,"s":0,"k":"err","lv":0,"t":"명사 앞 자리","q":"[Not] too many years ago, it was an [excited] experience [to travel] 25 or 50 miles [from home.]","a":1,"e":"it was an ___ experience에서 빈칸은 experience를 꾸며.¶경험이 사람을 흥분'시키는' 거라 exciting.¶구별법: 감정을 일으키는 원인 → -ing / 감정을 느끼는 사람 → p.p.","h":["패턴: 감정동사의 과거분사·현재분사","감정을 일으키는 경험"],"src":"패턴","pp":"패턴편 II 103쪽","x":"exciting"},{"id":"P465","c":12,"s":0,"k":"blank","lv":0,"t":"보어자리","q":"Most people enjoy Christmas holiday, but it is ________ to me.","a":1,"e":"크리스마스 휴일(it)이 나를 우울하게 '만드는' 쪽이야.¶감정을 일으키는 원인이라 depressing.¶depressed는 '우울함을 느끼는' 사람에게 써: I am depressed.","h":["패턴: 감정동사의 과거분사·현재분사","감정을 주는 대상"],"src":"패턴","pp":"패턴편 II 103쪽","o":["depress","depressing","depressed","depression"]},{"id":"P466","c":12,"s":0,"k":"blank","lv":0,"t":"보어자리","q":"The audience found the ill-prepared presentation chaotic and __________.","a":3,"e":"find + 목적어 + 형용사: 발표가 혼란스럽다고 느꼈다.¶발표가 청중을 혼란스럽게 '만드는' 거라 confusing.¶confused는 혼란을 '느끼는' 사람에게 써.","h":["패턴: 감정동사의 과거분사·현재분사","find + O + 형용사"],"src":"패턴","pp":"패턴편 II 103쪽","o":["confused","to confuse","confusion","confusing"]},{"id":"P467","c":12,"s":0,"k":"err","lv":0,"t":"분사구문자리","q":"[When] [frightening or exciting,] elephants sometimes [use their trunks] to make [a loud, shrill cry.]","a":1,"e":"When (they are) ___, elephants make a cry. 코끼리가 겁먹거나 흥분'한' 상태야.¶감정을 느끼는 쪽이라 frightened or excited.¶frightening이면 코끼리가 남을 겁주는 게 돼.","h":["패턴: 감정동사의 과거분사·현재분사","분사구문 + 감정"],"src":"패턴","pp":"패턴편 II 103쪽","x":"frightened or excited"},{"id":"12-01","c":12,"s":0,"k":"blank","lv":1,"t":"감정 분사","q":"The lecture was so ___ that many students fell asleep.","o":["boring","bored","bore","to bore"],"a":0,"h":["강의가 지루함을 '주는' 쪽이야, '느끼는' 쪽이야?","감정을 일으키면 -ing, 느끼면 p.p."],"e":"강의가 학생들을 지루하게 '만든' 거야.¶감정을 일으키는 원인이라 boring.¶학생들 입장이라면 The students were bored.","src":"연습"},{"id":"12-03","c":12,"s":0,"k":"blank","lv":2,"t":"자동사의 과거분사","q":"Look at the ___ leaves on the ground.","o":["fallen","falling","fell","fall"],"a":0,"h":["잎이 이미 땅에 떨어져 있어.","자동사의 p.p.는 '완료'의 뜻이야."],"e":"fall은 '떨어지다'라는 뜻이야. 스스로 떨어지는 거라 목적어가 없고, '떨어뜨려지다'라는 수동의 뜻도 없어.¶그래서 fall의 과거분사 fallen은 수동이 아니라 '이미 떨어진'이라는 완료의 뜻이 돼: fallen leaves.¶falling leaves는 지금 떨어지고 있는 잎이라 on the ground와 안 맞아.","src":"연습"},{"id":"P450","c":12,"s":1,"k":"blank","lv":0,"t":"부정사·분사를 구분하는 경우","q":"Foreign teachers are complaining over the government's new immigration law _____ them to submit police background checks and medical documents.","a":1,"e":"the new immigration law를 뒤에서 꾸미는 말이 필요해.¶법이 교사들에게 서류를 내라고 '요구하는' 능동이라 asking them to submit.¶asked면 법이 요구받는 게 돼.","h":["패턴: 준동사의 형용사적 용법 구별 - 후치수식(주술관계)","명사 뒤 분사"],"src":"패턴","pp":"패턴편 II 97쪽","o":["to ask","asking","that will ask","asked"]},{"id":"P451","c":12,"s":1,"k":"blank","lv":0,"t":"부정사·분사를 구분하는 경우","q":"Thyme, a fragrant garden herb, yield a medicinal oil ______ thymol.","a":1,"e":"a medicinal oil을 뒤에서 꾸미는 말이야. 기름이 티몰을 '함유하는' 능동.¶containing thymol (티몰을 함유한).¶contains는 동사라 접속사 없이 못 오고, that will contain은 시제가 안 맞아.","h":["패턴: 준동사의 형용사적 용법 구별 - 후치수식(주술관계)","명사 뒤 능동 분사"],"src":"패턴","pp":"패턴편 II 97쪽","o":["to contain","containing","that will contain","contains"]},{"id":"P455","c":12,"s":1,"k":"err","lv":0,"t":"과거동사와 과거분사의 구별","q":"Markets [sold] second-hand [goods] were [known as] flea markets because old items were thought [to be] full of fleas.","a":0,"e":"이 문장의 본동사는 were known이야. 그러니 앞의 sold는 동사가 될 수 없어.¶Markets를 꾸미는 분사가 필요하고, 시장이 물건을 '파는' 능동이라 selling.¶Markets selling second-hand goods were known as flea markets.","h":["패턴: 분사의 형용사적 용법 능·수동형 구별","명사 뒤 능동 분사"],"src":"패턴","pp":"패턴편 II 99쪽","x":"selling"},{"id":"P456","c":12,"s":1,"k":"blank","lv":0,"t":"과거동사와 과거분사의 구별","q":"More than 400 of the 687 people _________ by the earth quake lived in Las Colinas.","a":0,"e":"people을 뒤에서 꾸미는 말이 필요해: 지진으로 '죽은' 사람들.¶die는 스스로 죽는 거라 '죽임을 당하다'라는 수동 뜻을 만들 수 없어. 그래서 kill(죽이다)의 과거분사 killed를 써서 '죽임을 당한'.¶died는 동사라 명사 뒤에서 꾸미지 못해.","h":["패턴: 분사의 형용사적 용법 능·수동형 구별","명사 뒤 수동 분사"],"src":"패턴","pp":"패턴편 II 99쪽","o":["killed","kill","died","die"]},{"id":"P457","c":12,"s":1,"k":"err","lv":0,"t":"2개의 과거동사","q":"The American architect Frank L. Wright [developed] a theory of architecture [stressed] the needs of the people [who] [used] it.","a":1,"e":"본동사는 developed야. stressed까지 동사면 동사가 두 개가 돼.¶a theory를 꾸미는 분사로: 이론이 필요를 '강조하는' 능동이라 stressing.¶a theory stressing the needs of the people (사람들의 필요를 강조하는 이론).","h":["패턴: 분사의 형용사적 용법 능·수동형 구별","동사는 하나"],"src":"패턴","pp":"패턴편 II 99쪽","x":"stressing"},{"id":"P458","c":12,"s":1,"k":"err","lv":0,"t":"2개의 과거동사","q":"Before they [were hunted] [to extinction,] mammoths [resembled] modern elephants [survived] in the Arctic tundra regions.","a":2,"e":"본동사는 survived야. resembled까지 동사면 동사가 두 개.¶mammoths를 꾸미는 분사로: 매머드가 코끼리와 '닮은' 거라 resembling.¶mammoths resembling modern elephants survived ~.","h":["패턴: 분사의 형용사적 용법 능·수동형 구별","동사는 하나"],"src":"패턴","pp":"패턴편 II 99쪽","x":"resembling"},{"id":"P459","c":12,"s":1,"k":"err","lv":0,"t":"현재·과거분사 구분하는 경우","q":"If you [build] a strong position [in] your circle of friends you will be able [to get] the help [needing] to accomplish your objectives.","a":3,"e":"the help ___ to accomplish 에서 도움은 '필요로 되는' 대상이야.¶수동 분사 needed: the help needed (필요한 도움).¶needing이면 도움이 뭔가를 필요로 한다는 뜻이 돼.","h":["패턴: 분사의 형용사적 용법 능·수동형 구별","명사 뒤 수동 분사"],"src":"패턴","pp":"패턴편 II 99쪽","x":"needed"},{"id":"P460","c":12,"s":1,"k":"err","lv":0,"t":"현재·과거분사 구분하는 경우","q":"Today [people throughout the world] are aware that they depend [for their daily bread] on [something calling] \"the economy\", and they are aware that they are [vulnerable] because \"the economy\" is vulnerable.","a":2,"e":"'경제라고 불리는 무언가'라는 뜻이야.¶something이 그렇게 '불리는' 대상이라 수동 called.¶something calling이면 무언가가 부르고 있다는 뜻이 돼.","h":["패턴: 분사의 형용사적 용법 능·수동형 구별","명사 뒤 수동 분사"],"src":"패턴","pp":"패턴편 II 99쪽","x":"something called"},{"id":"P461","c":12,"s":1,"k":"err","lv":0,"t":"준동사의 형용사적 용법(전치수식) - 동사불가","q":"[Mined] over 2,000 years [ago,] copper is one of [the] earliest [know] metals.","a":3,"e":"the earliest ___ metals에서 빈칸은 metals를 꾸미는 형용사 자리야.¶금속은 '알려진' 대상이라 과거분사 known.¶know는 동사원형이라 명사 앞에서 꾸미지 못해.","h":["패턴: 분사의 형용사적 용법 - 전치수식","전치수식 분사"],"src":"패턴","pp":"패턴편 II 101쪽","x":"known"},{"id":"P462","c":12,"s":1,"k":"err","lv":0,"t":"현재·과거분사의 형용사적 용법(전치수식) - 능·수동 구별","q":"[Even if] Detroit could provide [nonpolluted] cars by the original deadline to meet [prescribed] Federal standards for clean air, the effect in big cities would be slight because [only] new cars would be properly equipped.","a":1,"e":"자동차가 오염을 '일으키지 않는' 거라 능동 nonpolluting.¶nonpolluting cars (무공해 차).¶nonpolluted는 '오염되지 않은'이라 차가 오염을 당하지 않았다는 뜻이 돼.","h":["패턴: 분사의 형용사적 용법 - 전치수식","오염시키지 않는 차"],"src":"패턴","pp":"패턴편 II 101쪽","x":"nonpolluting"},{"id":"P463","c":12,"s":1,"k":"err","lv":0,"t":"현재·과거분사의 형용사적 용법(전치수식) - 능·수동 구별","q":"[Because of] the flood, we will [have to] drink [bottling] water [instead of] tap water.","a":2,"e":"물은 병에 '담긴' 대상이야.¶과거분사 bottled water (생수, 병에 든 물).¶bottling water면 물이 뭔가를 병에 담는다는 뜻이 돼.","h":["패턴: 분사의 형용사적 용법 - 전치수식","병에 담긴 물"],"src":"패턴","pp":"패턴편 II 101쪽","x":"bottled"},{"id":"12-02","c":12,"s":1,"k":"err","lv":2,"t":"have + 목적어 + 원형","q":"He [had] his son [died] [in] the air [crash].","a":1,"h":["die는 자동사라 수동 p.p.로 쓸 수 없어.","have + 목적어 + 동사원형 = (불행한 일을) 당하다"],"e":"have + 목적어 + 동사에서 목적어와 동사의 관계를 봐. 아들이 스스로 '죽은' 거야.¶die는 스스로 하는 일이라 '죽어지다'라는 수동이 없어. 그래서 과거분사 died가 아니라 원형 die: had his son die (아들을 잃었다).¶비교: had my car repaired처럼 목적어가 '당하는' 쪽이면 p.p.","x":"die","src":"연습"},{"id":"12-04","c":12,"s":1,"k":"err","lv":2,"t":"분사구문의 주어","q":"[Entering] the room, [a strange sight] [caught] my [eye].","a":1,"x":"I saw a strange sight (주어를 사람으로)","h":["방에 들어간 사람이 누구야?","분사구문의 생략된 주어는 주절 주어와 같아야 해."],"e":"Entering the room(방에 들어가면서)의 주체는 사람이야.¶그런데 주절 주어가 a strange sight(광경)라 광경이 방에 들어간 꼴이 돼.¶주어를 사람으로: Entering the room, I saw a strange sight.","src":"연습"},{"id":"12-05","c":12,"s":1,"k":"blank","lv":2,"t":"수동 분사구문","q":"___ in French, the book can't be read easily.","o":["Writing","Written","Having written","To write"],"a":1,"h":["생략된 주어는 the book이야.","책은 쓰는 게 아니라 쓰여지는 거야."],"e":"분사구문의 생략된 주어는 주절 주어 the book이야.¶책은 프랑스어로 '쓰인' 거라 수동 Written.¶Writing이면 책이 뭔가를 쓰는 게 돼.","src":"연습"},{"id":"12-06","c":12,"s":1,"k":"err","lv":2,"t":"접속사 + 절","q":"[When] her husband [dying], she [received] $100,000 [in] insurance.","a":1,"h":["when 뒤에 주어 her husband가 따로 있어.","주어가 있는 when절이면 동사가 있어야 해."],"e":"When her husband ___ 에서 her husband라는 주어가 따로 있어.¶주어가 있으면 동사가 필요해: When her husband died.¶dying(분사)으로는 주어 + 동사 문장이 안 돼.","x":"died","src":"연습"},{"id":"12-07","c":12,"s":1,"k":"blank","lv":3,"t":"독립분사구문","q":"___ Sunday, the bank was closed.","a":0,"h":["Because it was Sunday를 분사구문으로 바꿔 봐.","주절 주어(the bank)와 다르니 주어를 남겨."],"e":"Because it was Sunday를 분사구문으로 바꾸면 It being Sunday.¶주절 주어(the bank)와 다른 주어는 생략하지 않고 남겨.¶비인칭 it도 생략하면 안 돼. Being Sunday만 쓰면 은행이 일요일인 꼴이 돼.","o":["It being","Being","It was","Been"],"src":"연습"},{"id":"12-10","c":12,"s":1,"k":"blank","lv":2,"t":"with + 목적어 + 분사","q":"She sat there with her eyes ___.","a":0,"h":["눈은 감는 거야, 감기는 거야?","with + 목적어 + 분사: 관계가 수동이면 p.p."],"e":"with + 목적어 + 분사 = ~한 채로.¶눈은 '감기는' 대상이라 수동 closed: with her eyes closed.¶같은 예: with her arms folded, with the engine running(능동).","o":["closed","closing","close","to close"],"src":"연습"},{"id":"P479","c":12,"s":2,"k":"blank","lv":0,"t":"분사의 경우","q":"Working like a telescope, ________ the size of objects at great distances.","a":1,"e":"Working like a telescope(망원경처럼 작동하는)의 주체는 망원 렌즈야.¶그래서 주절 주어가 a telephoto lens여야 하고, 동사 magnifies가 와야 해.¶관계사(which)를 쓰면 주절 동사가 없어져.","h":["패턴: 의미상의 주어를 표시하지 않은 경우","분사구문 주어 일치"],"src":"패턴","pp":"패턴편 II 113쪽","o":["which magnifies a telephoto lens","a telephoto lens magnifies","a telephoto lens which magnifies","and magnifying a telephoto lens"]},{"id":"P480","c":12,"s":2,"k":"err","lv":0,"t":"분사의 경우","q":"[While golfing], a rabbit ran [across] the course [and] knocked the ball [into] the hole.","a":0,"e":"While golfing(골프를 치는 동안)의 주체는 사람이야.¶그런데 주절 주어가 a rabbit이라 토끼가 골프를 친 꼴이 돼.¶주어를 밝혀서 While I was golfing.","h":["패턴: 의미상의 주어를 표시하지 않은 경우","분사구문 주어 불일치"],"src":"패턴","pp":"패턴편 II 113쪽","x":"While I was golfing"},{"id":"P501","c":12,"s":2,"k":"blank","lv":0,"t":"완료형 준동사가 나올 수 있는 자리 - 시점 구분 하기","q":"_______ up to the fifth floor with a heavy rope, the movers brought the piano in through the window.","a":3,"e":"hoist는 '~을 끌어올리다'라는 뜻이라 끌어올릴 대상(목적어)이 있어야 해.¶짐꾼들이 피아노를 끌어올린 게 창문으로 들여온 것보다 먼저라 Having hoisted it up(it = 피아노).¶Hoisted면 짐꾼들이 끌어올려진 게 되고, Having hoisted만 쓰면 무엇을 올렸는지가 빠져.","h":["패턴: 부정사의 완료형","Having hoisted it"],"src":"패턴","pp":"패턴편 II 119쪽","o":["Hoisted","Hoisting","Having hoisted","Having hoisted it"]},{"id":"P503","c":12,"s":2,"k":"blank","lv":0,"t":"어순","q":"_______, I don't know him.","a":1,"e":"분사구문의 부정은 not을 맨 앞에: Not having met him before.¶전에 만난 적이 없어서 그를 모른다는 뜻.¶Having not met은 not 위치가 틀려.","h":["패턴: 어순","분사구문의 부정"],"src":"패턴","pp":"패턴편 II 121쪽","o":["Meeting not him before","Not having met him before","As not meeting his before","Having not met him before"]},{"id":"12-08","c":12,"s":2,"k":"err","lv":2,"t":"분사구문의 부정","q":"[Having not been] deceived [by] him before, she [trusted] his [words].","a":0,"h":["not의 위치를 봐.","분사의 부정어는 분사 앞."],"e":"분사구문을 부정할 때 not은 맨 앞에.¶Not having been deceived by him before (전에 그에게 속은 적이 없어서).¶Having not been은 not 위치가 틀려.","x":"Not having been","src":"연습"},{"id":"12-09","c":12,"s":2,"k":"blank","lv":3,"t":"완료 수동 분사구문","q":"___ in poverty, he knows the value of money.","o":["Having been raised","Having raised","Raising","To raise"],"a":0,"h":["그가 가난 속에서 길러진 거야.","주절보다 앞선 일 + 수동"],"e":"그는 가난 속에서 '길러진' 쪽이고, 그건 지금보다 앞선 일이야.¶완료 수동 분사 Having been raised (줄여서 Raised).¶Having raised, Raising은 그가 누군가를 길렀다는 능동이 돼.","src":"연습"},{"id":"13-01","c":13,"s":0,"k":"err","lv":2,"t":"and로 병치된 명사 자리","q":"Artificial [rubies] and sapphires [have] the same [hard] and composition as [the real] stones.","a":2,"h":["the same 뒤, and composition과 나란히 놓인 자리야.","관사 + 형용사 뒤에는 명사."],"e":"the same ___ and composition에서 빈칸은 and로 composition(명사)과 나란히 놓여.¶the same(관사 + 형용사) 뒤는 명사 자리라 hardness(단단함).¶hard는 형용사라 이 자리에 못 와.","x":"hardness","src":"연습"},{"id":"13-02","c":13,"s":1,"k":"err","lv":2,"t":"the police는 복수","q":"The man [was] [questioned] yesterday, and the police [wants] [to interview] him again.","a":2,"x":"want","h":["the police가 단수 취급인지 복수 취급인지 떠올려 봐.","the police, the clergy, cattle, people"],"e":"the police(경찰)는 형태는 단수지만 항상 복수로 취급해.¶그래서 wants가 아니라 want: the police want to interview him.¶같은 부류: cattle, people, the clergy.","src":"연습"},{"id":"13-03","c":13,"s":1,"k":"blank","lv":2,"t":"집합명사의 단수 취급","q":"The committee ___ to its view that this is a matter for individuals to decide.","o":["adheres","adhere","adhering","are adhering"],"a":0,"h":["뒤에 its가 있어.","하나의 집합체로 보면 단수, 구성원 개개인으로 보면 복수."],"e":"committee(위원회) 같은 집합명사는 한 단체로 보면 단수, 구성원 각각으로 보면 복수야.¶뒤에 its view(그 단체의 견해)가 있으니 단수 취급: adheres.¶its가 단수라는 걸 알려 주는 단서야.","src":"연습"},{"id":"13-06","c":13,"s":1,"k":"blank","lv":2,"t":"of + 추상명사","q":"This information is of ___.","a":0,"h":["of 뒤에는 명사가 와.","of + 추상명사 = 형용사"],"e":"of + 추상명사 = 형용사와 같은 뜻.¶of importance = important (중요한).¶of 뒤는 명사 자리라 importance. 관사(an)는 붙이지 않아.","o":["importance","important","importantly","an importance"],"src":"연습"},{"id":"13-04","c":13,"s":3,"k":"err","lv":1,"t":"advice는 불가산","q":"Let me [give] you [an advice] [about] your [career].","a":1,"h":["advice는 셀 수 있는 명사일까?","불가산명사는 a/an도, -s도 못 붙여."],"e":"advice(충고)는 셀 수 없는 명사라 a/an을 붙이지 못해.¶some advice 또는 a piece of advice로 써.¶같은 부류: information, furniture, equipment, baggage, news.","x":"some advice (또는 a piece of advice)","src":"연습"},{"id":"13-05","c":13,"s":3,"k":"blank","lv":1,"t":"furniture 세기","q":"There are many ___ in the room.","o":["pieces of furniture","furnitures","furniture","piece of furnitures"],"a":0,"h":["There are many 뒤니까 복수 개념이 필요해.","furniture는 불가산이라 단위 명사로 세."],"e":"furniture(가구)는 셀 수 없는 명사라 furnitures (X).¶여러 개를 말할 때는 단위를 붙여: many pieces of furniture.¶There are many 뒤니까 복수 pieces.","src":"연습"},{"id":"13-07","c":13,"s":4,"k":"err","lv":2,"t":"학문명은 단수","q":"Economics [are] his [favorite] subject [of] [study].","a":0,"x":"is","h":["-ics로 끝나는 학문 이름은 몇 개로 취급할까?","형태는 복수, 취급은 단수"],"e":"economics(경제학)는 -s로 끝나지만 학문 이름이라 단수 취급해.¶Economics is his favorite subject.¶같은 부류: physics, mathematics, politics.","src":"연습"},{"id":"13-08","c":13,"s":4,"k":"err","lv":2,"t":"수사 + 명사 복합 형용사","q":"It is [a] [three-hours] journey [from here] [to] the temple.","a":1,"h":["하이픈으로 묶여 journey를 꾸미는 형용사야.","형용사로 쓰인 '숫자-명사'에서 명사는 단수."],"e":"명사 앞에서 하이픈으로 묶인 '숫자-명사'는 형용사처럼 쓰여서 단수로 써.¶a three-hour journey (3시간짜리 여행).¶같은 예: a ten-year-old girl, a five-dollar bill.","x":"three-hour","src":"연습"},{"id":"13-09","c":13,"s":4,"k":"blank","lv":2,"t":"명사 + 명사 복합명사","q":"I bought these shoes at a ___ shop downtown.","o":["shoe","shoes","shoe's","shoes'"],"a":0,"h":["shop 앞에서 명사가 형용사처럼 쓰였어.","앞 명사는 원칙적으로 단수."],"e":"명사가 다른 명사를 꾸밀 때(복합명사) 앞 명사는 단수로 써.¶a shoe shop (신발 가게).¶같은 예: a book store, a toy box.","src":"연습"},{"id":"13-10","c":13,"s":4,"k":"blank","lv":1,"t":"형용사 + 명사","q":"Please send me the ___ information by Friday.","o":["relevant","relevance","relevancy","relevantly"],"a":0,"h":["information을 꾸미는 자리야.","'관련된 정보'"],"e":"information(명사)을 꾸미는 자리라 형용사가 와야 해.¶the relevant information (관련 정보).¶relevance는 명사, relevantly는 부사라 명사 앞에서 꾸미지 못해.","src":"연습"},{"id":"13-11","c":13,"s":5,"k":"blank","lv":2,"t":"분화명사 manners","q":"Mind your ___ at the table.","o":["manners","manner","mannering","mannered"],"a":0,"h":["'식사 예절'을 말하는 거야.","단수와 복수의 뜻이 다른 명사야."],"e":"manner(방법)와 manners(예절)는 뜻이 달라.¶식탁 예절이라 manners: Mind your manners.¶이런 걸 분화명사라 해: custom(관습)/customs(세관), arm(팔)/arms(무기).","src":"연습"},{"id":"13-12","c":13,"s":7,"k":"err","lv":3,"t":"이중소유격","q":"He is [a his old friend], and I [have known] him [for] [years].","a":0,"h":["a와 his 같은 한정사를 같이 쓸 수 있는지 봐.","관사 + 명사 + of + 소유대명사"],"e":"a와 his처럼 관사와 소유격은 나란히 쓰지 못해.¶이중소유격: a + 명사 + of + 소유대명사 → an old friend of his.¶같은 예: this book of mine, a friend of Tom's.","x":"an old friend of his","src":"연습"},{"id":"13-13","c":13,"s":7,"k":"blank","lv":2,"t":"독립소유격","q":"I have an appointment at the ___ at noon.","a":0,"h":["'치과에서'는 치과의사의 진료소라는 뜻이야.","소유격 뒤 office가 생략돼."],"e":"at the dentist's = at the dentist's office (치과에서).¶소유격 뒤 장소 명사(office, shop, house)는 생략할 수 있어.¶같은 예: at the barber's(이발소에서), at my uncle's(삼촌 집에서).","o":["dentist's","dentist","dentists","dentists'"],"src":"연습"},{"src":"연습","id":"14-06","c":14,"s":0,"k":"blank","lv":1,"t":"'~마다'의 a","q":"The rent is now 600 dollars ___ month.","o":["a","the","per the","in"],"a":0,"h":["'한 달에'라는 뜻이야.","부정관사에는 '~마다(= per)'의 뜻이 있어."],"e":"부정관사 a에는 '~마다, ~당'(= per)이라는 뜻이 있어.¶600 dollars a month (한 달에 600달러).¶같은 예: twice a week, 60 miles an hour."},{"src":"연습","id":"14-04","c":14,"s":1,"k":"blank","lv":2,"t":"신체 부위 앞의 the","q":"He caught me by ___ arm.","o":["the","my","an","his"],"a":0,"h":["catch + 사람 + by + ___ + 신체 부위 구문이야.","사람을 먼저 목적어로 썼으면 신체 부위 앞은 the."],"e":"catch + 사람 + by + the + 신체 부위 = ~의 …를 잡다.¶이미 me로 사람을 밝혔으니 신체 부위 앞에는 소유격 대신 the.¶같은 부류: take, hold, pull, grab."},{"src":"연습","id":"14-07","c":14,"s":1,"k":"err","lv":1,"t":"방위 앞의 the","q":"[The] sun [rises] in [east] and [sets] in the west.","a":2,"x":"the east","h":["뒤의 in the west와 비교해 봐.","방위(동서남북) 앞에는 the를 붙여."],"e":"방위(동서남북) 앞에는 the를 붙여.¶The sun rises in the east and sets in the west.¶뒤의 in the west와 모양을 비교하면 바로 보여."},{"src":"연습","id":"14-08","c":14,"s":1,"k":"blank","lv":1,"t":"악기 앞의 the","q":"She plays ___ piano beautifully.","o":["the","a","an","(관사 없음)"],"a":0,"h":["play 뒤에 악기가 오면 관사는?","운동은 무관사, 악기는 the."],"e":"악기 이름 앞에는 the: play the piano, play the guitar.¶반대로 운동·게임은 관사 없이: play tennis, play chess.¶둘을 짝지어 외워 두면 헷갈리지 않아."},{"src":"연습","id":"14-11","c":14,"s":1,"k":"err","lv":2,"t":"by the + 단위","q":"Sugar is [sold] [by a pound] at [the] [local] market.","a":1,"x":"by the pound","h":["'파운드 단위로'라는 뜻이야.","단위를 나타낼 때 by 뒤의 관사는?"],"e":"단위로 팔거나 셀 때는 by the + 단위.¶sold by the pound (파운드 단위로 팔린다).¶같은 예: paid by the hour (시간당으로 받다)."},{"src":"연습","id":"14-03","c":14,"s":2,"k":"err","lv":1,"t":"운동·게임 이름은 무관사","q":"She visits her grandmother [twice a week], and they [play] [the chess] [after lunch].","a":2,"x":"chess","h":["chess 앞에 관사가 필요한지 생각해 봐.","운동·게임 이름 앞에는 관사를 쓰지 않아."],"e":"운동이나 게임 이름 앞에는 관사를 쓰지 않아.¶play chess, play baseball.¶악기는 반대로 the를 써: play the piano."},{"src":"연습","id":"14-05","c":14,"s":2,"k":"err","lv":1,"t":"본래 목적이면 무관사","q":"We [went] to [the bed] early [because] we [were] tired.","a":1,"x":"bed","h":["침대라는 가구로 간 걸까, 자러 간 걸까?","건물·장소를 본래 목적으로 쓰면 관사를 빼."],"e":"bed, school, church, hospital을 본래 목적으로 쓰면 관사를 빼.¶go to bed = 자러 가다. 침대라는 가구가 아니라 '잠'이 목적이야.¶비교: go to the bed = 침대(가구) 쪽으로 가다."},{"src":"연습","id":"14-09","c":14,"s":2,"k":"err","lv":2,"t":"관직 보어는 무관사","q":"He was [elected] [the chairman] of the committee [by] a [large majority].","a":1,"x":"chairman","h":["유일한 관직이 보어로 쓰였어.","관직·신분이 보어로 오면 관사를 생략해."],"e":"유일한 관직·신분이 보어로 오면 관사를 빼.¶He was elected chairman (그는 의장으로 선출되었다).¶같은 예: They made him captain."},{"src":"연습","id":"14-01","c":14,"s":3,"k":"err","lv":2,"t":"so + 형용사 + a + 명사","q":"He is [so a good boy] that [everyone] [likes] him [at school].","a":0,"x":"so good a boy","h":["so 뒤에 관사가 어디 오는지 봐.","so/as/too/how + 형용사 + a + 명사"],"e":"so + 형용사 + a + 명사 순서야. 형용사가 관사 앞으로 나가.¶so good a boy (그렇게 착한 소년).¶such를 쓰면 such a good boy 순서."},{"src":"연습","id":"14-02","c":14,"s":3,"k":"blank","lv":1,"t":"such a + 형용사 + 명사","q":"It was ___ that we stayed home all day.","o":["such a cold day","so a cold day","a such cold day","such cold a day"],"a":0,"h":["빈칸 뒤 that과 짝이 되는 말을 골라.","such는 관사 앞에 와."],"e":"such + a + 형용사 + 명사 + that = 너무 ~한 (명사)라서 …하다.¶such a cold day that we stayed home.¶so를 쓰면 so cold a day that ~."},{"src":"연습","id":"14-10","c":14,"s":3,"k":"blank","lv":1,"t":"such a + 형용사 + 명사","q":"I have nev c":16,"s":4,"k":"blank","lv":2,"t":"it is certain that","q":"___ that he will succeed.","o":["It is certain","It is sure","It is surely","It sure is"],"a":0,"h":["가주어 It + 형용사 + that절 구문이야.","sure는 사람 주어와 쓰여."],"e":"It is certain that ~ (~은 확실하다)은 가능해.¶sure는 사람 주어로만 써서 It is sure that은 틀려: He is sure that ~.¶certain은 둘 다 가능, sure는 사람만."},{"src":"연습","id":"16-07","c":16,"s":4,"k":"err","lv":2,"t":"감정 형용사 pleased","q":"She [was] [pleasant] [to see] the movie [last night].","a":1,"x":"pleased","h":["그녀가 기분이 좋았다는 뜻이야.","pleasant는 사람이 아니라 대상이 '즐겁게 하는' 거야."],"e":"pleasant는 대상이 사람을 '즐겁게 하는'이라는 뜻이야.¶사람의 기분은 pleased(기뻐하는): She was pleased to see the movie.¶비교: The movie was pleasant."},{"src":"연습","id":"16-09","c":16,"s":5,"k":"blank","lv":2,"t":"considerate와 considerable","q":"The tour guide was very ___ and answered all our questions kindly.","o":["considerate","considerable","consider","considering"],"a":0,"h":["사람의 성품을 말하는 자리야.","형태가 비슷한 형용사의 뜻을 구별해."],"e":"사람의 성품을 말하는 자리야.¶considerate = 사려 깊은 / considerable = (양이) 상당한.¶가이드가 친절하게 대답했으니 considerate."},{"src":"연습","id":"16-11","c":16,"s":6,"k":"blank","lv":1,"t":"be likely to","q":"He is ___ to win the race.","o":["likely","probable","possible","capable"],"a":0,"h":["사람이 주어고 뒤에 to부정사가 와.","사람 주어 + be ~ to R이 가능한 형용사는?"],"e":"사람 주어 + be ~ to R이 가능한 건 likely.¶He is likely to win (그가 이길 것 같다).¶probable, possible은 It is ~ that 구문으로만 쓰고, capable은 of -ing와 써."},{"src":"연습","id":"16-10","c":16,"s":7,"k":"err","lv":2,"t":"서수와 기수","q":"World War [Second] [ended] [in] [1945].","a":0,"x":"II (World War Two 또는 the Second World War)","h":["World War 뒤에 쓰는 숫자 읽기를 떠올려 봐.","명사 뒤에는 기수, 명사 앞에는 the + 서수."],"e":"'제2차 세계대전'은 World War II(Two) 또는 the Second World War.¶명사 뒤에는 기수(Two), 명사 앞에는 the + 서수(Second).¶World War Second는 두 방식을 섞은 틀린 형태야."},{"src":"연습","id":"17-02","c":17,"s":1,"k":"blank","lv":1,"t":"home은 부사","q":"Let's go ___ after the meeting.","o":["home","to home","at home","to the home"],"a":0,"h":["home이 '집으로'라는 부사로 쓰여.","부사 앞에는 전치사 "비교, 최상급의 형태","q":"The power of money is much [more great] in [those] societies [that] permit a [considerable] inequality [of] wealth.","a":0,"e":"great은 짧은 단어(1음절)라 비교급이 greater.¶much greater (훨씬 큰).¶more는 긴 단어(beautiful 등)에 붙여.","h":["패턴: 기타","great의 비교급"],"src":"패턴","pp":"패턴편 II 143쪽","x":"greater"},{"id":"P553","c":18,"s":0,"k":"err","lv":0,"t":"비교, 최상급의 형태","q":"Canning [is] the [most wide] [method of] food [preservation.]","a":1,"e":"'가장 널리 쓰이는 방법'은 the most widely used method.¶the most wide method는 뜻도 형태도 어색해.¶Canning is the most widely used method of food preservation.","h":["패턴: 기타","최상급 형태"],"src":"패턴","pp":"패턴편 II 143쪽","x":"most widely used"},{"id":"P554","c":18,"s":0,"k":"err","lv":0,"t":"비교, 최상급의 형태","q":"[The valuablest information] we currently have [on] the ocean floors is [that which] was obtained by oceanographic satellites [such as] Seasat.","a":0,"e":"valuable은 긴 단어(3음절 이상)라 최상급이 the most valuable.¶valuablest라는 형태는 없어.¶짧은 단어: -est, 긴 단어: most.","h":["패턴: 기타","긴 형용사의 최상급"],"src":"패턴","pp":"패턴편 II 143쪽","x":"The most valuable"},{"id":"P555","c":18,"s":0,"k":"err","lv":0,"t":"의미가 달라지는 비교, 최상급의 형태","q":"The debate was [farther] [fueled] by the announcement [by] TV newswoman Connie Chung that she would abandon the fast track at CBS in a [last-ditch] drive for motherhood at age 44.","a":0,"e":"further = 더 나아가, 더욱(정도) / farther = 더 멀리(거리).¶논쟁이 '더욱' 불붙었다는 정도라 further fueled.¶거리 이야기가 아니야.","h":["패턴: 기타","further와 farther"],"src":"패턴","pp":"패턴편 II 143쪽","x":"further"},{"id":"P556","c":18,"s":0,"k":"err","lv":0,"t":"의미가 달라지는 비교, 최상급의 형태","q":"Most presidents are [felled] by failure of their office―Carter by the hostages, Nixon by Watergate, Johnson by Vietnam ― but the Clintons [have been] [brought down] almost entirely by their sexual and financial escapades, the [former] his, the [later] hers.","a":4,"e":"the former(전자) ↔ the latter(후자).¶클린턴 부부의 스캔들 중 전자는 그의 것, 후자는 그녀의 것: the former his, the latter hers.¶later는 시간상 '나중에'라 다른 단어야.","h":["패턴: 기타","former와 latter"],"src":"패턴","pp":"패턴편 II 143쪽","x":"latter"},{"id":"P557","c":18,"s":0,"k":"err","lv":0,"t":"의미 중복 비교, 최상급의 형태","q":"[Looking] forward to her vacation was Mary’s [most favorite] way [of] [occupying] her mind.","a":1,"e":"favorite에는 이미 '가장 좋아하는'이라는 최상급 뜻이 있어.¶그래서 most를 붙이면 뜻이 겹쳐: Mary's favorite way.¶같은 부류: perfect, unique, ideal도 more/most를 붙이지 않아.","h":["패턴: 기타","favorite은 이미 최상급 의미"],"src":"패턴","pp":"패턴편 II 143쪽","x":"favorite"},{"id":"P558","c":18,"s":0,"k":"err","lv":0,"t":"라틴어계 비교급","q":"[Most of the] telephone [systems] in Vietnam were installed in [the 50's and 60's] and are inherently [inferior than] the modern systems already in use in Malaysia and Thailand.","a":3,"e":"inferior(열등한), superior(우월한), senior, junior는 than이 아니라 to와 써.¶are inferior to the modern systems.¶라틴어에서 온 비교 형용사라고 기억해.","h":["패턴: 기타","inferior는 to와"],"src":"패턴","pp":"패턴편 II 143쪽","x":"inferior to"},{"id":"P512","c":18,"s":1,"k":"err","lv":0,"t":"긍정문","q":"[With] productive thinking, one [generates] as many alternative approaches [that] [one] can.","a":2,"e":"as many ~ as가 짝이야.¶as many alternative approaches as one can (할 수 있는 한 많은 접근법).¶that으로 받으면 짝이 맞지 않아.","h":["패턴: 동등비교구문","as ~ as"],"src":"패턴","pp":"패턴편 II 129쪽","x":"as"},{"id":"P513","c":18,"s":1,"k":"err","lv":0,"t":"긍정문","q":"[Small amounts] of some minerals [are] just [so] important to the human system [as vitamins are.]","a":2,"e":"긍정문 원급 비교는 as ~ as.¶just as important as vitamins are (비타민만큼이나 중요하다).¶so ~ as는 부정문(not so ~ as)에서 써.","h":["패턴: 동등비교구문","just as ~ as"],"src":"패턴","pp":"패턴편 II 129쪽","x":"as"},{"id":"P514","c":18,"s":1,"k":"blank","lv":0,"t":"부정문","q":"Of the nominees for the Pulitzer Prize in Journalism this year, few are _________ influential as Professor Blake.","a":3,"e":"few(거의 ~ 없다)가 부정의 뜻이라 not so ~ as와 같은 원리야.¶few are so influential as Professor Blake (Blake 교수만큼 영향력 있는 사람은 거의 없다).¶more를 쓰려면 than이 필요해.","h":["패턴: 동등비교구문","not so(as) ~ as"],"src":"패턴","pp":"패턴편 II 129쪽","o":["very","more","much","so"]},{"id":"P515","c":18,"s":1,"k":"blank","lv":0,"t":"부정문","q":"Wild strawberries are _________ as cultivated strawberries.","a":4,"e":"부정문 원급 비교: not so(as) + 원급 + as.¶not so sweet as (~만큼 달지 않다).¶as 사이에는 원급만 와. sweeter(비교급)는 못 와.","h":["패턴: 동등비교구문","not so ~ as"],"src":"패턴","pp":"패턴편 II 129쪽","o":["less sweet","no less sweeter","not sweeter","not as sweeter","not so sweet"]},{"id":"P516","c":18,"s":1,"k":"blank","lv":0,"t":"부정문","q":"According to psychologists, a person's attention is attracted ________ by the intensity of different signals as by their context, significance, and information content.","a":1,"e":"not so much A as B = A라기보다는 B.¶주의는 신호의 강도보다는 맥락에 의해 끌린다는 뜻이야.¶not so much가 한 덩어리라 어순을 바꾸면 안 돼.","h":["패턴: 동등비교구문","not so much A as B"],"src":"패턴","pp":"패턴편 II 129쪽","o":["much not so","not so much","so not much","so much not"]},{"id":"P517","c":18,"s":1,"k":"blank","lv":0,"t":"기타","q":"An elephant can lift _______ a ton with its tusks.","a":3,"e":"as much as + 수량 = ~만큼이나 (많은 양을).¶lift as much as a ton (1톤이나 들어 올린다).¶수량이 많다는 걸 강조하는 표현이야.","h":["패턴: 동등비교구문","as much as + 수량"],"src":"패턴","pp":"패턴편 II 129쪽","o":["so much that","it","most","as much as"]},{"id":"P547","c":18,"s":1,"k":"blank","lv":0,"t":"어순","q":"White families are _______ blacks or Hispanics to have computers at home.","a":0,"e":"배수(three times)는 as 앞에 와: three times as likely as.¶순서: 배수 + as + 원급 + as.¶as three times처럼 순서를 바꾸면 틀려.","h":["패턴: 배수 비교","배수사 + as ~ as"],"src":"패턴","pp":"패턴편 II 141쪽","o":["three times as likely as","as three times likely as","as likely three times as","likely as three time as"]},{"id":"P548","c":18,"s":1,"k":"err","lv":0,"t":"어순","q":"He says that [in other natural disasters,] the number of [the injured] is usually four times [of the dead,] [but] in this case, the ratio is only 2 to 1.","a":2,"e":"'사망자 수의 네 배'라 앞의 the number를 다시 받아야 해.¶four times that of the dead (= the number of the dead).¶of the dead만 쓰면 무엇의 네 배인지가 사라져.","h":["패턴: 배수 비교","배수 비교 대상"],"src":"패턴","pp":"패턴편 II 141쪽","x":"that of the dead"},{"id":"P549","c":18,"s":1,"k":"err","lv":0,"t":"twice","q":"The bill [for lunch] was twice [more than] I [thought] [it would be.]","a":1,"e":"'두 배'는 twice as much as.¶The bill was twice as much as I thought (생각보다 두 배였다).¶twice more than은 시험에서 틀린 것으로 봐.","h":["패턴: 배수 비교","twice as much as"],"src":"패턴","pp":"패턴편 II 141쪽","x":"as much as"},{"id":"P550","c":18,"s":1,"k":"blank","lv":0,"t":"twice","q":"A: \"John, which hotel would you recommend?\" B: \"Well, staying in this hotel costs _________ staying in that one.\"","a":3,"e":"배수 + as much as: twice as much as.¶staying here costs twice as much as staying there (여기 묵는 게 거기보다 두 배 비싸다).¶배수는 맨 앞에.","h":["패턴: 배수 비교","twice as much as"],"src":"패턴","pp":"패턴편 II 141쪽","o":["more than twice","as twice much as","as much as twice","twice as much as","more twice than"]},{"id":"P551","c":18,"s":1,"k":"err","lv":0,"t":"twice","q":"The essence of the larger problem [is that] despite the dreadful conditions [that] urban squatters face, their numbers are growing at rates [as much as twice] that of the cities themselves and every step [taking to] improve living conditions in the slums [only attracts] more migrants.","a":3,"e":"every step ___ to improve ~ 에서 조치(step)는 '취해지는' 대상이야.¶수동 분사 taken: every step taken to improve living conditions.¶taking이면 조치가 뭔가를 취하는 게 돼.","h":["패턴: 배수 비교","명사 뒤 수동 분사"],"src":"패턴","pp":"패턴편 II 141쪽","x":"taken to"},{"id":"P518","c":18,"s":2,"k":"err","lv":0,"t":"'than' 선택","q":"Wall paintings found recently in the caves of Brazil are [convincing] evidence that cave art [developed] in the Americans at an earlier time [as] [it] did on other continents.","a":2,"e":"앞에 earlier(비교급)가 있으니 짝은 than.¶at an earlier time than it did on other continents (다른 대륙보다 더 이른 시기에).¶as를 쓰면 짝이 안 맞아.","h":["패턴: 우등비교","earlier ~ than"],"src":"패턴","pp":"패턴편 II 131쪽","x":"than"},{"id":"P519","c":18,"s":2,"k":"err","lv":0,"t":"'than' 선택","q":"After the gym class [is dismissed,] there’s no better [place to] relax [as] the spa, [especially for] massages.","a":2,"e":"no better(비교급)의 짝은 than.¶there's no better place to relax than the spa (스파보다 쉬기 좋은 곳은 없다).¶as는 원급과 짝이야.","h":["패턴: 우등비교","no better ~ than"],"src":"패턴","pp":"패턴편 II 131쪽","x":"than"},{"id":"P520","c":18,"s":2,"k":"err","lv":0,"t":"'-er/ more-' 선택","q":"If a company is found to hire a [high] percentage from one [group of applicants] than [another,] the company can be [legally challenged] by the government.","a":0,"e":"뒤에 than another가 있으니 비교급이 필요해.¶a higher percentage from one group than another.¶high(원급)는 than과 짝이 안 돼.","h":["패턴: 우등비교","than이 있으면 비교급"],"src":"패턴","pp":"패턴편 II 131쪽","x":"higher"},{"id":"P521","c":18,"s":2,"k":"err","lv":0,"t":"'-er/ more-' 선택","q":"Keep in mind that [although] trial lenses are free, your doctor [will] still charge you for the fitting process, [which] can be [much] time-consuming than [a regular] lens fitting.","a":3,"e":"뒤에 than이 있어. time-consuming은 긴 단어라 more를 붙여 비교급을 만들어.¶much more time-consuming than ~ (훨씬 더 시간이 걸리는).¶much는 비교급을 강조할 뿐 비교급을 만들지는 못해.","h":["패턴: 우등비교","much + 비교급"],"src":"패턴","pp":"패턴편 II 131쪽","x":"much more"},{"id":"P522","c":18,"s":2,"k":"blank","lv":0,"t":"much/ still more ↔ much/ still less","q":"Those students do not like to read novels, _________ course books.","a":2,"e":"부정문 뒤에서 '하물며 ~는 더 아니다'는 much(still) less.¶소설도 안 읽는데 하물며 교과서는 더 안 읽는다.¶긍정문 뒤면 much more.","h":["패턴: 우등비교","부정 + much less"],"src":"패턴","pp":"패턴편 II 131쪽","o":["about","in any case","much less","leaving out of the question"]},{"id":"P523","c":18,"s":2,"k":"blank","lv":0,"t":"much/ still more ↔ much/ still less","q":"I don’t think that Mike is very efficient; still _________ do I think that his assistants are.","a":1,"e":"부정문 뒤 '하물며 ~는 더 그렇지 않다'는 still less.¶still less do I think (더더욱 그렇게 생각하지 않는다).¶still less가 앞에 와서 do I로 도치됐어.","h":["패턴: 우등비교","still less"],"src":"패턴","pp":"패턴편 II 131쪽","o":["more","less","nor","never","so"]},{"id":"P524","c":18,"s":2,"k":"blank","lv":0,"t":"much/ still more ↔ much/ still less","q":"Everyone has a right to enjoy his liberty, and ________ his life.","a":0,"e":"긍정문 뒤에서 '하물며 ~는 더 그렇다'는 much(still) more.¶자유를 누릴 권리가 있는데 하물며 생명은 더 그렇다.¶부정문 뒤면 much less.","h":["패턴: 우등비교","긍정 + much more"],"src":"패턴","pp":"패턴편 II 131쪽","o":["much more","much less","indeed","so"]},{"id":"P525","c":18,"s":2,"k":"blank","lv":0,"t":"much/ still more ↔ much/ still less","q":"The baby could not even walk, _______ run.","a":0,"e":"let alone = ~는 말할 것도 없이(부정문 뒤).¶걷지도 못하는데 달리는 건 말할 것도 없다.¶much less와 같은 뜻이야.","h":["패턴: 우등비교","let alone"],"src":"패턴","pp":"패턴편 II 132쪽","o":["let alone","not to speak of","regardless of","not considering"]},{"id":"P526","c":18,"s":2,"k":"blank","lv":0,"t":"A no more B than C = A not B any more than C","q":"A home without love is ________ a home than a body without a soul is a man.","a":0,"e":"A no more B than C D = C가 D가 아닌 것처럼 A도 B가 아니다.¶사랑 없는 집이 집이 아닌 건, 영혼 없는 몸이 사람이 아닌 것과 같다.¶'고래 공식'(A whale is no more a fish than a horse is)으로 유명해.","h":["패턴: 우등비교","no more A than B"],"src":"패턴","pp":"패턴편 II 132쪽","o":["no more","not more","as much as not","not so much as"]},{"id":"P527","c":18,"s":2,"k":"blank","lv":0,"t":"the -er/ more- ~  of Ⓝs","q":"Joe is _________ of the twins.","a":1,"e":"둘 중에서 '더 ~한 쪽'은 the + 비교급.¶the taller of the twins (쌍둥이 중 키 큰 쪽).¶of the two처럼 범위가 둘로 정해지면 the를 붙여.","h":["패턴: 우등비교","the 비교급 of the two"],"src":"패턴","pp":"패턴편 II 132쪽","o":["taller","the taller","tallest","the tallest"]},{"id":"P528","c":18,"s":2,"k":"blank","lv":0,"t":"the -er/ more- ~  (이유부사구·절)","q":"We admire him _________ because he is honest.","a":2,"e":"all the + 비교급 + because(for) = ~ 때문에 더욱더.¶We admire him all the more because he is honest (정직하기 때문에 더욱더 존경한다).¶the는 '그만큼'이라는 뜻이야.","h":["패턴: 우등비교","all the more because"],"src":"패턴","pp":"패턴편 II 132쪽","o":["by far","the sooner       '","all the more","none the less"]},{"id":"P529","c":18,"s":2,"k":"blank","lv":0,"t":"the -er/ more- ~  (이유부사구·절)","q":"She is none ___________ happier for her beauty.","a":0,"e":"none the + 비교급 + for = ~에도 불구하고 조금도 더 ~하지 않다.¶She is none the happier for her beauty (아름답다고 해서 조금도 더 행복하지 않다).¶none the 세트로 기억해.","h":["패턴: 우등비교","none the 비교급 for"],"src":"패턴","pp":"패턴편 II 132쪽","o":["the","much","more","enough"]},{"id":"P530","c":18,"s":2,"k":"err","lv":0,"t":"the -er/ more- ~  , the -er/ more- ~","q":"A story [always] sounds clear enough [at a distance,] but [nearer] you get the scene of events, [the vaguer] it becomes.","a":2,"e":"the + 비교급 ~, the + 비교급 … = ~할수록 더 …하다.¶the nearer you get, the vaguer it becomes (가까이 갈수록 더 흐릿해진다).¶앞쪽에도 the가 빠지면 안 돼.","h":["패턴: 우등비교","the 비교급 ~, the 비교급"],"src":"패턴","pp":"패턴편 II 132쪽","x":"the nearer"},{"id":"P531","c":18,"s":2,"k":"blank","lv":0,"t":"the -er/ more- ~  , the -er/ more- ~","q":"The stronger _______ magnetic field, the greater the voltage produced by a generator.","a":3,"e":"The stronger the magnetic field (is), the greater the voltage (is).¶the 비교급 + 명사 뒤의 be동사는 생략할 수 있어.¶그래서 빈칸에는 the만.","h":["패턴: 우등비교","the 비교급 + 명사, the 비교급"],"src":"패턴","pp":"패턴편 II 132쪽","o":["than the","is the","is equal to","the"]},{"id":"P532","c":18,"s":2,"k":"blank","lv":0,"t":"the -er/ more- ~  , the -er/ more- ~","q":"The more distant a star happens to be, the dimmer ________.","a":3,"e":"the + 비교급 뒤는 '주어 + 동사' 순서.¶The more distant a star is, the dimmer it seems to us.¶that, seeming으로는 주어 + 동사가 안 돼.","h":["패턴: 우등비교","the 비교급 + S + V"],"src":"패턴","pp":"패턴편 II 133쪽","o":["that seems to us","seeming to us","seeming to us","it seems to us"]},{"id":"P533","c":18,"s":2,"k":"err","lv":0,"t":"the -er/ more- ~  , the -er/ more- ~","q":"The more dangerous [is the sport,] the [more enthusiastically] people [appear] to love [watching] it.","a":0,"e":"the + 비교급 뒤는 '주어 + 동사' 평서문 순서야.¶The more dangerous the sport is, ~.¶is the sport는 의문문 어순이라 틀려.","h":["패턴: 우등비교","the 비교급 뒤 어순"],"src":"패턴","pp":"패턴편 II 133쪽","x":"the sport is"},{"id":"P534","c":18,"s":2,"k":"blank","lv":0,"t":"the -er/ more- ~  , the -er/ more- ~","q":"The more we looked at the abstract painting, ________.","a":0,"e":"The more ~, the more ~ 짝을 맞춰.¶The more we looked, the more we liked it (볼수록 더 좋아졌다).¶뒤쪽에도 the + 비교급으로 시작해야 해.","h":["패턴: 우등비교","the more ~, the more ~"],"src":"패턴","pp":"패턴편 II 133쪽","o":["the more we liked it","we liked it more","better we liked it","it looked better"]},{"id":"P535","c":18,"s":2,"k":"blank","lv":0,"t":"the -er/ more- ~  , the -er/ more- ~","q":"The more citizens who are alert to the possibility of stolen wallets and pocketbooks, _________ thefts there will be.","a":1,"e":"the + 비교급 짝이고, thefts(절도 건수)는 셀 수 있는 복수명사야.¶셀 수 있는 명사의 '더 적은'은 fewer: the fewer thefts.¶less는 셀 수 없는 명사에 써.","h":["패턴: 우등비교","the fewer + 복수명사"],"src":"패턴","pp":"패턴편 II 133쪽","o":["much more","the fewer","the less","much less"]},{"id":"P536","c":18,"s":2,"k":"err","lv":0,"t":"'as/ than'의 선택","q":"Last year, land values in most parts of the pinelands [rose] almost [as fast,] and in some parts [even faster] than, [those] outside the pinelands.","a":1,"e":"원급과 비교급을 함께 쓸 때 각자 짝을 갖춰야 해.¶almost as fast as, and in some parts even faster than, those ~.¶as fast 뒤의 as가 빠졌어.","h":["패턴: 이중비교구문","as ~ as와 than 병치"],"src":"패턴","pp":"패턴편 II 135쪽","x":"as fast as"},{"id":"P537","c":18,"s":2,"k":"blank","lv":0,"t":"'as/ than'의 선택","q":"The bills of the ruling party _______.","a":3,"e":"원급(as bad as)과 비교급(worse than)을 둘 다 갖추고, 비교 대상도 맞춰야 해.¶법안끼리 비교하니 those of the opposition party (야당의 법안들).¶주어 The bills가 복수라 are.","h":["패턴: 이중비교구문","원급과 비교급 동시에"],"src":"패턴","pp":"패턴편 II 135쪽","o":["is as bad or worse than the opposition party","are as bad or worse than the opposition party","are as bad as or worse than the opposition party","are as bad as or worse than those of the opposition party"]},{"id":"P538","c":18,"s":3,"k":"blank","lv":0,"t":"최상급의 선택","q":"Helium is _______ all gases to liquefy and is impossible to solidify at normal air pressure.","a":2,"e":"of all gases(모든 기체 중)는 여럿 중 하나를 고르는 거라 최상급.¶the most difficult of al
