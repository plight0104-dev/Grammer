<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>편입 영어 문법</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool, quiet and exact, modelled on the practice site the user pointed to
   IDEA a workbook that follows the lecture notes' table of contents, chapter → section → problem
   PICTURE the problem itself: the English sentence set large with (A)–(D) underlines beside the answer sheet
   COLOUR white paper, near-black ink, navy primary buttons, teal for progress and correct, red for wrong
   TYPE Noto Sans KR for the interface + Source Serif 4 for English sentences
   LAYOUT 1040px column; problem page splits question | answer on laptops, stacks question → answer on phones */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111418);--soft:light-dark(#f4f6f8,#181d23);--line:light-dark(#e1e6eb,#2a3139);--ink:light-dark(#151a20,#eef1f4);--mute:light-dark(#5d6874,#9da8b4);--navy:light-dark(#1d2b3b,#e3ebf3);--onnavy:light-dark(#ffffff,#111418);--teal:light-dark(#167a68,#55c7ae);--tealbg:light-dark(#e5f3ef,#132d28);--red:light-dark(#c4313c,#ff7d86);--redbg:light-dark(#fcebec,#35171a);--obj:light-dark(#2456a3,#93b6ee);--objbg:light-dark(#e9f0fb,#18263a);--sub:light-dark(#985a00,#f1c272);--subbg:light-dark(#fcf1df,#33270f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
button{font:inherit;color:inherit}
.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.topin{max-width:1040px;margin:0 auto;padding:0 max(4vw,16px);display:flex;align-items:center;justify-content:space-between;gap:8px 18px;flex-wrap:wrap;min-height:58px}
.brand{font-weight:700;text-decoration:none;font-size:17px}
.nav{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.nav a{text-decoration:none;padding:10px 12px;border-radius:8px;font-size:15px;color:var(--mute)}
.nav a[aria-current=page]{color:var(--ink);font-weight:500;background:var(--soft)}
.save{font-size:13px;color:var(--mute);padding-left:8px}
main{max-width:1040px;margin:0 auto;padding:28px max(4vw,16px) 64px}
h1{font-size:clamp(28px,4vw,36px);line-height:1.15;letter-spacing:-.02em;margin:6px 0 10px}
.h2{font-size:22px;margin:40px 0 14px;letter-spacing:-.01em}
.lead{color:var(--mute);margin:0 0 18px;max-width:62ch}
.ser{color:var(--teal);font-weight:500;font-size:14px;margin:0}
.back{display:inline-block;text-decoration:none;color:var(--mute);font-size:14px;padding:6px 0}
.back:hover{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.card h2{font-size:20px;line-height:1.3;margin:0}
.desc{margin:0;color:var(--mute);font-size:15px;flex:1}
.stat{margin:0;font-size:13px;color:var(--mute)}
.prog{display:grid;gap:6px;font-size:14px;margin:6px 0 4px}
.prog i{display:block;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.prog b{display:block;height:100%;background:var(--teal);border-radius:3px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:0;background:var(--navy);color:var(--onnavy);font-weight:500;text-decoration:none;cursor:pointer;font-size:15px}
.btn.alt{background:var(--teal);color:var(--onnavy)}
.btn kbd{font:12px "Noto Sans KR",sans-serif;opacity:.75}
.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:15px;text-decoration:none}
.ghost:disabled{color:var(--mute);cursor:default}
.btn:focus-visible,.ghost:focus-visible,a:focus-visible,.opt:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--obj);outline-offset:2px}
.band{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px 24px;flex-wrap:wrap;background:var(--soft)}
.band h2{margin:0 0 2px;font-size:18px}
.band p{margin:0;color:var(--mute);font-size:15px}
.mode{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}
.mode .card h2{font-size:18px}
.kline{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--mute);margin:0 0 6px}
.kline b{color:var(--ink)}
.tocch{border-top:1px solid var(--line);padding:14px 0 10px}
.toch{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;text-decoration:none;gap:10px;padding:4px 0}
.num{font:600 22px/1 "Source Serif 4",Georgia,serif;color:var(--teal)}
.toch b{display:block;font-size:17px}
.toch small{color:var(--mute);font-size:13px}
.toch:hover b{text-decoration:underline}
.tocch ul{list-style:none;margin:6px 0 0;padding:0 0 0 54px}
.tocch li a{display:grid;grid-template-columns:2.6em minmax(0,1fr) auto;gap:8px;padding:7px 0;text-decoration:none;font-size:15px;border-bottom:1px dashed var(--line)}
.tocch li:last-child a{border-bottom:0}
.sl{color:var(--mute)}
.sn{color:var(--mute);font-size:13px;white-space:nowrap}
.tocch li a:hover .st{text-decoration:underline}
.filters{display:flex;flex-direction:column;gap:8px;margin:18px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--navy);color:var(--onnavy);border-color:var(--navy)}
.sec{border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}
.sh{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;padding:12px 16px;background:var(--soft)}
.sh b{font-size:16px}
.sh span{font-size:13px;color:var(--mute)}
.row{display:grid;grid-template-columns:20px auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none}
.row:hover .rt{text-decoration:underline}
.empty{padding:14px 16px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.dot.ok{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px var(--bg)}
.dot.no{border-color:var(--red);background:var(--redbg)}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.obj{background:var(--objbg);color:var(--obj)}
.tag.sub{background:var(--subbg);color:var(--sub)}
.lv{font-size:13px;color:var(--mute);white-space:nowrap}
.lv.l1{color:var(--teal)}.lv.l3{color:var(--red)}
.lv.ptg{color:var(--obj)}
.cnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}
.ptop{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-bottom:14px;font-size:14px;color:var(--mute)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.pane{border:1px solid var(--line);border-radius:12px;padding:clamp(18px,2.6vw,26px);background:var(--bg)}
.tags{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pt{font-size:clamp(22px,3vw,28px);margin:0 0 4px}
.src{margin:0 0 14px;color:var(--mute);font-size:14px}
.ins{margin:0;font-weight:500}
.sent{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(19px,2.2vw,22px);line-height:2.25;background:var(--soft);border-radius:10px;padding:16px 18px;margin-top:12px;overflow-wrap:anywhere}
.u{display:inline-flex;flex-direction:column;align-items:center;line-height:1.35}
.u>span{text-decoration:underline 1.5px;text-underline-offset:5px}
.u>b{font:500 12px/1.3 "Noto Sans KR",sans-serif;color:var(--mute)}
.u.good>span{color:var(--teal)}.u.bad>span{color:var(--red);text-decoration-style:wavy}
.u1{text-decoration:underline 1.5px;text-underline-offset:5px}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid currentColor;line-height:1.3;text-align:center}
.blank.on{color:var(--teal);padding:0 .3em}
.ah{font-size:16px;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:left;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt:disabled{cursor:default}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--mute);display:grid;place-items:center;font-size:13px;font-weight:500}
.opt .ot{font-family:"Source Serif 4",Georgia,serif;font-size:17px}
.opt.sel{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.opt.sel .bub{background:var(--navy);border-color:var(--navy);color:var(--onnavy)}
.opt.ok{border-color:var(--teal);background:var(--tealbg)}
.opt.ok .bub{background:var(--teal);border-color:var(--teal);color:var(--onnavy)}
.opt.no{border-color:var(--red);background:var(--redbg)}
.opt.no .bub{background:var(--red);border-color:var(--red);color:var(--onnavy)}
.inp{width:100%;min-height:50px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:17px "Source Serif 4",Georgia,serif}
.inp:disabled{background:var(--soft)}
.help{font-size:13px;color:var(--mute);margin:8px 0 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hints{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.hints li{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:15px}
.hints li b{color:var(--teal);margin-right:6px;font-weight:500}
.res{margin:14px 0 0;font-weight:700;font-size:17px}
.res.ok{color:var(--teal)}.res.no{color:var(--red)}
.res small{font-weight:400;color:var(--mute);font-size:14px;margin-left:6px}
.solbtn{width:100%;margin-top:14px}
.sol{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.sol p{margin:0 0 8px}
.lab{display:inline-block;min-width:3em;font-size:13px;color:var(--mute)}
.serif{font-family:"Source Serif 4",Georgia,serif;font-size:17px}
.exp{background:var(--soft);border-radius:8px;padding:12px 14px}
.exp p{margin:0 0 6px}.exp p:last-child{margin:0}
.pnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.exbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.timer{font:600 20px "Source Serif 4",Georgia,serif;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.setup{display:grid;gap:18px;max-width:640px}
.setup h3{margin:0 0 8px;font-size:16px}
.big{display:flex;align-items:baseline;gap:8px;margin:6px 0}
.big b{font:600 clamp(52px,9vw,72px)/1 "Source Serif 4",Georgia,serif;color:var(--teal)}
.big span{font-size:22px;color:var(--mute)}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 6px}
.fig{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.fig b{display:block;font:600 clamp(24px,3.4vw,32px)/1.15 "Source Serif 4",Georgia,serif}
.fig span{font-size:13px;color:var(--mute)}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) 4.6em 3.4em;gap:12px;align-items:center;min-height:36px;font-size:14px;text-decoration:none}
.bar i{display:block;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--teal)}
.bar .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar .m{text-align:right;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar:hover .bn{text-decoration:underline}
.bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:13px;color:var(--mute);margin-top:28px}
@media(max-width:900px){.cards{grid-template-columns:minmax(0,1fr)}.pgrid{grid-template-columns:minmax(0,1fr)}.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.mode{grid-template-columns:minmax(0,1fr)}.tocch ul{padding-left:0}.row{grid-template-columns:18px minmax(0,1fr) auto;row-gap:2px}.row .tag{grid-column:2;justify-self:start}.row .rt{grid-column:2}.row .lv{grid-column:3;grid-row:1}.bar{grid-template-columns:minmax(0,1fr) 4.4em 3.2em}.bar i{grid-column:1/-1;grid-row:2}.nav a{padding:10px 8px}.save{display:none}}
@media(prefers-reduced-motion:no-preference){.res{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="brand" href="#home">편입 영어 문법</a><nav class="nav" aria-label="주요 메뉴"><a href="#home" data-n="home">차례</a><a href="#exam" data-n="exam">모의고사</a><a href="#me" data-n="me">내 기록</a><span class="save" id="save">기록은 이 브라우저에 저장돼</span></nav></div></header>
<main id="app"></main>
<script>
{

const P=[{"id":"P174","c":1,"s":0,"k":"err","lv":0,"t":"무조건 ‘자동사 + 부사’","q":"[This type] of medicine really works [very good] if you [have got] anything on [the matter] with your throat.","a":1,"e":"이 문장에서 work는 '(약이) 효과가 있다'는 뜻이야. 이 뜻일 때는 목적어가 필요 없는 자동사로 쓰여.¶자동사 뒤에는 목적어도 보어도 오지 않으니, 뒤에 붙는 말은 '얼마나 잘 듣는지'를 꾸미는 부사여야 해. 그래서 good(형용사)이 아니라 well(부사).¶비교: work the machine(기계를 작동시키다)에서는 '작동시키다'라는 뜻의 타동사라 뒤에 목적어가 와.","h":["패턴: 무조건 ‘자동사 + 부사’","work + 부사"],"src":"패턴","pp":"패턴편 I 111쪽","x":"very well"},{"id":"P175","c":1,"s":0,"k":"err","lv":0,"t":"자동사 뒤: 부사 vs 형용사","q":"After [competing] in the Tour de France, Lance Armstrong reported that he [wasn't able to] bend his knees [for two entire days] and had to walk very [slow] to get around.","a":3,"e":"이 문장에서 walk는 '걷다'라는 뜻이야. 걷는 건 혼자 하는 동작이라 목적어가 필요 없는 자동사로 쓰여.¶자동사 뒤에는 '어떻게 걸었는지'를 꾸미는 부사만 올 수 있어. 그래서 slow(형용사)가 아니라 slowly.¶비교: walk the dog(개를 산책시키다)에서는 '산책시키다'라는 뜻의 타동사라 목적어가 와.","h":["패턴: 자동사 뒤: 부사 vs 형용사","walk + 부사"],"src":"패턴","pp":"패턴편 I 111쪽","x":"slowly"},{"id":"P176","c":1,"s":0,"k":"err","lv":0,"t":"자동사 뒤: 부사 vs 형용사","q":"He was looking [impatient] at the salesman, [who] showed [no signs] of [preparing] to leave the room.","a":0,"e":"뼈대: He was looking at the salesman. (그는 판매원을 보고 있었다)¶was looking은 be + -ing(진행형)라서 진짜 동사는 look이야. 여기서 look at은 '~을 보다'라는 동작이라, 뒤의 말은 '어떻게 보았는지'를 꾸미는 부사 impatiently가 와야 해.¶비교: He looked impatient.(초조해 보였다)에서 look은 '~해 보이다'라는 뜻이야. 이때는 주어의 상태를 말하는 보어가 필요해서 형용사가 와.","h":["패턴: 자동사 뒤: 부사 vs 형용사","look at + 부사"],"src":"패턴","pp":"패턴편 I 111쪽","x":"impatiently"},{"id":"P177","c":1,"s":0,"k":"err","lv":0,"t":"자동사 뒤: 부사 vs 형용사","q":"This is a wilderness of pipes, conduits and [ducts] - a [serpentine,] longitudinal paradise [where] a slim, youthful cobra might feel [analogical] at home.","a":3,"e":"뼈대: a cobra might feel at home. (코브라가 편안하게 느낄 수 있다)¶feel at home은 '편안하다'라는 한 덩어리 표현이야. analogical은 이 표현 전체를 '마찬가지로' 꾸며 주니까 부사 analogically.¶구별법: feel 바로 뒤에 보어(형용사)가 이미 at home으로 채워져 있어서, 그 앞에 끼는 말은 부사야.","h":["패턴: 자동사 뒤: 부사 vs 형용사","feel at home 수식"],"src":"패턴","pp":"패턴편 I 111쪽","x":"analogically"},{"id":"P178","c":1,"s":0,"k":"err","lv":0,"t":"자동사 뒤: 부사 vs 형용사","q":"Timbre is a peculiar blend of tones in [any sound;] it is [why] a tuba sounds so [differently] from a flute [even when] they are playing the same melody in the same key.","a":2,"e":"이 문장에서 sound는 '~하게 들리다'라는 뜻이야. 이 뜻일 때는 주어가 어떤 상태인지 말해 주는 보어가 꼭 있어야 하는 2형식으로 쓰여.¶보어 자리에는 형용사(또는 명사)가 오고, 부사는 못 와. 그래서 differently가 아니라 different(튜바 소리 = 다르다).¶비교: sound the alarm(경보를 울리다)에서는 '울리다'라는 뜻의 타동사라 뒤에 목적어가 와.","h":["패턴: 자동사 뒤: 부사 vs 형용사","sound + 형용사"],"src":"패턴","pp":"패턴편 I 111쪽","x":"different"},{"id":"P179","c":1,"s":0,"k":"err","lv":0,"t":"자동사 뒤: 부사 vs 형용사","q":"Even though it is true that as [people age,] they appear to gradually mellow and to feel [freer] to express their suppressed feelings, personality remains fairly [consistently,] and at the same time, though [many of] their manipulative skills decline, their capacity for learning [is likely to] remain intact.","a":2,"e":"이 문장에서 remain은 '(여전히) ~인 상태로 있다'는 뜻이야. 이 뜻일 때는 어떤 상태인지를 말해 주는 보어가 있어야 하는 2형식으로 쓰여.¶보어 자리라 형용사가 와야 해. 그래서 consistently(부사)가 아니라 consistent(성격 = 일정하다).¶비교: Only two cookies remain.(쿠키가 두 개 남아 있다)처럼 '남아 있다'라는 뜻이면 보어 없이도 문장이 끝나.","h":["패턴: 자동사 뒤: 부사 vs 형용사","remain + 형용사"],"src":"패턴","pp":"패턴편 I 111쪽","x":"consistent"},{"id":"P180","c":1,"s":0,"k":"blank","lv":0,"t":"자동사 뒤: 부사 vs 형용사","q":"Improvisation is an important part of jazz. This means that the musicians make the music up as they go along, or create the music on the spot. This is why a jazz song might _________ each time it is played.","a":3,"e":"might 뒤라 동사원형 sound가 와야 해.¶여기서 sound는 '~하게 들리다'라는 뜻이라 보어가 필요한 2형식으로 쓰여. 보어 자리라 형용사 different가 와(재즈곡 = 다르게 들린다).¶a little은 different를 꾸며 '조금'이라는 뜻을 더해. little만 쓰면 '거의 ~ 않다'라 뜻이 뒤집혀.","h":["패턴: 자동사 뒤: 부사 vs 형용사","sound + 형용사"],"src":"패턴","pp":"패턴편 I 112쪽","o":["sounds a little different","sound a little differently","sound little differently","sound a little different"]},{"id":"1-01","c":1,"s":0,"k":"err","lv":1,"t":"write가 1형식일 때","q":"This mechanical pencil [writes] very [smooth], so I [have used] it [for] years.","a":1,"x":"smoothly","h":["write, read, sell처럼 '~하게 써지다/읽히다/팔리다'로 쓰이는 1형식 동사를 떠올려 봐.","1형식 동사는 보어를 안 받으니까, 동사를 꾸미는 말은 부사여야 해."],"e":"이 문장에서 write는 '(펜이) 써지다'라는 뜻이야. 연필이 무언가를 쓰는 게 아니라 써지는 상태라 목적어가 없는 자동사로 쓰였어.¶자동사 뒤에는 '어떻게 써지는지'를 꾸미는 부사만 올 수 있어. 그래서 smooth가 아니라 smoothly.¶비교: write a letter(편지를 쓰다)에서는 '쓰다'라는 뜻의 타동사라 목적어가 와. 같은 원리로 This book reads easily.(쉽게 읽힌다)","src":"연습"},{"id":"1-02","c":1,"s":0,"k":"blank","lv":2,"t":"유도부사 there와 주어","q":"___ on the desk when I came into the office.","o":["There was the letter","There was a letter","A letter there was","There a letter was"],"a":1,"h":["There + be 구문의 주어로 어떤 명사가 오는지 생각해 봐.","처음 소개하는 불특정한 것이면 a/some, 이미 아는 특정한 것이면 there 구문을 안 써."],"e":"There + be 구문은 처음 소개하는 '어떤 것'이 있다고 말할 때 써.¶그래서 be 뒤 주어는 a letter처럼 불특정한 명사가 자연스러워. the letter, my letter처럼 특정한 건 The letter was on the desk.처럼 주어를 앞에 둬.¶A letter there was, There a letter was는 어순이 틀려.","src":"연습"},{"id":"1-03","c":1,"s":1,"k":"err","lv":1,"t":"오감동사의 보어","q":"Good medicine [tastes] [bitterly] [to] the [mouth].","a":1,"h":["taste, look, sound, smell, feel 뒤에 오는 말의 품사를 생각해 봐.","오감동사는 2형식이라 보어가 필요해."],"e":"이 문장에서 taste는 '~한 맛이 나다'라는 뜻이야. 이 뜻일 때는 '어떤 맛인지'를 말해 주는 보어가 있어야 하는 2형식으로 쓰여.¶보어 자리에는 형용사가 와야 해서 bitterly(부사)가 아니라 bitter(약 = 쓰다).¶비교: taste the soup(국 맛을 보다)에서는 '맛보다'라는 뜻의 타동사라 목적어가 와.","x":"bitter","src":"연습"},{"id":"1-04","c":1,"s":1,"k":"err","lv":2,"t":"오감동사 + 명사","q":"The night air [feels] [cool], and the moon [looks] [a coin] tonight.","a":3,"x":"like a coin","h":["오감동사 뒤에 명사가 바로 오면 어떻게 되는지 생각해 봐.","'~처럼 보이다'에 명사를 쓰려면 전치사가 하나 필요해."],"e":"이 문장에서 look은 '~해 보이다'라는 뜻이라 보어가 필요한 2형식으로 쓰여. 보어 자리에는 보통 형용사가 와(look happy).¶그런데 a coin은 명사라, '동전처럼'이라는 뜻을 만들려면 like를 붙여서 look like a coin.¶비교: feels cool은 feel(~하게 느껴지다) 뒤에 형용사 보어가 와서 맞아.","src":"연습"},{"id":"P183","c":1,"s":2,"k":"err","lv":0,"t":"‘자동사 + 전치사’","q":"When he [graduates college] he [will have to] decide [whether to continue] his studies or [seek employment.]","a":0,"e":"graduate는 '졸업하다'라는 뜻이야. 졸업은 내가 하는 일이고 학교를 '졸업시키는' 게 아니라서 목적어를 바로 받지 못하는 자동사로 쓰여.¶그래서 '어디를' 졸업하는지는 전치사 from으로 이어 줘야 해: graduate from college.¶비교: The school graduated 300 students.(학교가 학생을 졸업시켰다)처럼 '졸업시키다'라는 뜻이면 목적어를 받아.","h":["패턴: S + Vi + ⓟ + O","graduate from"],"src":"패턴","pp":"패턴편 I 115쪽","x":"graduates from college"},{"id":"P184","c":1,"s":2,"k":"err","lv":0,"t":"‘자동사 + 전치사’","q":"[Fieldwork] involves [participating] and [observing] the lives of people in the group the anthropologist [wishes] to study.","a":1,"e":"participate는 '참여하다'라는 뜻이야. 참여는 혼자 하는 행동이라 목적어를 바로 받지 못하는 자동사로 쓰여.¶그래서 '무엇에' 참여하는지는 in으로 이어 줘야 해: participating in. 반면 observe(관찰하다)는 관찰할 대상을 바로 받는 타동사라 그대로 the lives를 받아.¶두 동사가 the lives를 같이 쓰니까 participating in and observing the lives로 각자 필요한 걸 갖춰야 해.","h":["패턴: S + Vi + ⓟ + O","participate in"],"src":"패턴","pp":"패턴편 I 115쪽","x":"participating in"},{"id":"P185","c":1,"s":2,"k":"err","lv":0,"t":"‘타동사 + 전치사’","q":"This was at a time, just after the war, [when] economists, urban planners and social engineers believed that human affairs [could be] understood scientifically, and that the social sciences could [come to] [resemble with] hard sciences such as physics and chemistry.","a":3,"e":"resemble은 '~을 닮다'라는 뜻인데, 닮은 대상을 바로 목적어로 받는 타동사야.¶목적어를 바로 받으니까 사이에 전치사가 필요 없어: resemble hard sciences.¶우리말 '~와 닮다'의 '와' 때문에 with를 붙이기 쉬워. discuss, marry, approach, enter도 같은 실수를 노려.","h":["패턴: S + Vt + O","resemble은 타동사"],"src":"패턴","pp":"패턴편 I 117쪽","x":"resemble"},{"id":"P186","c":1,"s":2,"k":"err","lv":0,"t":"‘타동사 + 전치사’","q":"Moments before Shannon Lucid departed [on her first space mission,] a reporter [approached to her] and asked [what her thoughts were.] She replied that she was extremely proud [to participate] in such an important project.","a":1,"e":"approach는 '~에 다가가다'라는 뜻인데, 다가가는 대상을 바로 목적어로 받는 타동사야.¶그래서 사이에 to가 필요 없어: approached her.¶우리말 '~에게 다가가다'의 '에게' 때문에 to를 붙이기 쉬워.","h":["패턴: S + Vt + O","approach는 타동사"],"src":"패턴","pp":"패턴편 I 117쪽","x":"approached her"},{"id":"P187","c":1,"s":2,"k":"err","lv":0,"t":"‘타동사 + 전치사’","q":"[Our country's] economic situations are growing [worse and worse:] it is [high time] we [discussed about them] seriously.","a":3,"e":"discuss는 '~을 논의하다'라는 뜻으로, 논의할 거리를 바로 목적어로 받는 타동사야.¶목적어를 바로 받으니까 about이 필요 없어: discussed them.¶비교: talk about them은 talk가 목적어를 바로 받지 못해서 about이 필요해. 뜻은 비슷해도 구조가 달라.","h":["패턴: S + Vt + O","discuss는 타동사"],"src":"패턴","pp":"패턴편 I 117쪽","x":"discussed them"},{"id":"P188","c":1,"s":2,"k":"err","lv":0,"t":"‘타동사 + 전치사’","q":"[The number] of foreign workers that [are allowed] to [enter into] the country [has] decreased.","a":2,"e":"'그 나라에 들어가다'는 enter the country로 전치사 없이 써.¶enter into는 '(계약·협상 등을) 시작하다'라는 다른 뜻이야: enter into an agreement.¶뼈대: The number of workers has decreased. (노동자 수가 줄었다) 주어가 The number라 has가 맞아.","h":["패턴: S + Vt + O","enter는 타동사"],"src":"패턴","pp":"패턴편 I 117쪽","x":"enter"},{"id":"P189","c":1,"s":2,"k":"err","lv":0,"t":"‘타동사 + 전치사’","q":"The thief undoubtedly [waited for] Mr. Smith to go out and entered [by] the back window and [removed] the silver without ever [been seen.]","a":3,"e":"뼈대: The thief entered ~ without ever being seen. (한 번도 들키지 않고)¶without은 전치사라 뒤에 동명사가 와. 도둑이 '보이는' 쪽이니까 수동 동명사 being seen.¶been seen은 동명사가 아니라 완료형의 일부라 혼자 쓸 수 없어.","h":["패턴: S + Vt + O","전치사 + 동명사"],"src":"패턴","pp":"패턴편 I 117쪽","x":"being seen"},{"id":"P192","c":1,"s":2,"k":"blank","lv":0,"t":"동사의 선택","q":"He tried unsuccessfully to ________ his friend from joining the marines.","a":0,"e":"빈칸 뒤 from joining이 단서야. 'A가 ~하지 못하게 말리다'는 dissuade A from -ing.¶convince는 convince A to R(설득해서 ~하게 하다), ask는 ask A to R. from과 짝이 되는 동사는 dissuade야.¶같은 부류: prevent/stop/keep/discourage A from -ing.","h":["패턴: S + Vt + A  from  B","dissuade A from B"],"src":"패턴","pp":"패턴편 I 121쪽","o":["dissuade","make","convince","ask"]},{"id":"P193","c":1,"s":2,"k":"blank","lv":0,"t":"전치사의 선택","q":"She has given me the inch, and no precaution could prevent _________?","a":0,"e":"prevent A from -ing = A가 ~하지 못하게 하다.¶그래서 prevent me from taking the ell(내가 더 많이 가져가는 걸 막다).¶순서 기억: 동사 + 사람 + from + -ing. (속담 Give him an inch and he'll take an ell. 한 치를 주면 한 자를 가져간다)","h":["패턴: S + Vt + A  from  B","prevent A from -ing"],"src":"패턴","pp":"패턴편 I 121쪽","o":["me from taking the ell","the ell taking from me","taking the ell from me","from me the ell taking"]},{"id":"P194","c":1,"s":2,"k":"blank","lv":0,"t":"전치사의 선택","q":"The driver of the other car accused me ________ the accident.","a":3,"e":"accuse A of B = B 때문에 A를 비난하다(고발하다).¶of는 전치사라 뒤에 동명사: accused me of causing the accident.¶같은 부류: 사람 + of + 이유를 쓰는 동사 → suspect A of B, convict A of B.","h":["패턴: S + Vt + A  from  B","accuse A of B"],"src":"패턴","pp":"패턴편 I 121쪽","o":["to cause","causing","cause","of causing"]},{"id":"P195","c":1,"s":2,"k":"blank","lv":0,"t":"전치사의 선택","q":"The school provides all its students _______ textbooks.","a":2,"e":"provide A with B = A에게 B를 제공하다.¶학생들(A)에게 교과서(B)를 주는 거라 provides all its students with textbooks.¶같은 뜻 다른 형태: provide B for(to) A → provides textbooks for its students.","h":["패턴: S + Vt + A  from  B","provide A with B"],"src":"패턴","pp":"패턴편 I 121쪽","o":["in","for","with","by"]},{"id":"P196","c":1,"s":2,"k":"blank","lv":0,"t":"전치사의 선택","q":"Many of us believe that a man without an education is an unfortunate victim of adverse circumstances deprived ________ one of the greatest 20th-century opportunities.","a":1,"e":"deprive A of B = A에게서 B를 빼앗다. 수동이 되면 A is deprived of B.¶교육 없는 사람이 기회를 '빼앗긴' 거라 deprived of.¶같은 부류(빼앗다, 없애다 + of): rob A of B, rid A of B, strip A of B.","h":["패턴: S + Vt + A  from  B","deprive A of B"],"src":"패턴","pp":"패턴편 I 121쪽","o":["from","of","with","by"]},{"id":"P197","c":1,"s":2,"k":"err","lv":0,"t":"전치사의 선택","q":"Members of the staff [of the District Attorney] made more than $100,000 from a [get-rich-quick] scheme in which investors were bilked [with] about [$1-million.]","a":2,"e":"bilk A of B = A에게서 B를 사취하다(사기로 빼앗다).¶투자자들이 100만 달러를 사기당한 거라 수동 were bilked of about $1-million.¶같은 부류: rob A of B, deprive A of B처럼 '빼앗다'는 of와 짝이야.","h":["패턴: S + Vt + A  from  B","bilk A of B"],"src":"패턴","pp":"패턴편 I 122쪽","x":"of"},{"id":"P198","c":1,"s":2,"k":"err","lv":0,"t":"전치사의 선택","q":"[Unlike] oxygen, which is [chemically] transformed by our bodies [with] carbon dioxide, nitrogen is [merely] exhaled back [into] the air.","a":2,"e":"transform A into B = A를 B로 바꾸다.¶산소가 몸속에서 이산화탄소로 '바뀌는' 거라 transformed into carbon dioxide.¶같은 부류(변화 + into): change/turn/convert A into B.","h":["패턴: S + Vt + A  from  B","transform A into B"],"src":"패턴","pp":"패턴편 I 122쪽","x":"into"},{"id":"P199","c":1,"s":2,"k":"blank","lv":0,"t":"주의해야할 형태","q":"The black-billed cuckoo has been known to steal eggs ________ to other birds.","a":0,"e":"belong은 '~에 속하다'라는 뜻이야. 속하는 건 당하는 일이 아니라서 목적어를 받지 않는 자동사로 쓰이고, 수동형(be belonged)도 없어.¶그래서 eggs를 꾸밀 때 과거분사 belonged는 못 쓰고 현재분사 belonging to를 써.¶that belonged는 형태는 되지만 과거라서, '훔치곤 한다'는 현재의 습성과 시제가 안 맞아.","h":["패턴: S + Vt + A  from  B","steal eggs belonging to"],"src":"패턴","pp":"패턴편 I 122쪽","o":["belonging","belonged","from belonging","that belonged"]},{"id":"1-05","c":1,"s":2,"k":"err","lv":2,"t":"전치사를 쓰지 않는 타동사","q":"We [spent] hours [in] the meeting room [trying to reach] a decision, but we only [discussed about] the budget.","a":3,"x":"discussed","h":["우리말로는 '~에 대해'가 붙지만 영어로는 바로 목적어를 받는 동사가 있어.","discuss, mention, marry, resemble, approach, enter, attend, reach"],"e":"discuss는 '~을 논의하다'라는 뜻으로, 논의할 거리를 바로 목적어로 받는 타동사야.¶그래서 about 없이 discussed the budget.¶우리말 '~에 대해 논의하다' 때문에 about을 붙이기 쉬워. 비교: talk about은 talk가 목적어를 바로 못 받아서 about이 필요해.","src":"연습"},{"id":"1-06","c":1,"s":2,"k":"blank","lv":2,"t":"explain은 4형식 불가","q":"He ___ his situation in detail.","o":["explained me","explained to me","explained me about","explained for me"],"a":1,"h":["explain이 간접목적어(사람)를 바로 받을 수 있는지 생각해 봐.","explain, say, suggest, describe, announce는 4형식이 안 돼."],"e":"explain은 '~을 설명하다'라는 뜻이라 뒤에 설명할 내용(목적어)을 받아: explain his situation.¶그런데 explain은 tell처럼 '누구에게'를 목적어 자리에 바로 붙이는 4형식으로는 쓰지 않아. 그래서 사람은 to + 사람으로 따로 붙여: explained to me his situation.¶비교: tell은 tell me the story처럼 사람을 바로 붙일 수 있어. 둘 다 '알려 주다'지만 구조가 달라.","src":"연습"},{"id":"1-07","c":1,"s":2,"k":"blank","lv":2,"t":"become이 아니라 come to","q":"He came ___ the fact after the trial.","a":0,"h":["'~하게 되다'를 동사 + 부정사로 표현할 때 쓰는 동사야.","become to R은 틀린 표현이고 come/get/learn to R을 써."],"e":"'~하게 되다'는 come to + 동사원형.¶He came to know the fact. (그는 그 사실을 알게 되었다)¶become은 뒤에 to부정사를 못 받아서 became to know (X). get to R, learn to R도 '~하게 되다'.","o":["to know","knowing","know","to knowing"],"src":"연습"},{"id":"1-08","c":1,"s":2,"k":"err","lv":1,"t":"타동사 + 부사 + 대명사","q":"There was a switch [on] the wall, [so] they [turned on it] [quickly].","a":2,"h":["turn on은 '타동사 + 부사'로 된 구동사야.","목적어가 대명사일 때 위치가 정해져 있어."],"e":"turn on은 동사(turn) + 부사(on)로 된 구동사야.¶목적어가 it 같은 대명사면 반드시 가운데에 넣어: turned it on.¶명사면 둘 다 돼: turned on the light / turned the light on. (put on, give up, pick up도 같아)","x":"turned it on","src":"연습"},{"id":"P190","c":1,"s":3,"k":"err","lv":0,"t":"‘to'의 필요성","q":"The robber [admitted] the detective that she was [the one] who [had stolen] the diamond necklace [from the display.]","a":0,"e":"admit은 '~을 인정하다'라는 뜻이라, 인정하는 내용(that절)을 목적어로 받아.¶그런데 '누구에게' 인정하는지를 목적어 자리에 바로 붙이지는 못해. 그래서 사람은 to + 사람: admitted to the detective that ~.¶비교: tell the detective that ~ 처럼 tell은 사람을 바로 붙일 수 있어.","h":["패턴: S + Vt + 내용  (to 대상)/ S + Vt + (to 대상)  내용","admit to + 사람 + that절"],"src":"패턴","pp":"패턴편 I 119쪽","x":"admitted to"},{"id":"P191","c":1,"s":3,"k":"blank","lv":0,"t":"‘to'의 선택","q":"The doctor explained _________ that we should have a complete, physical examination once a year.","a":3,"e":"explain은 설명할 내용을 목적어로 받고, '누구에게'는 바로 붙이지 못해.¶그래서 사람은 to + 사람으로 따로 붙여: explained to us that ~.¶explain us, explain for us는 안 돼.","h":["패턴: S + Vt + 내용  (to 대상)/ S + Vt + (to 대상)  내용","explain to + 사람"],"src":"패턴","pp":"패턴편 I 119쪽","o":["us","at us","for us","to us"]},{"id":"P200","c":1,"s":3,"k":"blank","lv":0,"t":"짧은 동사의 필요성","q":"The teacher _____ them the answer to the question.","a":3,"e":"빈칸 뒤에 them(누구에게) + the answer(무엇을)가 바로 이어져. 이렇게 '누구에게 + 무엇을'을 둘 다 바로 받으려면 4형식으로 쓰이는 동사여야 해.¶보기 중 그게 되는 건 tell: told them the answer.¶said, explained, mentioned는 '누구에게'를 바로 받지 못해서 to them이 필요해.","h":["패턴: S + Vt + A  B  → S + Vt B to A","tell + 사람 + 사물"],"src":"패턴","pp":"패턴편 I 125쪽","o":["said","explained","mentioned","told"]},{"id":"P201","c":1,"s":3,"k":"blank","lv":0,"t":"짧은 동사의 필요성","q":"His negative attitude toward social welfare legislation, based entirely on his perception of himself as a self­made man, __________ him the support of the voters in the State’s economically depressed urban areas.","a":1,"e":"cost는 '(비용·대가가) ~에게 …을 치르게 하다'라는 뜻이야. 이 뜻일 때는 '누구에게 + 무엇을'을 둘 다 바로 받아.¶그래서 cost him the support of the voters (그에게 유권자의 지지를 잃게 했다).¶비교: It cost ten dollars.(10달러가 들었다)처럼 가격만 말할 때는 목적어가 하나야.","h":["패턴: S + Vt + A  B  → S + Vt B to A","cost + 사람 + 대가"],"src":"패턴","pp":"패턴편 I 125쪽","o":["entitled","cost","divested","evoked","replicated"]},{"id":"P202","c":1,"s":3,"k":"blank","lv":0,"t":"짧은 동사의 문형","q":"“What did you get your daughter for her birthday?” “She has always wanted a bicycle so I finally ______.”","a":3,"e":"give는 '누구에게 + 무엇을'을 둘 다 바로 받을 수 있어: gave her one.¶사람을 뒤로 보내려면 to를 붙여: gave one to her.¶두 방식을 섞은 gave to her one은 어순이 꼬여서 틀려.","h":["패턴: S + Vt + A  B  → S + Vt B to A","gave her one"],"src":"패턴","pp":"패턴편 I 125쪽","o":["gave one her","to her gave one","gave to her one","gave her one","her gave one"]},{"id":"P203","c":1,"s":3,"k":"blank","lv":0,"t":"짧은 동사의 문형","q":"\"I doubt if Korean teachers can actually conduct classes in English effectively,\" says Park Young-ju, who ________ to a private English institute.","a":2,"e":"두 가지를 봐야 해.¶1) send A to B: 딸(A)을 학원(B)에 보내다 → sends her daughter to ~. sends to her daughter는 뜻이 달라져.¶2) 하이픈으로 묶인 '숫자-명사'가 명사 앞에서 꾸밀 때는 단수: five-year-old daughter.","h":["패턴: S + Vt + A  B  → S + Vt B to A","send + 사람 + 장소, five-year-old"],"src":"패턴","pp":"패턴편 I 125쪽","o":["sends her five-years-old daughter","sends to her five-years-old daughter","sends her five-year-old daughter","sends to her five-year-old daughter"]},{"id":"P242","c":1,"s":3,"k":"blank","lv":0,"t":"패턴편 문제","q":"After the great blizzard of 1888 in the northeasten United States, it took some ________ the snow away from their homes.","a":1,"e":"It takes + 사람 + 시간 + to R = (사람이) ~하는 데 (시간이) 걸리다.¶그래서 it took some people several days to shovel ~ (몇몇 사람이 눈을 치우는 데 며칠 걸렸다).¶순서 기억: took + 누가 + 얼마나 + to 무엇.","h":["패턴: 패턴편 문제","It takes + 사람 + 시간 + to R"],"src":"패턴","pp":"패턴편 I 143쪽","o":["days to shovel people several","people several days to shovel","several days people to shovel","people to shovel several days"]},{"id":"1-09","c":1,"s":3,"k":"err","lv":3,"t":"take의 4형식","q":"It will [take] an hour [to you] [to get] there [by bus].","a":1,"x":"(to 없이) It will take you an hour to get there.","h":["'사람이 ~하는 데 시간이 걸리다'의 어순을 떠올려 봐.","It takes + 사람 + 시간 + to R"],"e":"It takes + 사람 + 시간 + to R = 사람이 ~하는 데 시간이 걸리다.¶사람 앞에 to를 붙이지 않고, 사람이 시간보다 먼저 와: It will take you an hour to get there.¶사람을 빼고 It will take an hour to get there.라고 해도 돼.","src":"연습"},{"id":"P181","c":1,"s":4,"k":"err","lv":0,"t":"타동사 + 목적어 뒤: 부사 vs 형용사","q":"[Greater] speed and weight of [modern] aircraft [have made] larger and more durable runways [necessarily.]","a":3,"e":"make에는 여러 뜻이 있는데, 이 문장에서는 '~을 …하게 만들다'라는 뜻이야. 이 뜻일 때는 목적어(runways) 다음에 그 목적어가 어떤 상태가 되는지 말해 주는 말이 필요해.¶목적어의 상태를 말하는 자리라 형용사 necessary(활주로 = 필요하다).¶비교: make a cake(케이크를 만들다)처럼 '만들다'라는 뜻이면 목적어 하나로 끝나.","h":["패턴: 타동사 + 목적어 뒤: 부사 vs 형용사","make + O + 형용사"],"src":"패턴","pp":"패턴편 I 112쪽","x":"necessary"},{"id":"P182","c":1,"s":4,"k":"err","lv":0,"t":"타동사 + 목적어 뒤: 부사 vs 형용사","q":"She [said] that I [played] my radio [too] [loud.]","a":3,"e":"play my radio(라디오를 틀다)에서 play는 '(라디오를) 틀다'라는 뜻이고 목적어 my radio로 의미가 완성돼.¶그 뒤의 말은 라디오의 상태가 아니라 '어떻게 틀었는지'를 꾸미니까 부사 loudly.¶비교: The radio is loud.(라디오가 시끄럽다)처럼 주어의 상태를 말할 때는 형용사.","h":["패턴: 타동사 + 목적어 뒤: 부사 vs 형용사","play + 목적어 + 부사"],"src":"패턴","pp":"패턴편 I 112쪽","x":"loudly"},{"id":"P204","c":1,"s":4,"k":"err","lv":0,"t":"‘as'의 필요한 경우","q":"[Certain] zoologists regard crows and ravens [are] the most [intelligent] of [birds.]","a":1,"e":"regard A as B = A를 B로 여기다.¶그래서 regard crows and ravens as the most intelligent of birds.¶같은 부류(as가 필요한 동사): think of / look upon / see / refer to A as B.","h":["패턴: S + Vt + A = B","regard A as B"],"src":"패턴","pp":"패턴편 I 127쪽","x":"as"},{"id":"P205","c":1,"s":4,"k":"err","lv":0,"t":"‘as'의 필요한 경우","q":"The result is [what] he [referred to] a cultural bouillabass, [yet] members of the nation's educational and cultural elect still [cling to] the notion that the nation belongs to Western civilization.","a":1,"e":"refer to A as B = A를 B라고 부르다.¶what he referred to as a cultural bouillabaisse(그가 '문화적 부야베스'라고 부른 것). as가 빠져서 틀렸어.¶같은 부류: regard A as B, think of A as B.","h":["패턴: S + Vt + A = B","refer to A as B"],"src":"패턴","pp":"패턴편 I 127쪽","x":"referred to as"},{"id":"P206","c":1,"s":4,"k":"err","lv":0,"t":"‘as'가 필요없는 경우","q":"Traditional healers were called [as] witch doctors by the colonizers, [who] viewed [their] medical practices [as inferior.]","a":0,"e":"call이 '~을 …라고 부르다'라는 뜻일 때는 목적어 바로 뒤에 부르는 이름이 와: call A B.¶그래서 수동이 되어도 as 없이 were called witch doctors.¶비교: regard A as B, refer to A as B는 as가 있어야 '~로'라는 뜻이 이어져. call은 as 없이도 그 뜻이 되는 동사야.","h":["패턴: S + Vt + A = B","call A B는 as 없이"],"src":"패턴","pp":"패턴편 I 127쪽","x":"(as 삭제)"},{"id":"P207","c":1,"s":4,"k":"blank","lv":0,"t":"'that'이 있는 경우","q":"If you think that these things ________ only on television, you are wrong.","a":0,"e":"빈칸은 that절 안의 동사 자리야. these things(이런 일들)가 주어야.¶happen은 '(일이) 일어나다'라는 뜻이라 누가 일으키는 게 아니라 스스로 일어나는 거야. 그래서 목적어가 없고 수동태(are happened)로도 못 써.¶일반적인 이야기라 현재 happen.","h":["패턴: 1) S + Vt + that S + V ~","that절 안의 동사"],"src":"패턴","pp":"패턴편 I 129쪽","o":["happen","to happen","happening","are happened"]},{"id":"P208","c":1,"s":4,"k":"blank","lv":0,"t":"'that'이 있는 경우","q":"The employer wanted _______ quickly and without mistakes.","a":2,"e":"want는 that절을 목적어로 잘 받지 않아.¶want + 목적어 + 과거분사 = 목적어가 ~되기를 원하다 → wanted the job done(일이 처리되기를 원했다).¶일은 '처리되는' 대상이라 수동 done.","h":["패턴: 1) S + Vt + that S + V ~","want + O + p.p."],"src":"패턴","pp":"패턴편 I 129쪽","o":["that the job is done","that the job to be done","the job done","that the job was done"]},{"id":"P209","c":1,"s":4,"k":"blank","lv":0,"t":"‘O’가 있는 경우","q":"My father believed that family members should help each other and made us _______ some chores every Saturdays.","a":2,"e":"make는 사역동사라 make + 목적어 + 동사원형.¶made us do some chores (우리에게 집안일을 하게 했다).¶to do는 안 돼. 수동이 되면 We were made to do ~ 로 to가 생겨.","h":["패턴: 1) S + Vt + that S + V ~","make + O + 원형"],"src":"패턴","pp":"패턴편 I 129쪽","o":["to do","does","do","did"]},{"id":"P210","c":1,"s":4,"k":"err","lv":0,"t":"‘O’가 있는 경우","q":"In his book, he looks [at language] as the key to intercultural [understanding] and urges us [never cut back] on [foreign language programs.]","a":2,"e":"urge + 사람 + to R = 사람에게 ~하라고 촉구하다.¶부정어 never는 to 앞에 둬: urges us never to cut back.¶같은 부류: ask, tell, advise, encourage + 사람 + to R.","h":["패턴: 1) S + Vt + that S + V ~","urge + O + to R"],"src":"패턴","pp":"패턴편 I 129쪽","x":"never to cut back"},{"id":"P211","c":1,"s":4,"k":"err","lv":0,"t":"시제의 유·무를 고려하는 경우","q":"[In the early days] of the airlines, money [earned from] carrying mail kept planes [fly] because [paying] passengers [were] not common.","a":2,"e":"keep + 목적어 + -ing = 목적어가 계속 ~하게 하다.¶money ~ kept planes flying (돈이 비행기를 계속 날게 했다).¶fly는 동사원형이라 이 자리에 못 와. 비행기가 '나는' 능동이니까 flying.","h":["패턴: 1) S + Vt + that S + V ~","keep + O + -ing"],"src":"패턴","pp":"패턴편 I 129쪽","x":"flying"},{"id":"P212","c":1,"s":4,"k":"err","lv":0,"t":"시제의 유·무를 고려하는 경우","q":"The United States and Britain [both] say they expect NATO enlargement [leads] to increases in the alliance's collective budget [but] believe the expenses will be [manageable.]","a":1,"e":"expect + 목적어 + to R = 목적어가 ~할 거라고 기대하다.¶expect NATO enlargement to lead to increases (나토 확장이 예산 증가로 이어질 거라 예상한다).¶leads는 동사 형태라 목적어 뒤 자리에 못 와.","h":["패턴: 1) S + Vt + that S + V ~","expect + O + to R"],"src":"패턴","pp":"패턴편 I 129쪽","x":"to lead"},{"id":"P213","c":1,"s":4,"k":"blank","lv":0,"t":"시제의 유·무를 고려하는 경우","q":"The teacher saw, out of the corner of his eyes, someone ______ pass a note to someone else.","a":0,"e":"see + 목적어 + -ing = 목적어가 ~하고 있는 걸 보다 (지각동사).¶saw someone trying to pass a note (누군가 쪽지를 건네려는 걸 봤다).¶to try to는 지각동사 뒤에 못 오고, is trying / who try는 동사 형태가 안 맞아.","h":["패턴: 1) S + Vt + that S + V ~","see + O + -ing"],"src":"패턴","pp":"패턴편 I 130쪽","o":["trying to","is trying to","to try to","who try to"]},{"id":"P214","c":1,"s":4,"k":"blank","lv":0,"t":"시제의 유·무를 고려하는 경우","q":"\"Isn't that our plane?\" \"Yes, let's go. Maybe we'll find Jerry ____________ at the gate.\"","a":3,"e":"find + 목적어 + -ing = 목적어가 ~하고 있는 걸 발견하다.¶find Jerry waiting for us (Jerry가 우리를 기다리고 있는 걸 발견하다).¶목적어 뒤에 is waiting처럼 동사 형태가 올 수 없어.","h":["패턴: 1) S + Vt + that S + V ~","find + O + -ing"],"src":"패턴","pp":"패턴편 I 130쪽","o":["to have waited for us","is waiting for us","waited for us","waiting for us"]},{"id":"P215","c":1,"s":4,"k":"blank","lv":0,"t":"능·수동을 고려하는 경우","q":"Our priest is always raising money for one cause or another, but he has never managed to get enough money to have the church clock _______.","a":0,"e":"have + 목적어 + 과거분사 = 목적어가 ~되게 하다.¶시계는 '수리되는' 대상이라 have the church clock repaired.¶구별법: 목적어가 스스로 하면 원형(have him repair), 목적어가 당하면 p.p.(have it repaired).","h":["패턴: 1) S + Vt + that S + V ~","have + O + p.p."],"src":"패턴","pp":"패턴편 I 130쪽","o":["repaired","repairing","repair","to repair"]},{"id":"P216","c":1,"s":4,"k":"err","lv":0,"t":"능·수동을 고려하는 경우","q":"[To] see so much power [combining] [with] such lack [of] foresight is really disquieting for us Europeans.","a":1,"e":"see + 목적어 + 분사에서 목적어와 분사의 관계를 봐.¶권력이 선견지명 부족과 '결합된' 거라 수동 combined (with).¶구별법: power combines(스스로 결합하다)보다 power is combined with(~와 결합되다)가 자연스러워.","h":["패턴: 1) S + Vt + that S + V ~","see + O + p.p."],"src":"패턴","pp":"패턴편 I 130쪽","x":"combined"},{"id":"P217","c":1,"s":4,"k":"blank","lv":0,"t":"능·수동을 고려하는 경우","q":"\"Don't touch the gold.\" \"Certainly, I'll not let the gold ________.\"","a":2,"e":"let + 목적어 + 동사원형. 그런데 금은 '만져지는' 대상이라 수동 원형 be touched.¶let the gold be touched (금이 만져지게 두다).¶let 뒤에는 to가 오지 않아서 to be touched는 틀려.","h":["패턴: 1) S + Vt + that S + V ~","let + O + be p.p."],"src":"패턴","pp":"패턴편 I 130쪽","o":["touch","to touch","be touched","to be touched"]},{"id":"P218","c":1,"s":4,"k":"blank","lv":0,"t":"능·수동을 고려하는 경우","q":"I lost my key. I will have to _______.","a":3,"e":"열쇠는 내가 직접 만드는 게 아니라 열쇠집에서 '만들어지게' 하는 거야.¶have + 목적어 + 과거분사: have another key made.¶make another key는 내가 직접 깎는다는 뜻이 돼.","h":["패턴: 1) S + Vt + that S + V ~","have + O + p.p."],"src":"패턴","pp":"패턴편 I 130쪽","o":["cut another key","make another key","copy another key","have another key made"]},{"id":"P219","c":1,"s":4,"k":"err","lv":0,"t":"지각·사역를 고려하는 경우","q":"[Thanks to] the often dreadful, although lifesaving, nature of diagnostic tests, many of us are becoming [experts at the art] of procrastination. Who can be blamed for [letting \"colonoscopy\" to slip] to the bottom of the [to-do list]?","a":2,"e":"let은 사역동사라 let + 목적어 + 동사원형 (to 없이).¶letting colonoscopy slip (대장내시경을 뒤로 밀리게 두다).¶to slip처럼 to를 붙이면 틀려. make, have도 같아.","h":["패턴: 1) S + Vt + that S + V ~","let + O + 원형"],"src":"패턴","pp":"패턴편 I 131쪽","x":"letting \"colonoscopy\" slip"},{"id":"P220","c":1,"s":4,"k":"blank","lv":0,"t":"지각·사역를 고려하는 경우","q":"The fact is that ice cream was first created in the Orient. The great Venetian explorer Marco Polo saw people __________ it there and brought back the idea to Italy.","a":2,"e":"see + 목적어 + -ing = 목적어가 ~하고 있는 걸 보다.¶Marco Polo saw people eating it (사람들이 그걸 먹고 있는 걸 봤다).¶eats, ate는 동사 형태라 못 오고, eaten은 사람이 먹히는 뜻이 돼.","h":["패턴: 1) S + Vt + that S + V ~","see + O + -ing"],"src":"패턴","pp":"패턴편 I 131쪽","o":["eats","ate","eating","eaten"]},{"id":"P221","c":1,"s":4,"k":"err","lv":0,"t":"지각·사역를 고려하는 경우","q":"Although seven [out of] ten parents scored an A or B for [acceptance] their kids [as they were,] kids said they felt pressure [to conform to] their parents.","a":1,"e":"전치사 for 뒤에서 목적어 their kids를 받아야 해.¶명사 acceptance는 목적어를 직접 받을 수 없으니 동명사 accepting.¶accepting their kids as they were (아이들을 있는 그대로 받아들이는 것).","h":["패턴: 1) S + Vt + that S + V ~","전치사 + 동명사 + 목적어"],"src":"패턴","pp":"패턴편 I 131쪽","x":"accepting"},{"id":"P222","c":1,"s":4,"k":"err","lv":0,"t":"지각·사역를 고려하는 경우","q":"The government feels the fee [being] fair since it [goes] towards [paying] for the services the government [provides] to new immigrants, [such as] language classes.","a":0,"e":"feel + 목적어 + (to be) 형용사 = 목적어가 ~하다고 느끼다(생각하다).¶feels the fee (to be) fair (요금이 공정하다고 여긴다).¶being은 이 자리에 쓰지 않아.","h":["패턴: 1) S + Vt + that S + V ~","feel + O + (to be) 형용사"],"src":"패턴","pp":"패턴편 I 131쪽","x":"to be"},{"id":"P223","c":1,"s":4,"k":"err","lv":0,"t":"시간 순서 개념을 고려하는 경우","q":"The desire to [make a] profit [motivates] business executives [organizing] and operate their firms [efficiently.]","a":2,"e":"motivate + 사람 + to R = 사람이 ~하도록 동기를 부여하다.¶and 뒤 operate(원형)와 나란히 가야 하니 to organize and (to) operate.¶organizing은 형태가 맞지 않아.","h":["패턴: 1) S + Vt + that S + V ~","motivate + O + to R"],"src":"패턴","pp":"패턴편 I 131쪽","x":"to organize"},{"id":"P224","c":1,"s":4,"k":"blank","lv":0,"t":"시간 순서 개념을 고려하는 경우","q":"My mother advised me _________ because of my health.","a":2,"e":"advise + 사람 + to R, 그리고 quit는 뒤에 동명사를 받아.¶advised me to quit smoking (담배를 끊으라고 충고했다).¶quit to smoke는 '담배 피우려고 그만두다'라는 엉뚱한 뜻이 돼.","h":["패턴: 1) S + Vt + that S + V ~","advise + O + to R, quit -ing"],"src":"패턴","pp":"패턴편 I 132쪽","o":["to quit to smoke","quitting smoking","to quit smoking","do not to smoke"]},{"id":"P225","c":1,"s":4,"k":"err","lv":0,"t":"가목적어 ‘it'이 필요한 경우","q":"The proximity of the two men’s ideas [on] many subjects [made easy] [for them] to work together during [that critical period] of our history.","a":1,"e":"make + 목적어 + 형용사에서 목적어가 to부정사면 그 자리에 가짜 목적어 it을 두고 to부정사를 뒤로 보내.¶made it easy for them to work together.¶it이 빠지면 무엇을 쉽게 만들었는지가 사라져.","h":["패턴: S + Vt + it + a + to R ~","가목적어 it"],"src":"패턴","pp":"패턴편 I 135쪽","x":"made it easy"},{"id":"P226","c":1,"s":4,"k":"blank","lv":0,"t":"가목적어 ‘it'이 필요없는 경우","q":"By killing much of the population of the Wampanoag confederacy, the epidemic that raged from 1616-19 _______ the first permanent European settlement in North America.","a":2,"e":"목적어가 명사구(the first permanent settlement)일 때는 가목적어 it이 필요 없어.¶목적어가 길어서 형용사 possible이 앞으로 나간 것: made possible the first settlement (= made the first settlement possible).¶가목적어 it은 목적어가 to부정사·that절일 때만 써.","h":["패턴: S + Vt + it + a + to R ~","made possible + 명사"],"src":"패턴","pp":"패턴편 I 135쪽","o":["made it possible for","made it possible","made possible","made it possible that"]},{"id":"P239","c":1,"s":4,"k":"blank","lv":0,"t":"패턴편 문제","q":"Humus, a substance found in soil, is soft and spongy and _______ through which they absorb water and food.","a":3,"e":"is soft and spongy and ___ 에서 and 뒤에도 동사가 와야 해. 그래서 enables.¶enable + 목적어 + to R = 목적어가 ~할 수 있게 하다: enables plants to send out tiny hairs.¶through which they(=plants) absorb ~ 와도 이어져.","h":["패턴: 패턴편 문제","enable + O + to R"],"src":"패턴","pp":"패턴편 I 143쪽","o":["enabling plant roots to send out tiny hairs","enables plant roots of sending out tiny hairs","enables sending out tiny hairs plant roots","enables plants to send out tiny hairs"]},{"id":"P240","c":1,"s":4,"k":"blank","lv":0,"t":"패턴편 문제","q":"The purpose of this survey is _________ the residents know about the budget of their local government.","a":3,"e":"The purpose is to R = 목적은 ~하는 것이다.¶to find out how much the residents know (주민들이 얼마나 아는지 알아내는 것).¶how much 뒤는 주어 + 동사(the residents know) 순서야.","h":["패턴: 패턴편 문제","보어 자리 to부정사"],"src":"패턴","pp":"패턴편 I 143쪽","o":["finding out how much of","how much to find out","to find how to discover","to find out how much"]},{"id":"P241","c":1,"s":4,"k":"blank","lv":0,"t":"패턴편 문제","q":"Any critic, teacher, librarian, or poet who hopes to broaden poetry's audience faces the difficult challenge of persuading skeptical readers ____________.","a":0,"e":"persuade + 사람 + that절 = 사람에게 ~라고 설득하다(납득시키다).¶persuading skeptical readers that poetry is important today.¶persuade + 사람 + to R은 '~하도록 설득하다'라 for poetry to be ~ 같은 형태는 안 돼.","h":["패턴: 패턴편 문제","persuade + O + that절"],"src":"패턴","pp":"패턴편 I 143쪽","o":["that poetry is important today","for poetry to be important today","to be important poetry today","poetry that is important today"]},{"id":"P243","c":1,"s":4,"k":"blank","lv":0,"t":"패턴편 문제","q":"Astronomers name meteor showers after the constellation from which ______________.","a":1,"e":"appear to R = ~하는 것처럼 보이다.¶from which they appear to originate (그것들이 비롯되는 것처럼 보이는 곳).¶관계절 안이라 의문문 어순(do they)은 안 되고, 주어 they는 meteor showers야.","h":["패턴: 패턴편 문제","appear to R"],"src":"패턴","pp":"패턴편 I 144쪽","o":["they originate to appear","they appear to originate","do they originate to appear","it appears to origiante"]},{"id":"1-10","c":1,"s":4,"k":"blank","lv":2,"t":"무생물 주어의 사역","q":"The earthquake ___ the floor shake for almost a minute.","o":["had","made","got","forced"],"a":1,"h":["뒤에 동사원형(shake)이 왔으니 원형부정사를 받는 사역동사가 필요해.","have는 사람에게 요청·지시하는 뜻이라 무생물 주어가 억지로 일으키는 결과엔 안 맞아."],"e":"뒤에 동사원형 shake가 있으니 사역동사 make, have, let 중에 골라야 해.¶지진이 바닥을 '흔들리게 만든' 건 강제·원인이라 make.¶have는 사람에게 시키는 뜻이라 무생물 주어와 어울리지 않고, got/forced는 to가 필요해.","src":"연습"},{"id":"1-11","c":1,"s":4,"k":"blank","lv":2,"t":"가목적어 it","q":"Machines make ___ possible for us to do much work.","a":0,"h":["make + 목적어 + possible에서 진짜 목적어가 어디 있는지 찾아봐.","진짜 목적어가 to부정사면 자리에 가목적어를 둬."],"e":"make + 목적어 + 형용사에서 진짜 목적어는 to do much work야.¶to부정사 목적어는 길어서 자리에 가짜 목적어 it을 두고 뒤로 보내: make it possible for us to do ~.¶이 it을 '가목적어'라고 해.","o":["it","that","this","what"],"src":"연습"},{"id":"P227","c":1,"s":5,"k":"err","lv":0,"t":"패턴편 문제","q":"Melanin, a pigment that [lays] under the skin, [is] responsible for skin color, including the variations that [occur] [among] different races.","a":0,"e":"이 문장에서 '피부 아래에 있다'는 스스로 놓여 있는 상태야. 이 뜻의 동사는 목적어가 필요 없는 lie(있다, 놓여 있다).¶lay는 '~을 놓다'라서 놓을 대상(목적어)이 있어야 해. 여기엔 목적어가 없으니 lie, 주어가 단수라 lies.¶외우기: lie-lay-lain (있다) / lay-laid-laid (놓다).","h":["패턴: 패턴편 문제","lie(놓여 있다)"],"src":"패턴","pp":"패턴편 I 137쪽","x":"lies"},{"id":"P228","c":1,"s":5,"k":"err","lv":0,"t":"패턴편 문제","q":"International trade, [going abroad,] and computer [have lain] the groundwork [for] modern global [life styles.]","a":1,"e":"이 문장은 '현대 생활 방식의 기초를 놓았다(마련했다)'는 뜻이야. 기초(the groundwork)를 '놓는' 거라 목적어가 있는 lay를 써야 해.¶현재완료라 have laid.¶lain은 lie(있다)의 과거분사라 목적어를 받을 수 없어.","h":["패턴: 패턴편 문제","lay the groundwork"],"src":"패턴","pp":"패턴편 I 137쪽","x":"have laid"},{"id":"P229","c":1,"s":5,"k":"blank","lv":0,"t":"패턴편 문제","q":"“When did the lecture begin?” “When all the students ______, the professor began his lecture.”","a":0,"e":"seat는 '~을 앉히다'라는 뜻이라 앉힐 사람(목적어)이 있어야 해.¶학생들이 스스로 '앉은' 거라면 '앉혀진' 상태로 표현해서 were seated.¶비교: sit(앉다)는 혼자 앉는 동작이라 목적어 없이 써: When all the students sat down.","h":["패턴: 패턴편 문제","be seated = 앉다"],"src":"패턴","pp":"패턴편 I 137쪽","o":["were seated","seat","seated","sit"]},{"id":"P230","c":1,"s":5,"k":"blank","lv":0,"t":"패턴편 문제","q":"The math skills of the nation’s public school students _______ steadily for more than a decade.","a":2,"e":"for more than a decade(10년 넘게)라 현재완료, 주어 skills가 복수라 have.¶실력이 '오르다'는 스스로 오르는 거라 목적어가 필요 없는 rise를 써: have risen.¶arise는 '(문제가) 생기다'라 뜻이 달라.","h":["패턴: 패턴편 문제","rise의 현재완료"],"src":"패턴","pp":"패턴편 I 137쪽","o":["has risen","have arisen","have risen","has arisen"]},{"id":"P231","c":1,"s":5,"k":"err","lv":0,"t":"패턴편 문제","q":"Food prices have [raised] [so rapidly] in the past few months [that] some families have been [forced to alter] their eating habits.","a":0,"e":"물가가 '오른' 건 누가 올린 게 아니라 스스로 오른 거야. 이 뜻은 목적어가 필요 없는 rise: have risen.¶raise는 '~을 올리다'라서 올릴 대상(목적어)이 있어야 해: They have raised prices.¶여기엔 목적어가 없으니 raised는 틀려.","h":["패턴: 패턴편 문제","rise와 raise"],"src":"패턴","pp":"패턴편 I 137쪽","x":"risen"},{"id":"P232","c":1,"s":5,"k":"blank","lv":0,"t":"패턴편 문제","q":"Some people _______ the single most important factor in any business is service.","a":2,"e":"빈칸 뒤가 (that) the single most important factor is service라는 that절이야.¶that절을 바로 목적어로 받는 동사는 say.¶tell은 사람 목적어가 먼저 필요하고(tell me that), talk, speak는 that절을 못 받아.","h":["패턴: 패턴편 문제","say + that절"],"src":"패턴","pp":"패턴편 I 139쪽","o":["talk","tell","say","speak of"]},{"id":"P233","c":1,"s":5,"k":"err","lv":0,"t":"패턴편 문제","q":"Jesus Dureza, chairman [of] the government negotiating panel, [says him] that the talks “[are not yet] focused [on] a political settlement, but on development of the conflict areas.”","a":1,"e":"say는 사람을 목적어로 받지 못해. says him (X).¶사람에게 말할 때는 tells him that ~ 또는 says (to him) that ~.¶구별법: tell + 사람 + that절 / say + that절.","h":["패턴: 패턴편 문제","say는 사람 목적어 불가"],"src":"패턴","pp":"패턴편 I 139쪽","x":"tells him"},{"id":"P234","c":1,"s":5,"k":"blank","lv":0,"t":"패턴편 문제","q":"A human resources manager was _______ me of an employee that was having trouble _______ repetitive stress syndrome.","a":2,"e":"두 칸 다 짝꿍 표현이야.¶① tell A of B = A에게 B에 대해 이야기하다 → telling me of an employee.¶② have trouble with + 명사 = ~로 고생하다 → trouble with repetitive stress syndrome.","h":["패턴: 패턴편 문제","tell A of B, trouble with"],"src":"패턴","pp":"패턴편 I 139쪽","o":["telling ― of","saying ― of","telling ― with","saying ― with"]},{"id":"P235","c":1,"s":5,"k":"blank","lv":0,"t":"패턴편 문제","q":"The information officer at the bank ________ his customers that there were several different kinds of checking accounts available.","a":1,"e":"빈칸 뒤에 his customers(사람) + that절이 바로 와.¶사람 + that절을 받는 건 tell: told his customers that ~.¶said는 사람을 바로 못 받고, converse·talk는 목적어를 받지 않아.","h":["패턴: 패턴편 문제","tell + 사람 + that절"],"src":"패턴","pp":"패턴편 I 139쪽","o":["said","told","conversed","talked"]},{"id":"P236","c":1,"s":5,"k":"err","lv":0,"t":"패턴편 문제","q":"[Although] Henry H. Ford built [his first] handmade car in 1896, he [did] no real progress in [developing] the automobile until 1903.","a":2,"e":"'진전을 이루다'는 make progress. do progress는 쓰지 않아.¶he made no real progress in developing ~ (개발에 진전이 없었다).¶make와 짝: make progress, make a mistake, make a decision.","h":["패턴: 패턴편 문제","make progress"],"src":"패턴","pp":"패턴편 I 141쪽","x":"made"},{"id":"P237","c":1,"s":5,"k":"err","lv":0,"t":"패턴편 문제","q":"When scientists [discovered] [how] soap works, [it] became possible [to do] synthetic detergents out of petroleum.","a":3,"e":"'B로 A를 만들다'는 make A out of B.¶to make synthetic detergents out of petroleum (석유로 합성세제를 만들다).¶do는 '하다'라 물건을 만든다는 뜻에 안 맞아.","h":["패턴: 패턴편 문제","make A out of B"],"src":"패턴","pp":"패턴편 I 141쪽","x":"to make"},{"id":"P238","c":1,"s":5,"k":"err","lv":0,"t":"패턴편 문제","q":"[According to] many scientists, the [release] of man-made chemicals into the atmosphere [has made] much damage to the [fragile] ozone layer.","a":2,"e":"'피해를 주다'는 do damage (to). make damage는 쓰지 않아.¶has done much damage to the ozone layer.¶do와 짝: do damage, do harm, do good, do one's best.","h":["패턴: 패턴편 문제","do damage"],"src":"패턴","pp":"패턴편 I 141쪽","x":"has done"},{"id":"1-12","c":1,"s":5,"k":"err","lv":1,"t":"lie와 lay","q":"She [laid] on the bed [all afternoon] because she [felt] [ill].","a":0,"x":"lay","h":["'눕다'인지 '~을 놓다'인지부터 봐.","lie(눕다) - lay - lain / lay(놓다) - laid - laid"],"e":"침대에 '누워 있었던' 건 스스로 누운 거라 목적어가 필요 없는 lie(눕다)를 써. 과거형은 lay.¶laid는 lay(~을 놓다)의 과거라, 놓을 대상이 있어야 해: She laid the book on the bed.¶외우기: lie-lay-lain (눕다) / lay-laid-laid (놓다).","src":"연습"},{"id":"1-13","c":1,"s":5,"k":"blank","lv":1,"t":"2형식 make","q":"She will ___ a good teacher; she is patient and kind.","o":["make","do","get","take"],"a":0,"h":["'좋은 선생님이 될 것이다'라는 뜻이야.","become의 뜻으로 쓰이는 동사를 골라."],"e":"make에는 여러 뜻이 있어. 이 문장에서는 '(자질을 갖춰) ~이 되다'라는 뜻이야.¶이 뜻일 때는 주어가 무엇이 되는지를 말해 주는 보어가 와: She will make a good teacher(그녀 = 좋은 선생님).¶비교: She will make a cake.(케이크를 만들 것이다)에서는 '만들다'라는 뜻이라 a cake는 목적어야.","src":"연습"},{"id":"1-14","c":1,"s":5,"k":"blank","lv":2,"t":"rise의 과거분사","q":"Prices have ___ sharply this year.","a":0,"h":["have 뒤니까 과거분사가 필요해.","rise - rose - ?"],"e":"have 뒤라 과거분사가 필요해.¶물가가 '오른' 건 스스로 오른 거라 목적어가 필요 없는 rise를 써: have risen.¶raised는 '올렸다'라 목적어가 있어야 하고, arisen은 '(문제가) 생겼다'라 뜻이 달라.","o":["risen","raised","rose","arisen"],"src":"연습"},{"id":"P001","c":2,"s":0,"k":"err","lv":0,"t":"‘다른 동사’와의 연계성","q":"It [is] true that the genes we inherit [from] our parents [decide], to some extent, what our health [was] like.","a":3,"e":"뼈대: It is true that the genes decide what our health is like. (유전자가 우리 건강이 어떤지를 결정하는 건 사실이다)¶decide가 현재시제로 '늘 그렇다'는 일반적 사실을 말하고 있어. 그 내용인 what our health is like도 지금의 일반적 사실이라 현재 is.¶구별법: 문장 안의 다른 동사(is, decide)가 모두 현재인데 과거로 바꿀 이유가 없어.","h":["패턴: 현재시제","일반적 사실은 현재시제"],"src":"패턴","pp":"패턴편 I 7쪽","x":"is"},{"id":"P002","c":2,"s":0,"k":"err","lv":0,"t":"‘다른 동사’와의 연계성과 ‘지속성 어구’","q":"In general, pilots [rarely] [concentrated on] one particular instrument on the flight deck, but [rather check] them all [at intervals].","a":1,"e":"뼈대: pilots rarely concentrate on one instrument, but rather check them all. (조종사는 한 계기에만 집중하지 않고 전부 확인한다)¶In general(일반적으로)과 뒤의 check(현재)가 단서야. 늘 하는 습관이라 현재 concentrate.¶구별법: 일반적 사실·습관은 현재시제, 그리고 but으로 이어진 두 동사는 시제를 맞춰.","h":["패턴: 현재시제","일반적 습관은 현재시제"],"src":"패턴","pp":"패턴편 I 7쪽","x":"concentrate"},{"id":"P003","c":2,"s":0,"k":"err","lv":0,"t":"‘다른 동사’와의 연계성과 ‘과학적사실문장’","q":"The adult mosquito usually lives [for about] thirty days, [although] the life span [varied] widely with temperature, humidity, and [other factors] of the environment.","a":2,"e":"뼈대: The mosquito lives about thirty days, although the life span varies. (모기는 약 30일 살지만 수명은 다양하다)¶모기 수명이 온도에 따라 다른 건 언제나 그런 과학적 사실이라 현재 varies.¶구별법: 앞의 lives가 현재인 것도 단서야. 과학적 사실은 현재시제.","h":["패턴: 현재시제","과학적 사실은 현재시제"],"src":"패턴","pp":"패턴편 I 7쪽","x":"varies"},{"id":"P004","c":2,"s":0,"k":"blank","lv":0,"t":"일반적인 시간부사절 접속사","q":"We are going to leave when Tom _______ back.","a":0,"e":"when Tom ___ back은 '언제 떠나나'를 말하는 시간 부사절이야.¶시간·조건 부사절에서는 미래 일이라도 현재시제로 써. 주어 Tom이 3인칭 단수라 comes.¶주절 We are going to leave가 미래를 이미 말해 주고 있어.","h":["패턴: 시간·조건 부사절에서 ‘will’ 사용불가","시간 부사절은 현재가 미래 대신"],"src":"패턴","pp":"패턴편 I 9쪽","o":["comes","came","come","will come","will have come"]},{"id":"P005","c":2,"s":0,"k":"err","lv":0,"t":"독특한 시간부사절 접속사","q":"[The next] time Paul [will fly] to New York, he will visit the [Metropolitan Museum’s] famous collection of [international musical] instruments.","a":1,"e":"the next time(다음에 ~할 때)도 when처럼 시간 부사절을 이끄는 접속사야.¶그래서 미래 일이어도 will fly가 아니라 현재 flies.¶주절 he will visit은 미래 그대로 맞아.","h":["패턴: 시간·조건 부사절에서 ‘will’ 사용불가","the next time도 시간 부사절"],"src":"패턴","pp":"패턴편 I 9쪽","x":"flies"},{"id":"P006","c":2,"s":0,"k":"err","lv":0,"t":"명령문을 이용한 문제","q":"Please [make sure] you [give] me [a ring] immediately after you [will get to] the destination.","a":3,"e":"after you ~ 는 시간 부사절이라 will을 쓰지 않아.¶immediately after you get to the destination (목적지에 도착하자마자).¶주절이 명령문(make sure)이어도 규칙은 같아.","h":["패턴: 시간·조건 부사절에서 ‘will’ 사용불가","after절의 will"],"src":"패턴","pp":"패턴편 I 9쪽","x":"get to"},{"id":"P007","c":2,"s":0,"k":"err","lv":0,"t":"주절의 ‘will' 선택","q":"[Unless] she is off [next] week, Ms. Morea [has worked] all year [without] a vacation.","a":2,"e":"뼈대: Ms. Morea will have worked all year. (그녀는 1년 내내 일한 셈이 될 거야)¶Unless she is off next week는 조건 부사절이라 현재 is로 미래를 대신했어. 주절은 '다음 주가 되면 1년 내내 일한 셈'이라 미래완료 will have worked.¶has worked(현재완료)는 '지금까지'라서 next week와 어울리지 않아.","h":["패턴: 시간·조건 부사절에서 ‘will’ 사용불가","주절은 미래완료"],"src":"패턴","pp":"패턴편 I 9쪽","x":"will have worked"},{"id":"P008","c":2,"s":0,"k":"blank","lv":0,"t":"현재와 비교","q":"Dylan, 63, looks younger and healthier than he _______ him in 1997.","a":1,"e":"비교 대상은 '1997년에 내가 그와 이야기했을 때'의 모습이야.¶in 1997이 과거라서 대동사도 과거 did, 시간절도 과거 spoke.¶구별법: 연도 같은 명백한 과거 표현이 있으면 같은 절 안의 동사를 과거로 맞춰.","h":["패턴: 과거시제","in 1997은 과거"],"src":"패턴","pp":"패턴편 I 11쪽","o":["does when I speak with","did when I spoke with","does when I’m speaking with","did when I’ve spoken with"]},{"id":"P009","c":2,"s":0,"k":"err","lv":0,"t":"과거완료와 비교","q":"The congress [had been established] in 1923 through [the renaming of] the South African Native National Congress, [itself founded] in 1912 [as the first] national native African political organization.","a":0,"e":"in 1923이라는 명백한 과거 시점이 있어서 단순과거 was established.¶과거완료(had p.p.)는 '과거보다 더 앞선 일'을 말할 때만 써. 여기엔 그보다 나중인 기준 과거가 없어.¶참고: 뒤의 itself founded in 1912는 1912년 일이지만 분사구라 시제가 따로 필요 없어.","h":["패턴: 과거시제","명백한 과거 시점은 과거시제"],"src":"패턴","pp":"패턴편 I 11쪽","x":"was established"},{"id":"P010","c":2,"s":0,"k":"err","lv":0,"t":"과거표현 형용사로 묻는 문제","q":"The early Korean newspaper [has consisted] [almost entirely] [of] [what we call] leading articles.","a":0,"e":"The early Korean newspaper는 '초창기 한국 신문', 즉 이미 지나간 과거의 신문이야.¶과거의 일이라 현재완료가 아니라 단순과거 consisted.¶구별법: early, former, ancient, in those days 같은 말이 과거를 알려 주는 단서야.","h":["패턴: 과거시제","early가 과거를 알려 줌"],"src":"패턴","pp":"패턴편 I 11쪽","x":"consisted"},{"id":"P011","c":2,"s":0,"k":"blank","lv":0,"t":"미래표현이 필요성을 묻는 경우","q":"X: Do you have any toothpaste left? Y: No, but I _________ some for you when I go downtown.","a":0,"e":"치약이 없다는 말을 듣고 '그 자리에서' 사다 주겠다고 정한 거야.¶말하는 순간 결정한 미래는 will: I will get some for you.¶비교: 미리 정한 계획이면 be going to를 써.","h":["패턴: 미래","그 자리에서 정한 미래는 will"],"src":"패턴","pp":"패턴편 I 13쪽","o":["will get","have got","am getting","get"]},{"id":"P012","c":2,"s":0,"k":"err","lv":0,"t":"미래표현이 필요성을 묻는 경우","q":"Judging from the [beauty] of the night, [I] believe that we are [liable] to have [good] weather tomorrow.","a":2,"e":"be liable to R은 '(나쁜 일을) 하기 쉽다'라는 뜻이라 좋은 날씨와 어울리지 않아.¶'~할 것 같다'는 미래 가능성은 be likely to R: we are likely to have good weather.¶구별법: liable은 나쁜 일(be liable to catch cold), likely는 좋고 나쁨 상관없이 가능성.","h":["패턴: 미래","be liable to와 be likely to"],"src":"패턴","pp":"패턴편 I 13쪽","x":"likely"},{"id":"P013","c":2,"s":0,"k":"blank","lv":0,"t":"가능성미래와 100%미래의 차이점을 묻는 문제","q":"John is cleaning the house because he _______ a party.","a":3,"e":"John이 지금 청소하는 이유가 파티야. 파티는 이미 정해 둔 계획이지.¶미리 정한 계획이나 징후가 있는 미래는 be going to: is going to have a party.¶he가 주어라 have(A)는 수 일치도 틀려.","h":["패턴: 미래","미리 정한 계획은 be going to"],"src":"패턴","pp":"패턴편 I 13쪽","o":["have","will have","will have had","is going to have"]},{"id":"P038","c":2,"s":0,"k":"err","lv":0,"t":"기본어형을 묻는 경우","q":"Despite [much] public criticism, history has [prove] Jimmy Carter [to have been] more politically astute than [many] [other] U.S.","a":1,"e":"has(현재완료) 뒤에는 과거분사가 와야 해.¶prove의 과거분사는 proved(또는 proven): history has proved ~.¶뜻: 역사는 카터가 다른 대통령들보다 정치적으로 기민했다는 걸 증명했다.","h":["패턴: 기본어형을 묻는 경우","have + 과거분사"],"src":"패턴","pp":"패턴편 I 28쪽","x":"proved"},{"id":"P039","c":2,"s":0,"k":"err","lv":0,"t":"기본어형을 묻는 경우","q":"When Sara’s daughter [caught] her finger [in] the door, she [did not cry] even though it [must have hurted her a lot.]","a":3,"e":"must have 뒤에는 과거분사가 와.¶hurt는 hurt-hurt-hurt로 형태가 안 변하는 불규칙동사라 hurted라는 형태는 없어: must have hurt.¶같은 부류: cut, put, set, cost, hit도 세 형태가 같아.","h":["패턴: 기본어형을 묻는 경우","hurt의 과거분사"],"src":"패턴","pp":"패턴편 I 28쪽","x":"must have hurt"},{"id":"P040","c":2,"s":0,"k":"err","lv":0,"t":"기본어형을 묻는 경우","q":"When, in the eighteenth century, nationalism began to [take form] as a modern movement, [its] forerunners in many [parts of] Europe were not soldiers and statesmen but scholars and poets who [seeked] to find in ancient legends and half forgotten folksongs the ‘soul’ of the nation.","a":3,"e":"seek(찾다)의 과거형은 sought야. seek-sought-sought.¶scholars and poets who sought to find ~ (~을 찾으려고 했던 학자와 시인들).¶비슷한 불규칙: bring-brought, think-thought, buy-bought.","h":["패턴: 기본어형을 묻는 경우","seek의 과거형"],"src":"패턴","pp":"패턴편 I 28쪽","x":"sought"},{"id":"P041","c":2,"s":0,"k":"err","lv":0,"t":"기본어형을 묻는 경우","q":"Even as they battle [quotas], the world's automakers [have] scrambling [to best] one [another] in electric-drive technology.","a":1,"e":"have 바로 뒤에 -ing가 올 수 없어.¶'계속 경쟁해 왔다'는 현재완료진행 have been scrambling (또는 현재진행 are scrambling).¶형태 기억: have been + -ing = 과거부터 지금까지 계속 ~하고 있다.","h":["패턴: 기본어형을 묻는 경우","현재완료진행의 형태"],"src":"패턴","pp":"패턴편 I 28쪽","x":"have been"},{"id":"2-01","c":2,"s":0,"k":"err","lv":1,"t":"시간 부사절의 미래","q":"I [will tell] him the news [when] he [will come] here [next week].","a":2,"x":"comes","h":["when절이 무슨 역할(명사절/부사절)인지 봐.","시간·조건 부사절에서는 미래를 무엇으로 대신하지?"],"e":"when he ___ here next week는 '언제 말해 주나'를 말하는 시간 부사절이야.¶시간·조건 부사절에서는 미래 대신 현재: when he comes.¶주절 I will tell은 미래 그대로 맞아.","src":"연습"},{"id":"2-02","c":2,"s":0,"k":"blank","lv":2,"t":"명사절 if와 미래","q":"I don't know if he ___ tomorrow.","o":["comes","will come","came","has come"],"a":1,"h":["이 if절이 know의 목적어인지, 조건 부사절인지부터 판단해.","명사절이면 미래는 그대로 will을 써."],"e":"이 if절은 '~인지'라는 뜻으로 know의 목적어(명사절)야.¶명사절은 미래 일을 그대로 will로 써: if he will come tomorrow.¶구별법: if가 '~라면'(부사절)이면 현재, '~인지'(명사절)이면 will 그대로.","src":"연습"},{"id":"P014","c":2,"s":1,"k":"err","lv":0,"t":"현재완료시점부사를 가지고 묻는 경우","q":"[To solve] the problem [completely] [requires] more thought [than] we [was] given so far.","a":4,"e":"so far(지금까지)는 현재완료와 짝이야.¶주어가 we라 has가 아니라 have: than we have given so far.¶뜻: 이 문제를 완전히 해결하려면 지금까지 들인 것보다 더 많은 생각이 필요하다.","h":["패턴: 현재완료","so far는 현재완료"],"src":"패턴","pp":"패턴편 I 15쪽","x":"have"},{"id":"P015","c":2,"s":1,"k":"blank","lv":0,"t":"for를 가지고 묻는 경우","q":"Mary ______ quite ill for the past few days.","a":2,"e":"for the past few days(지난 며칠 동안)는 과거부터 지금까지 이어진 기간이야.¶과거에서 현재까지 계속된 상태는 현재완료: Mary has been quite ill.¶had been은 과거보다 더 앞선 일에 써.","h":["패턴: 현재완료","for the past few days"],"src":"패턴","pp":"패턴편 I 15쪽","o":["will be","is","has been","had been"]},{"id":"P016","c":2,"s":1,"k":"blank","lv":0,"t":"for를 가지고 묻는 경우","q":"Doctoral students who are preparing to take their qualifying exams have been studying in the library _______ the last three months.","a":2,"e":"the last three months는 '세 달'이라는 기간의 길이야.¶기간 길이 앞에는 for: for the last three months.¶구별법: for + 기간 길이 / since + 시작 시점 / until + 끝나는 시점.","h":["패턴: 현재완료","기간 앞의 for"],"src":"패턴","pp":"패턴편 I 15쪽","o":["until","since","for","from"]},{"id":"P017","c":2,"s":1,"k":"err","lv":0,"t":"since를 가지고 묻는 경우","q":"[The euro] is not new: [it's used] in electronic transactions and [by banks] and international [businesses] since January 1999.","a":1,"e":"since January 1999(1999년 1월부터 지금까지)가 있으니 현재완료가 필요해.¶유로화는 '사용되는' 대상이라 현재완료 수동: it has been used (it's been used).¶it's used는 it is used(현재)라 since와 맞지 않아.","h":["패턴: 현재완료","since + 과거 시점은 현재완료"],"src":"패턴","pp":"패턴편 I 15쪽","x":"it's been used"},{"id":"P018","c":2,"s":1,"k":"err","lv":0,"t":"since를 가지고 묻는 경우","q":"Since it [begins], the patent system [has encouraged] many inventors [to develop] their ideas, but it has made few inventors [become rich].","a":0,"e":"since(~이래로) 뒤에는 출발점이 되는 과거 시점이 와.¶특허 제도가 시작된 건 과거라 Since it began.¶주절은 그 뒤로 지금까지 이어진 일이라 현재완료 has encouraged.","h":["패턴: 현재완료","since절 안은 과거"],"src":"패턴","pp":"패턴편 I 15쪽","x":"began"},{"id":"P019","c":2,"s":1,"k":"err","lv":0,"t":"since를 가지고 묻는 경우","q":"My brother has been [pursuing] a [career] in medical research [when] he [graduated] last May.","a":2,"e":"has been pursuing(현재완료진행)은 과거부터 지금까지 계속 해 온 일이야.¶그 출발점을 말하는 건 since: since he graduated last May (지난 5월 졸업한 이래로).¶when은 특정 시점이라 '계속 해 왔다'와 어울리지 않아.","h":["패턴: 현재완료","현재완료진행과 since"],"src":"패턴","pp":"패턴편 I 15쪽","x":"since"},{"id":"P020","c":2,"s":1,"k":"err","lv":0,"t":"현재와 현재완료의 비교를 묻는 문제","q":"[Although] I [am playing] golf [for] more than three years, I cannot [manage] [to] break 90.","a":1,"e":"for more than three years(3년 넘게)가 있으니 '지금까지 계속 쳐 왔다'는 뜻이야.¶과거부터 지금까지 계속된 일은 현재완료(진행): I have been playing golf.¶am playing(현재진행)은 '지금 치고 있다'라 기간과 어울리지 않아.","h":["패턴: 시제와 완료상의 차이","for 기간 + 현재완료(진행)"],"src":"패턴","pp":"패턴편 I 17쪽","x":"have been playing"},{"id":"P021","c":2,"s":1,"k":"blank","lv":0,"t":"과거와 현재완료의 비교를 묻는 문제","q":"Do you remember the incident that _________ at our first meeting?","a":2,"e":"at our first meeting(우리가 처음 만났을 때)은 과거의 특정 시점이야.¶특정 과거 시점의 일은 단순과거 took place.¶take place(일어나다)는 have place로 바꿀 수 없어.","h":["패턴: 시제와 완료상의 차이","과거 시점과 take place"],"src":"패턴","pp":"패턴편 I 17쪽","o":["had place","had taken place","took place","has taken place"]},{"id":"P022","c":2,"s":1,"k":"err","lv":0,"t":"과거와 현재완료의 비교를 묻는 문제","q":"I [have lived] in this house [for] three years, but I now [live] in a [different] neighborhood [nearby].","a":0,"e":"but I now live in a different neighborhood에서 지금은 다른 곳에 산다고 했어.¶그 집에서 3년 산 건 이미 끝난 과거라 lived.¶구별법: 현재완료는 지금까지 이어질 때, 이미 끝난 일은 과거.","h":["패턴: 시제와 완료상의 차이","지금은 안 사는 과거 경험"],"src":"패턴","pp":"패턴편 I 17쪽","x":"lived"},{"id":"P023","c":2,"s":1,"k":"blank","lv":0,"t":"by the time","q":"By the time the computer hardware advanced to the next step, software manufacturers _______ hundreds of new programs.","a":2,"e":"By the time + 과거(advanced) = ~했을 무렵에는.¶그 과거 시점까지 이미 완료된 일이라 과거완료 had made.¶짝 외우기: By the time + 과거 → 과거완료 / By the time + 현재 → 미래완료.","h":["패턴: by the time (that) + S + V-ed ~","By the time + 과거는 과거완료"],"src":"패턴","pp":"패턴편 I 19쪽","o":["made","have made","had made","will have made"]},{"id":"P024","c":2,"s":1,"k":"err","lv":0,"t":"현재완료와 과거완료의 비교를 묻는 문제","q":"When [questioned] by the police, the young woman said that she [has left] the store before [the robbery] [took place].","a":1,"e":"그녀가 '말한(said)' 과거 시점보다 가게를 '떠난' 게 더 먼저야.¶과거보다 더 앞선 일은 과거완료 had left.¶현재완료(has left)는 과거 기준점과 같이 쓸 수 없어.","h":["패턴: ‘현재’를 쓸까? 말까?","said보다 앞선 일은 과거완료"],"src":"패턴","pp":"패턴편 I 21쪽","x":"had left"},{"id":"P025","c":2,"s":1,"k":"blank","lv":0,"t":"과거와 과거완료의 비교를 묻는 문제","q":"When Ken went to get some money from his wallet, he discovered that someone ________ it.","a":2,"e":"지갑을 열어 보고 '알게 된(discovered)' 과거보다 누가 가져간 게 더 먼저야.¶더 앞선 과거라 과거완료 had taken.¶순서: 누가 가져감(had taken) → 내가 발견함(discovered).","h":["패턴: ‘현재’를 쓸까? 말까?","발견보다 앞선 일"],"src":"패턴","pp":"패턴편 I 21쪽","o":["takes","took","had taken","has taken"]},{"id":"P026","c":2,"s":1,"k":"blank","lv":0,"t":"과거와 과거완료의 비교를 묻는 문제","q":"When I came home, the house was quiet. Everybody ________.","a":1,"e":"내가 집에 온(came) 과거 순간에 모두 '이미' 잠자리에 든 상태였어.¶과거 기준보다 먼저 끝난 일이라 과거완료 had gone to bed.¶was going to bed는 '자러 가는 중'이라 집이 조용했다는 말과 안 맞아.","h":["패턴: ‘현재’를 쓸까? 말까?","과거 기준 이전 완료"],"src":"패턴","pp":"패턴편 I 21쪽","o":["has gone to bed","had gone to bed","was going to bed","will have gone to bed"]},{"id":"P027","c":2,"s":1,"k":"blank","lv":0,"t":"과거와 과거완료의 비교를 묻는 문제","q":"Before becoming President of the U.S. this year, Obama _______ as senator of Illinois.","a":4,"e":"올해 대통령이 된 것(과거)보다 '그 전에' 상원의원으로 일했던 거야.¶과거보다 앞선 일이라 과거완료 had served.¶has served(현재완료)는 지금도 상원의원이라는 뜻이 돼서 틀려.","h":["패턴: ‘현재’를 쓸까? 말까?","대통령이 되기 전의 경력"],"src":"패턴","pp":"패턴편 I 21쪽","o":["serve","serving","was served","has served","had served"]},{"id":"P028","c":2,"s":1,"k":"blank","lv":0,"t":"미래와 미래완료의 비교를 묻는 문제","q":"Bill always goes to bed at 10 p.m. Susan is planning to visit Bill’s house at 10:30 this evening, so when Susan gets there, Bill _______.","a":3,"e":"Susan이 도착하는 10시 30분(미래)에는 Bill이 '이미' 10시에 잠자리에 든 상태일 거야.¶미래의 어느 시점까지 끝나 있을 일은 미래완료 will have gone to bed.¶will go to bed는 그때 자러 간다는 뜻이라 순서가 안 맞아.","h":["패턴: 미래완료상 → 미래 + 현재","그 시점에는 이미 끝나 있다"],"src":"패턴","pp":"패턴편 I 23쪽","o":["will go to bed","has gone to bed","will be going to bed","will have gone to bed"]},{"id":"P029","c":2,"s":1,"k":"blank","lv":0,"t":"by + 미래시간,","q":"By 2020, scientists surely ________ a cure for AIDS, Acquired Immune Deficiency Syndrome.","a":3,"e":"By 2020(2020년까지)은 미래의 기준 시점이야.¶그때까지 완료될 일은 미래완료 will have discovered.¶짝 외우기: By + 미래 시점 → 미래완료.","h":["패턴: by + 미래시간, by the time (that) + S + V-es ~","By + 미래 시간은 미래완료"],"src":"패턴","pp":"패턴편 I 25쪽","o":["have discovered","must discover","discover","will have discovered"]},{"id":"P030","c":2,"s":1,"k":"blank","lv":0,"t":"by the time (that) + S + V-es ~","q":"By the time the mayor gets to his office, his secretary _________ for Santa Barbara.","a":0,"e":"By the time + 현재(gets) = ~할 무렵에는(미래).¶시장이 도착할 때쯤엔 비서가 이미 떠나 있을 거라 미래완료 will have left.¶시간 부사절이라 gets가 현재인 것도 확인해.","h":["패턴: by + 미래시간, by the time (that) + S + V-es ~","By the time + 현재는 미래완료"],"src":"패턴","pp":"패턴편 I 25쪽","o":["will have left","left","is leaving","will leave"]},{"id":"2-03","c":2,"s":1,"k":"err","lv":1,"t":"since와 for","q":"He [has been] ill [since] two years, so he [rarely] [goes] out.","a":1,"h":["two years는 시점일까, 기간일까?","since는 시작 시점, for는 기간 길이."],"e":"two years는 '2년'이라는 기간의 길이야.¶기간 길이 앞에는 for, 시작 시점 앞에는 since: for two years / since 2024.¶has been ill(현재완료)과 for는 잘 어울려.","x":"for","src":"연습"},{"id":"2-04","c":2,"s":1,"k":"err","lv":2,"t":"현재완료와 과거 부사","q":"I [have seen] him [a moment ago] [at] the station, but he [didn't recognize] me.","a":0,"x":"saw","h":["a moment ago 같은 부사가 어떤 시제랑 어울리는지 봐.","명백한 과거 시점 부사는 현재완료와 못 써."],"e":"a moment ago(조금 전에)는 명백한 과거 시점이야.¶명백한 과거 시점은 현재완료와 같이 못 써서 단순과거 saw.¶ago, yesterday, last ~, in 2019 같은 말이 보이면 현재완료를 의심해.","src":"연습"},{"id":"2-05","c":2,"s":1,"k":"blank","lv":2,"t":"when 의문문과 현재완료","q":"When ___ the book?","o":["have you read","did you read","had you read","have you been reading"],"a":1,"h":["의문사 when은 특정한 시점을 묻는 말이야.","특정 시점을 묻는 when은 현재완료와 같이 못 써."],"e":"when은 '언제'라는 특정 시점을 묻는 말이야.¶특정 시점을 묻는 when은 현재완료와 같이 못 써서 When did you read the book?¶구별법: Have you read ~?(읽어 본 적 있어?)는 되지만 When have you read ~?는 안 돼.","src":"연습"},{"id":"2-06","c":2,"s":1,"k":"blank","lv":2,"t":"과거완료","q":"When I got to the station, the train ___ already.","a":0,"h":["기차가 떠난 것과 내가 도착한 것 중 무엇이 먼저야?","과거 기준점보다 더 앞선 일은 had p.p."],"e":"내가 역에 도착한(got) 과거보다 기차가 떠난 게 먼저야.¶더 앞선 과거라 과거완료 had left: the train had left already.¶순서: 기차 출발(had left) → 내 도착(got).","o":["had left","has left","leaves","was leaving"],"src":"연습"},{"id":"P031","c":2,"s":2,"k":"blank","lv":0,"t":"1) 능·수동 문제","q":"The complex relationship between poet and poem ______ a primary concern of psycho-analytical critics in recent years.","a":1,"e":"in recent years(최근 몇 년간)는 현재완료와 짝이야.¶주어의 중심은 relationship(단수)이라 has been.¶between poet and poem은 꾸며 주는 말이라 주어 수에 영향을 주지 않아.","h":["패턴: ___________ : 진행가능","in recent years는 현재완료"],"src":"패턴","pp":"패턴편 I 27쪽","o":["has being","has been","have","is having"]},{"id":"P032","c":2,"s":2,"k":"err","lv":0,"t":"1) 능·수동 문제","q":"Popping [a pill or two] can help [to alleviate] the symptoms, but safe, specialized drugs which are [designing] to suppress migraines [do] not exist.","a":2,"e":"which의 선행사는 drugs(약). 약은 편두통을 억제하도록 '설계된' 대상이야.¶그래서 수동 are designed to suppress ~.¶are designing은 약이 직접 뭔가를 설계한다는 엉뚱한 뜻이 돼.","h":["패턴: ___________ : 진행가능","약은 '만들어진' 것"],"src":"패턴","pp":"패턴편 I 27쪽","x":"designed"},{"id":"P033","c":2,"s":2,"k":"blank","lv":0,"t":"1) 능·수동 문제","q":"While I was studying in one room of our apartment, my roommate _________ in the other room.","a":1,"e":"While I was studying(내가 공부하던 동안)과 같은 시간에 벌어지던 일이야.¶과거 같은 시간에 진행 중이던 일은 과거진행 was having a party.¶주절과 while절이 '동시에 진행 중'이면 둘 다 과거진행.","h":["패턴: ___________ : 진행가능","동시에 진행 중이던 과거"],"src":"패턴","pp":"패턴편 I 27쪽","o":["had had a party","was having a party","is having a party","would have had a party"]},{"id":"P034","c":2,"s":2,"k":"blank","lv":0,"t":"1) 능·수동 문제","q":"While he ________ the poster, a door somewhere behind him opened.","a":2,"e":"문이 열린(opened) 순간, 그는 포스터를 '보고 있는 중'이었어.¶과거 어느 순간 진행 중이던 일은 과거진행 was staring at.¶stare(빤히 보다)는 at과 짝이라 stare to는 틀려.","h":["패턴: ___________ : 진행가능","while + 과거진행"],"src":"패턴","pp":"패턴편 I 27쪽","o":["is staring at","did stare to","was staring at","looked carefully upon"]},{"id":"P035","c":2,"s":2,"k":"blank","lv":0,"t":"1) 능·수동 문제","q":"When the telephone rang, I _________ an interesting story.","a":3,"e":"전화가 울린(rang) 과거 순간에 나는 책을 '읽고 있는 중'이었어.¶과거진행 was reading.¶구별법: 짧은 사건(rang)은 과거, 그때 계속되던 일(reading)은 과거진행.","h":["패턴: ___________ : 진행가능","전화가 울린 순간"],"src":"패턴","pp":"패턴편 I 27쪽","o":["am reading","read","will read","was reading"]},{"id":"P036","c":2,"s":2,"k":"err","lv":0,"t":"1) 능·수동 문제","q":"[In spite of] many arguments [against the idea], John [is still believing] that men [are superior to] women.","a":2,"e":"believe(믿다)는 마음의 상태를 나타내는 동사라 진행형으로 쓰지 않아.¶still believes(여전히 믿는다)로 써.¶같은 부류: know, like, love, want, own, belong, resemble.","h":["패턴: ___________ : 진행가능","believe는 진행형 불가"],"src":"패턴","pp":"패턴편 I 27쪽","x":"still believes"},{"id":"P037","c":2,"s":2,"k":"err","lv":0,"t":"1) 능·수동 문제","q":"Professor Kim was [having] difficulties [controlling] the students in his class [because of] there [were] so many of them.","a":2,"e":"because of는 전치사라 뒤에 명사가 와야 해.¶뒤에 there were so many of them이라는 절(주어+동사)이 왔으니 접속사 because.¶구별법: because + 절 / because of + 명사.","h":["패턴: ___________ : 진행가능","because of + 절은 불가"],"src":"패턴","pp":"패턴편 I 27쪽","x":"because"},{"id":"2-07","c":2,"s":2,"k":"err","lv":1,"t":"상태동사는 진행형 불가","q":"I [have been knowing] him [for] 10 years, and he [has] never [lied] to me.","a":0,"h":["know가 동작인지 상태인지 생각해 봐.","상태동사는 진행형으로 못 써."],"e":"know(알다)는 상태동사라 진행형(have been knowing)이 안 돼.¶'10년 동안 알고 지냈다'는 현재완료 have known.¶같은 부류: like, love, own, believe, resemble.","x":"have known","src":"연습"},{"id":"2-08","c":2,"s":2,"k":"blank","lv":1,"t":"과거진행","q":"He ___ a shower when the phone rang.","o":["took","was taking","has taken","takes"],"a":1,"h":["전화가 울린 순간 그는 무엇을 하는 중이었어?","과거 어느 순간 진행 중이던 일은 was/were -ing."],"e":"전화가 울린(rang) 순간 그는 샤워를 '하는 중'이었어.¶과거 어느 순간 진행 중이던 일은 과거진행 was taking.¶took이면 전화가 울리자 그때 샤워를 했다는 순서가 돼.","src":"연습"},{"id":"2-09","c":2,"s":2,"k":"err","lv":2,"t":"감각동사의 진행형","q":"I [will add] some water [to] the soup [because] it [is tasting] too salty.","a":3,"x":"tastes","h":["taste가 '맛이 나다'일 때는 상태야.","'맛을 보다(동작)'일 때만 진행형이 가능해."],"e":"이 문장에서 taste는 '~한 맛이 나다'라는 뜻이야. 맛이 나는 건 잠깐 하는 동작이 아니라 원래 그런 상태라서 진행형으로 쓰지 않아.¶그래서 it tastes too salty.¶비교: He is tasting the soup.(맛을 보는 중)처럼 '맛보다'라는 동작일 때는 진행형이 가능해.","src":"연습"},{"id":"2-10","c":2,"s":3,"k":"err","lv":2,"t":"lately와 현재완료","q":"Flight cancellations [increased] [lately] [because of] the storms that [have hit] the region.","a":0,"x":"have increased","h":["lately(최근에)는 어떤 시제와 어울리는 부사야?","시점부사와 동사의 시제는 일치해야 해."],"e":"lately(최근에)는 '최근까지 쭉'이라는 뜻이라 현재완료와 짝이야.¶Flight cancellations have increased lately.¶같은 부류: recently(최근까지), so far, up to now.","src":"연습"},{"id":"2-11","c":2,"s":3,"k":"blank","lv":2,"t":"since + 과거 시점","q":"The population of this country ___ since 1945.","a":0,"h":["since 1945는 과거부터 지금까지야.","과거부터 현재까지 이어진 결과는 현재완료."],"e":"since 1945(1945년 이래로)는 과거부터 지금까지 이어진 기간이야.¶그 결과를 말하는 주절은 현재완료 has doubled.¶since가 보이면 주절은 현재완료일 확률이 높아.","o":["has doubled","doubled","had doubled","is doubling"],"src":"연습"},{"id":"P120","c":3,"s":0,"k":"blank","lv":0,"t":"패턴편 문제","q":"They strongly believed that war with the Indians should _______ at all costs.","a":3,"e":"전쟁은 스스로 무언가를 피하는 게 아니라 사람들이 '피하는' 대상이야.¶그래서 수동: should be avoided (반드시 피해져야 한다).¶구별법: 주어가 행동을 하는 쪽이면 능동, 당하는 쪽이면 be + p.p.","h":["패턴: 패턴편 문제","조동사 + be p.p."],"src":"패턴","pp":"패턴편 I 79쪽","o":["avoid","have avoided","be avoiding","be avoided"]},{"id":"P121","c":3,"s":0,"k":"blank","lv":0,"t":"패턴편 문제","q":"Males have a number of traditional gender role expectations in our society. A male _______ tough, fearless, logical, self-reliant, independent, and aggressive.","a":1,"e":"남성은 사회로부터 강하고 용감할 것을 '기대받는' 쪽이야.¶be expected to be ~ (~일 것으로 기대된다).¶expects being은 남성이 스스로 기대한다는 뜻이고, 형태도 틀려.","h":["패턴: 패턴편 문제","be expected to be"],"src":"패턴","pp":"패턴편 I 79쪽","o":["expects being","is expected to be","is expecting to be","has been expecting"]},{"id":"P122","c":3,"s":0,"k":"blank","lv":0,"t":"패턴편 문제","q":"We know that animals can whimper and whine when _______, but crying involves the production of tears with these emotions, and animals cannot do this.","a":0,"e":"동물이 '다쳤을 때' 낑낑댄다는 뜻이야. 다치는 건 당하는 일이라 수동 they are hurt.¶they hurt는 '그들이 아프게 한다/아프다'로 뜻이 어색해.¶참고: when (they are) hurt처럼 줄여 쓰기도 해.","h":["패턴: 패턴편 문제","when they are hurt"],"src":"패턴","pp":"패턴편 I 79쪽","o":["they are hurt","they hurt","they are hurting","it hurts"]},{"id":"P123","c":3,"s":1,"k":"blank","lv":0,"t":"패턴편 문제","q":"The first systematic chart ever made of an ocean current _______ by Benjamin Franklin.","a":3,"e":"문장에 동사가 없어. 주어는 The first systematic chart(최초의 해류 도표)야.¶도표는 Franklin에 의해 '발행된' 대상이라 수동 was published.¶ever made of an ocean current는 chart를 꾸미는 말이라 동사가 아니야.","h":["패턴: 패턴편 문제","발행된 것은 수동"],"src":"패턴","pp":"패턴편 I 81쪽","o":["published","publishing","to publish","was published","has published"]},{"id":"P124","c":3,"s":1,"k":"err","lv":0,"t":"패턴편 문제","q":"Despite attracting a small core of [devotees,] Joyce’s Ulysses [had denounced] by the Irish [as] un-Christian filth, and burned by U.S. censors [due to] its indecency.","a":1,"e":"뼈대: Joyce's Ulysses was denounced by the Irish (율리시스는 아일랜드인들에게 비난받았다)¶소설은 '비난받은' 대상이고 뒤에 by the Irish가 있으니 수동. 그냥 과거 일이라 was denounced.¶뒤의 and burned by U.S. censors도 (was) burned로 수동이라 짝이 맞아.","h":["패턴: 패턴편 문제","비난을 받은 것은 수동"],"src":"패턴","pp":"패턴편 I 81쪽","x":"was denounced"},{"id":"P125","c":3,"s":1,"k":"blank","lv":0,"t":"'Ⓝ  be p.p Ⓝ '  → ‘Ⓝ  = Ⓝ ’","q":"Cleaning symbioses are found in the sea, in fresh water, on land and in the air, but the greatest number of examples _______ marine species.","a":1,"e":"concern이 '~에 관한 것이다'라는 뜻일 때는 능동으로 써: A concerns B (A는 B에 관한 것이다).¶주어의 중심은 the greatest number라 단수 취급해서 concerns.¶수동 be concerned는 '걱정하다' 또는 '관련되다'라 뜻이 달라.","h":["패턴: 형태상의 능·수동 구별 2","A concern B = A는 B에 관한 것이다"],"src":"패턴","pp":"패턴편 I 83쪽","o":["concern","concerns","is concerned","are concerned"]},{"id":"P126","c":3,"s":1,"k":"err","lv":0,"t":"수동형을 능동형으로 바꾸는 경우","q":"To add [distilled] water to the test tube, the technician [was inserted] a large-gauge hollow needle [through] a cork in the base [made of] opaque material.","a":1,"e":"was inserted 뒤에 a large-gauge hollow needle(바늘)이 바로 와. 이 바늘은 '꽂는' 대상, 즉 목적어야.¶기술자가 바늘을 '꽂은' 거라 능동 inserted. 수동태가 되면 목적어가 주어로 가버려서 뒤에 남을 수 없어.¶구별법: be + p.p. 뒤에 목적어가 바로 오면 수동이 맞는지 의심해 봐.","h":["패턴: 형태상의 능·수동 구별 2","목적어가 있으면 능동"],"src":"패턴","pp":"패턴편 I 83쪽","x":"inserted"},{"id":"P127","c":3,"s":1,"k":"err","lv":0,"t":"
