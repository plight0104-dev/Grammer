수동형을 능동형으로 바꾸는 경우","q":"Watching [masses] of peasants scything a field three hundred years ago, only a madman [would be dreamed] that time [would soon come] when people would crowd into [urban factories] to earn their daily bread.","a":1,"e":"dream 뒤에 that time would soon come이라는 that절 목적어가 있어. 목적어가 있으니 능동이어야 해.¶300년 전 상황을 상상하는 거라 would have dreamed (꿈이나 꿨겠는가).¶미친 사람만이 공장 시대가 올 거라고 꿈꿨을 거다 → 아무도 몰랐다는 뜻.","h":["패턴: 형태상의 능·수동 구별 2","that절 목적어가 있으니 능동"],"src":"패턴","pp":"패턴편 I 83쪽","x":"would have dreamed"},{"id":"P128","c":3,"s":1,"k":"err","lv":0,"t":"수동형을 능동형으로 바꾸는 경우","q":"Pro-life and pro-choice forces [are bracing] for [competing] observances on Jan. 22, the twelfth anniversary of the Supreme Court decision that [was struck down] most legal [restrictions on abortion.]","a":2,"e":"that의 선행사는 the Supreme Court decision(대법원 판결). 판결이 낙태 규제를 '폐지한' 거야.¶뒤에 목적어 most legal restrictions가 있으니 능동 struck down.¶strike down = (법을) 폐지하다, 무효로 하다.","h":["패턴: 형태상의 능·수동 구별 2","목적어가 있으면 능동"],"src":"패턴","pp":"패턴편 I 83쪽","x":"struck down"},{"id":"P129","c":3,"s":1,"k":"err","lv":0,"t":"수동형을 능동형으로 바꾸는 경우","q":"[On] the national stage, Levi was [best known] as President Ford's choice [for] U.S. attorney general, a position he [was assumed] in 1975.","a":3,"e":"a position (that) he assumed in 1975 (그가 1975년에 맡은 직책).¶관계대명사가 assumed의 목적어 역할을 하니 assumed는 능동이야. 그가 직책을 '맡은' 거지.¶was assumed면 그가 맡아졌다는 이상한 뜻이 돼.","h":["패턴: 형태상의 능·수동 구별 2","관계절 안의 빠진 목적어"],"src":"패턴","pp":"패턴편 I 83쪽","x":"assumed"},{"id":"P130","c":3,"s":1,"k":"blank","lv":0,"t":"전치사를 넣어주는 경우","q":"Throughout the decades, television _______ nearly all our social ills: the rise in crime, increased divorce rates, racism, increased sexual promiscuity, dope addiction, and the collapse of the family.","a":3,"e":"사람들이 TV를 사회악의 원인으로 비난해 왔어: blame TV for ills.¶TV가 주어니까 수동 has been blamed for + 명사.¶구별법: blame A for B(B를 A의 탓으로 돌리다)에서 A가 주어로 오면 be blamed for B.","h":["패턴: 형태상의 능·수동 구별 2","blame A for B의 수동"],"src":"패턴","pp":"패턴편 I 84쪽","o":["has blamed","has been blamed","has blamed for","has been blamed for"]},{"id":"P131","c":3,"s":1,"k":"blank","lv":0,"t":"주의구문","q":"Mr. Kim _______ time off work to take care of some personal business.","a":2,"e":"give는 '누구에게 + 무엇을'을 둘 다 받을 수 있어: They gave Mr. Kim time off.¶여기서 '누구에게'인 Mr. Kim을 주어로 올리면 Mr. Kim was given time off가 돼. 김 씨는 휴가를 '받은' 쪽이니까 이 형태가 맞아.¶gave면 김 씨가 남에게 휴가를 준 게 돼서 뜻이 안 맞아.","h":["패턴: 형태상의 능·수동 구별 2","give의 수동"],"src":"패턴","pp":"패턴편 I 84쪽","o":["gave","will give","was given","had given"]},{"id":"P135","c":3,"s":1,"k":"err","lv":0,"t":"V → be p.p","q":"No matter what road [choose,] the travelers [who start] from different valleys will all meet on the top of the mountain, [provided] they [keep on ascending.]","a":0,"e":"No matter what road ___ 에는 주어도 동사도 필요해. 길은 사람이 '선택하는' 대상이야.¶그래서 수동 is chosen (어떤 길이 선택되든).¶능동으로 쓰려면 주어를 넣어서 No matter what road they choose.","h":["패턴: 의미상의 능·수동 구별","길은 선택되는 대상"],"src":"패턴","pp":"패턴편 I 89쪽","x":"is chosen"},{"id":"P136","c":3,"s":1,"k":"err","lv":0,"t":"V → be p.p","q":"Where do pickles come from? Evidence of the existence of pickles reaches [so far back] that their precise date of origin can’t [pin down.] However, pickle experts have gathered [enough evidence] to believe that the pickle came [into being] more than four thousand years ago.","a":1,"e":"정확한 기원 날짜는 사람들이 '확정하는' 대상이야.¶그래서 수동 can't be pinned down (정확히 짚어낼 수 없다).¶pin down = 정확히 밝히다. 날짜가 스스로 밝히는 게 아니야.","h":["패턴: 의미상의 능·수동 구별","날짜는 '확정되는' 대상"],"src":"패턴","pp":"패턴편 I 89쪽","x":"be pinned down"},{"id":"P137","c":3,"s":1,"k":"err","lv":0,"t":"V → be p.p","q":"The money should [spend] on a new football stadium [so that] the local team has [a] better chance [to compete] at national and international level.","a":0,"e":"돈은 '쓰이는' 대상이야. 돈이 스스로 뭔가를 쓰지 않잖아.¶조동사 should 뒤 수동이라 should be spent on ~ (~에 쓰여야 한다).¶구별법: spend의 주어는 사람, 돈이 주어면 be spent.","h":["패턴: 의미상의 능·수동 구별","돈은 쓰이는 대상"],"src":"패턴","pp":"패턴편 I 89쪽","x":"be spent"},{"id":"P138","c":3,"s":1,"k":"err","lv":0,"t":"be R-ing → be p.p","q":"[Women] in America [disproportionately] decide where [a family’s funds] will [be spending.]","a":3,"e":"가족의 자금(a family's funds)은 '쓰이는' 대상이야.¶will 뒤 수동: will be spent.¶be spending이면 자금이 무언가를 쓰고 있다는 뜻이 돼서 틀려.","h":["패턴: 의미상의 능·수동 구별","자금은 쓰이는 대상"],"src":"패턴","pp":"패턴편 I 89쪽","x":"be spent"},{"id":"P139","c":3,"s":1,"k":"err","lv":0,"t":"be R-ing → be p.p","q":"High [volume] production can [be maintaining] only [for] [a limited] period.","a":1,"e":"대량 생산(production)은 회사가 '유지하는' 대상이야.¶조동사 뒤 수동: can be maintained (유지될 수 있다).¶be maintaining이면 생산이 뭔가를 유지한다는 뜻이 돼.","h":["패턴: 의미상의 능·수동 구별","생산은 유지되는 대상"],"src":"패턴","pp":"패턴편 I 89쪽","x":"be maintained"},{"id":"P140","c":3,"s":1,"k":"err","lv":0,"t":"be R-ing → be p.p","q":"There [appears] to be [no] limit to the enjoyment that can be [finding] by listening [to] the music of Mozart.","a":2,"e":"that의 선행사는 the enjoyment(즐거움). 즐거움은 사람이 '찾는(얻는)' 대상이야.¶can be found by listening ~ (모차르트를 들으며 얻을 수 있는 즐거움).¶finding은 즐거움이 무언가를 찾는다는 뜻이 돼.","h":["패턴: 의미상의 능·수동 구별","즐거움은 발견되는 대상"],"src":"패턴","pp":"패턴편 I 89쪽","x":"found"},{"id":"P141","c":3,"s":1,"k":"err","lv":0,"t":"have p.p → have been p.p","q":"Over the years, many arguments [have put] forward for [legalizing] euthanasia, but people are afraid that this might [give rise to] murder, [unless] there were every strict safeguards.","a":0,"e":"put forward an argument = 주장을 내놓다. 여기선 arguments가 주어야.¶주장은 '제기되는' 대상이라 현재완료 수동 have been put forward.¶Over the years(수년간)가 있어서 현재완료가 맞아.","h":["패턴: 의미상의 능·수동 구별","주장은 제기되는 대상"],"src":"패턴","pp":"패턴편 I 90쪽","x":"have been put"},{"id":"P142","c":3,"s":1,"k":"err","lv":0,"t":"have p.p → have been p.p","q":"The normal [course] of events [has postponed] [indefinitely] [due to] lack of interest.","a":1,"e":"행사 일정(course of events)은 '연기되는' 대상이야.¶현재완료 수동 has been postponed (무기한 연기되었다).¶has postponed면 일정이 무언가를 연기했다는 뜻이 돼.","h":["패턴: 의미상의 능·수동 구별","일정은 연기되는 대상"],"src":"패턴","pp":"패턴편 I 90쪽","x":"has been postponed"},{"id":"P143","c":3,"s":1,"k":"err","lv":0,"t":"have p.p → have been p.p","q":"[The] first botanical garden in [the United States] [had established] in Philadelphia [in] 1894.","a":2,"e":"식물원은 '설립되는' 대상이고, in 1894는 명백한 과거 시점이야.¶그래서 과거 수동 was established.¶had established는 능동이고 과거완료라 두 가지 다 틀려.","h":["패턴: 의미상의 능·수동 구별","정원은 설립되는 대상"],"src":"패턴","pp":"패턴편 I 90쪽","x":"was established"},{"id":"P144","c":3,"s":1,"k":"err","lv":0,"t":"have p.p → have been p.p","q":"Ever since it [was built] three hundred years ago, [the Taj Mahal] in Agra, India, [has often described] [as the most beautiful] building in the world.","a":2,"e":"타지마할은 '묘사되는' 대상이고, Ever since(~이래로 지금까지)라 현재완료.¶has often been described as ~ (~로 자주 묘사되어 왔다).¶describe A as B의 수동: A is described as B.","h":["패턴: 의미상의 능·수동 구별","타지마할은 묘사되는 대상"],"src":"패턴","pp":"패턴편 I 90쪽","x":"has often been described"},{"id":"P145","c":3,"s":1,"k":"err","lv":0,"t":"have p.p → have been p.p","q":"The roles of nature and [of nurture] [in making] us [what] we are [have long debated.]","a":3,"e":"자연과 양육의 역할은 사람들이 '논의하는' 대상이야.¶long(오랫동안)이 있으니 현재완료 수동 have long been debated.¶have long debated면 역할이 논의를 했다는 뜻이 돼.","h":["패턴: 의미상의 능·수동 구별","역할은 논의되는 대상"],"src":"패턴","pp":"패턴편 I 90쪽","x":"have long been debated"},{"id":"P146","c":3,"s":1,"k":"blank","lv":0,"t":"과거동사 vs 과거분사","q":"Chemicals in paint that pose a fire hazard _______ as combustible, flammable, or extremely flammable.","a":0,"e":"Chemicals in paint that pose a fire hazard까지가 긴 주어야. 아직 본동사가 없어.¶화학물질은 '분류되는' 대상이라 are listed as ~ (~로 분류된다).¶listed만 쓰면 동사인지 분사인지 애매하고, 주어를 또 쓴 they are listed는 틀려.","h":["패턴: 의미상의 능·수동 구별","동사 자리 + 수동"],"src":"패턴","pp":"패턴편 I 91쪽","o":["are listed","listed","being listed","they are listed"]},{"id":"P147","c":3,"s":1,"k":"blank","lv":0,"t":"과거동사 vs 과거분사","q":"The hospital _______ for its heart transplant surgery several years ago.","a":1,"e":"병원은 '찬사를 받은' 쪽이야: People acclaimed the hospital → The hospital was acclaimed.¶several years ago는 과거라 was acclaimed.¶has been acclaimed는 ago와 같이 못 써.","h":["패턴: 의미상의 능·수동 구별","과거 시점 + 수동"],"src":"패턴","pp":"패턴편 I 91쪽","o":["acclaimed","was acclaimed","has acclaimed","has been acclaimed"]},{"id":"P148","c":3,"s":1,"k":"blank","lv":0,"t":"과거동사 vs 과거분사","q":"Many people are trying to buy a house before consumption tax _______ next year.","a":1,"e":"소비세는 정부가 '올리는' 대상이라 수동 is raised.¶before ~ next year는 시간 부사절이라 미래(will be raised) 대신 현재 is raised.¶rise(오르다)를 쓰려면 rises가 돼야 해.","h":["패턴: 의미상의 능·수동 구별","세금은 올려지는 대상"],"src":"패턴","pp":"패턴편 I 91쪽","o":["rise","is raised","risen","raised"]},{"id":"P149","c":3,"s":1,"k":"err","lv":0,"t":"과거동사 vs 과거분사","q":"Members of the staff [of the District Attorney] made more than $100,000 from a [get-rich-quick] scheme in which investors [bilked] of about [$1-million.]","a":2,"e":"investors(투자자)는 사기를 '당한' 쪽이야.¶수동 were bilked of about $1-million (약 100만 달러를 사기당했다).¶bilk A of B = A에게서 B를 사취하다.","h":["패턴: 의미상의 능·수동 구별","투자자는 사기를 당한 쪽"],"src":"패턴","pp":"패턴편 I 91쪽","x":"were bilked"},{"id":"P150","c":3,"s":1,"k":"err","lv":0,"t":"과거동사 vs 과거분사","q":"The [homeless] man [arrested and charged] [with] [pickpocketing] the commuters.","a":1,"e":"문장에 동사가 없어. 노숙자는 경찰에게 '체포되고 기소된' 쪽이야.¶그래서 was arrested and charged with ~ (~ 혐의로 체포되고 기소되었다).¶arrested만 쓰면 남을 체포했다는 뜻이 돼.","h":["패턴: 의미상의 능·수동 구별","체포된 사람은 수동"],"src":"패턴","pp":"패턴편 I 91쪽","x":"was arrested and charged"},{"id":"P151","c":3,"s":1,"k":"err","lv":0,"t":"과거동사 vs 과거분사","q":"When he [lost] one particular contest two years [ago,] he [compelled] to [dye] his hair brown.","a":2,"e":"그가 머리를 염색하도록 '강요받은' 거야.¶compel A to R의 수동: A is compelled to R → he was compelled to dye.¶compelled만 쓰면 그가 누군가를 강요한 게 되는데 목적어도 없어.","h":["패턴: 의미상의 능·수동 구별","강요받은 것은 수동"],"src":"패턴","pp":"패턴편 I 91쪽","x":"was compelled"},{"id":"P152","c":3,"s":1,"k":"err","lv":0,"t":"과거동사 vs 과거분사","q":"She [brought up] in the belief that pleasures [were sinful.] [As a result,] she now [leads] an ascetic life.","a":0,"e":"그녀는 그런 믿음 속에서 '길러진' 쪽이야.¶bring up(기르다)의 수동: She was brought up in ~.¶brought up만 쓰면 그녀가 누군가를 길렀다는 뜻인데 목적어가 없어.","h":["패턴: 의미상의 능·수동 구별","양육된 것은 수동"],"src":"패턴","pp":"패턴편 I 92쪽","x":"was brought up"},{"id":"P153","c":3,"s":1,"k":"err","lv":0,"t":"과거동사 vs 과거분사","q":"More than 250 other people [who injured] in the [crash] [were treated] at the hospital or other clinics in Maputo and later [discharged.]","a":0,"e":"injure는 '~을 다치게 하다'라는 뜻이라 다치게 할 대상(목적어)이 있어야 해.¶그런데 사람들은 사고로 다친 '당한' 쪽이야. 그래서 수동 who were injured.¶who injured면 그 사람들이 누군가를 다치게 한 게 되는데, 목적어도 없어.","h":["패턴: 의미상의 능·수동 구별","부상당한 사람은 수동"],"src":"패턴","pp":"패턴편 I 92쪽","x":"who were injured"},{"id":"P154","c":3,"s":1,"k":"err","lv":0,"t":"주어의 선택","q":"Acrylic [painter] can be used on a [wide] variety of surfaces, [such as] cardboard, paper, fabric, and [wood.]","a":0,"e":"뜻부터 봐: 아크릴 ___ 은 판지, 종이, 천, 나무에 쓰일 수 있다.¶여러 표면에 '칠하는' 건 물감(paint)이지 화가(painter)가 아니야.¶수동태 문제처럼 보이지만 주어 단어 자체가 틀린 문제야.","h":["패턴: 의미상의 능·수동 구별","주어 선택"],"src":"패턴","pp":"패턴편 I 92쪽","x":"paint"},{"id":"P164","c":3,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"The press is so powerful [in this respect] that it is [sometimes] [referred] to [the fourth estate.]","a":3,"e":"refer to A as B = A를 B라고 부르다. 수동은 A is referred to as B.¶it is sometimes referred to as the fourth estate (언론은 제4부라고 불린다). as가 빠졌어.¶구별법: refer to + as 세트로 기억해.","h":["패턴: 패턴편 문제","refer to A as B의 수동"],"src":"패턴","pp":"패턴편 I 99쪽","x":"as the fourth estate"},{"id":"P165","c":3,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"The saturated fat in dairy foods is thought _______ a factor in heart disease.","a":1,"e":"'~라고 여겨진다'는 be thought to be.¶The saturated fat ~ is thought to be a factor (포화지방은 원인으로 여겨진다).¶= It is thought that the saturated fat is a factor.","h":["패턴: 패턴편 문제","be thought to be"],"src":"패턴","pp":"패턴편 I 99쪽","o":["it is","to be","they are","as being"]},{"id":"P169","c":3,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"It can be [told] that of all [the planets] [in] the solar system, Mercury and Venus [have no] natural satellites.","a":0,"e":"'~라고 한다'는 It is said that ~.¶told는 tell의 수동이라 '사람이 들었다'는 뜻이 돼야 해: I was told that ~. It can be told that은 안 돼.¶구별법: It is said that / I was told that.","h":["패턴: 패턴편 문제","It is said that ~"],"src":"패턴","pp":"패턴편 I 103쪽","x":"said"},{"id":"P170","c":3,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"Politics __________ to be the art of the impossible.","a":2,"e":"'~라고들 한다'는 be said to be.¶Politics(정치)는 -s로 끝나도 단수 취급이라 is said.¶is told는 tell이 사람 목적어를 필요로 해서 이 뜻이 안 돼.","h":["패턴: 패턴편 문제","be said to be"],"src":"패턴","pp":"패턴편 I 103쪽","o":["is told","are told","is said","are said","is saying"]},{"id":"3-09","c":3,"s":2,"k":"blank","lv":2,"t":"that절 목적어의 수동태","q":"___ is said that he can buy everything.","a":0,"h":["They say that ~를 수동태로 바꾸는 문제야.","긴 that절은 주어 자리에 두지 않고 가주어를 써."],"e":"They say that he can buy everything을 수동태로 바꾼 거야.¶that절을 주어로 앞에 두지 않고 가주어 It을 써: It is said that ~.¶또는 He is said to be able to buy everything.","o":["It","That","He","There"],"src":"연습"},{"id":"P160","c":3,"s":3,"k":"err","lv":0,"t":"자동사의 경우","q":"There are about 10,000,000 children under five years old who need care while their mothers work. [Relatives care for] about half of these preschool children. The other half [is looking after by] people outside of the family. Some working mothers hire baby-sitters [to come into their homes.] However, this choice is [too expensive for] many people.","a":1,"e":"look after는 '~을 돌보다'라는 뜻이야. look만으로는 목적어를 못 받지만 after와 묶여서 돌볼 대상을 받을 수 있게 돼.¶나머지 절반의 아이들은 '돌봄을 받는' 쪽이라 수동: is looked after by people.¶수동이 되어도 after가 빠지면 '돌보다'라는 뜻이 사라져.","h":["패턴: 전치사의 목적어가 비어 있는 수동문장","look after의 수동"],"src":"패턴","pp":"패턴편 I 97쪽","x":"is looked after by"},{"id":"P161","c":3,"s":3,"k":"blank","lv":0,"t":"자동사의 경우","q":"Basic social services in all developing countries, according to a U.N. report on poverty, _______ by the seven richest men in the world. It appears that these enormously wealthy people, however, are not lining up to donate their fortunes to the poor of the world.","a":3,"e":"pay for(~의 비용을 대다)의 수동은 be paid for.¶기본 서비스 비용이 부자 7명에 의해 '지불될 수도 있었다'(실제론 안 함)라 could be paid for.¶for가 빠지면 '서비스가 돈을 받는다'는 뜻이 돼.","h":["패턴: 전치사의 목적어가 비어 있는 수동문장","pay for의 수동"],"src":"패턴","pp":"패턴편 I 97쪽","o":["can pay","can pay for","could be paid","could be paid for"]},{"id":"P162","c":3,"s":3,"k":"err","lv":0,"t":"타동사의 경우","q":"A female scholar [is used to being] a deviant in a society where [the learned] woman, far from [being valued,] is [likely to hear] herself [made fun] on the public stage.","a":4,"e":"make fun of는 '~을 놀리다'라는 뜻으로, of까지 있어야 놀리는 대상을 받을 수 있어.¶hear herself made fun of = 자신이 놀림받는 걸 듣다. 수동 모양이 되어도 of는 남아야 해.¶of가 빠지면 '재미를 만들다'라는 엉뚱한 뜻이 돼.","h":["패턴: 전치사의 목적어가 비어 있는 수동문장","make fun of의 수동"],"src":"패턴","pp":"패턴편 I 97쪽","x":"made fun of"},{"id":"P163","c":3,"s":3,"k":"blank","lv":0,"t":"타동사의 경우","q":"Elizabeth's grandfather, Henry Tudor, became King Henry VⅡ of England in 1485. He _______ his son Henry VⅢ in 1509.","a":1,"e":"succeed가 '~의 뒤를 잇다'라는 뜻이야. 1509년에 아들 헨리 8세가 '그(Henry Tudor)의 뒤를 이었다'.¶He가 주어니까 수동: He was succeeded by his son.¶능동으로 쓰면 His son succeeded him.","h":["패턴: 전치사의 목적어가 비어 있는 수동문장","succeed = 뒤를 잇다"],"src":"패턴","pp":"패턴편 I 97쪽","o":["succeeded","was succeeded by","succeeded to","was succeeded to"]},{"id":"3-02","c":3,"s":3,"k":"blank","lv":2,"t":"look up to의 수동태","q":"The professor is looked ___ by all the students.","o":["up to","up","to up","at up"],"a":0,"h":["'존경하다'는 look up to야.","타동사구는 수동태에서도 한 덩어리로 움직여."],"e":"look up to(존경하다)는 동사 + 부사 + 전치사가 한 덩어리야.¶수동이 돼도 통째로 남아: is looked up to by all the students.¶같은 부류: put up with(참다), look down on(얕보다).","src":"연습"},{"id":"3-03","c":3,"s":3,"k":"err","lv":2,"t":"do away with의 수동태","q":"The death penalty [has done away with] [in] many [countries] [since] 1990.","a":0,"h":["사형제도가 폐지'된' 거니까 태를 확인해 봐.","현재완료 수동태 = have/has been p.p."],"e":"사형제도는 '폐지되는' 대상이야.¶do away with(폐지하다) 덩어리 그대로 현재완료 수동: has been done away with.¶since 1990이 있어서 현재완료가 맞아.","x":"has been done away with","src":"연습"},{"id":"P171","c":3,"s":4,"k":"err","lv":0,"t":"패턴편 문제","q":"My wife was not upset when she [was dismissed] from her job because she [had told,] [when hired,] that it was [only] a temporary office.","a":1,"e":"아내는 그 자리가 임시직이라는 말을 '들은' 쪽이야.¶tell의 수동 + 과거완료: she had been told (that) it was only temporary.¶had told면 그녀가 남에게 말한 게 되는데 목적어(사람)도 없어.","h":["패턴: 패턴편 문제","들은 쪽은 수동"],"src":"패턴","pp":"패턴편 I 103쪽","x":"had been told"},{"id":"3-04","c":3,"s":4,"k":"blank","lv":3,"t":"for를 쓰는 4형식 동사의 수동태","q":"___ by him.","o":["A chair was made for me","I was made a chair","A chair was made me","I was made for a chair"],"a":0,"h":["make가 4형식일 때 3형식으로 바꾸면 어떤 전치사를 쓰지?","make, buy, cook, get처럼 for를 쓰는 동사는 사람을 주어로 한 수동태가 안 돼."],"e":"make가 '~에게 …을 만들어 주다'라는 뜻이면 make me a chair처럼 '누구에게 + 무엇을'을 받아.¶그런데 이 동사는 '누구에게'를 주어로 올린 수동(I was made a chair)으로는 쓰지 않아. '나'가 만들어진 것처럼 들리기 때문이야.¶그래서 만들어진 물건을 주어로: A chair was made for me by him.","src":"연습"},{"id":"P166","c":3,"s":5,"k":"blank","lv":0,"t":"패턴편 문제","q":"The ruling class became so distressed that it passed a law that all _______ bread would be hanged.","a":2,"e":"도둑질하다 '잡힌' 사람들이야.¶catch + 사람 + -ing(~하는 걸 붙잡다)의 수동: be caught -ing → who were caught stealing bread.¶stolen은 '도둑맞은'이라 뜻이 안 맞아.","h":["패턴: 패턴편 문제","all who were caught stealing"],"src":"패턴","pp":"패턴편 I 101쪽","o":["who caught stealing","who were caught stolen","who were caught stealing","whom they caught stealing"]},{"id":"P167","c":3,"s":5,"k":"err","lv":0,"t":"패턴편 문제","q":"[Whatever the reason] for [keeping silent] about the issue since [the dam detected] to have huge cracks through satellite photos in January, the government [can no longer] keep it from the public.","a":2,"e":"since 뒤에 주어 the dam과 동사가 필요해. 댐은 균열이 있는 것으로 '발견된' 대상이야.¶the dam was detected to have huge cracks (댐에 큰 균열이 있는 것으로 확인되었다).¶detected만 쓰면 댐이 뭔가를 발견했다는 뜻이 돼.","h":["패턴: 패턴편 문제","댐은 발견되는 대상"],"src":"패턴","pp":"패턴편 I 101쪽","x":"the dam was detected"},{"id":"P168","c":3,"s":5,"k":"blank","lv":0,"t":"패턴편 문제","q":"He _______ the room by anyone.","a":1,"e":"지각동사 notice + 사람 + -ing의 수동: 사람 + be noticed + -ing.¶He wasn't noticed entering the room by anyone (그가 방에 들어가는 걸 아무도 못 봤다).¶능동이라면 Nobody noticed him entering the room.","h":["패턴: 패턴편 문제","지각동사 수동 + 분사"],"src":"패턴","pp":"패턴편 I 101쪽","o":["didn't notice to enter","wasn't noticed entering","didn't notice enter","wasn't noticed enter"]},{"id":"3-05","c":3,"s":5,"k":"err","lv":1,"t":"사역동사의 수동태","q":"We [were made] [work] very hard [by] the [manager].","a":1,"h":["능동태 They made us work에서 원형부정사가 수동태로 오면?","사역·지각동사의 수동태에서 원형부정사는 to부정사로 바뀌어."],"e":"능동 They made us work hard에서 사역동사 make는 원형부정사(work)를 받아.¶수동이 되면 원형이 to부정사로 바뀌어: We were made to work very hard.¶지각동사도 같아: be seen to R.","x":"to work","src":"연습"},{"id":"3-06","c":3,"s":5,"k":"err","lv":2,"t":"지각동사의 수동태","q":"He [was seen] [enter] the room [by] the security guard [at] midnight.","a":1,"x":"to enter","h":["능동태라면 The guard saw him enter the room.","지각동사가 수동태가 되면 원형부정사가 어떻게 바뀌지?"],"e":"능동 The guard saw him enter the room에서 지각동사 see는 원형(enter)을 받아.¶수동이 되면 to가 생겨: He was seen to enter the room.¶진행 중이던 동작이면 was seen entering도 가능해.","src":"연습"},{"id":"3-07","c":3,"s":5,"k":"blank","lv":3,"t":"let은 수동태 불가","q":"I ___ to speak ahead of him at the meeting.","o":["was let","was allowed","was had","was made let"],"a":1,"h":["have와 let은 수동태로 못 써.","let의 뜻을 살리려면 다른 동사로 바꿔야 해."],"e":"사역동사 let과 have는 수동태로 쓰지 않아. was let (X).¶let의 뜻(허락하다)을 살리려면 be allowed to: I was allowed to speak.¶have의 뜻(시키다)은 be asked/told to로 바꿔.","src":"연습"},{"id":"P132","c":3,"s":6,"k":"err","lv":0,"t":"재귀대명사를 이용한 능·수동 구별","q":"If you are [concerning] [about] how others [will react] to your writing, try writing your first draft [as] a letter to a friend.","a":0,"e":"'걱정하다'는 be concerned about.¶concerning은 '~에 관하여'라는 전치사(또는 능동 분사)라 be 뒤에 '걱정하는'의 뜻으로 못 써.¶구별법: 사람의 마음 상태는 p.p.(concerned, worried, interested).","h":["패턴: 형태상의 능·수동 구별 3","be concerned about"],"src":"패턴","pp":"패턴편 I 87쪽","x":"concerned"},{"id":"P133","c":3,"s":6,"k":"err","lv":0,"t":"재귀대명사를 이용한 능·수동 구별","q":"[Though] Johnson knew his serious defects, he [was broad-minded] enough [to appoint] the man [to] the important position because he [was convincing] of his ability.","a":4,"e":"그가 그 사람의 능력을 '확신한' 거야. 확신은 마음 상태라 be convinced of.¶was convincing이면 그가 남을 설득하는(설득력 있는) 사람이라는 뜻이 돼.¶구별법: 감정·생각을 '느끼는' 사람은 p.p., '일으키는' 쪽은 -ing.","h":["패턴: 형태상의 능·수동 구별 3","be convinced of"],"src":"패턴","pp":"패턴편 I 87쪽","x":"was convinced"},{"id":"P134","c":3,"s":6,"k":"err","lv":0,"t":"감정동사","q":"[No one] was more [surprising] than Sue [to discover] that her roommate [had become] engaged.","a":1,"e":"No one(사람)이 '놀란' 거야. 감정을 느끼는 사람은 surprised.¶surprising은 '놀라게 하는'이라 놀라운 사건·소식에 써.¶뜻: Sue보다 더 놀란 사람은 없었다.","h":["패턴: 형태상의 능·수동 구별 3","감정을 느끼는 사람은 p.p."],"src":"패턴","pp":"패턴편 I 87쪽","x":"surprised"},{"id":"P155","c":3,"s":6,"k":"err","lv":0,"t":"동사의 의미를 보는 경우","q":"Protests [against] the government [have been grown] since the collapse of high risk [investment schemes,] in which [nearly every] Albanian family lost money.","a":1,"e":"이 문장에서 grow는 '(시위가 저절로) 커지다'라는 뜻이야. 이 뜻일 때는 목적어가 없는 자동사로 쓰여.¶자동사는 목적어가 없으니 뒤에는 부사(구)만 붙을 수 있고, 수동태(be + p.p.)로도 못 바꿔. 그래서 have grown.¶비교: He grows vegetables.(채소를 기르다)에서는 '기르다'라는 뜻의 타동사라 목적어가 오고, 수동도 돼: Vegetables are grown.","h":["패턴: 수동형을 능동형으로 바꾸는 경우","자동사 grow"],"src":"패턴","pp":"패턴편 I 95쪽","x":"have grown"},{"id":"P156","c":3,"s":6,"k":"err","lv":0,"t":"동사의 의미를 보는 경우","q":"Classicism which [was originated] in Greece and [continued] in ancient Rome, was the principal contributor [to] that aspect of our life which [is usually referred] to as [secular.]","a":0,"e":"originate는 '(어디서) 생겨나다, 비롯되다'라는 뜻이야. 고전주의가 스스로 생겨난 거라 목적어가 없는 자동사로 쓰여.¶목적어가 없으니 수동태(was originated)를 만들 수 없어. 그래서 originated in Greece.¶같은 이유로 happen, occur, appear, disappear도 수동태가 없어.","h":["패턴: 수동형을 능동형으로 바꾸는 경우","originate는 자동사"],"src":"패턴","pp":"패턴편 I 95쪽","x":"originated"},{"id":"P157","c":3,"s":6,"k":"err","lv":0,"t":"동사의 의미를 보는 경우","q":"The [crime rate] has [gone down] in the United States [while] the prison population [has been risen.]","a":3,"e":"이 문장에서 rise는 '(수가) 늘다, 오르다'라는 뜻이야. 스스로 오르는 거라 목적어가 없는 자동사야.¶목적어가 없으니 수동태(has been risen)를 만들 수 없어. 그래서 has risen.¶비교: raise(~을 올리다)는 올릴 대상이 있어서 수동이 가능해: Prices were raised.","h":["패턴: 수동형을 능동형으로 바꾸는 경우","rise는 자동사"],"src":"패턴","pp":"패턴편 I 95쪽","x":"has risen"},{"id":"P158","c":3,"s":6,"k":"err","lv":0,"t":"문장의 의미를 보는 경우","q":"Dialect [differences] tend to [be increased] [proportionally] [to] the degree of communicative isolation between the groups.","a":1,"e":"이 문장에서 increase는 '(차이가 저절로) 커지다'라는 뜻이야. 이 뜻일 때는 목적어 없이 쓰여.¶방언 차이는 누가 키우는 게 아니라 고립 정도에 따라 저절로 커지는 거라 tend to increase.¶비교: They increased the price.(가격을 올렸다)처럼 '~을 늘리다'라는 뜻이면 목적어를 받고, 그때는 수동(be increased)도 돼.","h":["패턴: 수동형을 능동형으로 바꾸는 경우","increase가 '증가하다'일 때"],"src":"패턴","pp":"패턴편 I 95쪽","x":"increase"},{"id":"P159","c":3,"s":6,"k":"blank","lv":0,"t":"문장의 의미를 보는 경우","q":"The golf club recently increased the membership dues ________ eighty dollars a month to ninety.","a":2,"e":"'80달러에서 90달러로' 올린 거야: from eighty dollars a month to ninety.¶from A to B 짝을 찾으면 돼.¶by는 '~만큼'(by ten dollars, 10달러만큼)이라 뒤에 to가 오는 구조와 안 맞아.","h":["패턴: 수동형을 능동형으로 바꾸는 경우","from A to B"],"src":"패턴","pp":"패턴편 I 95쪽","o":["by","at","from","about"]},{"id":"P172","c":3,"s":6,"k":"err","lv":0,"t":"by를 쓸까, 다른 전치사를 쓸까","q":"[Whether] happiness can be achieved by [all normal human beings] or only by those gifted [by very special talents] depends [for its answer] in part [on the conception] of happiness itself.","a":2,"e":"'~을 타고나다'는 be gifted with.¶those (who are) gifted with very special talents (아주 특별한 재능을 타고난 사람들).¶by가 아니라 with를 쓰는 수동 표현: be covered with, be filled with, be gifted with.","h":["패턴: 'by'가 아닌 다른 전치사를 사용하는 수동구문","be gifted with"],"src":"패턴","pp":"패턴편 I 106쪽","x":"with very special talents"},{"id":"P173","c":3,"s":6,"k":"err","lv":0,"t":"'By'가 아닌 다른 전치사의 선택","q":"Thomas Nast [was known] [primarily] [for] a [political cartoonist.]","a":2,"e":"be known as + 신분·자격 = ~로서 알려지다.¶Thomas Nast는 '정치 만화가로서' 알려졌으니 as.¶비교: be known for + 이유(~로 유명하다), be known to + 사람(~에게 알려지다).","h":["패턴: 'by'가 아닌 다른 전치사를 사용하는 수동구문","be known as + 신분"],"src":"패턴","pp":"패턴편 I 106쪽","x":"as"},{"id":"3-01","c":3,"s":6,"k":"err","lv":1,"t":"자동사는 수동태 불가","q":"Since I [started] the new [job], all my worries [have] completely [been disappeared].","a":3,"x":"disappeared (have completely disappeared)","h":["disappear가 목적어를 가질 수 있는 동사인지 봐.","목적어가 없는 자동사는 수동태가 될 수 없어."],"e":"disappear는 '사라지다'라는 뜻이야. 걱정이 스스로 사라진 거라 목적어가 필요 없는 자동사로 쓰여.¶목적어가 없으니 수동태(been disappeared)를 만들 수 없어. 그래서 have completely disappeared.¶같은 이유로 happen, occur, appear도 수동이 없어.","src":"연습"},{"id":"3-08","c":3,"s":6,"k":"blank","lv":2,"t":"resemble의 특징","q":"He ___ his father in every way.","o":["resembles","is resembled","resembles to","is resembling"],"a":0,"h":["resemble은 '닮다'라는 상태를 나타내는 타동사야.","상태동사: 수동태 X, 진행형 X, 전치사 X"],"e":"resemble은 '~을 닮다'라는 뜻으로, 닮은 대상을 바로 목적어로 받아. 그래서 전치사가 필요 없어(resembles to X).¶그런데 '닮았다'는 누가 하는 동작이 아니라 원래 그런 상태라서 진행형(is resembling)도, 누가 닮음을 '당하는' 수동형(is resembled)도 쓰지 않아.¶그래서 He resembles his father.만 맞아.","src":"연습"},{"id":"3-10","c":3,"s":6,"k":"blank","lv":1,"t":"by 이외의 전치사","q":"The top of the mountain is covered ___ snow all year round.","o":["with","by","in","of"],"a":0,"h":["be covered + 전치사 짝을 떠올려 봐.","be known to, be interested in, be satisfied with처럼 by 말고 다른 전치사를 쓰는 수동태가 있어."],"e":"be covered with = ~로 덮여 있다.¶by 대신 다른 전치사를 쓰는 대표 수동 표현이야.¶같이 외우기: be known to, be interested in, be made of/from, be satisfied with.","src":"연습"},{"id":"3-11","c":3,"s":6,"k":"blank","lv":3,"t":"부정주어의 수동태","q":"The ugly dog ___ by anyone.","o":["was not loved","was loved","was loved not","was never not loved"],"a":0,"h":["능동태 No one loved the ugly dog를 수동태로 바꿔 봐.","by no one으로 끝내지 않고 not ~ by anyone으로 써."],"e":"능동 No one loved the ugly dog를 수동으로 바꾼 문장이야.¶by no one으로 끝내지 않고 not ~ by anyone으로 써: was not loved by anyone.¶부정어를 문장 앞쪽(동사)에 두는 게 영어의 습관이야.","src":"연습"},{"id":"P042","c":4,"s":0,"k":"err","lv":0,"t":"평서문","q":"If Carol had not warned her guests [about] the [flooded] streets, they might [have ran] into difficulty [on the way] to her house.","a":2,"e":"might have 뒤에는 과거분사가 와야 해.¶run은 run-ran-run이라 과거분사가 run이야: might have run into difficulty (곤란을 겪었을지도 모른다).¶ran은 과거형이라 have 뒤에 못 와.","h":["패턴: 주조동사","조동사 + have p.p."],"src":"패턴","pp":"패턴편 I 33쪽","x":"have run"},{"id":"P043","c":4,"s":0,"k":"err","lv":0,"t":"평서문","q":"There are still [many] problems to be [overcame] [regarding] the [use] of the laser.","a":1,"e":"to be 뒤 수동이라 과거분사가 필요해.¶overcome은 overcome-overcame-overcome: problems to be overcome (극복되어야 할 문제들).¶overcame은 과거형이야.","h":["패턴: 주조동사","to be + 과거분사"],"src":"패턴","pp":"패턴편 I 33쪽","x":"overcome"},{"id":"P044","c":4,"s":0,"k":"err","lv":0,"t":"부정문","q":"I took some of my clients [to] a very fancy restaurant, but when I [went] to pay the bill I [didn't enough] money to [cover] it.","a":2,"e":"didn't 뒤에는 동사원형이 와야 하는데 enough(형용사)가 바로 왔어.¶'돈이 충분하지 않았다'는 didn't have enough money.¶조동사 do/does/did 뒤에는 반드시 동사원형.","h":["패턴: 주조동사","didn't 뒤에는 동사원형"],"src":"패턴","pp":"패턴편 I 33쪽","x":"didn't have enough"},{"id":"P045","c":4,"s":0,"k":"blank","lv":0,"t":"부정문","q":"Although most adopted persons want the right to know who their natural parents are, some who have found them wish that they ________ the experience of meeting.","a":2,"e":"입양된 사람들이 친부모를 이미 '찾아서 만나 본' 거야(have found them). 그 지난 경험을 아쉬워하는 거라 wish + 과거완료.¶wish that they hadn't had the experience (그런 경험을 하지 않았더라면 좋았을 텐데).¶hadn't만 쓰면 동사가 빠져.","h":["패턴: 주조동사","wish + 과거완료"],"src":"패턴","pp":"패턴편 I 33쪽","o":["hadn't","didn't have had","hadn't had","hadn't have"]},{"id":"P046","c":4,"s":0,"k":"blank","lv":0,"t":"도치문","q":"Does the belief in equality, freedom, and the right to be treated in a certain way ______________ ?","a":0,"e":"의문문 Does 뒤에는 '주어 + 동사원형'이 와.¶주어가 the belief in ~ a certain way로 길 뿐이야. 그 뒤에 원형 apply.¶Does the belief ~ apply to animals as well? (그 믿음이 동물에게도 적용되나?)","h":["패턴: 주조동사","Does + 주어 + 동사원형"],"src":"패턴","pp":"패턴편 I 33쪽","o":["apply to animals as well","have applied to animals as well","to apply to animals as well","be applying to animals as well"]},{"id":"P047","c":4,"s":0,"k":"err","lv":0,"t":"도치문","q":"Not only did [he fails] to [profit from] his stock transactions, [but he also lost] all that he [had invested].","a":0,"e":"Not only가 문장 앞으로 나가서 did he로 도치됐어.¶did 뒤에는 동사원형이라 fails가 아니라 fail: Not only did he fail to profit ~.¶평서문으로 돌리면 He not only failed to profit ~.","h":["패턴: 주조동사","did + 주어 + 동사원형"],"src":"패턴","pp":"패턴편 I 33쪽","x":"he fail"},{"id":"P048","c":4,"s":0,"k":"err","lv":0,"t":"대동사","q":"[Obviously] we were [much more] impressed [with performance] than [did] the other members of the audience.","a":3,"e":"비교 대상의 동사가 were impressed(be동사)야.¶than 뒤 대동사도 be동사로 맞춰서 than were the other members.¶구별법: 앞 동사가 be면 대동사 be, 일반동사면 do/does/did.","h":["패턴: 주조동사","대동사는 앞 동사에 맞춰"],"src":"패턴","pp":"패턴편 I 34쪽","x":"were"},{"id":"P049","c":4,"s":0,"k":"err","lv":0,"t":"대동사","q":"Venus [approaches] the Earth [more closely] [than] any other [planet is].","a":3,"e":"앞 동사 approaches가 일반동사야.¶그래서 than 뒤 대동사도 일반동사를 받는 does: than any other planet does.¶is를 쓰면 'approaches'를 받을 수 없어.","h":["패턴: 주조동사","일반동사를 받는 대동사"],"src":"패턴","pp":"패턴편 I 34쪽","x":"planet does"},{"id":"4-01","c":4,"s":1,"k":"err","lv":1,"t":"조동사 두 개 연속 불가","q":"He [has worked] [hard] [for months], so next year he [will can] do the work for himself.","a":3,"x":"will be able to","h":["서법조동사를 두 개 연달아 쓸 수 있는지 생각해 봐.","미래 + 능력은 will + be able to."],"e":"조동사(will, can, may, must)는 두 개를 연달아 쓸 수 없어. will can (X).¶미래 + 능력은 will be able to: will be able to do the work.¶같은 방식: will must → will have to, will may → will be allowed to.","src":"연습"},{"id":"4-02","c":4,"s":1,"k":"err","lv":2,"t":"had better의 부정","q":"You [had not better] go [there] [after] [dark].","a":0,"h":["had better를 한 덩어리 조동사로 봐.","조동사 + not + 동사원형 순서야."],"e":"had better는 한 덩어리 조동사야.¶부정어 not은 덩어리 뒤에: had better not go (가지 않는 게 좋다).¶would rather도 would rather not + 원형.","x":"had better not","src":"연습"},{"id":"P050","c":4,"s":2,"k":"err","lv":0,"t":"평서문","q":"He would [lost] his license [if he didn’t take] a [refresher] course, [according to] my broker.","a":0,"e":"조동사 would 뒤에는 동사원형이 와야 해: would lose his license.¶if he didn't take ~ 는 가정법 과거라 주절 would + 원형과 짝이 맞아.¶뜻: 재교육을 안 받으면 면허를 잃을 거다.","h":["패턴: 서법조동사","would + 동사원형"],"src":"패턴","pp":"패턴편 I 37쪽","x":"lose"},{"id":"P051","c":4,"s":2,"k":"blank","lv":0,"t":"평서문","q":"I think we had better _______ on time.","a":1,"e":"had better는 조동사처럼 쓰여서 뒤에 동사원형이 와.¶had better start working on time (제시간에 일을 시작하는 게 좋겠다).¶to be, started, being은 원형이 아니라 안 돼.","h":["패턴: 서법조동사","had better + 동사원형"],"src":"패턴","pp":"패턴편 I 37쪽","o":["to be with","start working","started working","being"]},{"id":"P052","c":4,"s":2,"k":"err","lv":0,"t":"평서문","q":"The farmer realized that [he'd] better, if he didn't want to have a total loss, [to harvest] his crop [earlier] [than usual].","a":1,"e":"he'd better = he had better. 뒤에는 to 없이 동사원형이 와야 해.¶중간에 if he didn't want ~ 가 끼어 있어서 헷갈리게 만든 거야. 걷어내면 he'd better harvest his crop earlier.¶구별법: 삽입절을 괄호로 묶고 앞뒤를 바로 이어 봐.","h":["패턴: 서법조동사","had better 뒤 to 불가"],"src":"패턴","pp":"패턴편 I 37쪽","x":"harvest"},{"id":"P053","c":4,"s":2,"k":"blank","lv":0,"t":"부정문","q":"They _______ moved from their old house.","a":3,"e":"조동사 + 부정어 + have p.p. 순서야.¶may not have moved (이사 가지 않았을지도 모른다).¶not은 항상 조동사 바로 뒤에 와.","h":["패턴: 서법조동사","조동사 + not + have p.p."],"src":"패턴","pp":"패턴편 I 37쪽","o":["may haven`t","do not may have","not may have","may not have","may well"]},{"id":"P054","c":4,"s":2,"k":"blank","lv":0,"t":"부정문","q":"I would rather _______ a thing at all than do it badly.","a":0,"e":"would rather의 부정은 would rather not + 동사원형.¶I would rather not do a thing at all than do it badly (대충 할 바엔 아예 안 하겠다).¶than 뒤 do와도 원형끼리 맞아.","h":["패턴: 서법조동사","would rather not + 동사원형"],"src":"패턴","pp":"패턴편 I 37쪽","o":["not do","not to do","not doing","no doing"]},{"id":"P055","c":4,"s":2,"k":"blank","lv":0,"t":"도치문","q":"Only after they are tanned _______ resistant to decomposition.","a":0,"e":"Only after ~ 처럼 Only가 이끄는 말이 문장 앞에 오면 주절이 도치돼.¶조동사 + 주어 + 동사 순서: can animal skin become resistant.¶평서문이면 Animal skin can become resistant only after ~.","h":["패턴: 서법조동사","Only + 부사절이 앞이면 도치"],"src":"패턴","pp":"패턴편 I 37쪽","o":["can animal skin become","that animal skin can become","animal skins can become","can become animal skins"]},{"id":"P056","c":4,"s":2,"k":"err","lv":0,"t":"도치문","q":"[Should] a foreign student [needing] [help], he or she [must] see the foreign student advisor.","a":1,"e":"Should a foreign student need help = If a foreign student should need help (if 생략 도치).¶should 뒤에는 동사원형이라 need. needing은 동사가 아니라 안 돼.¶구별법: 문두 Should는 '혹시 ~하면'이라는 if의 대용이야.","h":["패턴: 서법조동사","Should + 주어 + 동사원형"],"src":"패턴","pp":"패턴편 I 38쪽","x":"need"},{"id":"P057","c":4,"s":2,"k":"err","lv":0,"t":"도치문","q":"[Rarely] [should] a child [is] [discouraged] by his teacher.","a":2,"e":"부정부사 Rarely가 문장 앞으로 나가서 should a child로 도치됐어.¶should 뒤는 동사원형이라 is가 아니라 be: should a child be discouraged.¶평서문이면 A child should rarely be discouraged.","h":["패턴: 서법조동사","도치된 조동사 뒤는 원형"],"src":"패턴","pp":"패턴편 I 38쪽","x":"be"},{"id":"P058","c":4,"s":2,"k":"blank","lv":0,"t":"대동사","q":"Quarter horses can start more quickly, turn more sharply, and run faster over short courses than other breeds _______.","a":0,"e":"비교 대상 동사가 can start, (can) turn, (can) run이야.¶그래서 than 뒤 대동사도 can: than other breeds can.¶구별법: 앞에 조동사가 있으면 대동사도 그 조동사.","h":["패턴: 서법조동사","앞 조동사를 받는 대동사"],"src":"패턴","pp":"패턴편 I 38쪽","o":["can","do","will","may"]},{"id":"P059","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"He won’t believe her, whatever she _______ say.","a":1,"e":"whatever(무엇을 ~하더라도)처럼 양보를 뜻하는 절에는 조동사 may를 써.¶whatever she may say (그녀가 무슨 말을 하더라도).¶= No matter what she may say.","h":["패턴: 패턴편 문제","양보절의 may"],"src":"패턴","pp":"패턴편 I 41쪽","o":["can","may","could","would"]},{"id":"P060","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"Charlie assured his wife that there was no danger, but she could not _______.","a":2,"e":"'~하지 않을 수 없다'는 cannot help -ing.¶she could not help worrying (걱정하지 않을 수 없었다).¶같은 뜻: cannot but + 원형. help but -ing, but to R은 틀려.","h":["패턴: 패턴편 문제","cannot help -ing"],"src":"패턴","pp":"패턴편 I 41쪽","o":["help worry","but to worry","help worrying","help but worrying"]},{"id":"P061","c":4,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"The scientists could not [help] [but talking] about the success [of] the Voyager missions [among] [themselves].","a":1,"e":"cannot help but 뒤에는 동사원형이 와.¶could not help but talk (말하지 않을 수 없었다).¶정리: cannot help -ing = cannot but R = cannot help but R.","h":["패턴: 패턴편 문제","cannot help but + 원형"],"src":"패턴","pp":"패턴편 I 41쪽","x":"but talk"},{"id":"P062","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"I had better put the meat in the refrigerator so that it ________.","a":2,"e":"so that ~ = ~하도록(목적). 주절이 현재(had better put)라 앞으로의 일이야.¶so that it won't melt (녹지 않도록).¶과거형 조동사(wouldn't)는 주절이 과거일 때 써.","h":["패턴: 패턴편 문제","so that + 미래 조동사"],"src":"패턴","pp":"패턴편 I 41쪽","o":["didn’t melt","wouldn’t melt","won’t melt","doesn’t melt"]},{"id":"P063","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"It seems to me that I can hardly pick up a newspaper ________ someone`s comments on that trial.","a":2,"e":"cannot(hardly) A without B-ing = A하면 반드시 B한다.¶신문을 집어 들 때마다 그 재판 이야기를 보게 된다는 뜻이라 without encountering.¶without은 전치사라 뒤에 동명사.","h":["패턴: 패턴편 문제","cannot ~ without -ing"],"src":"패턴","pp":"패턴편 I 41쪽","o":["for me not to ecounter","but to encounter","without encountering","but I don`t encounter"]},{"id":"P070","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"I'm so tired. I'd rather stay at home _______ to the movies.","a":1,"e":"would rather A than B = B하느니 차라리 A하겠다.¶A와 B는 둘 다 동사원형: would rather stay at home than go to the movies.¶to go, going은 형태가 안 맞아.","h":["패턴: 패턴편 문제","would rather A than B"],"src":"패턴","pp":"패턴편 I 45쪽","o":["to go","than go","to going","than going"]},{"id":"P071","c":4,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"The labor union members [shouted] that they [would] rather [die] than [losing] their jobs.","a":3,"e":"would rather A than B에서 B도 동사원형이어야 해.¶would rather die than lose their jobs (일자리를 잃느니 죽겠다).¶losing은 형태가 안 맞아.","h":["패턴: 패턴편 문제","would rather die than lose"],"src":"패턴","pp":"패턴편 I 45쪽","x":"lose"},{"id":"P072","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"Alexander Graham Bell once said that he would rather be remembered as a teacher of the deaf _______ of the telephone.","a":3,"e":"would rather be remembered as A than as B.¶앞의 as a teacher와 짝을 맞춰 than as the inventor of the telephone.¶비교하는 두 덩어리는 같은 모양이어야 해.","h":["패턴: 패턴편 문제","than as the inventor"],"src":"패턴","pp":"패턴편 I 45쪽","o":["invention than","than invented","as the inventor","than as the inventor"]},{"id":"P073","c":4,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"[To become] a member of the civic association, one need only [attend] three meetings and [to pay] his fees [regularly.]","a":2,"e":"need가 조동사로 쓰였어: one need only attend ~ (참석하기만 하면 된다).¶조동사 need 뒤 원형이 and로 이어지니 두 번째도 원형: and pay his fees.¶to pay는 형태가 안 맞아.","h":["패턴: 패턴편 문제","need only + 원형 and 원형"],"src":"패턴","pp":"패턴편 I 47쪽","x":"pay"},{"id":"P074","c":4,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"The idea of space colonies may appear [to be] farfetched at present, but as the earth's population grows and [as] its resources diminish, the idea [will need be] considered [seriously].","a":2,"e":"need는 긍정문에서는 일반동사라 to부정사를 받아: will need to be considered.¶조동사 need(need + 원형)는 부정문·의문문에서만 써: You need not go.¶will need be는 조동사 두 개를 겹친 꼴이라 틀려.","h":["패턴: 패턴편 문제","will need to be + p.p."],"src":"패턴","pp":"패턴편 I 47쪽","x":"will need to be"},{"id":"P075","c":4,"s":2,"k":"blank","lv":0,"t":"패턴편 문제","q":"Ancient civilizations such as the Phoenicians and the Mesopotamians _______ goods rather than use money.","a":1,"e":"과거에 늘 하던 일(물물교환)은 used to + 원형.¶Ancient civilizations used to trade goods (고대 문명은 물물교환을 하곤 했다).¶be used to R은 '~하는 데 사용되다'라 사람이 주어면 뜻이 안 맞아.","h":["패턴: 패턴편 문제","used to + 동사원형"],"src":"패턴","pp":"패턴편 I 49쪽","o":["use to trade","used to trade","is used to trade","was used to trade"]},{"id":"P076","c":4,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"A female scholar [used to being] a deviant in a society where [the learned] woman, far from [being valued], is [likely to hear] herself [made fun of] on the public stage.","a":0,"e":"이 문장에는 where절 밖에 본동사가 없어.¶'~에 익숙하다'는 be used to -ing라 A female scholar is used to being a deviant.¶구별법: used to + 원형(~하곤 했다) / be used to + -ing(~에 익숙하다).","h":["패턴: 패턴편 문제","문장에 동사가 없음"],"src":"패턴","pp":"패턴편 I 49쪽","x":"is used to being"},{"id":"P077","c":4,"s":2,"k":"err","lv":0,"t":"패턴편 문제","q":"[Like] other forms of energy, natural gas [may be used] [to heating] homes, cook food, and even [run] automobiles.","a":2,"e":"'~하는 데 사용되다'는 be used to + 동사원형.¶may be used to heat homes, (to) cook food, and (to) run automobiles.¶뒤의 cook, run(원형)과 나란히 가야 하니 to heating이 아니라 to heat.","h":["패턴: 패턴편 문제","be used to + 동사원형"],"src":"패턴","pp":"패턴편 I 49쪽","x":"to heat"},{"id":"4-03","c":4,"s":2,"k":"blank","lv":2,"t":"may well","q":"He ___ be proud of his son; he has just become a doctor.","o":["may well","may as well","might as well","can well"],"a":0,"h":["'자랑스러워하는 것도 당연하다'라는 뜻이야.","may well R = have good reason to R"],"e":"may well + 원형 = ~하는 것도 당연하다.¶아들이 의사가 됐으니 자랑스러워하는 게 당연하다: He may well be proud.¶비교: may as well = ~하는 편이 낫다.","src":"연습"},{"id":"4-04","c":4,"s":2,"k":"blank","lv":2,"t":"may as well A as B","q":"You ___ throw your money away as lend it to him.","o":["may well","might as well","had better","would rather"],"a":1,"h":["뒤에 as lend가 있어서 'A하는 것은 B하는 것과 같다'는 비교 구문이야.","may/might as well A as B"],"e":"may(might) as well A as B = B하느니 차라리 A하는 게 낫다.¶그에게 돈을 빌려주느니 차라리 버리는 게 낫다: might as well throw ~ as lend ~.¶뒤에 as가 있는 게 단서야.","src":"연습"},{"id":"4-05","c":4,"s":2,"k":"blank","lv":2,"t":"cannot help -ing","q":"I cannot help ___ at the sight.","a":0,"h":["'~하지 않을 수 없다'를 cannot help로 쓰면 뒤에 어떤 형태가 와?","cannot but R과 형태를 헷갈리지 마."],"e":"'~하지 않을 수 없다'는 cannot help + -ing.¶I cannot help laughing (웃지 않을 수 없다).¶같은 뜻: cannot but laugh, cannot help but laugh.","o":["laughing","laugh","to laugh","but laughing"],"src":"연습"},{"id":"4-06","c":4,"s":2,"k":"err","lv":2,"t":"cannot ~ too","q":"You [cannot] be [very] careful [when] you drive [at night].","a":1,"h":["'아무리 조심해도 지나치지 않다'라는 뜻이 되게 고쳐 봐.","cannot ~ too ~"],"e":"cannot ~ too ~ = 아무리 ~해도 지나치지 않다.¶You cannot be too careful (아무리 조심해도 지나치지 않다).¶very로 바꾸면 '아주 조심할 수 없다'는 엉뚱한 뜻이 돼.","x":"too","src":"연습"},{"id":"4-07","c":4,"s":2,"k":"err","lv":3,"t":"부정적 추측 cannot","q":"The cause of his death [may be] heavy smoking, but the news [must not] be true because no doctor [has confirmed] it [yet].","a":1,"x":"cannot","h":["'사실일 리가 없다'는 추측이야.","must not은 금지, '~일 리 없다'는 다른 조동사."],"e":"'~일 리가 없다'는 부정적 추측은 cannot.¶the news cannot be true (그 소식은 사실일 리 없다).¶must not은 '~해서는 안 된다'(금지)라 추측에 안 써.","src":"연습"},{"id":"4-10","c":4,"s":2,"k":"err","lv":2,"t":"조동사 need와 일반동사 need","q":"You [needed not] [write] a letter [to] him [yesterday].","a":0,"h":["조동사 need는 과거형이 따로 없어.","과거 부정은 일반동사 need로 써."],"e":"조동사 need는 과거형이 따로 없어서 needed not (X).¶과거 '~할 필요가 없었다'는 일반동사로 didn't need to.¶이미 해 버린 일이라면 need not have written(쓸 필요 없었는데 썼다).","x":"didn't need to","src":"연습"},{"id":"4-11","c":4,"s":2,"k":"blank","lv":1,"t":"used to와 would","q":"There ___ be a big tree in front of my house.","o":["used to","would","was used to","is used to"],"a":0,"h":["나무가 '있었다'는 동작이야, 상태야?","과거의 상태는 used to만 가능해."],"e":"나무가 '있었다'는 동작이 아니라 상태야.¶과거의 상태는 used to만 가능: There used to be a big tree.¶would는 과거의 '동작' 습관에만 써(He would often go fishing).","src":"연습"},{"id":"P064","c":4,"s":3,"k":"blank","lv":0,"t":"과거표현의 선택","q":"She worked very hard so that she _______ pass the entrance exam.","a":3,"e":"주절이 과거(worked)라 목적절 조동사도 과거형으로 맞춰.¶so that she could pass the exam (시험에 합격할 수 있도록).¶주절이 현재면 so that she can pass.","h":["패턴: 서법조동사의 시점","과거 주절 + so that could"],"src":"패턴","pp":"패턴편 I 43쪽","o":["will","shall","may","could"]},{"id":"P065","c":4,"s":3,"k":"blank","lv":0,"t":"과거표현의 선택","q":"I told him that he ______ worked much harder.","a":0,"e":"'더 열심히 했어야 했다'는 과거에 하지 않은 일에 대한 유감이야.¶should have + p.p.: he should have worked much harder.¶could만 쓰면 have가 빠져서 worked와 맞지 않아.","h":["패턴: 서법조동사의 시점","should have p.p. = 후회·유감"],"src":"패턴","pp":"패턴편 I 43쪽","o":["should have","could","will have","shall have"]},{"id":"P066","c":4,"s":3,"k":"blank","lv":0,"t":"과거표현의 선택","q":"A: Did you finish Lesson 7 today? B: Yes, but I ______ it last Friday.","a":1,"e":"오늘 끝냈지만 원래 '지난 금요일에 끝냈어야 했다'는 뜻이야.¶하지 않은 과거 일에 대한 아쉬움 = should have finished.¶should finish는 앞으로의 일이라 last Friday와 안 맞아.","h":["패턴: 서법조동사의 시점","해야 했는데 안 한 일"],"src":"패턴","pp":"패턴편 I 43쪽","o":["should finish","should have finished","should be finishing","should be finished"]},{"id":"P067","c":4,"s":3,"k":"blank","lv":0,"t":"과거의 추측과 과거의 유감 의미구별","q":"A: Please accept my apology for breaking one of your favorite glasses. B: Well, I suppose it might have been worse. All of my glasses _______.","a":2,"e":"'더 나쁠 수도 있었다'는 말에 이어 '잔이 전부 깨졌을 수도 있었다'는 과거의 가능성이야.¶could have p.p. = ~했을 수도 있었다: could have been broken.¶must have been은 '깨졌음에 틀림없다'라 사실과 달라.","h":["패턴: 서법조동사의 시점","could have p.p. = ~했을 수도 있다"],"src":"패턴","pp":"패턴편 I 43쪽","o":["won`t never be broken","must have been broken","could have been broken","should have been broken"]},{"id":"P068","c":4,"s":3,"k":"blank","lv":0,"t":"과거의 추측과 과거의 유감 의미구별","q":"Look at all the water on the ground. It _______ really hard last night.","a":0,"e":"땅에 물이 가득하니 어젯밤 비가 많이 왔음에 '틀림없다'는 강한 추측이야.¶과거에 대한 확신 있는 추측 = must have p.p.: must have rained.¶should have rained는 '왔어야 했는데'라 뜻이 달라.","h":["패턴: 서법조동사의 시점","must have p.p. = 확신 있는 과거 추측"],"src":"패턴","pp":"패턴편 I 43쪽","o":["must have rained","should rain","must be raining","should have rained"]},{"id":"P069","c":4,"s":3,"k":"blank","lv":0,"t":"과거의 추측과 과거의 유감 의미구별","q":"That was very kind of you, but you _______ have done it.","a":0,"e":"이미 해 준 일에 대해 '그럴 필요는 없었는데'라고 말하는 거야.¶need not have p.p. = ~할 필요가 없었는데 (해 버렸다).¶친절했다는 말과 함께 써서 고마움 + 미안함을 표현해.","h":["패턴: 서법조동사의 시점","need not have p.p."],"src":"패턴","pp":"패턴편 I 43쪽","o":["need not","can not","may","had better"]},{"id":"4-08","c":4,"s":3,"k":"blank","lv":2,"t":"must have p.p.","q":"He ___ the exam; he looks so happy.","o":["must have passed","should have passed","cannot have passed","need not have passed"],"a":0,"h":["지금 기뻐 보이니 과거 일을 강하게 추측하는 거야.","과거에 대한 강한 확신은 must have p.p."],"e":"지금 아주 기뻐 보이니 시험에 '붙었음에 틀림없다'는 추측이야.¶must have p.p. = ~했음에 틀림없다(과거 추측).¶비교: should have p.p.(했어야 했는데), cannot have p.p.(했을 리 없다).","src":"연습"},{"id":"4-09","c":4,"s":3,"k":"blank","lv":2,"t":"should have p.p.","q":"I failed the test. I ___ harder.","a":0,"h":["과거에 하지 않은 일에 대한 후회야.","should + have + p.p."],"e":"시험에 떨어졌어. 그래서 '더 열심히 공부했어야 했는데'라는 후회야.¶should have p.p. = ~했어야 했는데 (안 했다).¶must have studied는 '공부했음에 틀림없다'라 반대 뜻이야.","o":["should have studied","must have studied","cannot have studied","should study"],"src":"연습"},{"id":"P078","c":5,"s":0,"k":"blank","lv":0,"t":"시제를 앞당긴 가정법인가, 직설법인가","q":"If he didn't promise it yesterday, still he _______ it tomorrow.","a":3,"e":"If he didn't promise it yesterday는 '어제 실제로 약속을 안 했다'는 사실을 말하는 거야. 가정법이 아니라 직설법이지.¶시제를 하나 앞당긴 가정이 아니니 내일 일은 그대로 미래 will not promise.¶구별법: if절에 yesterday처럼 실제 과거 시점이 있으면 진짜 과거(직설법)일 가능성이 높아.","h":["패턴: 직설법과 가정법의 구분방법","직설법 조건문"],"src":"패턴","pp":"패턴편 I 53쪽","o":["should not promise","could not promise","would not promise","will not promise"]},{"id":"P079","c":5,"s":0,"k":"err","lv":0,"t":"사실인가, 사실의 반대인가","q":"I [would] be able to finish [all my] work if the day [was] thirty [hours] long.","a":2,"e":"하루가 30시간이라는 건 현재 사실의 반대라 가정법 과거야.¶가정법 과거의 be동사는 주어가 무엇이든 were가 원칙: if the day were thirty hours long.¶(일상 회화에선 was도 쓰지만 시험에선 were가 정답)","h":["패턴: 직설법과 가정법의 구분방법","가정법 과거의 be동사"],"src":"패턴","pp":"패턴편 I 53쪽","x":"were"},{"id":"P080","c":5,"s":0,"k":"err","lv":0,"t":"사실인가, 사실의 반대인가","q":"Why [do] U.S. golf clubmakers still use Chinese factories? “If we [don't],” [says Adams], “your $400 driver [would cost] $1,000.”","a":1,"e":"주절 would cost는 가정법 과거의 모양이야. 실제로는 중국 공장을 '쓰고 있으니까' 쓰지 않는다면은 현재 사실의 반대지.¶그래서 조건절도 과거형: If we didn't.¶짝 외우기: If + 과거, would + 원형.","h":["패턴: 직설법과 가정법의 구분방법","가정법 과거의 조건절"],"src":"패턴","pp":"패턴편 I 53쪽","x":"didn't"},{"id":"P081","c":5,"s":1,"k":"blank","lv":0,"t":"단순한 형태","q":"The climate ______ more extreme if the town were a long way from the sea.","a":3,"e":"if절이 were(가정법 과거)라 주절은 would + 동사원형.¶The climate would be more extreme (기후가 더 극단적일 텐데). 실제로는 바다에서 멀지 않다는 뜻이야.¶짝 외우기: If + 과거(were), 주어 + would + 원형.","h":["패턴: ※ 가정법과거","가정법 과거의 주절"],"src":"패턴","pp":"패턴편 I 55쪽","o":["was","will be","was being","would be"]},{"id":"P087","c":5,"s":1,"k":"blank","lv":0,"t":"같은 시점, 다른 시점 구분하기","q":"If she _______ the manager, she would not treat us so severely.","a":0,"e":"주절 would not treat가 가정법 과거라 조건절도 과거형이어야 해.¶be동사는 were: If she were the manager (그녀가 매니저라면, 실제론 아님).¶had been은 과거 사실의 반대라 주절과 시점이 안 맞아.","h":["패턴: ※ 가정법과거","가정법 과거의 were"],"src":"패턴","pp":"패턴편 I 56쪽","o":["were","are","is","had been"]},{"id":"5-01","c":5,"s":1,"k":"err","lv":1,"t":"It's time + 가정법","q":"It's [time] we [go] to [bed]; it's [already] midnight.","a":1,"h":["'진작 ~했어야 할 시간이다'라는 뜻이야.","It's time + 주어 + 과거동사"],"e":"It's time + 주어 + 과거동사 = (진작) ~했어야 할 시간이다.¶It's time we went to bed (이제 잘 시간이다, 이미 늦었다).¶should + 원형도 가능해: It's time we should go to bed.","x":"went (또는 should go)","src":"연습"},{"id":"5-02","c":5,"s":1,"k":"blank","lv":2,"t":"would rather + 가정법","q":"I'd rather you ___ anything about it.","o":["don't do","didn't do","won't do","not do"],"a":1,"h":["would rather 뒤에 주어 + 동사의 절이 오면 어떤 시제를 써?","현재의 바람이지만 가정법 과거."],"e":"would rather 뒤에 '주어 + 동사' 절이 오면 가정법 과거를 써.¶I'd rather you didn't do anything (네가 아무것도 안 했으면 좋겠어).¶뜻은 현재·미래의 바람이지만 형태는 과거.","src":"연습"},{"id":"5-03","c":5,"s":1,"k":"err","lv":2,"t":"가정법 과거의 be동사","q":"I [would be able to] finish all my work [if] the day [was] thirty hours [long].","a":2,"x":"were","h":["하루가 30시간인 것은 현재 사실의 반대야.","가정법 과거에서 be동사는 원칙적으로 하나로 통일해."],"e":"하루가 30시간이라는 건 현재 사실의 반대(가정법 과거)야.¶be동사는 주어와 상관없이 were: if the day were thirty hours long.¶시험에서는 was를 틀린 것으로 봐.","src":"연습"},{"id":"P082","c":5,"s":2,"k":"blank","lv":0,"t":"단순한 형태","q":"They could have stopped him if they _______ .","a":4,"e":"주절 could have stopped는 가정법 과거완료(과거 사실의 반대)야.¶그래서 조건절은 had + p.p.: if they had wanted to (그들이 원했더라면).¶짝 외우기: If + had p.p., 주어 + would/could have p.p.","h":["패턴: ※ 가정법과거","가정법 과거완료의 조건절"],"src":"패턴","pp":"패턴편 I 55쪽","o":["want to","were wanting to","have wanted to","wanted","had wanted to"]},{"id":"P088","c":5,"s":2,"k":"blank","lv":0,"t":"같은 시점, 다른 시점 구분하기","q":"A: What do you think about German? B: If I had known German was so difficult, I ________ it up.","a":0,"e":"If I had known(과거 사실의 반대)이니까 주절은 would have p.p.¶I would never have taken it up (애초에 시작하지 않았을 거야).¶would never had taken은 have 자리에 had를 쓴 틀린 형태야.","h":["패턴: ※ 가정법과거","가정법 과거완료의 주절"],"src":"패턴","pp":"패턴편 I 56쪽","o":["would never have taken","would never take","will never take","would never had taken"]},{"id":"5-04","c":5,"s":2,"k":"err","lv":1,"t":"가정법 과거완료의 주절","q":"If I [had known] her number [yesterday], I [would call] her [to apologize].","a":2,"x":"would have called","h":["if절이 had p.p.면 무엇의 반대야?","가정법 과거완료 주절 = would have p.p."],"e":"If I had known(가정법 과거완료) + yesterday라 주절도 과거의 반대여야 해.¶I would have called her (전화했을 텐데).¶would call은 지금 일의 반대라 yesterday와 안 맞아.","src":"연습"},{"id":"5-05","c":5,"s":2,"k":"blank","lv":2,"t":"If it had not been for","q":"If it had not been for your help, I ___.","o":["would fail","would have failed","had failed","will fail"],"a":1,"h":["If it had not been for는 '~가 없었다면'이야.","과거의 반대니 주절은 would have p.p."],"e":"If it had not been for ~ = ~가 없었다면 (가정법 과거완료).¶그래서 주절도 would have p.p.: I would have failed.¶= Without your help, I would have failed.","src":"연습"},{"id":"P083","c":5,"s":3,"k":"err","lv":0,"t":"시점부사 보기","q":"If you had not [stayed] [out] late last night, you [would not] [have felt] so tired now.","a":3,"e":"if절은 last night(과거)이라 had not stayed, 주절은 now(지금)라 현재의 반대 would not feel.¶이렇게 앞과 뒤의 시점이 다른 걸 혼합 가정법이라고 해.¶구별법: 주절에 now, today가 있으면 would + 원형.","h":["패턴: ※ 가정법과거","now가 있으면 혼합 가정법"],"src":"패턴","pp":"패턴편 I 55쪽","x":"feel"},{"id":"P084","c":5,"s":3,"k":"err","lv":0,"t":"다른동사 보기","q":"If you [saw] the amount of food he ate [for breakfast] this morning, you would [understand] [why] he has grown so fat.","a":0,"e":"this morning(오늘 아침)에 먹은 양을 '봤다면'은 과거 사실의 반대라 had seen.¶주절은 지금 이해할 텐데(현재의 반대)라 would understand.¶과거 반대 + 현재 반대 = 혼합 가정법.","h":["패턴: ※ 가정법과거","this morning은 과거"],"src":"패턴","pp":"패턴편 I 55쪽","x":"had seen"},{"id":"P085","c":5,"s":3,"k":"blank","lv":0,"t":"다른동사 보기","q":"I’m hungry because I didn’t eat anything this morning. If I ①_______ breakfast, I ②_______ hungry now.","a":2,"e":"아침을 안 먹은 건 과거라 ① had eaten, 지금 배고픈 건 현재라 ② wouldn't be.¶If I had eaten breakfast, I wouldn't be hungry now.¶now가 혼합 가정법의 결정적 단서야.","h":["패턴: ※ 가정법과거","과거 반대 + 현재 반대"],"src":"패턴","pp":"패턴편 I 55쪽","o":["① ate        ―  ② wouldn't be","① ate        ―  ② wouldn't have been","① had eaten  ―  ② wouldn't be","① had eaten  ―  ② wouldn't have been"]},{"id":"P086","c":5,"s":3,"k":"blank","lv":0,"t":"다른동사 보기","q":"A: “I am very tired.” B: “You would be less tired if you ________ to bed earlier last night.”","a":0,"e":"last night(어젯밤)에 일찍 잤다면은 과거의 반대라 had gone.¶주절 would be less tired는 지금(현재)의 반대야.¶과거 반대(if절) + 현재 반대(주절) = 혼합 가정법.","h":["패턴: ※ 가정법과거","last night은 과거"],"src":"패턴","pp":"패턴편 I 55쪽","o":["had gone","would have gone","went","have been","would had gone"]},{"id":"5-06","c":5,"s":3,"k":"blank","lv":3,"t":"혼합 가정법","q":"If he had taken the doctor's advice then, he ___ healthy now.","o":["would be","would have been","will be","had been"],"a":0,"h":["if절의 then과 주절의 now를 봐.","과거에 ~했다면 (지금) ~할 텐데: 혼합 가정법"],"e":"if절은 then(그때)이라 과거 반대 had taken, 주절은 now(지금)라 현재 반대 would be.¶If he had taken the advice then, he would be healthy now.¶시간 부사(then, now)를 보면 각 절의 시점이 보여.","src":"연습"},{"id":"P089","c":5,"s":4,"k":"blank","lv":0,"t":"주절을 물어보는 경우","q":"If a ruby is heated, it ______ temporarily lose its color.","a":2,"e":"루비를 가열하면 색이 변하는 건 실제로 일어나는 일이야. 사실과 반대가 아니니 직설법.¶조건절 현재(is heated) + 주절 미래 will lose.¶would를 쓰면 실제로는 일어나지 않는다는 뜻이 돼.","h":["패턴: 가정법현재","가능성 있는 조건은 직설법"],"src":"패턴","pp":"패턴편 I 59쪽","o":["would","does","will","has"]},{"id":"P090","c":5,"s":4,"k":"blank","lv":0,"t":"조건절을 물어보는 경우","q":"If the client _______ dissatisfied, please have him write a letter.","a":1,"e":"고객이 불만스러울 수 있는 실제 가능성이라 직설법이야.¶조건 부사절에서는 미래 대신 현재를 쓰니 is. 주어 client가 단수라 are가 아니라 is.¶주절이 명령문(please have him write)이어도 같은 규칙이야.","h":["패턴: 가정법현재","조건절 현재로 미래 대신"],"src":"패턴","pp":"패턴편 I 59쪽","o":["will be","is","are","be"]},{"id":"P113","c":5,"s":4,"k":"blank","lv":0,"t":"명령형 동사","q":"He also requested that the private sector voluntarily _______ from any such activity.","a":0,"e":"request(요청하다) 같은 요구·제안 동사 뒤 that절은 '(should) + 동사원형'이야.¶that the private sector (should) refrain from ~.¶같은 부류: insist, demand, require, suggest, recommend, order.","h":["패턴: 명령형","request that + (should) 원형"],"src":"패턴","pp":"패턴편 I 75쪽","o":["refrain","might refrain","has been refrained","can refrain"]},{"id":"P114","c":5,"s":4,"k":"err","lv":0,"t":"명령형 동사","q":"The [patient’s] doctor [strongly] urges that he [has] an operation on his back as soon as his general health [improves].","a":2,"e":"urge(촉구하다)는 요구 동사라 that절에 (should) + 원형.¶주어가 he여도 has가 아니라 have: that he (should) have an operation.¶3인칭 단수인데 -s가 없는 게 이 문법의 특징이야.","h":["패턴: 명령형","urge that + (should) 원형"],"src":"패턴","pp":"패턴편 I 75쪽","x":"have"},{"id":"P115","c":5,"s":4,"k":"blank","lv":0,"t":"명령형 형용사","q":"It is essential that he ______ the director of the English program.","a":3,"e":"essential(필수적인)처럼 '꼭 해야 한다'는 판단 형용사 뒤 that절도 (should) + 원형.¶It is essential that he be the director.¶같은 부류: necessary, important, imperative, vital.","h":["패턴: 명령형","essential that + 원형"],"src":"패턴","pp":"패턴편 I 75쪽","o":["being","will be","to be","be"]},{"id":"P116","c":5,"s":4,"k":"err","lv":0,"t":"명령형 형용사","q":"It is [imperative] that a graduate student [maintains] a [grade point average] [of] “B” in his study.","a":1,"e":"imperative(반드시 해야 하는)는 당위 형용사라 that절에 (should) + 원형.¶a graduate student (should) maintain a B average.¶maintains처럼 -s를 붙이면 틀려.","h":["패턴: 명령형","imperative that + 원형"],"src":"패턴","pp":"패턴편 I 75쪽","x":"maintain"},{"id":"P117","c":5,"s":4,"k":"blank","lv":0,"t":"명령형 형용사","q":"I found it strongly recommendable that he _______ for bankruptcy.","a":2,"e":"recommendable(권할 만한)도 '해야 한다'는 판단이라 that절에 (should) + 원형.¶that he (should) file for bankruptcy (파산 신청을 해야 한다).¶files, filed는 사실을 말하는 형태라 안 맞아.","h":["패턴: 명령형","recommendable that + 원형"],"src":"패턴","pp":"패턴편 I 75쪽","o":["would have filed","filed","file","files"]},{"id":"P118","c":5,"s":4,"k":"err","lv":0,"t":"명령형 명사","q":"John complied [with] the requirement that [all graduate] students [in education] [would write] a thesis.","a":3,"e":"requirement(요구 사항) 같은 명사 뒤 that절도 (should) + 원형.¶the requirement that all students (should) write a thesis.¶would write는 이 자리에 쓰지 않아.","h":["패턴: 명령형","requirement that + 원형"],"src":"패턴","pp":"패턴편 I 75쪽","x":"write"},{"id":"P119","c":5,"s":4,"k":"err","lv":0,"t":"명령형(당위) 문장 vs 단순 사실 문장","q":"The witness insisted that [that major] car accident [take place] around the corner [at] about [11 p.m].","a":1,"e":"insist가 '~해야 한다고 주장하다'면 (should) + 원형이지만, '~했다고(사실이라고) 주장하다'면 그냥 시제대로 써.¶증인은 사고가 '일어났다'는 과거 사실을 주장한 거라 took place.¶구별법: '해야 한다'(당위) → 원형 / '했다'(사실) → 시제대로.","h":["패턴: 명령형","insist가 사실 주장이면 직설법"],"src":"패턴","pp":"패턴편 I 75쪽","x":"took place"},{"id":"5-07","c":5,"s":4,"k":"blank","lv":2,"t":"제안 동사 + that + (should) R","q":"The doctor suggested that he ___ smoking.","a":0,"h":["suggest가 '제안하다'일 때 that절의 동사 형태야.","주장·요구·제안·명령 동사 + that + 주어 + (should) 동사원형"],"e":"suggest(제안하다)는 제안 동사라 that절에 (should) + 원형.¶The doctor suggested that he (should) stop smoking.¶stops, stopped처럼 시제를 맞추면 틀려.","o":["stop","stops","stopped","will stop"],"src":"연습"},{"id":"P091","c":5,"s":5,"k":"err","lv":0,"t":"'should' 미래 가정법","q":"If the volcano slope should collapse and [slide] into the sea, a scientist warns, it [has sent] waves [coursing] through [the Atlantic basin].","a":1,"e":"If ~ should collapse는 '혹시라도 무너진다면'이라는 가정법 미래야.¶주절은 would(또는 will) + 원형: it would send waves ~.¶has sent(현재완료)는 아직 안 일어난 가정과 맞지 않아.","h":["패턴: 가정법미래","should 가정법 미래의 주절"],"src":"패턴","pp":"패턴편 I 61쪽","x":"would send"},{"id":"P092","c":5,"s":5,"k":"blank","lv":0,"t":"'should' 미래 가정법","q":"If you _______ see Mr. Smith, give him my regards.","a":1,"e":"'혹시라도 Smith 씨를 만나면'이라는 가능성 낮은 미래 가정이라 If you should see.¶가정법 미래 should는 주절에 명령문(give him my regards)이 자주 와.¶= Should you see Mr. Smith, ~.","h":["패턴: 가정법미래","If you should ~ 명령문"],"src":"패턴","pp":"패턴편 I 61쪽","o":["would","should","will","shall"]},{"id":"P093","c":5,"s":5,"k":"blank","lv":0,"t":"'were to' 미래 가정법","q":"_______, I for one would be disturbed.","a":0,"e":"그가 메달을 딸 가능성이 거의 없는 미래를 가정하는 거야.¶이럴 때는 If + 주어 + were to + 원형: If he were to win the medal.¶주절 would be와 짝이 맞아. was to는 시험에서 틀린 것으로 봐.","h":["패턴: 가정법미래","were to = 거의 불가능한 가정"],"src":"패턴","pp":"패턴편 I 61쪽","o":["If he were to win the medal","If he was to win the medal","If he wins the medal","If he is the winner of the medal"]},{"id":"5-08","c":5,"s":5,"k":"blank","lv":2,"t":"were to 가정법 미래","q":"If the sun ___ rise in the west, I would not change my mind.","o":["were to","should","will","would"],"a":0,"h":["해가 서쪽에서 뜰 가능성은 거의 0%야.","실현 가능성이 거의 없는 미래는 were to."],"e":"해가 서쪽에서 뜰 가능성은 0%야. 거의 불가능한 미래 가정은 If + 주어 + were to + 원형.¶If the sun were to rise in the west (해가 서쪽에서 뜬다 해도).¶가능성이 낮지만 있는 일이면 should를 써.","src":"연습"},{"id":"P094","c":5,"s":6,"k":"blank","lv":0,"t":"‘were, had, should'의 접속사 역할","q":"________ cut away, the wheel could be strengthened with struts or crossbars.","a":0,"e":"If large sections of a wheel were cut away에서 if를 생략하면 were가 주어 앞으로 나가.¶Were large sections of a wheel cut away, ~ (바퀴의 큰 부분이 잘려 나간다면).¶if 생략 도치는 were, had, should 세 가지만 가능해.","h":["패턴: ‘were, had, should'의 접속사 역할","Were + 주어 + p.p. 도치"],"src":"패턴","pp":"패턴편 I 63쪽","o":["Were large sections of a wheel","Large sections of a wheel","Large sections of a wheel were","Large sections of a wheel to"]},{"id":"P095","c":5,"s":6,"k":"blank","lv":0,"t":"‘were, had, should'의 접속사 역할","q":"_______ you have any questions about this matter, never hesitate to drop by my office.","a":0,"e":"If you should have any questions에서 if를 생략하면 Should you have ~.¶Should you have any questions, never hesitate to drop by. (혹시 질문이 있으면 언제든 들러)¶주절이 명령문인 것도 should 가정법의 특징이야.","h":["패턴: ‘were, had, should'의 접속사 역할","Should you ~ = If you should ~"],"src":"패턴","pp":"패턴편 I 63쪽","o":["Should","Would","Could","That"]},{"id":"P096","c":5,"s":6,"k":"err","lv":0,"t":"‘were, had, should' 도치구문 이하의 동사형태","q":"[Should] a foreign student [needing] [help], he or she [must] see the foreign student advisor.","a":1,"e":"Should a foreign student need help = If a foreign student should need help.¶should 뒤 동사는 원형이라 need. needing은 동사가 아니야.¶if를 생략하고 should가 앞으로 나간 도치 문장이야.","h":["패턴: ‘were, had, should' 도치구문 이하의 동사형태","Should 도치 뒤 동사원형"],"src":"패턴","pp":"패턴편 I 63쪽","x":"need"},{"id":"P097","c":5,"s":6,"k":"blank","lv":0,"t":"‘were, had, should' 도치구문 이하의 동사형태","q":"We were instructed to disable the trigger device _______ there be any indication of system malfunction.","a":0,"e":"빈칸 뒤가 there be(원형)야. 원형 앞에 올 수 있는 건 조동사 should.¶should there be any indication = if there should be any indication (혹시 이상 징후가 있으면).¶if, in case는 뒤에 there is처럼 시제가 있는 동사가 와야 해.","h":["패턴: ‘were, had, should' 도치구문 이하의 동사형태","should 도치의 위치"],"src":"패턴","pp":"패턴편 I 63쪽","o":["should","if","in case","provided that"]},{"id":"P098","c":5,"s":6,"k":"blank","lv":0,"t":"‘were, had, should'와 ’if'의 구별","q":"_______ he triumphed, he would have been widely recognized as the game’s leading player.","a":2,"e":"주절 would have been(과거 사실의 반대)에 맞춰 조건절은 had p.p.¶If he had triumphed에서 if를 생략하면 Had he triumphed.¶빈칸 뒤 he triumphed가 이미 있으니 if를 쓰려면 If he had triumphed여야 해.","h":["패턴: ‘were, had, should'와 ’if'의 구별","Had + 주어 + p.p."],"src":"패턴","pp":"패턴편 I 64쪽","o":["Should","If","Had","Were"]},{"id":"P099","c":5,"s":6,"k":"blank","lv":0,"t":"‘were, had, should'와 ’if'의 구별","q":"_______ I was to failing, I would not have gone to the party.","a":3,"e":"주절 would not have gone(과거 사실의 반대)에 맞춰 If I had realized → Had I realized.¶how close I was to failing (내가 얼마나 낙제에 가까웠는지). was의 보어라 부사 closely가 아니라 형용사 close.¶Had I had realized처럼 had를 두 번 쓰면 틀려.","h":["패턴: ‘were, had, should'와 ’if'의 구별","Had I realized"],"src":"패턴","pp":"패턴편 I 64쪽","o":["When I realized how closely","If I would have realized how closely","Had I had realized how close","Had I realized how close","If I realized how close"]},{"id":"P100","c":5,"s":6,"k":"blank","lv":0,"t":"‘were, had, should'와 ’if'의 구별","q":"_______ the manager, please tell him that I am waiting for him in the hotel lounge.","a":3,"e":"빈칸 뒤가 명령문(please tell him)이라 '혹시 매니저를 만나면'이라는 가정법 미래가 어울려.¶Should you meet the manager = If you should meet the manager.¶Having met은 주어가 없어서 명령문과 어색해.","h":["패턴: ‘were, had, should'와 ’if'의 구별","Should you meet"],"src":"패턴","pp":"패턴편 I 64쪽","o":["Having met","Unless you meet","Will you meet","Should you meet"]},{"id":"5-09","c":5,"s":6,"k":"err","lv":2,"t":"가정절 도치","q":"[If had I known] the truth, I [would have told] you [right away] [about] it.","a":0,"h":["if를 생략하면 어순이 어떻게 바뀌지?","If I had known = Had I known"],"e":"가정법에서 if를 생략하면 had가 주어 앞으로 나가: Had I known the truth.¶if와 도치를 같이 쓸 수는 없어. If had I known (X).¶= If I had known the truth.","x":"Had I known (또는 If I had known)","src":"연습"},{"id":"5-10","c":5,"s":6,"k":"blank","lv":3,"t":"Were it not for","q":"___ it not for water, no living things could survive.","a":0,"h":["If it were not for water에서 if를 생략해 봐.","가정법 과거 도치"],"e":"If it were not for water(물이 없다면)에서 if를 생략하면 Were it not for water.¶주절 could survive가 가정법 과거라 were가 맞아.¶과거라면 Had it not been for ~.","o":["Were","Had","Should","If"],"src":"연습"},{"id":"P101","c":5,"s":7,"k":"err","lv":0,"t":"'wish' 가정법 - 과거형의 필요성","q":"There [were] [a great many] children from broken homes in the suburban schools. The principal wished that there [are] more [intact] families.","a":2,"e":"wish 뒤에는 이루어지지 않은 바람이라 가정법 과거를 써.¶The principal wished that there were more intact families (온전한 가정이 더 많으면 좋겠다고 바랐다).¶are를 쓰면 실제로 그렇다는 뜻이 돼.","h":["패턴: wish","wish + 가정법 과거"],"src":"패턴","pp":"패턴편 I 67쪽","x":"were"},{"id":"P102","c":5,"s":7,"k":"blank","lv":0,"t":"'wish' 가정법 - 시점의 구분","q":"I wish I _______ hooky at school. I failed the exam miserably!","a":2,"e":"이미 시험을 망쳤으니 '땡땡이친 것'은 지난 과거 일이야.¶과거 일에 대한 후회는 wish + 과거완료: I wish I hadn't played hooky.¶didn't play는 지금의 아쉬움이라 시점이 안 맞아.","h":["패턴: wish","과거에 대한 후회"],"src":"패턴","pp":"패턴편 I 67쪽","o":["wouldn't play","didn't play","hadn't played","wouldn't have played"]},{"id":"P103","c":5,"s":7,"k":"blank","lv":0,"t":"'wish' 가정법 - 시점의 구분","q":"I wish that you ______ such a bad headache because I'm sure that you would have enjoyed the concert.","a":0,"e":"콘서트는 이미 지나갔어(would have enjoyed가 단서). 그때 두통이 없었으면 좋았을 거라는 아쉬움이야.¶과거에 대한 바람은 wish + 과거완료: hadn't had such a bad headache.¶hadn't만 쓰면 동사가 빠져.","h":["패턴: wish","과거의 아쉬움 = had p.p."],"src":"패턴","pp":"패턴편 I 67쪽","o":["hadn't had","hadn't","didn't have","haven't had","didn't have had"]},{"id":"P104","c":5,"s":7,"k":"err","lv":0,"t":"사실과 반대를 표현","q":"That [American] speaks [Korean] as [fluently] as if he [is] a Korean.","a":3,"e":"그 미국인은 실제로 한국인이 아니야. 사실과 반대를 말하니 as if + 가정법 과거.¶as if he were a Korean (마치 한국인인 것처럼).¶is를 쓰면 실제로 한국인일 수도 있다는 뜻이 돼.","h":["패턴: as if","as if + 가정법 과거"],"src":"패턴","pp":"패턴편 I 69쪽","x":"were"},{"id":"P105","c":5,"s":7,"k":"blank","lv":0,"t":"사실과 반대를 표현","q":"The wind lulls as if ________.","a":0,"e":"바람이 잦아드는 걸 '마치 그들을 깨울까 두려워하는 듯' 표현했어. 실제로 바람이 두려워할 리 없으니 사실의 반대야.¶as if + 과거: as if it feared to waken them.¶fears, must, is going to는 사실을 말하는 형태라 안 돼.","h":["패턴: as if","as if + 과거"],"src":"패턴","pp":"패턴편 I 69쪽","o":["it feared to waken them","it must waken them","it fears to waken them","it is going to awaken them"]},{"id":"P106","c":5,"s":7,"k":"blank","lv":0,"t":"패턴편 문제","q":"It's about time she __________ out what that reason is.","a":2,"e":"It's about time + 주어 + 과거동사 = 이제 ~할 때다(늦었다).¶It's about time she found out ~ (이제 그녀가 알아낼 때다).¶형태는 과거지만 뜻은 지금·앞으로의 일이야.","h":["패턴: 패턴편 문제","It's about time + 과거"],"src":"패턴","pp":"패턴편 I 71쪽","o":["find","finds","found","had found"]},{"id":"P107","c":5,"s":7,"k":"blank","lv":0,"t":"패턴편 문제","q":"I’d rather you _______ anything about it for the time being.","a":1,"e":"would rather 뒤의 절은 가정법 과거라 과거형 동사가 와.¶I'd rather you didn't do anything (당분간 아무것도 하지 않았으면 해).¶didn't만 쓰면 목적어 anything과 이어질 동사가 빠져.","h":["패턴: 패턴편 문제","would rather + 가정법 과거"],"src":"패턴","pp":"패턴편 I 71쪽","o":["do","didn’t do","don’t","didn’t"]},{"id":"P108","c":5,"s":7,"k":"err","lv":0,"t":"'but'을 이용한 문제 - 시점","q":"I [would have done] the assignment [earlier], but I [had met] an old friend of mine [on my way home].","a":2,"e":"but 뒤에는 실제로 일어난 일(직설법)이 와.¶과제를 일찍 끝냈을 텐데(가정), 하지만 실제로 친구를 '만났다'(사실): but I met an old friend.¶had met은 더 앞선 과거라 필요 없어.","h":["패턴: but, otherwise","but 뒤는 실제 사실"],"src":"패턴","pp":"패턴편 I 73쪽","x":"met"},{"id":"P109","c":5,"s":7,"k":"blank","lv":0,"t":"'but'을 이용한 문제 - 시점","q":"I _______ him accept their offer but I was not on the scene at that time.","a":1,"e":"but I was not on the scene(그 자리에 없었다)이 실제 과거 사실이야.¶그래서 앞은 과거 사실의 반대: I would not have let him accept (받아들이게 두지 않았을 텐데).¶짝 외우기: 가정(would have p.p.) + but + 사실(과거).","h":["패턴: but, otherwise","but 앞은 가정, 뒤는 사실"],"src":"패턴","pp":"패턴편 I 73쪽","o":["have not let","would not have let","had not let","will not have let"]},{"id":"P110","c":5,"s":7,"k":"blank","lv":0,"t":"'but'을 이용한 문제 - 시점","q":"She would certainly have attended the lecture yesterday, but for the fact that she ________ ill.","a":1,"e":"but for the fact that ~ = ~라는 사실이 없었다면. 그 that절 안은 실제로 일어난 사실이야.¶그녀가 실제로 아팠던 거라 직설법 과거 was ill.¶가정법은 바깥(would have attended)에만 쓰여.","h":["패턴: but, otherwise","but for the fact that + 직설법"],"src":"패턴","pp":"패턴편 I 73쪽","o":["is","was","were","had been"]},{"id":"P111","c":5,"s":7,"k":"blank","lv":0,"t":"'otherwise'를 이용한 문제 - 시점","q":"Using this method, men discovered laws of nature that otherwise _______.","a":2,"e":"otherwise = 그렇지 않았다면(이 방법을 쓰지 않았다면). 과거 일을 가정하니 would have p.p.¶would have remained unknown (알려지지 않은 채로 남았을 것이다).¶법칙은 '알려지는' 대상이라 unknown(알려지지 않은)이 맞아.","h":["패턴: but, otherwise","otherwise = 그렇지 않았다면"],"src":"패턴","pp":"패턴편 I 73쪽","o":["remained unknowing","remained unknown","would have remained unknown","would have remained unknowing"]},{"id":"P112","c":5,"s":7,"k":"err","lv":0,"t":"'otherwise'를 이용한 문제 - 선택","q":"These researchers have provided fresh [insights] into the daily lives of [ordinary] people [whose] existences might not [likewise] be so well documented.","a":3,"e":"'이 연구가 없었다면 이렇게 잘 기록되지 않았을'이라는 뜻이야.¶'그렇지 않았다면'은 otherwise. likewise는 '마찬가지로'라 뜻이 안 맞아.¶might not otherwise be documented (그렇지 않았다면 기록되지 않았을 것이다).","h":["패턴: but, otherwise","otherwise와 likewise"],"src":"패턴","pp":"패턴편 I 73쪽","x":"otherwise"},{"id":"5-11","c":5,"s":7,"k":"blank","lv":2,"t":"전치사구형 가정법","q":"___ your advice, I would have made a big mistake.","o":["Without","Unless","Except","If not"],"a":0,"h":["빈칸 뒤에 명사구(your advice)만 있어.","명사 앞에 쓸 수 있는 '~가 없었다면'은?"],"e":"빈칸 뒤에는 your advice라는 명사만 있어.¶명사 앞에서 '~가 없었다면'은 Without(또는 But for): Without your advice, I would have made a mistake.¶Unless, If not은 접속사라 뒤에 주어 + 동사가 와야 해.","src":"연습"},{"id":"P244","c":6,"s":0,"k":"blank","lv":0,"t":"공통된 부분을 생략","q":"Knowing why some materials are electric conductors and _______ requires a bit of quantum mechanics.","a":0,"e":"why 뒤 절이 두 개 and로 이어졌어: some materials are conductors and others (are) insulators.¶뒤 절에서 앞과 같은 동사 are가 생략된 거야. 그래서 others insulators.¶and로 병치할 때 반복되는 부분은 생략할 수 있어.","h":["패턴: 등위접속사의 접속원칙","공통 부분 생략"],"src":"패턴","pp":"패턴편 II 7쪽","o":["others insulators","others being insulators","the other insulators","the others be insulators"]},{"id":"P245","c":6,"s":0,"k":"blank","lv":0,"t":"병치구문의 공통관계","q":"The natural resources of Kentucky include rich soils and mineral deposits, __________, and plentiful plant and animal life.","a":1,"e":"include의 목적어가 쭉 나열돼: rich soils, mineral deposits, ___, plentiful life.¶나열된 게 모두 명사구라 빈칸도 명사구 thick forests.¶A, B, C, and D로 나열하면 모두 같은 모양이어야 해.","h":["패턴: 등위접속사의 접속원칙","명사끼리 병치"],"src":"패턴","pp":"패턴편 II 7쪽","o":["forests are thick","thick forests","thickly forested","are forested thickly"]},{"id":"P246","c":6,"s":0,"k":"err","lv":0,"t":"병치구문의 공통관계","q":"Mark Twain is [a good] representative [of] post-Civil War authors because of his [place of birth,] education, and [how he wrote.]","a":3,"e":"because of 뒤에 his place of birth(명사), education(명사), and ___ 가 나열돼.¶마지막만 how he wrote(절)라 모양이 안 맞아. 명사 writing style로 맞춰.¶구별법: and로 묶인 것들은 같은 품사·같은 모양.","h":["패턴: 등위접속사의 접속원칙","명사끼리 병치"],"src":"패턴","pp":"패턴편 II 7쪽","x":"writing style"},{"id":"P247","c":6,"s":0,"k":"err","lv":0,"t":"병치구문의 공통관계","q":"At all times, mankind [has had] [an interest] and [a deep] worship for the sun and its [life-giving] rays.","a":1,"e":"an interest와 a deep worship이 for the sun을 함께 쓰고 있어.¶그런데 interest는 in과 짝이야: an interest in. 짝이 다르면 각자 써 줘야 해.¶an interest in and a deep worship for the sun.","h":["패턴: 등위접속사의 접속원칙","공통관계의 전치사"],"src":"패턴","pp":"패턴편 II 7쪽","x":"an interest in"},{"id":"P248","c":6,"s":0,"k":"err","lv":0,"t":"병치구문의 공통관계","q":"[Fieldwork] involves [participating] and [observing] the lives of people in the group the anthropologist [wishes] to study.","a":1,"e":"participate는 '참여하다'라는 뜻이야. 참여는 혼자 하는 행동이라 목적어를 바로 받지 못하고, 무엇에 참여하는지는 in으로 이어 줘야 해.¶observe(관찰하다)는 관찰 대상을 바로 받는 동사라 그대로 the lives를 받아.¶두 동사가 the lives를 같이 쓰니까 participating in and observing the lives.","h":["패턴: 등위접속사의 접속원칙","공통관계의 전치사"],"src":"패턴","pp":"패턴편 II 7쪽","x":"participating in"},{"id":"P249","c":6,"s":0,"k":"err","lv":0,"t":"명사연결","q":"Benjamin Franklin [was] the editor of [the largest] newspaper in the colonies, a diplomatic representative to France, and [he invented] [many] useful devices.","a":2,"e":"Franklin이 무엇이었는지 나열돼: the editor of ~, a diplomatic representative to ~, and ___.¶앞 두 개가 명사구라 마지막도 명사구 an inventor of many useful devices.¶he invented처럼 절을 넣으면 모양이 안 맞아.","h":["패턴: 등위접속사의 병치구문","명사끼리 병치"],"src":"패턴","pp":"패턴편 II 9쪽","x":"an inventor of"},{"id":"P250","c":6,"s":0,"k":"err","lv":0,"t":"명사연결","q":"It's [long] been a part of folk wisdom [that] birth order [strongly] affects personality, [intelligent,] and achievement.","a":3,"e":"affects의 목적어가 personality, ___, achievement로 나열돼.¶모두 명사라 빈칸도 명사 intelligence(지능).¶intelligent는 형용사라 나열에서 튀어.","h":["패턴: 등위접속사의 병치구문","명사끼리 병치"],"src":"패턴","pp":"패턴편 II 9쪽","x":"intelligence"},{"id":"P251","c":6,"s":0,"k":"err","lv":0,"t":"명사연결","q":"[The idea that] learning is a lifelong process [has been expressed] by philosophers and [educations] [throughout the centuries.]","a":2,"e":"by philosophers and ___ 에서 '~에 의해'의 주체(사람)가 나열돼.¶철학자(사람)와 나란히 오려면 educators(교육자). educations는 '교육'이라 사람이 아니야.¶구별법: 병치된 단어는 의미 종류도 맞춰.","h":["패턴: 등위접속사의 병치구문","사람 명사끼리 병치"],"src":"패턴","pp":"패턴편 II 9쪽","x":"educators"},{"id":"P252","c":6,"s":0,"k":"err","lv":0,"t":"명사연결","q":"[Accurate] meteorological [predictions] can be formulated using techniques [derived] from [chemicals,] physics, and mathematics.","a":3,"e":"from ___, physics, and mathematics는 학문 이름이 나열된 거야.¶그래서 chemicals(화학물질)가 아니라 chemistry(화학).¶physics(물리학), mathematics(수학)와 같은 종류로 맞춰.","h":["패턴: 등위접속사의 병치구문","학문 이름끼리 병치"],"src":"패턴","pp":"패턴편 II 9쪽","x":"chemistry"},{"id":"P253","c":6,"s":0,"k":"err","lv":0,"t":"형용사·부사 연결","q":"The [domestic] dog is [generally] loyal, courageous, [intelligence,] and [adaptable.]","a":2,"e":"is 뒤에 보어가 나열돼: loyal, courageous, ___, adaptable.¶모두 형용사라 빈칸도 형용사 intelligent.¶intelligence는 명사라 모양이 안 맞아.","h":["패턴: 등위접속사의 병치구문","형용사끼리 병치"],"src":"패턴","pp":"패턴편 II 9쪽","x":"intelligent"},{"id":"P254","c":6,"s":0,"k":"err","lv":0,"t":"형용사·부사 연결","q":"As recently [as] [the late 1960s,] the view still prevailed [that] the deepest sea was an empty, [monotonously,] [virtually] lifeless environment.","a":3,"e":"environment를 꾸미는 말이 나열돼: an empty, ___, lifeless environment.¶명사를 꾸미니까 형용사 monotonous(단조로운). virtually는 lifeless를 꾸미는 부사라 그대로 맞아.¶구별법: 명사 앞에서 나란히 꾸미는 말은 모두 형용사.","h":["패턴: 등위접속사의 병치구문","형용사끼리 병치"],"src":"패턴","pp":"패턴편 II 9쪽","x":"monotonous"},{"id":"P255","c":6,"s":0,"k":"err","lv":0,"t":"형용사·부사 연결","q":"Bankruptcy legislation [is designed] [to provide] an [orderly] and [equitably] liquidation of the estate of an insolvent debtor.","a":3,"e":"liquidation(청산)을 꾸미는 말이 orderly and ___ 로 나열돼.¶명사를 꾸미니까 형용사 equitable(공정한).¶orderly는 -ly로 끝나지만 형용사라 헷갈리기 쉬워.","h":["패턴: 등위접속사의 병치구문","형용사끼리 병치"],"src":"패턴","pp":"패턴편 II 9쪽","x":"equitable"},{"id":"P256","c":6,"s":0,"k":"err","lv":0,"t":"형용사·부사 연결","q":"The [most highly praised] performances in theatrical history [were achieved] by creating believable [characters who] behaved [logical] and truthfully.","a":3,"e":"behaved(행동했다)를 꾸미는 말이 ___ and truthfully로 나열돼.¶동사를 꾸미니까 부사 logically, truthfully와 모양도 맞아.¶구별법: and 반대쪽 truthfully가 부사라는 게 단서야.","h":["패턴: 등위접속사의 병치구문","부사끼리 병치"],"src":"패턴","pp":"패턴편 II 9쪽","x":"logically"},{"id":"P257","c":6,"s":0,"k":"err","lv":0,"t":"동사연결","q":"Plants [absorb water] and [nutrients] and [anchoring] themselves in the soil with [their roots.]","a":2,"e":"주어 Plants의 동사가 and로 이어져: Plants absorb ~ and anchor ~.¶absorb(현재)와 나란히 anchor.¶anchoring은 동사가 아니라서 병치가 안 맞아.","h":["패턴: 등위접속사의 병치구문","동사끼리 병치"],"src":"패턴","pp":"패턴편 II 10쪽","x":"anchor"},{"id":"P258","c":6,"s":0,"k":"err","lv":0,"t":"동사연결","q":"The development of motor skills in [babies begins] with [the head] and [progress] downward through [other] parts of the body.","a":2,"e":"주어 The development가 동사 두 개를 가져: begins ~ and progresses ~.¶주어가 단수라 progress가 아니라 progresses.¶구별법: and 뒤 동사도 같은 주어에 수를 맞춰.","h":["패턴: 등위접속사의 병치구문","동사끼리 병치"],"src":"패턴","pp":"패턴편 II 10쪽","x":"progresses"},{"id":"P259","c":6,"s":0,"k":"err","lv":0,"t":"동사연결","q":"The kangaroo has [been called] an overgrown rabbit that [walks on] [two feet] and [raised] its young in a pocket.","a":3,"e":"that(=rabbit)의 동사가 and로 이어져: that walks on two feet and raises its young.¶walks(현재)와 나란히 raises.¶raised(과거)는 시제가 안 맞아.","h":["패턴: 등위접속사의 병치구문","동사끼리 병치"],"src":"패턴","pp":"패턴편 II 10쪽","x":"raises"},{"id":"P260","c":6,"s":0,"k":"err","lv":0,"t":"동사연결","q":"The best thing [about sports photography] is [that] the photographer can freeze a single moment [that] contains pure and raw emotion and [shares] it with the public.","a":3,"e":"can 뒤에 동사원형이 and로 이어져: can freeze ~ and share ~.¶조동사 뒤라 shares가 아니라 원형 share.¶뜻: 사진가는 순간을 포착하고 그걸 대중과 나눌 수 있다.","h":["패턴: 등위접속사의 병치구문","조동사 뒤 병치"],"src":"패턴","pp":"패턴편 II 10쪽","x":"share"},{"id":"P261","c":6,"s":0,"k":"err","lv":0,"t":"동사연결","q":"Civilization resulted [from] the ability [of human beings] to control fire, [cultivate] crops, train animals, [and built] permanent homes.","a":3,"e":"the ability to 뒤에 동사원형이 나열돼: to control, cultivate, train, and build.¶마지막도 원형 build여야 해. built(과거)는 틀려.¶to 하나에 원형 여러 개가 이어진 모양이야.","h":["패턴: 등위접속사의 병치구문","to부정사 병치"],"src":"패턴","pp":"패턴편 II 10쪽","x":"and build"},{"id":"P262","c":6,"s":0,"k":"err","lv":0,"t":"준동사연결","q":"We are considering [granting] membership [to foreign firms] and allowing them to challenge [our markets,] [expanding] their products, and [to compete openly with us.]","a":3,"e":"allowing them to 뒤에 외국 기업이 할 일이 나열돼: to challenge ~, to expand ~, and to compete ~.¶expanding만 모양이 달라서 to expand로 맞춰.¶구별법: 무엇이 나열되는지(외국 기업이 할 일) 먼저 찾고 모양을 맞춰.","h":["패턴: 등위접속사의 병치구문","to부정사 병치"],"src":"패턴","pp":"패턴편 II 11쪽","x":"to expand"},{"id":"P263","c":6,"s":0,"k":"blank","lv":0,"t":"준동사연결","q":"Seismographs are used to locate oil, to determine ocean depth, and ________ and measure earthquakes.","a":1,"e":"are used to 뒤에 목적이 나열돼: to locate, to determine, and to detect.¶앞 두 개처럼 to부정사 to detect.¶뒤의 and measure는 to detect and (to) measure로 이어진 거야.","h":["패턴: 등위접속사의 병치구문","to부정사 병치"],"src":"패턴","pp":"패턴편 II 11쪽","o":["detect","to detect","detecting","be detecting","are detecting"]},{"id":"P264","c":6,"s":0,"k":"err","lv":0,"t":"준동사연결","q":"Jogging, walking, and [go swimming] are [all] excellent [ways] to improve [one's] health.","a":0,"e":"주어가 Jogging, walking, and ___ 로 나열돼.¶모두 동명사라 swimming. go swimming은 '수영하러 가다'라 모양이 안 맞아.¶주어 자리에 동사원형은 못 와.","h":["패턴: 등위접속사의 병치구문","동명사 주어 병치"],"src":"패턴","pp":"패턴편 II 11쪽","x":"swimming"},{"id":"P265","c":6,"s":0,"k":"err","lv":0,"t":"준동사연결","q":"Young people often are [in a conflict] between wanting to be [independent of] their parents and [realize] their parents are providing for many of their [wants and needs:] food, shelter, clothes, emotional support, spending money, and so on.","a":2,"e":"between A and B 구문이야: between wanting ~ and realizing ~.¶A가 동명사 wanting이니 B도 동명사 realizing.¶between 뒤는 전치사 목적어라 동사원형 realize는 못 와.","h":["패턴: 등위접속사의 병치구문","between A and B 병치"],"src":"패턴","pp":"패턴편 II 11쪽","x":"realizing"},{"id":"P266","c":6,"s":0,"k":"blank","lv":0,"t":"절 연결","q":"In the alpine tundra, the summer is intense, winds are prevalent _________ highly variable.","a":0,"e":"절이 나열돼: the summer is intense, winds are prevalent, and the precipitation is highly variable.¶앞이 모두 '주어 + 동사' 절이니 마지막도 절 and the precipitation is.¶and가 마지막 절 앞에 와야 해.","h":["패턴: 등위접속사의 병치구문","절 병치"],"src":"패턴","pp":"패턴편 II 11쪽","o":["and the precipitation is","precipitation being","that the precipitation is","with precipitation"]},{"id":"P267","c":6,"s":0,"k":"blank","lv":0,"t":"절 연결","q":"Lizards' tails may teach us how cells learn to specialize, how heart muscles grow, and even ________.","a":2,"e":"teach us 뒤에 간접의문문이 나열돼: how cells ~, how heart muscles ~, and how ~.¶마지막도 how + 주어 + 동사: how cancer growth is arrested.¶간접의문문은 의문사 + 주어 + 동사 순서(where is X).","h":["패턴: 등위접속사의 병치구문","명사절 병치"],"src":"패턴","pp":"패턴편 II 11쪽","o":["the cancer growth is arrested","to be arresting cancer growth","how cancer growth is arrested","where is cancer growth arrested"]},{"id":"6-01","c":6,"s":0,"k":"err","lv":1,"t":"병치되는 형용사 수식","q":"She is [real] [beautiful] and [polite] [to everyone].","a":0,"h":["beautiful and polite 전체를 꾸미는 말이야.","형용사를 꾸미는 건 부사."],"e":"beautiful and polite 전체를 꾸미는 말이야.¶형용사를 꾸미는 건 부사라 real이 아니라 really.¶real은 형용사(진짜의)라 다른 형용사를 꾸미지 못해.","x":"really","src":"연습"},{"id":"6-02","c":6,"s":0,"k":"err","lv":3,"t":"공통관계의 전치사","q":"My first son has an [aptitude and] interest [in] science, and he [wants] to [become] a chemist.","a":0,"x":"aptitude for and","h":["aptitude와 interest가 각각 어떤 전치사와 짝인지 봐.","aptitude for, interest in"],"e":"aptitude와 interest가 science를 함께 받고 있어.¶그런데 aptitude는 for, interest는 in과 짝이야. 짝이 다르면 둘 다 써: an aptitude for and interest in science.¶같은 원리: P247 an interest in and a worship for.","src":"연습"},{"id":"6-03","c":6,"s":0,"k":"err","lv":1,"t":"접속사 중복","q":"[Although] she is a teacher, [but] she [doesn't like] [children].","a":1,"x":"(but 삭제)","h":["두 절을 잇는 접속사가 몇 개야?","종속접속사와 등위접속사를 같이 쓸 수 없어."],"e":"although(종속접속사)와 but(등위접속사)은 같이 쓸 수 없어.¶두 절을 잇는 접속사는 하나면 충분해: Although she is a teacher, she doesn't like children.¶또는 She is a teacher, but she doesn't like children.","src":"연습"},{"id":"P268","c":6,"s":1,"k":"blank","lv":0,"t":"등위접속사의 의미","q":"Helium is not inflammable, _______ therefore safer than hydrogen.","a":0,"e":"Helium이 주어로 동사 두 개를 가져: Helium is not inflammable and is therefore safer.¶같은 주어의 동사를 and로 잇는 거라 and is.¶that is, which is는 관계사라 뜻이 어색해.","h":["패턴: 등위접속사의 의미","and + 동사"],"src":"패턴","pp":"패턴편 II 13쪽","o":["and is","that is","yet","which is"]},{"id":"P269","c":6,"s":1,"k":"err","lv":0,"t":"등위접속사의 의미","q":"The [adult] gorilla [looks] fierce, [and] it is actually a shy, friendly animal [that needs] companionship and attention.","a":2,"e":"겉보기엔 사납지만(fierce) 실제
