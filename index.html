e L. Hill","So successful was Grace L. Hill","Because Grace L. Hill was so successful"]},{"id":"P602","c":19,"s":3,"k":"err","lv":0,"t":"수일치","q":"Unquantified [was] the many [charities] he supported, the causes [he backed] and the innumerable kindnesses to friends, who were steadfast and [few.]","a":0,"e":"보어(Unquantified)가 앞으로 나간 도치야. 진짜 주어는 was 뒤에 있어.¶주어가 the charities, the causes, the kindnesses로 여러 개(복수)라 were.¶도치 문장은 동사 뒤에서 주어를 찾아.","h":["패턴: 보어도치","도치된 주어에 수일치"],"src":"패턴","pp":"패턴편 II 161쪽","x":"were"},{"id":"P603","c":19,"s":3,"k":"err","lv":0,"t":"현재·과거분사의 선택","q":"[Intersperse with] diverse lectures and classroom activities [were] periods of financial difficulty, military service, and employment as a private tutor, [all of which] added to the curious medley of experience that would ultimately [blossom into] his remarkable life's work.","a":0,"e":"Interspersed with ~ (~ 사이사이에 끼워진)이 앞으로 나간 도치야.¶시기들이 강의 사이에 '끼워진' 거라 과거분사 Interspersed.¶Intersperse(원형)는 문장 앞에 이런 식으로 못 와.","h":["패턴: 보어도치","보어 도치 + p.p."],"src":"패턴","pp":"패턴편 II 161쪽","x":"Interspersed with"},{"id":"P604","c":19,"s":3,"k":"err","lv":0,"t":"현재·과거분사의 선택","q":"[Hiding] [from] [view] beneath the desk was a [tray] of small objects.","a":0,"e":"Hidden from view ~ (보이지 않게 숨겨진)이 앞으로 나간 도치야. 주어는 a tray.¶쟁반이 '숨겨진' 상태라 과거분사 Hidden.¶Hiding이면 쟁반이 뭔가를 숨긴다는 뜻이 돼.","h":["패턴: 보어도치","보어 도치 + p.p."],"src":"패턴","pp":"패턴편 II 161쪽","x":"Hidden"},{"id":"P605","c":19,"s":3,"k":"blank","lv":0,"t":"어순","q":"Over the river and through the woods _________ my grandmother lives.","a":2,"e":"장소 부사구(Over the river ~)가 문장 앞에 오면 동사 + 주어로 도치돼.¶Over the river ~ is the house where my grandmother lives.¶평서문이면 The house where my grandmother lives is over the river.","h":["패턴: 장소부사구 도치","장소부사구 도치"],"src":"패턴","pp":"패턴편 II 163쪽","o":["the house is where","where is the house","is the house where","where the house is"]},{"id":"P606","c":19,"s":3,"k":"blank","lv":0,"t":"어순","q":"In the Silverman Library in New York City _______ of medieval and Renaissance manuscripts.","a":2,"e":"장소 부사구(In the Silverman Library)가 문장 앞에 와서 동사 + 주어로 도치됐어.¶In the Silverman Library is a collection of manuscripts.¶주어가 동사 뒤로 간 거야.","h":["패턴: 장소부사구 도치","장소부사구 도치"],"src":"패턴","pp":"패턴편 II 163쪽","o":["a collection is","in a collection","is a collection","which is a collection"]},{"id":"P607","c":19,"s":3,"k":"blank","lv":0,"t":"어순","q":"“Can you tell me where my teacher is?” “Yes, of course! ________”","a":1,"e":"Here(There) + come + 명사 주어 → 도치: Here comes your teacher.¶주어가 대명사면 도치하지 않아: Here he comes.¶명사냐 대명사냐로 어순이 달라져.","h":["패턴: 장소부사구 도치","Here comes + 명사"],"src":"패턴","pp":"패턴편 II 163쪽","o":["Here your teacher comes.","Here comes your teacher.","Comes your teacher.","Your teacher here comes."]},{"id":"P608","c":19,"s":3,"k":"err","lv":0,"t":"수일치","q":"Within the Alamo [was] one hundred and eighty men, more than two [thirds of whom] had recently [migrated] from [near-by states.]","a":0,"e":"장소 부사구(Within the Alamo)가 앞에 와서 도치됐어. 진짜 주어는 one hundred and eighty men.¶주어가 복수라 was가 아니라 were.¶도치 문장은 동사 뒤 주어에 수를 맞춰.","h":["패턴: 장소부사구 도치","도치된 주어에 수일치"],"src":"패턴","pp":"패턴편 II 163쪽","x":"were"},{"id":"P609","c":19,"s":3,"k":"err","lv":0,"t":"수일치","q":"[There have been] [little] change in my father's situation [since] he [left for] America.","a":0,"e":"There + be 구문은 뒤의 진짜 주어에 수를 맞춰.¶주어 little change가 단수라 There has been.¶change(변화)는 여기서 셀 수 없는 명사로 쓰였어.","h":["패턴: 장소부사구 도치","There + be + 주어 수일치"],"src":"패턴","pp":"패턴편 II 163쪽","x":"There has been"},{"id":"P610","c":19,"s":3,"k":"err","lv":0,"t":"동사의 선택","q":"[Obviously] we were [much more] impressed [with performance] than [did] the other members of the audience.","a":3,"e":"비교 대상 동사가 were impressed(be동사)야.¶than 뒤 대동사도 be동사로: than were the other members.¶대동사가 주어 앞으로 도치된 모양이야.","h":["패턴: 비교구문 도치","비교 도치의 대동사"],"src":"패턴","pp":"패턴편 II 165쪽","x":"were"},{"id":"P611","c":19,"s":3,"k":"err","lv":0,"t":"동사의 선택","q":"When Michael Levine of University of Pennsylvania compared college students raised with dogs with those [raised] [without,] he found that women who had owned dogs as children scored higher on tests of self-reliance, social skills, sociability and tolerance [than] [was] petless women.","a":3,"e":"비교절에서 대동사가 주어 앞으로 도치됐어: than were petless women.¶주어 women이 복수라 was가 아니라 were.¶도치 문장은 동사 뒤 주어를 찾아서 수를 맞춰.","h":["패턴: 비교구문 도치","비교 도치의 수일치"],"src":"패턴","pp":"패턴편 II 165쪽","x":"were"},{"id":"P612","c":19,"s":3,"k":"blank","lv":0,"t":"어순","q":"Scientists stress that the overall warming trend of the last decade holds much more significance ________ single year's temperatures.","a":1,"e":"than 뒤에서 대동사 do가 주어 앞으로 도치될 수 있어.¶than do any single year's temperatures (어떤 한 해의 기온보다).¶holds를 대신하는 대동사가 do야.","h":["패턴: 비교구문 도치","than + 대동사 + 주어"],"src":"패턴","pp":"패턴편 II 165쪽","o":["any do","than do any","than any do","do then"]},{"id":"P613","c":19,"s":3,"k":"blank","lv":0,"t":"어순","q":"Solar heat penetrates more deeply into water than ________.","a":1,"e":"태양열이 물에 스며드는 것과 흙에 스며드는 것을 비교하는 거야.¶than it does into soil (흙에 스며드는 것보다). does는 penetrates를 대신해.¶that, what은 than 뒤에 필요 없어.","h":["패턴: 비교구문 도치","than it does into soil"],"src":"패턴","pp":"패턴편 II 165쪽","o":["it is penetrating into the soil","it does into soil","does it into soil","that it does into soil","what does into soil"]},{"id":"P614","c":19,"s":3,"k":"blank","lv":0,"t":"도치비교구문을 이용한 문제풀이","q":"People who live outside of Greencastle give the city higher marks _______ own citizens, according to a survey of Central Indiana residents.","a":1,"e":"than 뒤 대동사가 주어 앞으로 도치: than do its own citizens.¶its는 the city(그 도시)를 받아.¶give를 대신하는 대동사가 do.","h":["패턴: 비교구문 도치","than do + 주어"],"src":"패턴","pp":"패턴편 II 165쪽","o":["than it does the","than do its","do than their","as they do"]},{"id":"P615","c":19,"s":3,"k":"blank","lv":0,"t":"도치비교구문을 이용한 문제풀이","q":"Overexposure to the sun can produce ______ can some toxic chemicals.","a":3,"e":"more + 명사 + than: more damage to the skin than ~.¶than 뒤에서 can이 주어 앞으로 도치됐어: than can some toxic chemicals.¶more와 명사 damage를 붙여서 써야 해.","h":["패턴: 비교구문 도치","more + 명사 + than"],"src":"패턴","pp":"패턴편 II 165쪽","o":["more than damage to the skin","more damage than to the skin","damage more than to the skin","more damage to the skin than"]},{"id":"P616","c":19,"s":3,"k":"blank","lv":0,"t":"so ↔ neither","q":"A: What kind of music do you like? B: I like classical music, opera, that kind of thing. A: I like it, too. I have a lot of classical records. I don't understand modern jazz. B: _______ I think it's boring.","a":3,"e":"앞 사람이 don't understand modern jazz(부정)라고 했어.¶부정에 동의하는 '나도 그래'는 Neither do I.¶긍정에 동의하면 So do I.","h":["패턴: so/ neither 도치","Neither do I"],"src":"패턴","pp":"패턴편 II 167쪽","o":["So do I.","I don't.","I do","Neither do I."]},{"id":"P617","c":19,"s":3,"k":"blank","lv":0,"t":"대동사의 선택","q":"She took a keen interest in international affairs, ________.","a":3,"e":"앞 문장 took(과거 일반동사)에 대한 긍정 동의야.¶so + 대동사 + 주어: so did I (나도 그랬어).¶was는 be동사를 받을 때 써.","h":["패턴: so/ neither 도치","so did I"],"src":"패턴","pp":"패턴편 II 167쪽","o":["I was so","so was I","I did so","so did I."]},{"id":"P618","c":19,"s":3,"k":"blank","lv":0,"t":"대동사의 선택","q":"\"Are you going to see him?\" \"If the boy goes, _________.\"","a":1,"e":"If the boy goes(그 애가 가면) 다음 '나도 갈 거야'는 미래야.¶so + will + I: so will I.¶긍정 동의는 so + 조동사 + 주어로 도치.","h":["패턴: so/ neither 도치","so will I"],"src":"패턴","pp":"패턴편 II 167쪽","o":["so I go","so will I","I do so","so go I"]},{"id":"P619","c":19,"s":3,"k":"err","lv":0,"t":"어순","q":"Mary objects [to our buying] this house [without the] approval [of our president,] and [John does so.]","a":3,"e":"'John도 마찬가지다'는 so + 대동사 + 주어로 도치: so does John.¶John does so는 '실제로 John이 그렇게 한다'는 다른 뜻이야.¶동의 표현은 도치된 모양으로 외워 둬.","h":["패턴: so/ neither 도치","so + 대동사 + 주어"],"src":"패턴","pp":"패턴편 II 167쪽","x":"so does John"},{"id":"P620","c":19,"s":3,"k":"err","lv":0,"t":"도치구문의 필요성","q":"If you [were] an executive in an [advertising] company, how [you would] use the information [in] this report?","a":2,"e":"how로 묻는 직접의문문이라 조동사가 주어 앞으로 와야 해.¶how would you use the information?¶평서문 어순(you would)은 의문문에서 틀려.","h":["패턴: 의문문도치","의문문 어순"],"src":"패턴","pp":"패턴편 II 169쪽","x":"would you"},{"id":"P621","c":19,"s":3,"k":"blank","lv":0,"t":"주의구문","q":"How many people ________ the conference on “Digital Divide”?","a":3,"e":"How many people이 문장의 주어야.¶주어를 묻는 의문문은 도치 없이 바로 동사: How many people attended ~?¶do they attend처럼 주어를 또 넣으면 틀려.","h":["패턴: 의문문도치","의문사가 주어"],"src":"패턴","pp":"패턴편 II 169쪽","o":["is attending","do they attend","did attend","attended"]},{"id":"P622","c":19,"s":3,"k":"err","lv":0,"t":"주의구문","q":"If sex is [such a natural] phenomenon, how come [are there] [so many] books [on] how to do it?","a":1,"e":"how come(왜)은 특이하게 뒤에 평서문 어순이 와.¶how come there are so many books ~?¶why를 쓰면 why are there ~ 로 도치하지만, how come은 도치하지 않아.","h":["패턴: 의문문도치","how come + 평서문 어순"],"src":"패턴","pp":"패턴편 II 169쪽","x":"there are"},{"id":"P623","c":19,"s":3,"k":"blank","lv":0,"t":"주의구문","q":"It is not known _______.","a":3,"e":"It is not known ___ 에서 빈칸은 진짜 주어인 간접의문문이야.¶간접의문문은 의문사 + 주어 + 동사: what time he returned.¶when did he return은 직접의문문 어순이라 틀려.","h":["패턴: 의문문도치","간접의문문 어순"],"src":"패턴","pp":"패턴편 II 169쪽","o":["he returned to his quarters","that did he return to his quarters","when did he return to his quarters","what time he returned to his quarters"]},{"id":"P624","c":19,"s":3,"k":"err","lv":0,"t":"주의구문","q":"A [critical] question [about] the monolithic stone statues of Easter Island is \"Why [they were] all made [alike]?\"","a":2,"e":"따옴표 안은 직접 묻는 질문(직접의문문)이야.¶Why were they all made alike? (왜 다 똑같이 만들어졌을까?)¶they were는 평서문 어순이라 질문에서는 틀려.","h":["패턴: 의문문도치","직접의문문 어순"],"src":"패턴","pp":"패턴편 II 169쪽","x":"were they"},{"id":"P579","c":19,"s":4,"k":"blank","lv":0,"t":"대동사의 선택","q":"Michael is going to be nominated to receive the Academy Award for best director, _________?","a":3,"e":"본문 동사가 is (going to be nominated)라서 부가의문문은 isn't he.¶긍정문 → 부정 부가의문문, 동사 종류를 그대로 따라가.¶be동사면 be동사, 조동사면 조동사, 일반동사면 do.","h":["패턴: 부가의문문","be going to의 부가의문문"],"src":"패턴","pp":"패턴편 II 155쪽","o":["won't he","doesn't he","didn't he","isn't he"]},{"id":"P580","c":19,"s":4,"k":"blank","lv":0,"t":"대동사의 선택","q":"A: I had one of my amazing dreams again last night. B: You haven't had a dream like that for a very long time, __________? A: No, I haven't. B: It means you are very imaginative, __________?","a":1,"e":"① You haven't had ~ (부정, have) → have you?¶② It means ~ (긍정, 일반동사 means) → doesn't it?¶부가의문문은 앞 문장의 동사·긍부정을 반대로 따라가.","h":["패턴: 부가의문문","have you / doesn't it"],"src":"패턴","pp":"패턴편 II 155쪽","o":["do you - doesn't it","have you - doesn't it","do you - haven't it","have you - does it"]},{"id":"P581","c":19,"s":4,"k":"blank","lv":0,"t":"대동사의 선택","q":"We'd decided to start a joint venture, _________?","a":2,"e":"We'd decided = We had decided (과거완료).¶그래서 부가의문문은 hadn't we.¶'d가 had인지 would인지는 뒤 동사(decided = p.p.)를 보고 판단해.","h":["패턴: 부가의문문","We'd = We had"],"src":"패턴","pp":"패턴편 II 155쪽","o":["would we","wouldn't we","hadn't we","aren't we"]},{"id":"P582","c":19,"s":4,"k":"blank","lv":0,"t":"명령문의 부가의문문","q":"A: Turn off the light, _________? B: Of course, I will.","a":1,"e":"명령문의 부가의문문은 will you.¶Turn off the light, will you? (불 좀 꺼 줄래?)¶대답도 I will.이라 짝이 맞아.","h":["패턴: 부가의문문","명령문 + will you"],"src":"패턴","pp":"패턴편 II 155쪽","o":["do you","will you","shall you","can you"]},{"id":"P583","c":19,"s":4,"k":"blank","lv":0,"t":"명령문의 부가의문문","q":"Don't make a noise, ________?","a":1,"e":"부정 명령문(Don't ~)의 부가의문문도 will you.¶Don't make a noise, will you?¶참고: Let's ~ 는 shall we.","h":["패턴: 부가의문문","부정 명령문 + will you"],"src":"패턴","pp":"패턴편 II 155쪽","o":["shall you","will you","won't you","do you","don't you"]},{"id":"P559","c":19,"s":5,"k":"err","lv":0,"t":"동사의 의미중복","q":"[Normall]y, insulin [is produced] by the pancreas in the body when [the level of] glucose [rises and goes up] in bloodstream.","a":3,"e":"rise와 go up은 둘 다 '오르다'라 같은 뜻이 겹쳤어.¶하나만 써: when glucose rises.¶편입에서는 같은 뜻 단어를 겹쳐 쓰는 걸 틀린 것으로 봐.","h":["패턴: 동의어의 의미 중복표현","의미 중복"],"src":"패턴","pp":"패턴편 II 147쪽","x":"rises"},{"id":"P560","c":19,"s":5,"k":"err","lv":0,"t":"동사의 의미중복","q":"Prices [reach an equilibrium] [at the level] [at which quantity] demanded [equals and is the same as] quantity supplied.","a":3,"e":"equal과 be the same as는 둘 다 '같다'라 겹쳤어.¶하나만 써: quantity demanded equals quantity supplied.¶의미 중복 문제는 and로 묶인 비슷한 말을 의심해.","h":["패턴: 동의어의 의미 중복표현","의미 중복"],"src":"패턴","pp":"패턴편 II 147쪽","x":"equals"},{"id":"P561","c":19,"s":5,"k":"blank","lv":0,"t":"동사와 접두어의 의미중복","q":"Annual investment in genetic engineering firms __________ down slightly this year due to the world`s economic recession.","a":0,"e":"빈칸 뒤에 down이 있어.¶decline은 '감소하다'라는 뜻 자체에 '아래로'가 들어 있어서 declined down이라고 하면 뜻이 겹쳐. go는 그 자체로 방향이 없어서 down과 함께 써야 '내려가다'가 돼: went down.¶reduce는 '~을 줄이다'라 줄일 대상(목적어)이 있어야 하는데 여기엔 없어.","h":["패턴: 동의어의 의미 중복표현","decline down은 중복"],"src":"패턴","pp":"패턴편 II 147쪽","o":["went","reduced","declined","jumped"]},{"id":"P562","c":19,"s":5,"k":"err","lv":0,"t":"동사와 접두어의 의미중복","q":"[To obtain] [a full] refund on your purchase, you must [return back] the merchandise [within] ten days.","a":2,"e":"return(돌려주다)에 이미 '다시, 되돌려'라는 뜻이 있어.¶return back은 뜻이 겹쳐: return the merchandise.¶같은 예: repeat again, revert back도 중복.","h":["패턴: 동의어의 의미 중복표현","return back 중복"],"src":"패턴","pp":"패턴편 II 147쪽","x":"return"},{"id":"P563","c":19,"s":5,"k":"err","lv":0,"t":"수식어의 의미중복","q":"Though he [paid] about ten thousand dollars [or so] for the car, he has had [trouble with] it [all the time.]","a":1,"e":"about(약)과 or so(~쯤)는 둘 다 '대략'이라 겹쳤어.¶둘 중 하나만: about ten thousand dollars.¶편입은 이런 의미 중복을 자주 물어.","h":["패턴: 동의어의 의미 중복표현","about과 or so 중복"],"src":"패턴","pp":"패턴편 II 147쪽","x":"(or so 삭제)"},{"id":"P564","c":19,"s":5,"k":"err","lv":0,"t":"수식어의 의미중복","q":"The oxygen content of Mars is not [sufficient enough] [to support] life [as] we know [it.]","a":0,"e":"sufficient와 enough는 둘 다 '충분한'이라 겹쳤어.¶하나만 써: not sufficient to support life.¶같은 예: very unique, most perfect도 중복이야.","h":["패턴: 동의어의 의미 중복표현","sufficient enough 중복"],"src":"패턴","pp":"패턴편 II 147쪽","x":"sufficient"},{"id":"P565","c":19,"s":5,"k":"err","lv":0,"t":"수식어의 의미중복","q":"[The thirteen] [original, first states] ratified the United States Constitution [during a three-year period] [between 1787 and 1790.]","a":1,"e":"original(최초의)과 first(첫 번째)는 같은 뜻이라 겹쳤어.¶The thirteen original states (최초의 13개 주).¶같은 뜻 형용사를 나란히 쓰지 않아.","h":["패턴: 동의어의 의미 중복표현","original과 first 중복"],"src":"패턴","pp":"패턴편 II 147쪽","x":"original"},{"id":"P566","c":19,"s":5,"k":"err","lv":0,"t":"수식어의 의미중복","q":"[Of] [nearly approximately] 5,000 stars, only [several hundred] have proper [names.]","a":1,"e":"nearly와 approximately는 둘 다 '약, 거의'라 겹쳤어.¶하나만 써: Of approximately 5,000 stars.¶about, around, roughly도 같은 부류야.","h":["패턴: 동의어의 의미 중복표현","nearly와 approximately 중복"],"src":"패턴","pp":"패턴편 II 147쪽","x":"approximately"},{"id":"P567","c":19,"s":5,"k":"err","lv":0,"t":"명사의 의미중복","q":"Latitude [describes ]the [position and location] of a point [on] the Earth`s surface in relation [to the equator.]","a":1,"e":"position(위치)과 location(위치)은 같은 뜻이라 겹쳤어.¶하나만 써: describes the position of a point.¶and로 묶인 비슷한 명사를 의심해.","h":["패턴: 동의어의 의미 중복표현","position과 location 중복"],"src":"패턴","pp":"패턴편 II 147쪽","x":"position"},{"id":"P568","c":19,"s":5,"k":"err","lv":0,"t":"접속사의 의미·기능 중복","q":"[Once that] the old virtues [were] refuted, they assumed that [most men] would immediately [agree] that [their desires] are real.","a":0,"e":"once는 그 자체로 접속사(일단 ~하면)야.¶Once that처럼 that을 붙이면 접속사가 겹쳐: Once the old virtues were refuted.¶같은 원리: as soon as that (X).","h":["패턴: 동의어의 의미 중복표현","Once that 중복"],"src":"패턴","pp":"패턴편 II 148쪽","x":"Once"},{"id":"P569","c":19,"s":5,"k":"err","lv":0,"t":"접속사의 의미·기능 중복","q":"The reason he [is] a star is [because] he listens [carefully] to his [staff.]","a":1,"e":"The reason ~ is that ~ 이 맞는 짝이야.¶reason(이유)과 because(왜냐하면)는 같은 뜻을 겹쳐 말하는 셈이야.¶The reason he is a star is that he listens ~.","h":["패턴: 동의어의 의미 중복표현","The reason ~ is because 중복"],"src":"패턴","pp":"패턴편 II 148쪽","x":"that"},{"id":"P570","c":19,"s":5,"k":"err","lv":0,"t":"부정부사","q":"The bus driver was [not hardly] in the mood [to wait] for passengers: he drove off while [some] passengers were in the store [buying souvenirs.]","a":0,"e":"hardly 자체에 '거의 ~ 않다'라는 부정이 있어.¶not과 같이 쓰면 부정이 겹쳐: was hardly in the mood.¶같은 부류: scarcely, barely, seldom, rarely.","h":["패턴: 부정어 중복","이중 부정"],"src":"패턴","pp":"패턴편 II 151쪽","x":"hardly"},{"id":"P571","c":19,"s":5,"k":"err","lv":0,"t":"부정부사","q":"Jane is [so tired] from yesterday's outing at the park that she [can't] scarcely keep her eyes [open] today [in class.]","a":1,"e":"scarcely에 이미 부정(거의 ~못 하다)이 있어.¶can't scarcely는 부정이 겹쳐서 틀려: can scarcely keep her eyes open.¶부정부사 + 부정어 = 이중 부정.","h":["패턴: 부정어 중복","이중 부정"],"src":"패턴","pp":"패턴편 II 151쪽","x":"can"},{"id":"P572","c":19,"s":5,"k":"blank","lv":0,"t":"부정부사","q":"There has been _______ of agreement as yet between the management and the union.","a":1,"e":"hardly(거의 ~없다) + no는 부정이 겹쳐.¶hardly 뒤에는 any: hardly any sign of agreement (합의의 기미가 거의 없다).¶같은 예: hardly anything, hardly ever.","h":["패턴: 부정어 중복","hardly any"],"src":"패턴","pp":"패턴편 II 151쪽","o":["hardly no sign","hardly any sign","no sign hardly","any hardly sign"]},{"id":"P573","c":19,"s":5,"k":"err","lv":0,"t":"전치사·접속사와 부정부사","q":"He wants [to compliment] the class on the way they went [through] the fire drill [without hardly] any [whispering.]","a":2,"e":"without(~ 없이)에 이미 부정이 있어서 hardly와 같이 쓰면 겹쳐.¶with hardly any whispering (속삭임이 거의 없이).¶without any whispering도 가능해.","h":["패턴: 부정어 중복","without hardly 이중 부정"],"src":"패턴","pp":"패턴편 II 151쪽","x":"with hardly"},{"id":"P574","c":19,"s":5,"k":"err","lv":0,"t":"일반적인 형태","q":"Elizabeth Peabody, founder of the first American kindergarten, [she helped] gain [acceptance] of that institution [as a] regular [part of] public education.","a":0,"e":"주어 Elizabeth Peabody가 이미 있어.¶그 뒤에 she를 또 쓰면 주어가 두 번 들어가: Elizabeth Peabody, founder of ~, helped g   const r=db.doc("data/users/"+uid+"/progress");

  ref=r;const d=snap.exists?snap.data():null;

 const prev=CH[c-1]?`<a class="ghost" href="#c${c-1}">← ${c-1}강 ${CH[c-1].t}</a>`:"<span></span>",next=CH[c+1]?`<a class="ghost" href="#c${c+1}">${c+1}강 ${CH[c+1].t} →</a>`:"<span></span>";
 return `<a class="back" href="#${b.id}">← ${b.name} 차례</a><p class="ser">${c}강</p><h1>${C.t}</h1><p class="lead">${b.name} ${C.pg}쪽 · 문제 ${cp.length}개 · 푼 문제 ${solved(cp)} · 맞힌 문제 ${cp.filter(p=>st(p.id)==="ok").length}</p>
 <div class="filters"><div class="chips" role="group" aria-label="출처">${[["all","모든 문제"],["pt","패턴편"],["ex","연습 문제"]].map(([v,l])=>`<button class="chip" data-fsrc="${v}" aria-pressed="${ui.fsrc===v}">${l}</button>`).join("")}</div><div class="chips" role="group" aria-label="유형">${fk}</div><div class="chips" role="group" aria-label="상태">${fs}</div></div>${secs}<div class="cnav">${prev}${next}</div>`}

function sentH(p,g){let n=0;
 let h=esc(p.q).replace(/\[([^\]]+)\]/g,(m,t)=>{const i=n++;if(p.k==="err"){let c="u";if(g){if(i===p.a)c+=" good";else if(g.g===i)c+=" bad"}return `<span class="${c}"><span>${t}</span><b>(${LET[i]})</b></span>`}return `<span class="u1">${t}</span>`});
 return h.replace(/_{3,}/g,()=>g&&p.k==="blank"?`<span class="blank on">${esc(p.o[p.a])}</span>`:g&&p.k==="fill"?`<span class="blank on">${esc(p.a[0])}</span>`:`<span class="blank"></span>`)}
function optsH(p,sel,g){const sg=segs(p);
 return `<div class="opts">${ord(p).map((oi,pos)=>{let c="opt";if(g){if(oi===p.a)c+=" ok";else if(g.g===oi)c+=" no"}else if(sel===oi)c+=" sel";
  const txt=p.k==="err"?esc(sg[oi]):esc(p.o[oi]);
  return `<button class="${c}" data-o="${oi}" ${g?"disabled":""} aria-pressed="${sel===oi}"><span class="bub">${LET[pos]}</span><span class="ot">${txt}</span></button>`}).join("")}</div>`}
function qPane(p,extra){const C=CH[p.c],b=bookOf(p.c);
 return `<section class="pane"><div class="tags"><span class="tag ${KIND[p.k][1]}">${KIND[p.k][0]}</span>${lvH(p)}</div><h1 class="pt">${esc(p.t)}</h1><p class="src">${b.name} ${p.c}강 ${secName(p.c,p.s)} · ${C.s[p.s][2]}쪽${p.pp?` · 출처 ${p.pp}`:""}</p><p class="ins">${INS[p.k]}</p><div class="sent">${sentH(p,extra)}</div></section>`}

function vProb(p){
 const C=CH[p.c],list=chP(p.c),i=list.indexOf(p),rec=S.r[p.id],g=rec&&!ui.retry[p.id]?rec:null;
 const sel=ui.sel[p.id],hs=ui.hints[p.id]||0,open=!!ui.open[p.id];
 const area=OBJ(p.k)?optsH(p,sel,g):`<label class="help" for="ans" style="display:block;margin:0 0 6px">${p.k==="fix"?"밑줄 친 부분을 고친 형태만 써":"빈칸에 들어갈 말만 써"}</label><input class="inp" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" ${g?`disabled value="${esc(g.g)}"`:`value="${esc(ui.draft[p.id]||"")}"`} placeholder="${p.k==="fix"?"예: had been":"영어로 입력"}"><p class="help">대소문자와 끝의 마침표는 상관없어.</p>`;
 const res=g?(g.s==="ok"?`<p class="res ok">정답이야${g.n>1?`<small>${g.n}번째 시도</small>`:""}</p>`:`<p class="res no">틀렸어${!OBJ(p.k)?`<small>내 답: ${esc(g.g||"(비워 둠)")}</small>`:""}</p>`):"";
 const self=g&&g.s==="no"&&!OBJ(p.k)&&g.g?`<button class="ghost" id="selfok">내 답도 맞아</button>`:"";
 const hints=hs?`<ol class="hints">${p.h.slice(0,hs).map((h,k)=>`<li><b>힌트 ${k+1}</b>${esc(h)}</li>`).join("")}</ol>`:"";
 const sol=g&&open?`<div class="sol"><p><span class="lab">정답</span> <span class="serif">${esc(ansText(p))}</span></p><div class="exp">${p.e.split("¶").map(x=>`<p>${esc(x)}</p>`).join("")}</div></div>`:"";
 const prev=list[i-1],next=list[i+1];
 return `<div class="ptop"><a class="back" href="#c${p.c}">← ${p.c}강 ${C.t}</a><span>${secName(p.c,p.s)}</span><span>${i+1} / ${list.length}</span></div>
 <div class="pgrid">${qPane(p,g)}<section class="pane"><h2 class="ah">답안</h2>${area}
 <div class="acts">${g?`<button class="btn" id="retry">다시 풀기</button>`:`<button class="btn" id="grade">채점하기 <kbd>Ctrl+↵</kbd></button>`}<button class="ghost" id="hint" ${hs>=2?"disabled":""}>힌트 ${hs}/2</button>${self}</div>${hints}${res}
 <button class="ghost solbtn" id="sol" ${g?"":"disabled"}>${g?(open?"정답과 해설 닫기":"정답과 해설 보기"):"정답과 해설 · 한 번 채점하면 열려"}</button>${sol}</section></div>
 <nav class="pnav">${prev?`<a class="ghost" href="#p${prev.id}">← 이전 문제</a>`:`<a class="ghost" href="#c${p.c}">← ${p.c}강 목록</a>`}${next?`<a class="btn" href="#p${next.id}">다음 문제 →</a>`:CH[p.c+1]?`<a class="btn" href="#p${chP(p.c+1)[0].id}">${p.c+1}강 첫 문제 →</a>`:`<a class="btn" href="#me">내 기록 보기</a>`}</nav>`}

/* 모의고사 */
function vExam(){
 if(EX&&!EX.done)return exRun();
 if(EX&&EX.done)return exResult();
 const sc=[["all","전체"]].concat(BOOKS.map(b=>[b.id,b.name])).map(([v,l])=>`<button class="chip" data-sc="${v}" aria-pressed="${ui.scope===v}">${l}</button>`).join("");
 const nn=[10,20,30].map(v=>`<button class="chip" data-en="${v}" aria-pressed="${ui.exN===v}">${v}문제</button>`).join("");
 const tt=[[0,"제한 없음"],[10,"10분"],[20,"20분"],[30,"30분"]].map(([v,l])=>`<button class="chip" data-et="${v}" aria-pressed="${ui.exT===v}">${l}</button>`).join("");
 return `<a class="back" href="#home">← 편입 영어 문법</a><h1>모의고사</h1><p class="lead">고른 범위에서 무작위로 문제를 뽑아. 풀 때는 채점하지 않고, 다 풀고 제출하면 한꺼번에 채점해. 결과는 내 기록에도 남아.</p>
 <div class="setup"><div><h3>범위</h3><div class="chips">${sc}</div></div><div><h3>문항 수</h3><div class="chips">${nn}</div></div><div><h3>제한 시간</h3><div class="chips">${tt}</div></div><div><button class="btn alt" id="exstart">시작하기</button></div></div>`}
function exRun(){const p=byId[EX.ids[EX.i]],a=EX.ans[p.id],n=EX.ids.length,last=EX.i===n-1;
 const area=OBJ(p.k)?optsH(p,a,null):`<input class="inp" id="exans" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(a||"")}" placeholder="${p.k==="fix"?"고친 형태만":"빈칸에 들어갈 말만"}">`;
 const done=EX.ids.filter(id=>EX.ans[id]!==undefined&&EX.ans[id]!=="").length;
 return `<div class="exbar"><div><p class="ser">모의고사 · ${EX.label}</p><b>${EX.i+1} / ${n}</b> <span class="lv">· 답한 문제 ${done}</span></div><span class="timer" id="timer">${EX.lim?fmt(EX.lim-(Date.now()-EX.t0)):fmt(Date.now()-EX.t0)}</span></div>
 <div class="pgrid">${qPane(p,null)}<section class="pane"><h2 class="ah">답안</h2>${area}<div class="acts">${EX.i?`<button class="ghost" data-ex="prev">← 이전</button>`:""}${last?`<button class="btn alt" data-ex="submit">제출하고 채점</button>`:`<button class="btn" data-ex="next">다음 →</button>`}</div><p class="help">${last?"제출하면 바로 채점해. 답하지 않은 문제는 기록에 남기지 않아.":"이전으로 돌아가 답을 바꿀 수 있어."}</p>${!last?`<button class="ghost solbtn" data-ex="submit">지금 제출하기</button>`:""}</section></div>`}
const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`};
function exStart(){const pool=ui.scope==="all"?P:P.filter(p=>bookOf(p.c).id===ui.scope);
 EX={ids:shuffle(pool.map(p=>p.id)).slice(0,ui.exN),i:0,ans:{},t0:Date.now(),lim:ui.exT*60000,done:false,label:ui.scope==="all"?"전체":BOOKS.find(b=>b.id===ui.scope).name};keep()}
function exFinish(){if(!EX||EX.done)return;EX.done=true;EX.used=Date.now()-EX.t0;EX.res={};
 EX.ids.forEach(id=>{const p=byId[id],g=EX.ans[id];if(g===undefined||g==="")return;const ok=check(p,g);EX.res[id]=ok;const prev=S.r[id]||{n:0};S.r[id]={s:ok?"ok":"no",g,n:(prev.n||0)+1,t:Date.now()}});save();keep()}
function exResult(){const n=EX.ids.length,ok=EX.ids.filter(id=>EX.res[id]===true).length;
 const rows=EX.ids.map((id,k)=>{const p=byId[id],r=EX.res[id];return `<a class="row" href="#p${id}"><span class="dot ${r===true?"ok":r===false?"no":""}"></span><span class="tag ${KIND[p.k][1]}">${KIND[p.k][0]}</span><span class="rt">${k+1}. ${esc(p.t)} <span class="lv">· ${p.c}강${p.src==="패턴"?" · 패턴편":""}</span></span><span class="lv ${r===true?"l1":r===false?"l3":""}">${r===true?"정답":r===false?"오답":"미응답"}</span></a>`}).join("");
 return `<a class="back" href="#home">← 편입 영어 문법</a><p class="ser">모의고사 결과 · ${EX.label}</p><div class="big"><b>${ok}</b><span>/ ${n}</span></div><p class="lead">${pct(ok,n)}점 · 걸린 시간 ${fmt(EX.used)} · 문제를 누르면 힌트와 해설을 볼 수 있어.</p><div class="sec"><div class="sh"><b>문항별 결과</b><span>정답 ${ok} · 오답 ${Object.values(EX.res).filter(v=>!v).length} · 미응답 ${n-Object.keys(EX.res).length}</span></div>${rows}</div><div class="cnav"><button class="ghost" id="exagain">같은 조건으로 다시</button><button class="btn" id="exnew">새 모의고사</button></div>`}

/* 내 기록 */
function vMe(){const done=solved(P),ok=P.filter(p=>st(p.id)==="ok").length,wr=P.filter(p=>st(p.id)==="no");
 const bars=Object.keys(CH).map(Number).map(c=>{const cp=chP(c),d=solved(cp),o=cp.filter(p=>st(p.id)==="ok").length;return `<a class="bar" href="#c${c}"><span class="bn">${c}강 ${CH[c].t}</span><i><b style="width:${pct(d,cp.length)}%"></b></i><span class="v">${d}/${cp.length}</span><span class="m">${d?pct(o,d)+"%":"—"}</span></a>`}).join("");
 const wl=wr.length?wr.map(rowH).join(""):`<div class="empty">틀린 문제가 없어. 틀리면 여기 모이고, 다시 맞히면 빠져.</div>`;
 return `<h1>내 기록</h1><div class="figs"><div class="fig"><b>${done}</b><span>푼 문제 / ${P.length}</span></div><div class="fig"><b>${ok}</b><span>맞힌 문제</span></div><div class="fig"><b>${done?pct(ok,done)+"%":"—"}</b><span>정답률</span></div><div class="fig"><b>${wr.length}</b><span>틀린 문제</span></div></div>
 <h2 class="h2">강별 진행</h2><p class="help" style="margin:-6px 0 10px">막대는 푼 비율, 오른쪽 숫자는 푼 문제 중 맞힌 비율이야.</p><div class="bars">${bars}</div>
 <h2 class="h2">틀린 문제</h2><div class="sec" style="margin-top:0">${wl}</div>
 <div class="cnav"><span class="help">기록은 문제마다 가장 최근 채점 결과로 남아.</span><button class="ghost" id="reset">${ui.reset?"한 번 더 누르면 모든 기록이 지워져":"기록 초기화"}</button></div>`}

/* 라우팅 */
function route(){clearInterval(tick);const h=decodeURIComponent(location.hash.slice(1))||"home";let html,title="편입 영어 문법",nav="home";
 if(/^b[123]$/.test(h)){const b=BOOKS.find(x=>x.id===h);html=vBook(b);title=b.name+" · 편입 영어 문법"}
 else if(/^c\d+$/.test(h)&&CH[+h.slice(1)]){const c=+h.slice(1);html=vChap(c);title=`${c}강 ${CH[c].t} · 편입 영어 문법`}
 else if(h[0]==="p"&&byId[h.slice(1)]){const p=byId[h.slice(1)];html=vProb(p);title=p.t+" · 편입 영어 문법"}
 else if(h==="exam"){html=vExam();nav="exam";title="모의고사 · 편입 영어 문법"}
 else if(h==="me"){html=vMe();nav="me";title="내 기록 · 편입 영어 문법"}
 else html=vHome();
 $("#app").innerHTML=html;document.title=title;
 document.querySelectorAll(".nav a").forEach(a=>a.dataset.n===nav?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
 if(h==="exam"&&EX&&!EX.done)tick=setInterval(()=>{const el=$("#timer");if(!el)return;if(EX.lim){const left=EX.lim-(Date.now()-EX.t0);el.textContent=fmt(left);el.classList.toggle("low",left<60000);if(left<=0){exFinish()}}else el.textContent=fmt(Date.now()-EX.t0)},1000);
}
let lastH=null;
function go(){const h=location.hash;if(h!==lastH){lastH=h;route();if(ui.sec){const el=document.getElementById(ui.sec);ui.sec=null;if(el){el.scrollIntoView();return}}window.scrollTo(0,0)}else keep()}
function keep(){const y=window.scrollY;route();window.scrollTo(0,y)}
window.addEventListener("hashchange",go);

const cur=()=>{const h=location.hash.slice(1);return h[0]==="p"?byId[h.slice(1)]:null};
function grade(p,g){const ok=check(p,g);const prev=S.r[p.id]||{n:0};S.r[p.id]={s:ok?"ok":"no",g,n:(prev.n||0)+1,t:Date.now()};delete ui.retry[p.id];delete ui.sel[p.id];save();keep()}
function tryGrade(){const p=cur();if(!p||(S.r[p.id]&&!ui.retry[p.id]))return;
 if(OBJ(p.k)){if(ui.sel[p.id]===undefined)return;grade(p,ui.sel[p.id])}else{const v=($("#ans")||{}).value||"";if(!v.trim()){$("#ans").focus();return}grade(p,v.trim())}}

document.addEventListener("click",e=>{const t=e.target.closest("button,a");if(!t)return;const p=cur();
 if(t.dataset.scope)ui.scope=t.dataset.scope;
 if(t.dataset.sec)ui.sec=t.dataset.sec;
 if(t.dataset.goto){document.getElementById(t.dataset.goto).scrollIntoView({behavior:"smooth"});return}
 if(t.dataset.fk){ui.fk=t.dataset.fk;keep();return}
 if(t.dataset.fs){ui.fs=t.dataset.fs;keep();return}
 if(t.dataset.fsrc){ui.fsrc=t.dataset.fsrc;keep();return}
 if(t.dataset.sc){ui.scope=t.dataset.sc;keep();return}
 if(t.dataset.en){ui.exN=+t.dataset.en;keep();return}
 if(t.dataset.et){ui.exT=+t.dataset.et;keep();return}
 if(t.id==="exstart"){exStart();window.scrollTo(0,0);return}
 if(t.id==="exagain"){exStart();window.scrollTo(0,0);return}
 if(t.id==="exnew"){EX=null;keep();return}
 if(t.dataset.ex){if(t.dataset.ex==="prev")EX.i--;else if(t.dataset.ex==="next")EX.i++;else exFinish();route();window.scrollTo(0,0);return}
 if(t.dataset.o!==undefined&&!t.disabled){const o=+t.dataset.o;if(location.hash==="#exam"&&EX&&!EX.done){EX.ans[EX.ids[EX.i]]=o;keep()}else if(p){ui.sel[p.id]=o;keep()}return}
 if(!p&&t.id==="reset"){if(ui.reset){S={r:{},u:0};save();ui.reset=0}else{ui.reset=1;setTimeout(()=>{if(ui.reset){ui.reset=0;if(location.hash==="#me")keep()}},4000)}keep();return}
 if(!p)return;
 if(t.id==="grade")tryGrade();
 else if(t.id==="retry"){ui.retry[p.id]=1;ui.open[p.id]=0;ui.draft[p.id]="";keep()}
 else if(t.id==="hint"){ui.hints[p.id]=Math.min(2,(ui.hints[p.id]||0)+1);keep()}
 else if(t.id==="sol"){ui.open[p.id]=!ui.open[p.id];keep()}
 else if(t.id==="selfok"){S.r[p.id].s="ok";save();keep()}
});
document.addEventListener("input",e=>{if(e.target.id==="ans"){const p=cur();if(p)ui.draft[p.id]=e.target.value}if(e.target.id==="exans"&&EX)EX.ans[EX.ids[EX.i]]=e.target.value});
document.addEventListener("keydown",e=>{const p=cur();
 if((e.ctrlKey||e.metaKey)&&e.key==="Enter"&&p){e.preventDefault();tryGrade();return}
 if(e.key==="Enter"&&e.target.id==="ans"){e.preventDefault();tryGrade();return}
 if(e.key==="Enter"&&e.target.id==="exans"){e.preventDefault();const b=document.querySelector('[data-ex="next"],[data-ex="submit"]');if(b)b.click();return}
 const tag=e.target.tagName;if(tag==="INPUT"||tag==="TEXTAREA"||e.ctrlKey||e.metaKey||e.altKey)return;
 if(/^[1-5]$/.test(e.key)){const q=location.hash==="#exam"&&EX&&!EX.done?byId[EX.ids[EX.i]]:p;if(!q||!OBJ(q.k))return;if(q===p&&S.r[p.id]&&!ui.retry[p.id])return;const o=ord(q)[+e.key-1];if(o===undefined)return;if(q===p)ui.sel[p.id]=o;else EX.ans[q.id]=o;keep()}
});

window.claude?.hot?.snapshot?.(()=>({EX,fk:ui.fk,fs:ui.fs,fsrc:ui.fsrc,scope:ui.scope,exN:ui.exN,exT:ui.exT}));
const boot=d=>{if(d&&d.EX)EX=d.EX;if(d&&d.fk){ui.fk=d.fk;ui.fs=d.fs||"all";ui.fsrc=d.fsrc||"all";ui.scope=d.scope||"all";ui.exN=d.exN||10;ui.exT=d.exT||0}go();setSave("기록은 이 브라우저에 저장돼")};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
}
</script>
</body>
</html>
